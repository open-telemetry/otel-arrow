name: Observe existing Kubernetes pods
components:
  existing-service:
    existing:
      kubernetes:
        namespace: telemetry
        label_selector: app=my-service,component=collector
        # Optional: use a specific kubeconfig and context.
        # kubeconfig: /path/to/kubeconfig
        # context: my-context
    monitoring:
      kubernetes_component:
        interval: 5
        max_age_seconds: 120
      prometheus:
        endpoint: http://127.0.0.1:8888/metrics
        interval: 1
tests:
  - from_template:
      path: templates/observe-existing.yaml
      variables:
        name: Observe existing pods
        report_name: Kubernetes container resources
        report_config:
          from_template:
            path: examples/kubernetes-resources-report.yaml
