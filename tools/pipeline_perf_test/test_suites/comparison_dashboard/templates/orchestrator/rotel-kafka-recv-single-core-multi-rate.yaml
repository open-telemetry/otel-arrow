{%- set compression = variables.compression_method | default("none") %}
{%- set signal = variables.signal | default("logs") %}
{%- if signal == "logs" %}
{%- set log_weight = 100 %}{%- set metric_weight = 0 %}{%- set trace_weight = 0 %}
{%- elif signal == "metrics" %}
{%- set log_weight = 0 %}{%- set metric_weight = 100 %}{%- set trace_weight = 0 %}
{%- elif signal == "traces" %}
{%- set log_weight = 0 %}{%- set metric_weight = 0 %}{%- set trace_weight = 100 %}
{%- endif %}
{%- set group_id = variables.kafka_consumer_group_id | default("kafka-benchmark-consumer") %}
{%- set offset_reset = variables.kafka_consumer_auto_offset_reset | default("earliest") %}
{%- set commit_interval = variables.kafka_consumer_commit_interval_ms | default(1000) %}
{%- set session_timeout = variables.kafka_consumer_session_timeout_ms | default(30000) %}
{%- set heartbeat = variables.kafka_consumer_heartbeat_interval_ms | default(3000) %}
{%- set fetch_min = variables.kafka_consumer_fetch_min_bytes | default(1) %}
{%- set max_partition_fetch = variables.kafka_consumer_max_partition_fetch_bytes | default(1048576) %}
{%- set fetch_wait = variables.kafka_consumer_fetch_max_wait_ms | default(500) %}
name: {{suite_name}}
# Receiver-isolation topology (rotel receiver under test).
#
#   load-generator (DFE traffic_generator -> DFE kafka EXPORTER)   [fixed ref]
#     -> kafka-broker
#     -> kafka-consumer (rotel kafka receiver -> otlp exporter)
#     -> backend-service (DFE otlp receiver -> perf sink)
components:
  load-generator:
    deployment:
      docker:
        image: {{df_engine_image}}
        network: testbed
        ports:
          - "8085:8080"
        volumes:
          - '{{data_dir}}/loadgen-config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1
      prometheus:
        endpoint: http://localhost:8085/api/v1/telemetry/metrics?format=prometheus&reset=false
  kafka-broker:
    deployment:
      docker:
        image: {{kafka_image}}
        network: testbed
        ports:
          - "9094:9094"
        environment:
          - KAFKA_NODE_ID=1
          - KAFKA_PROCESS_ROLES=broker,controller
          - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka-broker:9093
          - KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:9094
          - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://kafka-broker:9092,EXTERNAL://localhost:9094
          - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
          - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
          - KAFKA_INTER_BROKER_LISTENER_NAME=PLAINTEXT
          - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
          - KAFKA_MESSAGE_MAX_BYTES=10485760
          - KAFKA_REPLICA_FETCH_MAX_BYTES=10485760
          - KAFKA_NUM_PARTITIONS=1
          - KAFKA_LOG_RETENTION_MS=300000
          - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
          - CLUSTER_ID=benchmark-kafka-cluster-id
    monitoring:
      docker_component:
        allocated_cores: 1
  kafka-consumer:
    deployment:
      docker:
        image: {{rotel_image}}
        network: testbed
        cpuset_cpus: "1"
        environment:
          - RUST_LOG=info
        command:
          # Select the Kafka receiver; without this rotel defaults to its OTLP
          # receiver and never consumes from Kafka.
          - "--receiver"
          - "kafka"
          - "--kafka-receiver-logs"
          - "--kafka-receiver-metrics"
          - "--kafka-receiver-traces"
          - "--kafka-receiver-brokers"
          - "kafka-broker:9092"
          - "--kafka-receiver-logs-topic"
          - "otel-logs"
          - "--kafka-receiver-metrics-topic"
          - "otel-metrics"
          - "--kafka-receiver-traces-topic"
          - "otel-spans"
          - "--kafka-receiver-format"
          - "protobuf"
          - "--kafka-receiver-group-id"
          - "{{group_id}}"
          - "--kafka-receiver-auto-offset-reset"
          - "{{offset_reset}}"
          - "--kafka-receiver-enable-auto-commit"
          - "--kafka-receiver-auto-commit-interval-ms"
          - "{{commit_interval}}"
          - "--kafka-receiver-session-timeout-ms"
          - "{{session_timeout}}"
          - "--kafka-receiver-heartbeat-interval-ms"
          - "{{heartbeat}}"
          - "--kafka-receiver-fetch-min-bytes"
          - "{{fetch_min}}"
          - "--kafka-receiver-max-partition-fetch-bytes"
          - "{{max_partition_fetch}}"
          - "--kafka-receiver-fetch-max-wait-ms"
          - "{{fetch_wait}}"
          - "--kafka-receiver-isolation-level"
          - "read-uncommitted"
          - "--exporter"
          - "otlp"
          - "--otlp-exporter-protocol"
          - "grpc"
          - "--otlp-exporter-endpoint"
          - "backend-service:1235"
          - "--otlp-exporter-compression"
          - "{{compression}}"
    monitoring:
      docker_component:
        allocated_cores: 1
  backend-service:
    deployment:
      docker:
        image: {{df_engine_image}}
        network: testbed
        ports:
          - "8087:8080"
        volumes:
          - '{{data_dir}}/backend-config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1
      prometheus:
        endpoint: http://localhost:8087/api/v1/telemetry/metrics?format=prometheus&reset=false

{% macro forward_variables() -%}
{%- for k, v in variables.items() %}
        {{ k }}: {{ v | tojson }}
{%- endfor %}
        variables: {{ variables | tojson }}
{%- endmacro -%}

tests:
{%- for rate in ['100k', '200k', '300k', '400k', '600k', '800k', '1000k'] %}
{%- set loadgen_end = {'100k': 3, '200k': 4, '300k': 5, '400k': 6, '600k': 8, '800k': 10, '1000k': 12}[rate] %}
  - name: {{rate}}
    from_template:
      path: ../pipeline_perf_test/test_suites/comparison_dashboard/templates/steps/rotel-kafka-recv.yaml
      variables:{{ forward_variables() }}
        data_dir: {{data_dir}}
        test_dir: {{data_dir}}/tests/{{rate}}
        report_name: "Rotel Kafka Receiver {{rate}} - {{suite_name}}"
        observation_interval: {{observation_interval}}
        signals_per_second: 100000
        log_weight: {{log_weight}}
        metric_weight: {{metric_weight}}
        trace_weight: {{trace_weight}}
        backend_core_start: 2
        backend_core_end: 2
        loadgen_core_start: 3
        loadgen_core_end: {{loadgen_end}}
{%- endfor %}
