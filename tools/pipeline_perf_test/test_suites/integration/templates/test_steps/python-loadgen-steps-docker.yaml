steps:
  - name: Configure syslog generator with test params
    action:
      update_component_strategy:
        target: load-generator
        execution:
          pipeline_perf_loadgen:
            threads: {{syslog_threads | default(1)}}
            target_rate: {{syslog_rate | default(5000)}}
            batch_size:  {{syslog_batch_size | default(100)}}
            load_type: syslog
            syslog_transport: '{{syslog_transport | default("udp")}}'
            message_body: {{syslog_message | default(none) | tojson}}
  - name: Deploy Backend Engine
    action:
      component_action:
        phase: deploy
        target: backend-service
    hooks:
      run:
        pre:
          # Render the engine config into the suite config directory
          - render_template:
              template_path: './test_suites/integration/templates/configs/backend/config.yaml.j2'
              output_path: ./test_suites/integration/configs/backend/config.rendered.yaml
              variables:
                # ----- General settings -----
                # default_pipeline_ctrl_msg_channel_size: 100
                # default_node_ctrl_msg_channel_size: 100
                # default_pdata_channel_size: 100
                # ----- Receiver config -----
                # backend_receiver_type: otap             # Options: otap, otlp, or custom/invalid
                # listening_addr: "0.0.0.0:1235"
                # compression_method: zstd                # Default is 'zstd' for otap, 'gzip' for otlp
                backend_receiver_type: '{{backend_receiver_type}}'
        post:
          # Wait for the telemetry endpoint to be active (TODO: switch to healthcheck endpoint when available).
          - ready_check_http:
              url: http://localhost:8087/api/v1/telemetry/metrics?reset=false
              method: GET
              expected_status_code: 200
  - name: Deploy DF Engine
    action:
      component_action:
        phase: deploy
        target: df-engine
    hooks:
      run:
        pre:
          # Render the engine config into the suite config directory
          - render_template:
              template_path: '{{engine_config_template}}'
              output_path: ./test_suites/integration/configs/engine/config.rendered.yaml
              variables:
                backend_hostname: backend-service
                syslog_transport: '{{syslog_transport | default("udp")}}'
                exporter: '{{exporter | default("otap")}}'
        post:
          # Wait for the telemetry endpoint to be active (TODO: switch to healthcheck endpoint when available).
          - ready_check_http:
              url: http://localhost:8086/api/v1/telemetry/metrics?reset=false
              method: GET
              expected_status_code: 200
  - name: Deploy Load Generator
    action:
      component_action:
        phase: deploy
        target: load-generator
    hooks:
      run:
        post:
          # Wait for the telemetry endpoint to be active (TODO: switch to healthcheck endpoint when available).
          - ready_check_http:
              url: http://localhost:5001/metrics
              method: GET
              expected_status_code: 200
  - name: Monitor All
    action:
      multi_component_action:
        phase: start_monitoring
        targets:
          - backend-service
          - load-generator
          - df-engine
  - name: Start Load
    action:
      component_action:
        phase: start
        target: load-generator
  - name: Wait for data
    action:
      wait:
        delay_seconds: {{wait_for_data_interval | default(5)}}
  # This is the main observation window, marked by custome events at start/stop
  - name: Observe Load
    action:
      wait:
        delay_seconds: {{observation_interval | default(20)}}
    hooks:
      run:
        pre:
          - record_event:
              name: observation_start
        post:
          - record_event:
              name: observation_stop
  # Stop the load generator from sending traffic. Its process (and /metrics
  # endpoint) stays up, so its final count remains scrapeable.
  - name: Stop Load
    action:
      component_action:
        phase: stop
        target: load-generator
  # Wait for all items in-flight to reach the engine.
  - name: Wait For Load Generator Drain
    action:
      wait:
        delay_seconds: 3
  # Drain and remove the df-engine pipeline groups, upstream first. Deleting a
  # group (rather than calling groups/shutdown) keeps the engine process and its
  # admin endpoint alive, so the final counts of the stopped pipelines remain
  # scrapeable for engine.telemetry.metric_unregister_grace_period.
  # Stop the df-engine pipelines and wait for them to drain in-flight data to the backend.
  - name: Stop Engine Pipelines
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:8086/api/v1/groups/default?timeout_secs={{drain_timeout_secs | default(60)}}
              method: DELETE
              timeout: {{drain_timeout_secs | default(60) | int + 5}}  # Client timeout slightly longer than server
              raise_for_status: false
              on_error:
                continue: true
    action:
      no_op: {}
  # Stop the backend pipelines (ensures any internal processing completes).
  - name: Stop Backend Pipelines
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:8087/api/v1/groups/default?timeout_secs={{drain_timeout_secs | default(60)}}
              method: DELETE
              timeout: {{drain_timeout_secs | default(60) | int + 5}}  # Client timeout slightly longer than server
              raise_for_status: false
              on_error:
                continue: true
    action:
      no_op: {}
  # Let a few scrapes observe the final post-drain counts.
  - name: Wait For Final Metrics
    action:
      wait:
        delay_seconds: {{final_metrics_wait_secs | default(3)}}
  # Stop monitoring all components.
  - name: Stop Monitoring All
    action:
      multi_component_action:
        phase: stop_monitoring
        targets:
          - backend-service
          - load-generator
          - df-engine
  # Shut down the (now empty) engines so the processes exit gracefully.
  - name: Shutdown Engines
    hooks:
      run:
        pre:
          - send_http_request:
              url: http://localhost:8086/api/v1/groups/shutdown?wait=true&timeout_secs=10
              method: POST
              headers:
                "Content-Type": "application/json"
              timeout: 15
              raise_for_status: false
              on_error:
                continue: true
          - send_http_request:
              url: http://localhost:8087/api/v1/groups/shutdown?wait=true&timeout_secs=10
              method: POST
              headers:
                "Content-Type": "application/json"
              timeout: 15
              raise_for_status: false
              on_error:
                continue: true
    action:
      no_op: {}
  # Stop all running components.
  - name: Destroy All
    action:
      multi_component_action:
        phase: destroy
        targets:
          - load-generator
          - df-engine
          - backend-service
  # Run the report
  - name: Run Report
    action:
      wait:
        delay_seconds: 0
    hooks:
      run:
        post:
          # Print all Docker container logs
          - print_container_logs: {}
          - sql_report:
              name: Integration Report - Logs
              report_config_file: ./test_suites/integration/configs/integration_report_logs.yaml
              output:
                - format:
                    template: {}
                  destination:
                    console: {}
                - format:
                    template:
                      path:  ./test_suites/integration/templates/reports/gh-action-sqlreport.j2
                  destination:
                    file:
                      directory: results/{{result_dir | default('integration')}}/gh-actions-benchmark
