name: Nightly - Batch Processor
# Push-based variant: the load generator, engine and backend push internal
# metrics over OTLP to an embedded sink in the orchestrator. Loss is computed
# from exact whole-run totals (including the engines' final post-drain flush)
# instead of scraped counters.
hooks:
  run:
    pre:
      - start_otlp_metrics_sink:
          endpoint: 0.0.0.0:14317
    post:
      - stop_otlp_metrics_sink: {}
components:
  load-generator:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8085:8080"
        volumes:
          - "test_suites/integration/configs/loadgen/config.rendered.yaml:/home/nonroot/config.yaml:ro"
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "2-2"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1
  df-engine:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8086:8080"
        volumes:
          - "test_suites/integration/configs/engine/config.rendered.yaml:/home/nonroot/config.yaml:ro"
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "3-3"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1
  backend-service:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        extra_hosts:
          host.docker.internal: host-gateway
        ports:
          - "8087:8080"
        volumes:
          - "test_suites/integration/configs/backend/config.rendered.yaml:/home/nonroot/config.yaml:ro"
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "1-1"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 1

tests:
  # --- Logs ---
  - name: Logs-OTAP-BATCH-OTAP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: Logs-OTAP-BATCH-OTAP
        result_dir: nightly_batch_processor
        engine_config_template: test_suites/integration/templates/configs/engine/batch_processor/otap-batch-otap.yaml.j2
        loadgen_exporter_type: otap
        backend_receiver_type: otap
        generation_strategy: fresh
        observation_interval: 60
        log_weight: 100
        metric_weight: 0
        trace_weight: 0

  - name: Logs-OTLP-BATCH-OTLP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: Logs-OTLP-BATCH-OTLP
        result_dir: nightly_batch_processor
        engine_config_template: test_suites/integration/templates/configs/engine/batch_processor/otlp-batch-otlp.yaml.j2
        loadgen_exporter_type: otlp
        backend_receiver_type: otlp
        generation_strategy: fresh
        observation_interval: 60
        log_weight: 100
        metric_weight: 0
        trace_weight: 0
        exporter_extra_config:
          max_in_flight: 256

  # --- Metrics ---
  - name: Metrics-OTAP-BATCH-OTAP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: Metrics-OTAP-BATCH-OTAP
        result_dir: nightly_batch_processor
        engine_config_template: test_suites/integration/templates/configs/engine/batch_processor/otap-batch-otap.yaml.j2
        loadgen_exporter_type: otap
        backend_receiver_type: otap
        generation_strategy: fresh
        observation_interval: 60
        log_weight: 0
        metric_weight: 100
        trace_weight: 0
        report_config: ./test_suites/integration/configs/integration_report_metrics_push.yaml

  - name: Metrics-OTLP-BATCH-OTLP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: Metrics-OTLP-BATCH-OTLP
        result_dir: nightly_batch_processor
        engine_config_template: test_suites/integration/templates/configs/engine/batch_processor/otlp-batch-otlp.yaml.j2
        loadgen_exporter_type: otlp
        backend_receiver_type: otlp
        generation_strategy: fresh
        observation_interval: 60
        log_weight: 0
        metric_weight: 100
        trace_weight: 0
        report_config: ./test_suites/integration/configs/integration_report_metrics_push.yaml
        exporter_extra_config:
          max_in_flight: 256

  # --- Traces ---
  - name: Traces-OTAP-BATCH-OTAP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: Traces-OTAP-BATCH-OTAP
        result_dir: nightly_batch_processor
        engine_config_template: test_suites/integration/templates/configs/engine/batch_processor/otap-batch-otap.yaml.j2
        loadgen_exporter_type: otap
        backend_receiver_type: otap
        generation_strategy: fresh
        observation_interval: 60
        log_weight: 0
        metric_weight: 0
        trace_weight: 100
        report_config: ./test_suites/integration/configs/integration_report_traces_push.yaml

  - name: Traces-OTLP-BATCH-OTLP
    from_template:
      path: test_suites/integration/templates/test_steps/df-loadgen-steps-docker-push.yaml
      variables:
        test_name: Traces-OTLP-BATCH-OTLP
        result_dir: nightly_batch_processor
