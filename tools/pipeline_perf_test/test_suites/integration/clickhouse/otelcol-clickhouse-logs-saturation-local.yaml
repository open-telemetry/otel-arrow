# Temporary dedicated-runner single-core OTel Collector ClickHouse saturation test.
# Uses the same host allocation and workload as the DFE saturation suite.
name: OTel Collector ClickHouse Single-Core Saturation
components:
  load-generator:
    deployment:
      docker:
        image: df_engine:latest
        network: testbed
        ports:
          - "8085:8080"
        volumes:
          - 'test_suites/integration/configs/loadgen/config.rendered.yaml:/home/nonroot/config.yaml:ro'
        command:
          - "--config"
          - "./config.yaml"
          - "--core-id-range"
          - "32-43"
          - "--http-admin-bind"
          - "0.0.0.0:8080"
    monitoring:
      docker_component:
        allocated_cores: 12
      prometheus:
        endpoint: http://localhost:8085/api/v1/telemetry/metrics?format=prometheus&reset=false

  go-collector:
    deployment:
      docker:
        image: otel/opentelemetry-collector-contrib:0.149.0@sha256:0fba96233274f6d665ac8831ad99dfe6479a9a20459f6e2719c0d20945773b46
        network: testbed
        cpuset_cpus: "0"
        ports:
          - "8086:8086"
        volumes:
          - 'test_suites/integration/configs/otelcol/clickhouse-logs.yaml:/etc/otelcol-contrib/config.yaml:ro'
        environment:
          GOMAXPROCS: "1"
    monitoring:
      docker_component:
        allocated_cores: 1
      prometheus:
        endpoint: http://localhost:8086/metrics

  clickhouse:
    deployment:
      docker:
        image: clickhouse/clickhouse-server:26.3.17.56@sha256:422be85ae7344058369cdd366ac0efea9daa8428b55c9cf50258e83a7d12fcb3
        network: testbed
        cpuset_cpus: "44-49"
        ports:
          - "8123:8123"
        environment:
          CLICKHOUSE_PASSWORD: test
    monitoring:
      docker_component:
        allocated_cores: 6

tests:
  - name: OTELCOL-OTLP-TRANSFORMED-SATURATION
    from_template:
      path: test_suites/integration/templates/test_steps/otelcol-clickhouse-steps-docker.yaml
      variables:
        signals_per_second: null
        loadgen_max_in_flight: 10
        max_batch_size: 8192
        wait_for_data_interval: 20
        observation_interval: 120
        drain_timeout_secs: 120
