service:
  flush: 1
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: opentelemetry
      listen: 0.0.0.0
      port: 4317
      http2: on
      threaded: off
      processors:
        logs:
          - name: content_modifier
            context: otel_log_attributes
            action: insert
            key: processing.engine
            value: benchmark
          - name: content_modifier
            context: otel_log_attributes
            action: insert
            key: processing.stage
            value: benchmark
          - name: content_modifier
            context: otel_log_attributes
            action: insert
            key: processing.batch.id
            value: benchmark

  outputs:
    - name: opentelemetry
      match: '*'
      host: backend-service
      port: 1235
      grpc: on
      tls: off
      workers: 0
      retry_limit: false