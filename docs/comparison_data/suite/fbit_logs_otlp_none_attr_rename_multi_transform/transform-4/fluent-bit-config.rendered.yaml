service:
  flush: 1
  log_level: info
  http_server: on
  http_listen: 0.0.0.0
  http_port: 2020

pipeline:
  inputs:
    - name: opentelemetry
      listen: 0.0.0.0
      port: 4317
      http2: on
      threaded: off
      processors:
        logs:
          - name: content_modifier
            context: otel_log_attributes
            action: rename
            key: exception.type
            value: exception.kind
          - name: content_modifier
            context: otel_log_attributes
            action: rename
            key: exception.message
            value: exception.msg
          - name: content_modifier
            context: otel_log_attributes
            action: rename
            key: exception.stacktrace
            value: exception.trace
          - name: content_modifier
            context: otel_log_attributes
            action: rename
            key: user.id
            value: end_user.id

  outputs:
    - name: opentelemetry
      match: '*'
      host: backend-service
      port: 1235
      grpc: on
      tls: off
      workers: 0
      retry_limit: false