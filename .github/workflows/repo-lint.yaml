# This workflow is for various linting tasks that act in bulk over the repository.
# Scoped linting (i.e. code formatting) should be done in the respective language-specific workflows.
name: Repo Lint

permissions:
  contents: read

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
    branches:
      - main
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  deny:
    strategy:
      fail-fast: false
      matrix:
        folder:
          - otap-dataflow
          - contrib/data_engine
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check cargo-deny opt-out
        id: deny_bypass
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          MERGE_GROUP_HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [[ "$EVENT_NAME" == "merge_group" ]]; then
            if [[ "$MERGE_GROUP_HEAD_REF" =~ /pr-([0-9]+)- ]]; then
              PR_NUMBER="${BASH_REMATCH[1]}"
            else
              echo "::error::Could not identify the pull request from merge group ref."
              exit 1
            fi
          fi

          skip=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" \
            --jq 'any(.labels[]; .name == "skipdeny")')
          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

          if [[ "$skip" == "true" ]]; then
            echo "::notice::Skipping cargo-deny because PR #${PR_NUMBER} has the skipdeny label."
            echo "cargo-deny bypassed for PR #${PR_NUMBER} via \`skipdeny\`. Maintainers must confirm the failure is pre-existing and not introduced by this PR." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.deny_bypass.outputs.skip != 'true'
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        if: steps.deny_bypass.outputs.skip != 'true'
        with:
          toolchain: stable
      - name: Advisories
        if: "!cancelled() && steps.deny_bypass.outputs.skip == 'false'"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories
          manifest-path: ./rust/${{ matrix.folder }}/Cargo.toml
      - name: Licenses
        if: "!cancelled() && steps.deny_bypass.outputs.skip == 'false'"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check licenses
          manifest-path: ./rust/${{ matrix.folder }}/Cargo.toml
      - name: Bans
        if: "!cancelled() && steps.deny_bypass.outputs.skip == 'false'"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check bans
          manifest-path: ./rust/${{ matrix.folder }}/Cargo.toml
      - name: Sources
        if: "!cancelled() && steps.deny_bypass.outputs.skip == 'false'"
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check sources
          manifest-path: ./rust/${{ matrix.folder }}/Cargo.toml

  markdownlint:
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: run markdownlint
      uses: DavidAnson/markdownlint-cli2-action@21c1be1b93ad9ed58fa840aacc3f279cde2a72ff # v24.2.0
      with:
        globs: |
          **/*.md

  link-check:
    runs-on: ubuntu-latest

    steps:
    - name: Harden the runner (Audit all outbound calls)
      uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
      with:
        egress-policy: audit

    - name: check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: run lychee
      uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
      with:
        args: --verbose --no-progress --config .github/lychee.toml './**/*.md'
        fail: true

  sanity:
    runs-on: ubuntu-latest
    if: always()
    needs: deny

    steps:
    - name: Require cargo-deny success or explicit opt-out
      env:
        DENY_RESULT: ${{ needs.deny.result }}
      run: |
        if [[ "$DENY_RESULT" != "success" ]]; then
          echo "::error::deny failed, was cancelled, or was skipped."
          exit 1
        fi

    - name: check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: run sanitycheck.py
      run: python3 ./tools/sanitycheck.py

    - name: run sanitycheck.py unit tests
      run: python3 ./tools/test_sanitycheck.py

    - name: run owner coverage unit tests
      run: python3 .github/workflows/scripts/test_report_owner_coverage.py

  renovate-config-validation:
    runs-on: ubuntu-latest

    steps:
    - name: check out code
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false

    - name: Set up Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: '24'

    - name: Validate Renovate config
      run: npx --yes --package renovate -- renovate-config-validator --strict
