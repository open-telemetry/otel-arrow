name: Flaky Test Tracker

# Runs daily and on-demand to detect flaky tests from recent CI runs.
# Parses JUnit XML artifacts from Rust-CI workflow runs, identifies tests
# marked as flaky (failed then passed on retry), and creates/updates a
# tracking issue with a summary table.

permissions:
  contents: read

on:
  schedule:
    # Run daily at 06:00 UTC
    - cron: "0 6 * * *"
  workflow_dispatch:

env:
  # The label applied to the flaky test tracking issue.
  FLAKY_ISSUE_LABEL: "flaky-test"
  # How many recent Rust-CI workflow runs to scan.
  LOOKBACK_RUNS: 50
  # Reject API responses that do not contain runs from this recent window.
  RUN_LOOKBACK_DAYS: 7
  # Keep previously observed tests visible for this many calendar days.
  LAST_SEEN_RETENTION_DAYS: 7
  # The canonical tracking issue to update. Keep a stable default to avoid
  # duplicate issues when GitHub's search/label indexes are stale, but allow
  # overriding it via a repository variable if the canonical issue changes
  # (for example after repo migration or switching to a new tracker issue).
  FLAKY_ISSUE_NUMBER: ${{ vars.FLAKY_ISSUE_NUMBER || '2720' }}

jobs:
  detect-flaky-tests:
    permissions:
      actions: read
      issues: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Ensure flaky-test label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "$FLAKY_ISSUE_LABEL" \
            --description "Automatically detected flaky tests" \
            --color "FBCA04" \
            --force

      - name: Download JUnit XML from recent Rust-CI runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p junit-artifacts

          # Get the workflow ID for Rust-CI
          WORKFLOW_ID=$(gh api "repos/${{ github.repository }}/actions/workflows" \
            --jq '.workflows[] | select(.name == "Rust-CI") | .id')

          if [[ -z "$WORKFLOW_ID" ]]; then
            echo "::error::Could not find Rust-CI workflow"
            exit 1
          fi

          echo "Rust-CI workflow ID: $WORKFLOW_ID"
          RUN_CUTOFF=$(date -u -d "$RUN_LOOKBACK_DAYS days ago" \
            +"%Y-%m-%dT%H:%M:%SZ")

          # Recent pull requests, so that runs from draft pull requests can
          # be excluded. Draft pull requests are not ready for review, so
          # their failures are not yet actionable.
          #
          # Runs triggered from forks -- how nearly every contribution to
          # this repository arrives -- leave the run's `pull_requests` field
          # empty, so runs are matched to pull requests by head label
          # ("owner:branch") below. This is best effort: if the lookup
          # fails, draft runs are simply not filtered out.
          #
          # Two pages are fetched so the pull request window comfortably
          # outspans the run window below: draft filtering only works for
          # runs whose head label appears here, and a run's pull request is
          # missed if more pull requests were updated than are fetched.
          for PAGE in 1 2; do
            gh api "repos/${{ github.repository }}/pulls?state=all&sort=updated&direction=desc&per_page=100&page=$PAGE" \
              --jq '.[] | {label: .head.label, draft: .draft}' || true
          done | jq -s '.' > pull-requests.json

          # Get recent completed runs, skipping draft pull requests. Rust-CI
          # no longer runs on pushes to main, so this scans pull request and
          # merge queue runs rather than filtering to a single branch.
          #
          # The pull request list is ordered most-recently-updated first, so
          # the first entry for a head label is that branch's current pull
          # request. A label with no known pull request is kept: that is how
          # merge queue runs ("gh-readonly-queue/...") reach the report, and
          # it keeps a failed lookup from dropping every run.
          RUN_INFO=$(gh api --method GET \
            "repos/${{ github.repository }}/actions/workflows/$WORKFLOW_ID/runs" \
            -f status=completed -f created=">=$RUN_CUTOFF" -F per_page=100 \
            --jq '[.workflow_runs[] | {
                id, created_at, conclusion,
                label: (
                  (.head_repository.owner.login // "")
                  + ":" + (.head_branch // "")
                )
              }]' \
            | jq -r --slurpfile pulls pull-requests.json \
              --argjson limit "$LOOKBACK_RUNS" '
                (reduce $pulls[0][] as $pr ({};
                  if has($pr.label) then . else .[$pr.label] = $pr.draft end)) as $draft
                | [.[] | select(
                        .conclusion == "success" or .conclusion == "failure"
                      )
                    | select($draft[.label] != true)
                  ][:$limit][]
                | [.id, .created_at] | @tsv')

          if [[ -z "$RUN_INFO" ]]; then
            echo "::error::No recent Rust-CI runs found since $RUN_CUTOFF"
            exit 1
          fi
          printf '%s\n' "$RUN_INFO" > selected-runs.tsv

          echo "Found $(wc -l < selected-runs.tsv) recent runs"
          while IFS=$'\t' read -r RUN_ID CREATED_AT; do
            echo "Checking run $RUN_ID for JUnit artifacts..."
            # List artifacts for this run that match our naming pattern
            ARTIFACT_INFO=$(gh api \
              "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
              --jq '.artifacts[]
                | select(.name | startswith("junit-xml-"))
                | [.id, .name] | @tsv')

            while IFS=$'\t' read -r ARTIFACT_ID ARTIFACT_NAME; do
              [[ -z "$ARTIFACT_ID" ]] && continue
              echo "  Downloading artifact $ARTIFACT_NAME ($ARTIFACT_ID) from run $RUN_ID"
              DEST_DIR="junit-artifacts/run-$RUN_ID/$ARTIFACT_NAME"
              mkdir -p "$DEST_DIR"
              gh api "repos/${{ github.repository }}/actions/artifacts/$ARTIFACT_ID/zip" \
                > "$DEST_DIR/artifact.zip"
              (
                cd "$DEST_DIR"
                unzip -o -q "artifact.zip"
                rm -f "artifact.zip"
              )
            done <<< "$ARTIFACT_INFO"
          done < selected-runs.tsv

          XML_COUNT=$(find junit-artifacts -type f -name '*.xml' | wc -l)
          if [[ "$XML_COUNT" -eq 0 ]]; then
            echo "::error::No JUnit XML files were downloaded; refusing to update the report"
            exit 1
          fi

          echo "Found $XML_COUNT JUnit XML files"
          find junit-artifacts -type f -name '*.xml' | head -50

      - name: Parse JUnit XML and detect flaky tests
        id: parse
        env:
          GITHUB_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
          FLAKY_ISSUE_LABEL: ${{ env.FLAKY_ISSUE_LABEL }}
          FLAKY_ISSUE_NUMBER: ${{ env.FLAKY_ISSUE_NUMBER }}
          LAST_SEEN_RETENTION_DAYS: ${{ env.LAST_SEEN_RETENTION_DAYS }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/workflows/scripts/parse_flaky.py

      - name: Update tracking issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          STEPS_PARSE_OUTPUTS_FLAKY_COUNT: ${{ steps.parse.outputs.flaky_count }}
        run: |
          set -euo pipefail

          BODY=$(cat flaky-report.md)
          FLAKY_COUNT="${STEPS_PARSE_OUTPUTS_FLAKY_COUNT}"
          FLAKY_COUNT="${FLAKY_COUNT:-0}"

          echo "Updating tracking issue #$FLAKY_ISSUE_NUMBER (flaky_count: $FLAKY_COUNT)"
          gh issue edit "$FLAKY_ISSUE_NUMBER" \
            --body "$BODY" \
            --add-label "$FLAKY_ISSUE_LABEL"

      - name: Post summary
        if: always()
        run: |
          if [[ -f flaky-report.md ]]; then
            cat flaky-report.md >> "$GITHUB_STEP_SUMMARY"
          fi
