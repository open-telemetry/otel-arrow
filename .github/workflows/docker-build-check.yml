name: Docker Build Check
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rust/otap-dataflow/Dockerfile'
      - 'rust/otap-dataflow/cross-arch-build.sh'
      - 'rust/otap-dataflow/Cargo.toml'
      - 'rust/otap-dataflow/Cargo.lock'
      - 'rust/otap-dataflow/src/**'
      - 'rust/otap-dataflow/crates/**'
      - 'THIRD_PARTY_NOTICES.txt'
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  docker-build:
    runs-on: ubuntu-26.04
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build Docker image
        run: |
          cd rust/otap-dataflow
          docker buildx build \
            --build-context otel-arrow=../../ \
            -f Dockerfile \
            -t df_engine:check \
            --load \
            .
