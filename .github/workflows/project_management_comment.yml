name: Add comment
on:
  issues:
    types:
      - labeled
permissions:
  contents: read

jobs:
  add-comment:
    if: github.event.label.name == 'help wanted'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Add comment
        uses: peter-evans/create-or-update-comment@57232238742e38b2ccc27136ce596ccae7ca28b4
        with:
          issue-number: ${{ github.event.issue.number }}
          body: |
            This issue is available for anyone to work on.

            **To avoid duplicated effort, please claim it before you start:**
            1. Check the assignee and the comments below - if someone is already assigned or has claimed it, coordinate with them first instead of starting in parallel.
            2. If it is unclaimed, leave a comment asking to be assigned, and **wait until you are actually assigned** before doing the work.
            3. Once assigned, **reference this issue in your pull request** (could be draft) so progress is visible to everyone.
            4. If you can no longer work on it, please comment so we can unassign and free it up for others.

            Claims with no visible progress or update for 2 weeks may be unassigned so someone else can pick the issue up.

            :sparkles: Thank you for your contribution! :sparkles:
