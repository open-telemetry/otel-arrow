# This workflow requires that any PR targeting the main branch adds a
# yaml file to the appropriate `.chloggen/` directory
# (`go/.chloggen/` for Go changes, `rust/otap-dataflow/.chloggen/` for
# Rust changes). If a CHANGELOG entry is not required (e.g. internal
# refactors, dev-dependency bumps), include "chore" in the PR title,
# apply the "chore" label, or apply the "skipchangelog" label.
#
# PRs confined to paths that have no changelog to write into -- any `docs/`
# or `rfcs/` directory, or `rust/experimental/` -- are exempt automatically.
#
# Modeled on opentelemetry-collector-contrib/.github/workflows/changelog.yml.

name: changelog

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled, edited]
    branches:
      - main
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changelog-merge-group:
    name: changelog
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'merge_group' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Identify pull request in merge group
        id: merge_group
        env:
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [[ "$HEAD_REF" =~ /pr-([0-9]+)- ]]; then
            echo "pr_number=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Error: Could not identify the pull request from merge group ref: $HEAD_REF"
            exit 1
          fi
      - name: Block merge during active release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/scripts/check-release-freeze.sh "${{ steps.merge_group.outputs.pr_number }}"

  changelog-bot-pull-request:
    name: changelog
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && (github.actor == 'dependabot[bot]' || github.actor == 'renovate[bot]' || github.actor == 'otelbot-arrow[bot]') }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Block merge during active release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/scripts/check-release-freeze.sh "${{ github.event.pull_request.number }}"

  changelog-validation:
    name: changelog
    runs-on: ubuntu-latest
    if: ${{ github.event_name == 'pull_request' && github.actor != 'dependabot[bot]' && github.actor != 'renovate[bot]' && github.actor != 'otelbot-arrow[bot]' }}
    env:
      PR_HEAD: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Detect changelog bypass conditions
        id: detect_bypass
        env:
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          labels="$PR_LABELS"
          title="$PR_TITLE"

          skip=false
          for label in dependencies chore skipchangelog; do
            if echo "$labels" | grep -Eq "(^|[[:space:]])${label}($|[[:space:]])"; then
              skip=true
              break
            fi
          done

          if echo "$title" | grep -qi 'chore'; then
            skip=true
          fi

          echo "skip=${skip}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ steps.detect_bypass.outputs.skip == 'true' && '1' || '0' }}

      - name: Block merge during active release
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./.github/workflows/scripts/check-release-freeze.sh "${{ github.event.pull_request.number }}"

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        if: ${{ steps.detect_bypass.outputs.skip != 'true' }}
        with:
          go-version: stable
          cache-dependency-path: "**/*.sum"

      - name: Check if PR only touches changelog-exempt paths
        id: check_exempt_paths
        if: ${{ steps.detect_bypass.outputs.skip != 'true' }}
        run: |
          # Get all changed files
          all_changed=$(git diff --name-only "$(git merge-base origin/main "$PR_HEAD")" "$PR_HEAD")

          # Treat PR as exempt when every changed file is under a path with no
          # user-facing changelog:
          #   - any docs/ or rfcs/ directory
          #   - rust/experimental/, whose crates ship no CHANGELOG.md
          non_exempt_files=$(printf '%s\n' "$all_changed" | grep -v '^$' \
            | grep -v -E '(^|.*/)(docs|rfcs)/' \
            | grep -v -E '^rust/experimental/' \
            || true)

          if [ -z "$non_exempt_files" ]; then
            echo "is_exempt=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_exempt=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Ensure no direct edits to CHANGELOG files
        if: ${{ steps.detect_bypass.outputs.skip != 'true' && steps.check_exempt_paths.outputs.is_exempt != 'true' }}
        run: |
          changed=$(git diff --name-only "$(git merge-base origin/main "$PR_HEAD")" "$PR_HEAD" \
            -- go/CHANGELOG.md rust/otap-dataflow/CHANGELOG.md)
          if [ -n "$changed" ]; then
            echo "Error: the following CHANGELOG files were modified directly:"
            echo "$changed"
            echo
            echo "Please add a .yaml entry to go/.chloggen/ or"
            echo "rust/otap-dataflow/.chloggen/ instead (see the README in each)."
            echo "If this PR does not require a changelog entry, add 'chore' to the"
            echo "PR title, apply the 'chore' label, or apply the 'skipchangelog' label."
            exit 1
          fi

      - name: Ensure a .chloggen/*.yaml entry was added or edited
        if: ${{ steps.detect_bypass.outputs.skip != 'true' && steps.check_exempt_paths.outputs.is_exempt != 'true' }}
        run: |
          touched=$(git diff --diff-filter=AM --name-only "$(git merge-base origin/main "$PR_HEAD")" "$PR_HEAD" \
            -- 'go/.chloggen/' 'rust/otap-dataflow/.chloggen/' \
            | grep -E '\.chloggen/.+\.yaml$' \
            | grep -v -E '\.chloggen/(TEMPLATE|config)\.yaml$' \
            || true)
          if [ -z "$touched" ]; then
            echo "Error: no .chloggen/*.yaml entry was added or modified in this PR."
            echo
            echo "Copy 'go/.chloggen/TEMPLATE.yaml' (for Go changes) or"
            echo "'rust/otap-dataflow/.chloggen/TEMPLATE.yaml' (for Rust changes)"
            echo "to a new .yaml file in the same directory, fill in the fields,"
            echo "and commit it."
            echo
            echo "See the documentation for details:"
            echo "  - https://github.com/open-telemetry/otel-arrow/blob/main/CONTRIBUTING.md#changelog-entries"
            echo "  - https://github.com/open-telemetry/otel-arrow/blob/main/go/.chloggen/README.md"
            echo "  - https://github.com/open-telemetry/otel-arrow/blob/main/rust/otap-dataflow/.chloggen/README.md"
            echo
            echo "If this PR does not require a changelog entry, add 'chore' to the"
            echo "PR title, apply the 'chore' label, or apply the 'skipchangelog' label."
            exit 1
          fi
          echo "Touched chloggen entries:"
          echo "$touched"

          mapfile -t touched_files <<< "$touched"
          non_ascii=$(LC_ALL=C grep -a -nP '[\x80-\xFF]' -- "${touched_files[@]}" || true)
          if [ -n "$non_ascii" ]; then
            echo "Error: .chloggen entries must contain only ASCII characters."
            echo
            echo "$non_ascii"
            echo
            echo "Replace typographic punctuation and other non-ASCII characters with ASCII equivalents."
            exit 1
          fi

      - name: Validate .chloggen/*.yaml entries
        if: ${{ steps.detect_bypass.outputs.skip != 'true' && steps.check_exempt_paths.outputs.is_exempt != 'true' }}
        run: |
          make chlog-install
          make chlog-validate
