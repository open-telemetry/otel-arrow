name: Go-CI
# See README.md in this directory for CI event, status, and cache strategy.
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - "go/**"
      - ".github/workflows/go-ci.yml"
  pull_request:
    branches:
      - main
  merge_group:

# Cancel in-progress runs on new commits to same PR
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  test_and_coverage:
    if: github.event_name != 'push'
    strategy:
      fail-fast: false
      matrix:
        folder:
          - pkg/otel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.27.3"
      - name: Run tests with coverage
        run: go test -cover -coverprofile=coverage.txt -covermode=atomic -coverpkg=./... ./...
        working-directory: ./go/${{ matrix.folder }}
      # NOTE: when adding or removing a codecov upload step anywhere in
      # the repo, update `codecov.notify.after_n_builds` in
      # .github/codecov.yaml so codecov waits for the new total.
      - name: Upload to codecov.io
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          fail_ci_if_error: true

  codeql:
    # Keep the default-branch code-scanning baseline current after merges.
    permissions:
      # needed for codeql
      security-events: write
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        persist-credentials: false
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version: "1.27.3"
    - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      with:
        languages: go
    - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
      timeout-minutes: 60

  # Aggregated status check for all Go CI jobs
  # This job can be set as a required status check in GitHub branch protection
  # to simplify maintenance - add/remove jobs from the needs list as needed
  go-required-status-check:
    runs-on: ubuntu-latest
    if: github.event_name != 'push' && !cancelled()
    needs:
      - test_and_coverage
      - codeql
    steps:
      - name: Check if all jobs succeeded
        run: |
          # Check if any required job failed or was cancelled
          if [[ "${{ needs.test_and_coverage.result }}" != "success" ]]; then
            echo "test_and_coverage failed or was cancelled"
            exit 1
          fi
          if [[ "${{ needs.codeql.result }}" != "success" ]]; then
            echo "codeql failed or was cancelled"
            exit 1
          fi
          echo "All required checks passed!"
