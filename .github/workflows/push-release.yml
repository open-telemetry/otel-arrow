name: Push Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to tag and publish (e.g., 0.40.0)"
        required: true
        type: string
      dry_run:
        description: "Dry run mode (just show what would happen)"
        required: true
        type: boolean
        default: true

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: push-release
  cancel-in-progress: false

jobs:
  push-release:
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ !inputs.dry_run && 'release' || '' }}
    steps:
      - name: Checkout (dry run)
        if: inputs.dry_run
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}

      - name: Create GitHub App token
        if: "!inputs.dry_run"
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.OTELBOT_ARROW_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_ARROW_PRIVATE_KEY }}

      - name: Get GitHub App User ID
        if: "!inputs.dry_run"
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout (release push)
        if: "!inputs.dry_run"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}
          token: ${{ steps.app-token.outputs.token }}

      - name: Validate inputs
        run: |
          # Validate version format
          if [[ ! "${{ inputs.version }}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Error: Version must be in format X.Y.Z (e.g., 0.40.0)"
            exit 1
          fi

      - name: Resolve release pull request commit
        id: release
        env:
          GH_TOKEN: ${{ inputs.dry_run && github.token || steps.app-token.outputs.token }}
        run: |
          BRANCH="otelbot/release-v${{ inputs.version }}"
          RELEASE_PRS=$(gh api \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&head=${GITHUB_REPOSITORY_OWNER}:${BRANCH}&per_page=100" \
            --jq '[.[] | select(.merged_at != null)]')
          RELEASE_PR_COUNT=$(jq 'length' <<< "$RELEASE_PRS")

          if [ "$RELEASE_PR_COUNT" -ne 1 ]; then
            echo "Error: Expected exactly one merged release PR from ${BRANCH}, found ${RELEASE_PR_COUNT}"
            echo "Make sure the Prepare Release PR for v${{ inputs.version }} has been merged"
            exit 1
          fi

          RELEASE_PR=$(jq -r '.[0].number' <<< "$RELEASE_PRS")
          RELEASE_SHA=$(jq -r '.[0].merge_commit_sha' <<< "$RELEASE_PRS")

          echo "pr_number=$RELEASE_PR" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"
          echo "Resolved release PR #${RELEASE_PR} to commit ${RELEASE_SHA}"

      - name: Check out release pull request commit
        run: |
          git fetch --quiet origin main --tags
          git checkout --detach "${{ steps.release.outputs.sha }}"

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.98.0

      - name: Verify release preparation
        run: |
          # Check if the version is already in go/CHANGELOG.md.
          # Chloggen renders new entries under `## v<VERSION>`.
          if ! grep -q "^## v${{ inputs.version }}$" go/CHANGELOG.md; then
            echo "Error: Version v${{ inputs.version }} not found in go/CHANGELOG.md"
            echo "Make sure you have run the 'Prepare Release' workflow and merged the PR first"
            exit 1
          fi

          # Check if repository is clean
          if [ -n "$(git status --porcelain)" ]; then
            echo "Error: Repository has uncommitted changes"
            git status
            exit 1
          fi

          if [ "$(git rev-parse HEAD)" != "${{ steps.release.outputs.sha }}" ]; then
            echo "Error: Checkout does not match the resolved release PR commit"
            exit 1
          fi

      - name: Get last released version
        id: last_version
        run: |
          # Get the latest tag
          LAST_TAG=$(
            git tag --list 'v*' --sort=-version:refname |
              awk -v current="v${{ inputs.version }}" '$0 != current { print; exit }'
          )
          if [ -z "$LAST_TAG" ]; then
            echo "No previous tags found"
            LAST_VERSION="0.0.0"
          else
            LAST_VERSION=${LAST_TAG#v}
          fi
          echo "last_version=$LAST_VERSION" >> $GITHUB_OUTPUT
          echo "Last released version: $LAST_VERSION"
          echo "New version: ${{ inputs.version }}"

      - name: Validate version increment
        run: |
          LAST_VERSION="${{ steps.last_version.outputs.last_version }}"
          NEW_VERSION="${{ inputs.version }}"

          # Simple version comparison (assumes semantic versioning)
          if [ "$LAST_VERSION" != "0.0.0" ]; then
            if ! printf '%s\n%s\n' "$LAST_VERSION" "$NEW_VERSION" | sort -V -C; then
              echo "Error: New version $NEW_VERSION is not greater than last version $LAST_VERSION"
              exit 1
            fi
          fi

      - name: Validate existing tags
        run: |
          for tag in \
            "v${{ inputs.version }}" \
            "go/v${{ inputs.version }}" \
            "rust/otap-dataflow/v${{ inputs.version }}"; do
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              TAG_COMMIT=$(git rev-parse "${tag}^{commit}")
              if [ "$TAG_COMMIT" != "${{ steps.release.outputs.sha }}" ]; then
                echo "Error: Existing tag ${tag} points to ${TAG_COMMIT}"
                exit 1
              fi
              echo "Existing tag ${tag} already points to the release commit"
            fi
          done

      - name: Preflight Rust crates.io publish
        run: cargo xtask crates-publish preflight "${{ inputs.version }}"
        working-directory: rust/otap-dataflow

      - name: Extract changelog content for this release
        id: changelog
        run: |
          # Pull the rendered section from each CHANGELOG and combine
          # them under per-language `## What's Changed (...)` headings
          # for the GitHub Release body. --allow-missing keeps the
          # workflow working if one side had no chloggen entries this
          # release.
          .github/workflows/scripts/extract-changelog.sh \
            --version "${{ inputs.version }}" \
            --file go/CHANGELOG.md \
            --allow-missing \
            /tmp/go_release_content.txt
          .github/workflows/scripts/extract-changelog.sh \
            --version "${{ inputs.version }}" \
            --file rust/otap-dataflow/CHANGELOG.md \
            --allow-missing \
            /tmp/rust_release_content.txt

          {
            echo "## Go Module"
            echo ""
            echo "This release includes the following Go module:"
            echo ""
            echo "- \`github.com/open-telemetry/otel-arrow/go@v${{ inputs.version }}\`"
            echo ""
            echo "## Rust Crates"
            echo ""
            (cd rust/otap-dataflow && cargo xtask crates-publish plan) \
              > /tmp/crates_publish_plan.json
            jq -r --arg version "${{ inputs.version }}" \
              '.packages[] | "- `\(.name)@\($version)`"' \
              /tmp/crates_publish_plan.json
            echo ""
            echo "The Rust workspace is tagged as \`rust/otap-dataflow/v${{ inputs.version }}\`."
            echo ""
            echo "## What's Changed (Go :hamster:)"
            echo ""
            if [ -s /tmp/go_release_content.txt ]; then
              cat /tmp/go_release_content.txt
            else
              echo "_No Go changes in this release._"
            fi
            echo ""
            echo "## What's Changed (Rust :crab:)"
            echo ""
            if [ -s /tmp/rust_release_content.txt ]; then
              cat /tmp/rust_release_content.txt
            else
              echo "_No Rust changes in this release._"
            fi
          } > /tmp/release_content.txt
          echo "package_count=$(jq '.packages | length' /tmp/crates_publish_plan.json)" \
            >> "$GITHUB_OUTPUT"

      - name: Dry run - Show planned changes
        if: inputs.dry_run
        run: |
          # Write to GitHub Step Summary
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          # :rocket: Release Push Dry Run

          ## Summary
          **DRY RUN MODE** - No changes will be made to the repository

          ## Planned Operations
          - **Version to tag**: `v${{ inputs.version }}`
          - **Release PR**: `#${{ steps.release.outputs.pr_number }}`
          - **Commit to tag**: `${{ steps.release.outputs.sha }}`
          - **Last version**: `v${{ steps.last_version.outputs.last_version }}`

          ## Git Tags to Create
          - `v${{ inputs.version }}` - Main release tag
          - `go/v${{ inputs.version }}` - Go module tag
          - `rust/otap-dataflow/v${{ inputs.version }}` - Rust workspace tag

          ## crates.io
          - **Packages**: ${{ steps.changelog.outputs.package_count }} OTAP Dataflow crates in dependency order
          - **Authentication**: crates.io trusted publishing (OIDC)
          - Existing versions are detected and skipped.

          ## GitHub Release
          - **Title**: Release v${{ inputs.version }}
          - **Tag**: v${{ inputs.version }}
          - **Type**: Draft release (latest)
          - **Release notes**: Combined from `go/CHANGELOG.md` and `rust/otap-dataflow/CHANGELOG.md`

          ## Go Modules
          After release, the following modules will be available:
          ```bash
          go get github.com/open-telemetry/otel-arrow/go@v${{ inputs.version }}
          ```

          ## Release Notes Preview
          ```
          EOF
          cat /tmp/release_content.txt >> $GITHUB_STEP_SUMMARY
          cat >> $GITHUB_STEP_SUMMARY << 'EOF'
          ```

          ## Next Steps
          1. Review the planned operations above
          2. Run again without dry-run when ready to publish
          3. The GitHub release will be created as a draft for final review

          ---
          **Note**: This is a dry run. To execute the actual release push, set `dry_run` to `false`.
          EOF

      - name: Authenticate to crates.io with trusted publishing
        if: "!inputs.dry_run"
        id: crates-io-auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5

      - name: Publish Rust crates with trusted publishing
        if: "!inputs.dry_run"
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
        run: cargo xtask crates-publish publish "${{ inputs.version }}"
        working-directory: rust/otap-dataflow

      - name: Create git tags
        if: "!inputs.dry_run"
        run: |
          # Configure git
          git config user.name '${{ steps.app-token.outputs.app-slug }}[bot]'
          git config user.email '${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com'

          create_tag() {
            local tag="$1"
            if git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
              echo "Tag ${tag} already exists at the release commit"
            else
              git tag -a "$tag" "${{ steps.release.outputs.sha }}" -m "Release ${tag}"
            fi
          }

          create_tag "v${{ inputs.version }}"
          create_tag "go/v${{ inputs.version }}"
          create_tag "rust/otap-dataflow/v${{ inputs.version }}"

          echo "Created tags:"
          git tag --list "v${{ inputs.version }}"
          git tag --list "*v${{ inputs.version }}"

      - name: Push git tags
        if: "!inputs.dry_run"
        run: |
          # Push all tags for this version
          git push origin "v${{ inputs.version }}"
          git push origin "go/v${{ inputs.version }}"
          git push origin "rust/otap-dataflow/v${{ inputs.version }}"

          echo "Pushed tags:"
          echo "- v${{ inputs.version }}"
          echo "- go/v${{ inputs.version }}"
          echo "- rust/otap-dataflow/v${{ inputs.version }}"

      - name: Create GitHub release
        if: "!inputs.dry_run"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Read combined changelog content into a variable
          RELEASE_CONTENT=$(cat /tmp/release_content.txt)

          # Create release body content
          cat > /tmp/release_body.md << EOF
          ${RELEASE_CONTENT}

          **Full Changelog**: https://github.com/open-telemetry/otel-arrow/compare/v${{ steps.last_version.outputs.last_version }}...v${{ inputs.version }}
          EOF

          if gh release view "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "GitHub release v${{ inputs.version }} already exists; skipping"
          else
            gh release create "v${{ inputs.version }}" \
              --title "Release v${{ inputs.version }}" \
              --notes-file /tmp/release_body.md \
              --draft \
              --latest
          fi

      - name: Summary
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            echo ":heavy_check_mark: Dry run completed successfully"
            echo "No changes were made to the repository"
            echo "Review the planned changes above and run again without dry-run when ready"
          else
            echo ":heavy_check_mark: Release published successfully"
            echo ""
            echo "Release details:"
            echo "- Version: v${{ inputs.version }}"
            echo "- Release PR: #${{ steps.release.outputs.pr_number }}"
            echo "- Tagged commit: ${{ steps.release.outputs.sha }}"
            echo "- GitHub release: https://github.com/open-telemetry/otel-arrow/releases/tag/v${{ inputs.version }}"
            echo ""
            echo "Git tags created:"
            echo "- v${{ inputs.version }}"
            echo "- go/v${{ inputs.version }}"
            echo "- rust/otap-dataflow/v${{ inputs.version }}"
            echo ""
            echo "Go modules are now available:"
            echo "- go get github.com/open-telemetry/otel-arrow/go@v${{ inputs.version }}"
          fi
