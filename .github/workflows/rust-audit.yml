name: Rust-Audit
permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
    paths:
      - 'rust/otap-dataflow/Cargo.lock'
      - 'rust/otap-dataflow/Cargo.toml'
  push:
    branches:
      - main
    paths:
      - 'rust/otap-dataflow/Cargo.lock'
      - 'rust/otap-dataflow/Cargo.toml'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  audit:
    strategy:
      fail-fast: false
      matrix:
        folder: [otap-dataflow]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Audit ${{ matrix.folder }}
        run: |
          set +e
          cargo audit --json > /tmp/cargo-audit.json
          status=$?
          set -e

          {
            echo "## Rust dependency audit: ${{ matrix.folder }}"
            echo ""
            echo "**Vulnerabilities:** $(jq -r '.vulnerabilities.found // 0' /tmp/cargo-audit.json)"
            echo ""
            jq -r '
              .vulnerabilities.list[]? |
              "- [\(.advisory.id)](\(.advisory.url)): \(.package.name)@\(.package.version) - \(.advisory.title)"
            ' /tmp/cargo-audit.json
          } >> "$GITHUB_STEP_SUMMARY"

          exit "$status"
        working-directory: ./rust/${{ matrix.folder }}
