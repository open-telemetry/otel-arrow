name: Rust-Audit
permissions:
  contents: read

on:
  push:
    branches:
      - main
    paths:
      - 'rust/**/Cargo.lock'
      - 'rust/**/Cargo.toml'
      - 'rust/**/deny.toml'
      - '.github/workflows/rust-audit.yml'
      - '.github/workflows/scripts/report_cargo_deny.py'
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

concurrency:
  group: rust-dependency-audit
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event.repository.fork == false &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: read
      issues: write
    strategy:
      fail-fast: false
      matrix:
        folder: [otap-dataflow, contrib/data_engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      - name: Check dependencies
        id: deny
        continue-on-error: true
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check
          manifest-path: ./rust/${{ matrix.folder }}/Cargo.toml
      - name: Update dependency tracking issue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WORKSPACE: ${{ matrix.folder }}
          CHECK_OUTCOME: ${{ steps.deny.outcome }}
        run: python3 .github/workflows/scripts/report_cargo_deny.py
      - name: Preserve audit failure visibility
        if: steps.deny.outcome == 'failure'
        run: |
          echo "::error::cargo-deny failed; see the dependency tracking issue and check logs."
          exit 1
