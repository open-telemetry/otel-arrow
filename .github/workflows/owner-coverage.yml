name: Component owner coverage

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] - executes only trusted main-branch code
    branches: [main]
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
  workflow_run:
    workflows: [Owner coverage events]
    types: [completed]
  workflow_dispatch:
    inputs:
      pull_request_number:
        description: PR number to report owner coverage for
        required: true
        type: number

permissions: {}

concurrency:
  # Match the notification run name so all triggers use the same per-PR lock.
  group: >-
    owner-coverage-${{ github.event.workflow_run.display_title ||
    format('Owner reviews for PR #{0}', github.event.pull_request.number || inputs.pull_request_number) }}
  cancel-in-progress: false

jobs:
  report:
    if: github.repository == 'open-telemetry/otel-arrow'
    permissions:
      contents: read
      pull-requests: read
      statuses: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted reporting code and ownership
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false

      - name: Report advisory owner coverage
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/workflows/scripts/report_owner_coverage.py
