name: Pipeline Performance Tests - Continuous
permissions:
  contents: read

on:
  schedule:
    - cron: "0 8 * * *"
  push:
    branches: [main]
    paths:
      - 'rust/**'
      - 'tools/pipeline_perf_test/**'
      - 'tools/comparison_dashboard/**'
      - '.github/workflows/scripts/**'
      - '.github/workflows/pipeline-perf-test-continuous.yml'
  pull_request:
    paths:
      - '.github/workflows/pipeline-perf-test-continuous.yml'
      - '.github/workflows/scripts/analyze-idle-state-scaling.py'
      - '.github/workflows/scripts/analyze-idle-state-variance.py'
      - 'rust/otap-dataflow/**'
      - 'tools/pipeline_perf_test/**'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  WARMUP_ITERATIONS: "1"
  MEASURED_ITERATIONS: "5"
  MAX_CV_PERCENT: "15"

jobs:
  pipeline-perf-test:
    name: Pipeline performance test (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux
            runner: oracle-bare-metal-64cpu-1024gb-x86-64-ubuntu-24
            timeout_minutes: 360
          - platform: windows
            runner: windows-latest
            timeout_minutes: 60
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.timeout_minutes }}
    steps:
      # Route tool-created temp files to RUNNER_TEMP, which GitHub Actions empties
      # at the start and end of every job. Required when running directly on the
      # shared bare-metal host (no job-level container) per
      # https://github.com/open-telemetry/community/blob/main/docs/how-to-use-bare-metal-runner.md
      - name: Route temp files to RUNNER_TEMP
        if: matrix.platform == 'linux'
        run: |
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TMP=$RUNNER_TEMP" >> "$GITHUB_ENV"
          echo "TEMP=$RUNNER_TEMP" >> "$GITHUB_ENV"

      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false

      - name: Free disk space
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Write-Host "disk usage before"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name='Used(GB)';Expression={[math]::Round($_.Used/1GB,2)}}, @{Name='Free(GB)';Expression={[math]::Round($_.Free/1GB,2)}}
          if (Test-Path "C:\Android") { Remove-Item -Recurse -Force "C:\Android" }
          if (Test-Path "C:\SeleniumWebDrivers") { Remove-Item -Recurse -Force "C:\SeleniumWebDrivers" }
          if (Test-Path "C:\imagemagick") { Remove-Item -Recurse -Force "C:\imagemagick" }
          Write-Host "disk usage after"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name='Used(GB)';Expression={[math]::Round($_.Used/1GB,2)}}, @{Name='Free(GB)';Expression={[math]::Round($_.Free/1GB,2)}}

      - name: Set up protoc
        if: matrix.platform == 'windows'
        uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Docker service
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          Start-Service docker
          docker info

      - name: Set up Rust
        if: matrix.platform == 'windows'
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Set up Docker Buildx
        if: matrix.platform == 'linux'
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: System topology (NUMA, CPU, memory)
        if: matrix.platform == 'linux'
        run: |
          echo "### System Topology" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          lscpu | grep -E "Model name|Socket|Core|Thread|NUMA|CPU\(s\)" | tee -a $GITHUB_STEP_SUMMARY
          echo "" | tee -a $GITHUB_STEP_SUMMARY
          numactl --hardware 2>/dev/null | tee -a $GITHUB_STEP_SUMMARY || echo "numactl not available"
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Capture runner metadata
        if: matrix.platform == 'windows' && !cancelled()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/pipeline_perf_test/results | Out-Null
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os = Get-CimInstance Win32_OperatingSystem
          Push-Location rust/otap-dataflow
          $buildRustVersion = (rustc --version)
          Pop-Location
          $meta = [ordered]@{
            timestamp_utc    = (Get-Date).ToUniversalTime().ToString("o")
            commit_sha       = $env:GITHUB_SHA
            ref              = $env:GITHUB_REF
            runner_os        = "${{ runner.os }}"
            runner_image     = "windows-latest"
            os_version       = $os.Version
            os_caption       = $os.Caption
            cpu_model        = $cpu.Name
            logical_cores    = [Environment]::ProcessorCount
            physical_cores   = $cpu.NumberOfCores
            total_memory_gb  = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
            rust_version     = $buildRustVersion
            python_version   = (python --version)
            warmup_iters     = "${{ env.WARMUP_ITERATIONS }}"
            measured_iters   = "${{ env.MEASURED_ITERATIONS }}"
            max_cv_percent   = "${{ env.MAX_CV_PERCENT }}"
          }
          $json = $meta | ConvertTo-Json -Depth 4
          $json | Out-File -Encoding utf8 tools/pipeline_perf_test/results/windows-runner-metadata.json
          Write-Host $json
          echo "### Windows Perf Runner Metadata" >> $env:GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($k in $meta.Keys) { echo "| $k | $($meta[$k]) |" >> $env:GITHUB_STEP_SUMMARY }

      - name: Build dataflow_engine
        if: matrix.platform == 'linux'
        run: |
          cd rust/otap-dataflow
          docker buildx build --load --build-context otel-arrow=../../ -f Dockerfile -t df_engine .
          cd ../..

      # Hosted runners are not a fixed hardware generation, so native codegen
      # would pollute the variance this job measures. The static CRT allows the
      # binary to run in a minimal Windows container. The required features are
      # listed explicitly because the default jemalloc feature conflicts with
      # mimalloc.
      - name: Build df_engine.exe
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: ./rust/otap-dataflow
        run: cargo build --release --no-default-features --features mimalloc,crypto-ring,dev-tools,core-nodes
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build Windows Docker image
        if: matrix.platform == 'windows'
        shell: pwsh
        working-directory: ./rust/otap-dataflow
        run: docker build -f Dockerfile.windows -t df_engine_win .

      - name: Verify Windows Docker image
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          docker images df_engine_win
          docker run --rm df_engine_win --version

      - name: Install Python dependencies
        if: ${{ !cancelled() }}
        run: |
          python -m pip install --user --require-hashes -r tools/pipeline_perf_test/orchestrator/requirements.lock.txt
          python -m pip install --user --require-hashes -r tools/pipeline_perf_test/load_generator/requirements.lock.txt

      - name: Run pipeline performance test log suite
        if: matrix.platform == 'linux'
        run: |
          cd tools/pipeline_perf_test
          python orchestrator/run_orchestrator.py --config test_suites/integration/continuous/100klrps-docker.yaml

      - name: Upload benchmark results for processing
        if: matrix.platform == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: benchmark-results-pipeline
          path: tools/pipeline_perf_test/results/integration/gh-actions-benchmark/*.json

      - name: Add benchmark link to job summary
        if: matrix.platform == 'linux'
        run: |
          echo "### Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "[View the benchmark results here](https://open-telemetry.github.io/otel-arrow/benchmarks/continuous/)" >> $GITHUB_STEP_SUMMARY

      - name: Run idle state test (1 core) - warmup + repeated samples
        if: matrix.platform == 'windows' && !cancelled()
        shell: pwsh
        working-directory: ./tools/pipeline_perf_test
        run: |
          $ErrorActionPreference = 'Stop'
          $warmup = [int]"${{ env.WARMUP_ITERATIONS }}"
          $iterations = [int]"${{ env.MEASURED_ITERATIONS }}"
          $config = "test_suites/integration/nightly-windows/idle-state-docker.yaml"
          $src = "results/windows_idle_state_1core/gh-actions-benchmark"
          $varianceDir = "results/windows_idle_variance"
          if (Test-Path $varianceDir) { Remove-Item -Recurse -Force $varianceDir }
          New-Item -ItemType Directory -Force -Path $varianceDir | Out-Null

          for ($w = 1; $w -le $warmup; $w++) {
            Write-Host "=== Warmup iteration $w/$warmup (discarded) ==="
            python orchestrator/run_orchestrator.py --config $config
            if ($LASTEXITCODE -ne 0) { throw "Warmup iteration $w failed with exit code $LASTEXITCODE" }
          }

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "=== Measured iteration $i/$iterations ==="
            if (Test-Path $src) { Remove-Item -Recurse -Force $src }
            python orchestrator/run_orchestrator.py --config $config
            if ($LASTEXITCODE -ne 0) { throw "Measured iteration $i failed with exit code $LASTEXITCODE" }
            $iterDir = Join-Path $varianceDir ("iter_{0:D2}" -f $i)
            New-Item -ItemType Directory -Force -Path $iterDir | Out-Null
            Copy-Item "$src/*.json" $iterDir -Force
          }

      - name: Analyze idle memory variance (1 core)
        if: matrix.platform == 'windows' && !cancelled()
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python .github/workflows/scripts/analyze-idle-state-variance.py `
            tools/pipeline_perf_test/results/windows_idle_variance `
            tools/pipeline_perf_test/results/windows-idle-variance.json `
            "${{ env.MAX_CV_PERCENT }}" `
            "${{ env.MEASURED_ITERATIONS }}" `
            | Tee-Object -Variable varianceReport
          echo "### Windows Idle Memory Variance (1 core, N=${{ env.MEASURED_ITERATIONS }})" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          $varianceReport >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Upload runner metadata
        if: matrix.platform == 'windows' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runner-metadata
          path: tools/pipeline_perf_test/results/windows-runner-metadata.json

      - name: Upload idle state results
        if: matrix.platform == 'windows' && !cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-idle-state-results
          path: |
            tools/pipeline_perf_test/results/windows_idle_state_*/gh-actions-benchmark/*.json
            tools/pipeline_perf_test/results/windows_idle_variance/**/*.json
            tools/pipeline_perf_test/results/windows-idle-variance.json
            tools/pipeline_perf_test/results/windows-idle-memory-scaling.json

      # Bare-metal host cleanup: remove only the Docker artifacts created by
      # this job. Avoid broad commands (e.g. rm -rf /tmp/*) per the shared
      # runner guidelines.
      - name: Clean up Docker artifacts created by this job
        if: ${{ always() && matrix.platform == 'linux' }}
        run: |
          docker rmi -f df_engine 2>/dev/null || true
          docker builder prune -f 2>/dev/null || true
          docker image prune -f 2>/dev/null || true

  update-benchmarks:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    needs: [pipeline-perf-test]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download benchmark artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: benchmark-results-pipeline*
          merge-multiple: true
          path: results-pipeline

      - name: Consolidate pipeline benchmark data
        run: |
          bash ./.github/workflows/scripts/consolidate-benchmarks.sh results-pipeline output-pipeline.json

      - name: Update pipeline benchmark data and deploy to GitHub Pages
        uses: benchmark-action/github-action-benchmark@52576c92bccf6ac60c8223ec7eb2565637cae9ba # v1.22.1
        with:
          tool: "customSmallerIsBetter"
          output-file-path: output-pipeline.json
          gh-pages-branch: benchmarks
          max-items-in-chart: 100
          github-token: ${{ secrets.GITHUB_TOKEN }}
          benchmark-data-dir-path: "docs/benchmarks/continuous"
          auto-push: true
          save-data-file: true

      - name: Add benchmark link to job summary
        run: |
          echo "### Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "[View the pipeline benchmark results here](https://open-telemetry.github.io/otel-arrow/benchmarks/continuous/)" >> $GITHUB_STEP_SUMMARY

  workflow-notification:
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      issues: write
    needs:
      - pipeline-perf-test
      - update-benchmarks
    uses: open-telemetry/shared-workflows/.github/workflows/workflow-failure-issue.yml@dde3047a8f219c296772c17936b9d02bb7447af5 # v0.12.0
    with:
      success: ${{ needs.pipeline-perf-test.result == 'success' && needs.update-benchmarks.result == 'success' }}
