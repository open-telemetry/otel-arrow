# Pipeline Performance Tests - Windows
#
# STATUS: EXPERIMENTAL / NON-GATING (informational only).
#   Hosted GitHub Windows runners are shared, noisy environments with no
#   dedicated perf hardware. These results are for feasibility and directional
#   sanity, NOT for absolute regression claims. Every measurement step runs with
#   `continue-on-error: true` so a failure or a noisy sample never blocks a PR.
#
# TEST OBJECTIVE:
#   Determine whether a meaningful subset of the pipeline perf suite (starting
#   with idle-state resource usage) is feasible to run on hosted Windows CI,
#   and characterize the variance so we know how much to trust the numbers.
#
# ACCEPTANCE / STABILITY CRITERIA (informational thresholds, see `env` below):
#   - Job completes within the job `timeout-minutes` budget.
#   - Idle-memory coefficient of variation (CV = stddev/mean) across
#     MEASURED_ITERATIONS runs is <= MAX_CV_PERCENT. Above that, results are
#     treated as directional only.
#   - Linear memory-scaling fit (R squared) across 1/2/4 cores is reported for
#     directional sanity, compared to prior Windows runs and the Linux baseline.
#
# METHODOLOGY:
#   - Environment is intentionally unpinned beyond what the repo already pins:
#     the windows-latest image and whatever Python the runner ships. The Rust
#     toolchain comes from rust/otap-dataflow/rust-toolchain.toml, which cargo
#     honors for the build regardless of what the setup action installs.
#     Exact runner details are captured in the metadata artifact.
#   - WARMUP_ITERATIONS discarded warmup run(s) before measurement.
#   - MEASURED_ITERATIONS repeated samples; report median / p95 / stddev / CV
#     rather than a single datapoint or a bare mean.
#   - Raw per-run JSON plus machine metadata uploaded as artifacts every run.
#
# PROMOTION CRITERIA (when this may become gating):
#   Once several weeks of history show CV consistently <= MAX_CV_PERCENT and a
#   stable median across runs, define absolute pass/fail thresholds and remove
#   the `continue-on-error` markers. Until then this stays experimental.

name: Pipeline Performance Tests - Windows
permissions:
  contents: read

on:
  # Nightly at 08:00 UTC (00:00 PT). Offset from the Linux nightly perf job
  # (16:00 / 00:00 UTC) so the two do not compete for runner capacity. This
  # gives a baseline sample independent of merge activity.
  schedule:
    - cron: "0 8 * * *"
  # Run on PRs that touch the engine or the perf harness, so a Windows
  # regression is visible before merge rather than at the next nightly.
  #
  # COST NOTE: the broad rust/otap-dataflow/** and tools/pipeline_perf_test/**
  # paths below mean every push to a matching PR runs this long Windows job.
  # Expect it to take a significant fraction of the 60 minute timeout because
  # it includes a multi-GB Windows base image pull, release build, warmup, and
  # repeated perf samples. It is deliberately non-gating (every measurement
  # step is continue-on-error), so it costs runner time on each PR iteration
  # without blocking merge.
  # If that cost becomes a problem, the cheaper option is to move the
  # engine/harness paths to a `push: branches: [main]` trigger, matching
  # pipeline-perf-test-continuous.yml, and keep only the self-test paths
  # here.
  pull_request:
    paths:
      - '.github/workflows/pipeline-perf-test-windows.yml'
      - '.github/workflows/scripts/analyze-idle-state-scaling.py'
      - '.github/workflows/scripts/analyze-idle-state-variance.py'
      - 'rust/otap-dataflow/**'
      - 'tools/pipeline_perf_test/**'
  workflow_dispatch:

# Cancel a superseded run when a PR is pushed again. Without this, a ~60
# minute job would queue up once per push and several stale runs could be
# measuring at the same time on shared runners, which skews the numbers as
# well as burning capacity. Scheduled runs group by ref and are once daily,
# so they are unaffected.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Tunable statistical parameters. These control measurement rigor only; they do
# not pin any tool/runtime versions. Adjust here, not per-step.
env:
  # Warmup + repetition for statistical rigor.
  WARMUP_ITERATIONS: "1"
  MEASURED_ITERATIONS: "5"
  # Informational stability threshold (percent). CV above this => "noisy".
  MAX_CV_PERCENT: "15"

jobs:
  pipeline-perf-test-windows:
    runs-on: windows-latest
    # Bound total runtime; hard cap so a hung run cannot burn the whole budget.
    timeout-minutes: 60
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true

      - name: Free disk space
        shell: pwsh
        run: |
          Write-Host "disk usage before"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name='Used(GB)';Expression={[math]::Round($_.Used/1GB,2)}}, @{Name='Free(GB)';Expression={[math]::Round($_.Free/1GB,2)}}
          if (Test-Path "C:\Android") { Remove-Item -Recurse -Force "C:\Android" }
          if (Test-Path "C:\SeleniumWebDrivers") { Remove-Item -Recurse -Force "C:\SeleniumWebDrivers" }
          if (Test-Path "C:\imagemagick") { Remove-Item -Recurse -Force "C:\imagemagick" }
          Write-Host "disk usage after"
          Get-PSDrive -PSProvider FileSystem | Select-Object Name, @{Name='Used(GB)';Expression={[math]::Round($_.Used/1GB,2)}}, @{Name='Free(GB)';Expression={[math]::Round($_.Free/1GB,2)}}

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b # v3.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Start Docker service
        shell: pwsh
        run: |
          Start-Service docker
          docker info

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable

      - name: Capture runner metadata
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path tools/pipeline_perf_test/results | Out-Null
          $cpu = Get-CimInstance Win32_Processor | Select-Object -First 1
          $os = Get-CimInstance Win32_OperatingSystem
          # Resolve rustc from inside the crate dir so rust-toolchain.toml
          # applies; this is the toolchain the build actually uses, which is
          # not necessarily the one the setup action installed.
          Push-Location rust/otap-dataflow
          $buildRustVersion = (rustc --version)
          Pop-Location
          $meta = [ordered]@{
            timestamp_utc    = (Get-Date).ToUniversalTime().ToString("o")
            commit_sha       = "${{ github.sha }}"
            ref              = "${{ github.ref }}"
            runner_os        = "${{ runner.os }}"
            runner_image     = "windows-latest"
            os_version       = $os.Version
            os_caption       = $os.Caption
            cpu_model        = $cpu.Name
            logical_cores    = [Environment]::ProcessorCount
            physical_cores   = $cpu.NumberOfCores
            total_memory_gb  = [math]::Round($os.TotalVisibleMemorySize / 1MB, 2)
            rust_version     = $buildRustVersion
            python_version   = (python --version)
            warmup_iters     = "${{ env.WARMUP_ITERATIONS }}"
            measured_iters   = "${{ env.MEASURED_ITERATIONS }}"
            max_cv_percent   = "${{ env.MAX_CV_PERCENT }}"
          }
          $json = $meta | ConvertTo-Json -Depth 4
          $json | Out-File -Encoding utf8 tools/pipeline_perf_test/results/windows-runner-metadata.json
          Write-Host $json
          echo "### Windows Perf Runner Metadata" >> $env:GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $env:GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $env:GITHUB_STEP_SUMMARY
          foreach ($k in $meta.Keys) { echo "| $k | $($meta[$k]) |" >> $env:GITHUB_STEP_SUMMARY }

      # NOTE: deliberately no `-C target-cpu=native`. Hosted runners are not a
      # fixed hardware generation, so native codegen would vary run to run and
      # pollute the very variance this job measures. `+crt-static` is kept so
      # the binary can run in a minimal Windows container.
      #
      # `--no-default-features` is required: the default feature set enables
      # `jemalloc`, and the allocator features are mutually exclusive, so
      # adding `mimalloc` on top of the defaults is a compile error. Because
      # that also drops the other defaults, the ones this job needs are
      # re-enabled explicitly:
      #   crypto-ring - crypto provider for rustls-backed dependencies
      #   dev-tools   - pulls in dev-nodes, which provides the
      #                 urn:otel:receiver:traffic_generator receiver used by
      #                 the load generator in the 100kLRPS test
      - name: Build df_engine.exe
        shell: pwsh
        working-directory: ./rust/otap-dataflow
        run: cargo build --release --no-default-features --features mimalloc,crypto-ring,dev-tools
        env:
          RUSTFLAGS: "-C target-feature=+crt-static"

      - name: Build Windows Docker image
        shell: pwsh
        working-directory: ./rust/otap-dataflow
        run: docker build -f Dockerfile.windows -t df_engine_win .

      - name: Verify Docker image
        shell: pwsh
        run: |
          docker images df_engine_win
          docker run --rm df_engine_win --version

      - name: Install Python dependencies
        if: ${{ !cancelled() }}
        shell: pwsh
        run: |
          # Use plain requirements.txt (not .lock.txt) on Windows because the
          # lock files contain --hash directives that trigger pip hash-checking
          # mode, which rejects the Windows-only transitive dep pywin32 (not in
          # the Linux-generated lock file).
          python -m pip install --user -r tools/pipeline_perf_test/orchestrator/requirements.txt
          python -m pip install --user -r tools/pipeline_perf_test/load_generator/requirements.txt

      # Warmup + repeated measurement for the 1-core idle test. Warmup runs are
      # discarded (fill caches / JIT / Docker layer warmup); measured runs are
      # collected per-iteration so we can report median / p95 / CV instead of a
      # single, easily-misled datapoint.
      - name: Run idle state test (1 core) - warmup + repeated samples
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        working-directory: ./tools/pipeline_perf_test
        run: |
          $ErrorActionPreference = 'Stop'
          $warmup = [int]"${{ env.WARMUP_ITERATIONS }}"
          $iterations = [int]"${{ env.MEASURED_ITERATIONS }}"
          $config = "test_suites/integration/nightly-windows/idle-state-docker.yaml"
          $src = "results/windows_idle_state_1core/gh-actions-benchmark"
          $varianceDir = "results/windows_idle_variance"
          if (Test-Path $varianceDir) { Remove-Item -Recurse -Force $varianceDir }
          New-Item -ItemType Directory -Force -Path $varianceDir | Out-Null

          for ($w = 1; $w -le $warmup; $w++) {
            Write-Host "=== Warmup iteration $w/$warmup (discarded) ==="
            python orchestrator/run_orchestrator.py --config $config
          }

          for ($i = 1; $i -le $iterations; $i++) {
            Write-Host "=== Measured iteration $i/$iterations ==="
            if (Test-Path $src) { Remove-Item -Recurse -Force $src }
            python orchestrator/run_orchestrator.py --config $config
            $iterDir = Join-Path $varianceDir ("iter_{0:D2}" -f $i)
            New-Item -ItemType Directory -Force -Path $iterDir | Out-Null
            Copy-Item "$src/*.json" $iterDir -Force
          }

      - name: Analyze idle state variance (1 core)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python .github/workflows/scripts/analyze-idle-state-variance.py `
            tools/pipeline_perf_test/results/windows_idle_variance `
            tools/pipeline_perf_test/results/windows-idle-variance.json `
            "${{ env.MAX_CV_PERCENT }}" `
            | Tee-Object -Variable varianceReport
          echo "### Windows Idle State Variance (1 core, N=${{ env.MEASURED_ITERATIONS }})" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          $varianceReport >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Run idle state test (2 cores)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          cd tools/pipeline_perf_test
          python orchestrator/run_orchestrator.py --config test_suites/integration/nightly-windows/idle-state-2cores-docker.yaml

      - name: Run idle state test (4 cores)
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          cd tools/pipeline_perf_test
          python orchestrator/run_orchestrator.py --config test_suites/integration/nightly-windows/idle-state-4cores-docker.yaml

      - name: Analyze memory scaling
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        env:
          PYTHONUTF8: "1"
        run: |
          python .github/workflows/scripts/analyze-idle-state-scaling.py `
            tools/pipeline_perf_test/results `
            tools/pipeline_perf_test/results/windows-idle-memory-scaling.json `
            | Tee-Object -Variable scalingReport
          # Add to job summary
          echo "### Windows Idle State Memory Scaling Analysis" >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY
          $scalingReport >> $env:GITHUB_STEP_SUMMARY
          echo '```' >> $env:GITHUB_STEP_SUMMARY

      - name: Run 100kLRPS OTLP-OTLP test
        if: ${{ !cancelled() }}
        continue-on-error: true
        shell: pwsh
        run: |
          cd tools/pipeline_perf_test
          python orchestrator/run_orchestrator.py --config test_suites/integration/nightly-windows/100klrps-docker.yaml

      - name: Upload runner metadata
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-runner-metadata
          path: tools/pipeline_perf_test/results/windows-runner-metadata.json

      - name: Upload idle state results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-idle-state-results
          path: |
            tools/pipeline_perf_test/results/windows_idle_state_*/gh-actions-benchmark/*.json
            tools/pipeline_perf_test/results/windows_idle_variance/**/*.json
            tools/pipeline_perf_test/results/windows-idle-variance.json
            tools/pipeline_perf_test/results/windows-idle-memory-scaling.json

      - name: Upload 100kLRPS results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-100klrps-results
          path: tools/pipeline_perf_test/results/windows_100klrps/gh-actions-benchmark/*.json
