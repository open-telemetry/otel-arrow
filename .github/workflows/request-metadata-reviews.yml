name: Request metadata reviews

permissions:
  contents: read

on:
  pull_request_target: # zizmor: ignore[dangerous-triggers] - only trusted base-branch code is executed
    types:
      - opened
      - synchronize
      - ready_for_review

jobs:
  request-component-reviews:
    if: >-
      github.repository_owner == 'open-telemetry' &&
      github.event.pull_request.draft == false &&
      github.actor != 'dependabot[bot]' &&
      github.actor != 'renovate[bot]'
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted workflow code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Request metadata reviews
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
        run: python3 .github/workflows/scripts/request_metadata_reviews.py
