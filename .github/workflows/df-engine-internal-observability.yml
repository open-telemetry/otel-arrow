name: df-engine-internal-observability

# Validates the exhaustive semantic-convention v2 contract for OTAP Dataflow.
# Weaver checks the registry syntax and references.

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

env:
  WEAVER_VERSION: v0.25.1

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  semconv-check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@26c685ff52b925056ff1d53476c6022638c01220 # v0.25.1
        with:
          version: ${{ env.WEAVER_VERSION }}
      - name: Validate semantic-convention v2 registry
        run: weaver registry check --v2 --registry rust/otap-dataflow/semconv
