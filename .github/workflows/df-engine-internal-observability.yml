name: df-engine-internal-observability

# Validates that df_engine's internal observability surface (events,
# and eventually metrics + attributes) matches the in-tree semantic-
# conventions registry under `rust/otap-dataflow/semconv/`.
#
# The job boots `weaver registry live-check` against the in-tree
# registry, runs df_engine wired to emit its internal telemetry into
# weaver via OTLP, exercises every declared event with per-event
# triggers, and fails if any declared event receives zero samples or
# has an event-level violation. Events whose registry entry carries a
# `live_check.exempt` annotation, stating why CI cannot drive them, may
# receive zero samples. Attribute-level findings (attributes
# emitted by the engine but not yet declared) are tolerated today and
# tightened in follow-up PRs as the registry is filled in.
#
# Long-term intent: this is the authoritative gate ensuring df_engine's
# self-reported telemetry stays conformant with its declared contract.
#
# Tracking issue:
# https://github.com/open-telemetry/otel-arrow/issues/1613

permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  merge_group:

env:
  CARGO_TERM_COLOR: always
  WEAVER_VERSION: v0.28.0

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  weaver-live-check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: stable
      # Keep specialized validation caches restore-only so they do not compete
      # with the required build caches published by Post-Merge Actions.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: ./rust/otap-dataflow
          cache-bin: false
          save-if: false
      - name: Setup Weaver
        uses: open-telemetry/weaver/.github/actions/setup-weaver@51a5bf95bdbb2e20fb6e16638e6bbe7dde911e93 # v0.28.0
        with:
          version: ${{ env.WEAVER_VERSION }}
      - name: Generate self-signed TLS cert
        run: |
          set -euo pipefail
          mkdir -p /tmp/df-engine-tls
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/df-engine-tls/key.pem \
            -out   /tmp/df-engine-tls/cert.pem \
            -subj "/CN=127.0.0.1" \
            -addext "subjectAltName=IP:127.0.0.1,DNS:localhost" \
            >/dev/null 2>&1
          ls -la /tmp/df-engine-tls
      - name: Build df_engine
        run: cargo build --locked --release --bin df_engine
        working-directory: ./rust/otap-dataflow
      # Weaver listener lifecycle (start, readiness probe, /stop, report
      # capture, artifact upload) is owned by the upstream composite
      # actions below. The CLI and actions are pinned to v0.25.1, which
      # fixes a race that could truncate the report returned by /stop.
      - name: Start weaver live-check listener
        id: weaver-start
        uses: open-telemetry/weaver/.github/actions/weaver-live-check-start@51a5bf95bdbb2e20fb6e16638e6bbe7dde911e93 # v0.28.0
        with:
          registry: rust/otap-dataflow/semconv
          otlp-grpc-port: '4317'
          admin-port: '4320'
          # Generous safety net: the listener uses `--output http` so the
          # report is only retrievable via `/stop`. Make sure weaver does
          # not self-exit on inactivity before df_engine startup, triggers,
          # and flush complete (~30s readiness + triggers + 8s flush).
          inactivity-timeout: '300'
          # Pin the state dir explicitly so failure-path diagnostics
          # (weaver.log bundling) and the stop action both work even if
          # the start action fails before exporting
          # `WEAVER_LIVE_CHECK_STATE_DIR` via $GITHUB_ENV.
          state-dir: ${{ runner.temp }}/weaver-live-check-df-engine
      - name: Start df_engine
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          mkdir -p live-check-report
          ./rust/otap-dataflow/target/release/df_engine \
            --config rust/otap-dataflow/configs/internal-events-otlp.yaml \
            --num-cores 1 \
            > live-check-report/df_engine.log 2>&1 &
          ENGINE_PID=$!
          echo "df_engine pid: $ENGINE_PID"
          echo "ENGINE_PID=$ENGINE_PID" >> "$GITHUB_ENV"

          # Wait for the engine to report ready via its admin endpoint.
          # `/api/v1/readyz` signals all pipelines (including the TLS-enabled
          # OTLP receiver in the engine config) are up and serving.
          if ! curl --retry 30 --retry-delay 1 --retry-all-errors --max-time 2 -fsS \
              http://127.0.0.1:14319/api/v1/readyz > /dev/null; then
            echo "::error::df_engine admin /readyz did not become healthy within 30s"
            tail -n 200 live-check-report/df_engine.log || true
            kill -KILL "$ENGINE_PID" 2>/dev/null || true
            exit 1
          fi
      - name: Run active triggers
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # Run every script in the trigger directory. These exist solely
          # to fire events that need active driving (e.g. network calls);
          # passive events fire from the engine config on its own and need
          # no script here. Adding a new event: declare it in
          # `semconv/groups/event.<name>.yaml`; if it cannot be exercised
          # purely by the engine config, drop a script in
          # `semconv/triggers/` that drives it. If neither can drive it,
          # annotate the group with `live_check.exempt` and the reason.
          shopt -s nullglob
          for trigger in rust/otap-dataflow/semconv/triggers/*.sh; do
            echo "--- $(basename "$trigger") ---"
            bash "$trigger"
          done
      - name: Flush internal telemetry to weaver
        run: |
          # Allow the internal_telemetry receiver to drain and the OTLP
          # exporter to flush to weaver before we stop the listener.
          sleep 8
      - name: Stop df_engine
        if: always()
        run: |
          set -euo pipefail
          # df_engine does not implement SIGINT shutdown today; hard-kill
          # it and do NOT `wait` on it (would block indefinitely).
          if [ -n "${ENGINE_PID:-}" ]; then
            kill -KILL "$ENGINE_PID" 2>/dev/null || true
          fi
          echo "::group::df_engine log (tail)"
          tail -n 100 live-check-report/df_engine.log 2>/dev/null || true
          echo "::endgroup::"
      - name: Stop weaver live-check and collect report
        id: weaver-stop
        if: always()
        uses: open-telemetry/weaver/.github/actions/weaver-live-check-stop@51a5bf95bdbb2e20fb6e16638e6bbe7dde911e93 # v0.28.0
        with:
          # Match the explicit state dir from the start action so this
          # works even if start failed before exporting it via env.
          state-dir: ${{ runner.temp }}/weaver-live-check-df-engine
          # Tolerate weaver's global findings exit code today: the
          # registry is not yet exhaustive, so attribute-level
          # violations from undeclared attributes are expected. The
          # substantive gate is the registry-driven event coverage
          # check in the next step.
          fail-on: 'none'
          # Keep using our own bundled upload (which also includes the
          # df_engine and weaver logs) below.
          upload-report: 'false'
      - name: Assert every registered event was validated
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          REPORT_PATH: ${{ steps.weaver-stop.outputs['report-path'] }}
        run: |
          set -euo pipefail
          REPORT="${REPORT_PATH:-}"
          if [ -z "$REPORT" ] || [ ! -s "$REPORT" ]; then
            echo "::error::No live-check report found (path='$REPORT')"
            exit 1
          fi

          # The two gates below (zero-sample detection and severity-scoped
          # exit code) are workarounds; weaver's native exit code does not
          # yet express them. They can be removed once both upstream
          # features land:
          #   - https://github.com/open-telemetry/weaver/issues/1473
          #     `--fail-on` for severity-based exit code
          #   - https://github.com/open-telemetry/weaver/issues/1474
          #     coverage / `--fail-on-coverage-below`
          # The expected event set is enumerated directly from
          # `semconv/groups/*.yaml` -- the registry is the single source
          # of truth, and `semconv/triggers/` is just a bag of scripts
          # to run before validation.
          {
            echo "## df_engine events live-check"
            echo
            echo "| Event | Samples | Worst event-level advice |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          mapfile -t expected < <(
            yq eval-all '.groups[] | select(.type == "event") | .name' \
              rust/otap-dataflow/semconv/groups/*.yaml \
              | grep -Ev '^(---|null)$' | sort -u
          )
          if [ "${#expected[@]}" -eq 0 ]; then
            echo "::error::No events discovered under semconv/groups/"
            exit 1
          fi

          # Zero samples are allowed only for events annotated
          # `live_check.exempt`; samples they do receive are still checked.
          declare -A exempt=()
          while read -r name; do
            exempt["$name"]=1
          done < <(
            yq eval-all '.groups[] | select(.type == "event" and .annotations.live_check.exempt != null) | .name' \
              rust/otap-dataflow/semconv/groups/*.yaml \
              | grep -Ev '^(---|null)?$' | sort -u
          )

          fail=0
          for name in "${expected[@]}"; do
            read -r count worst < <(jq -r --arg n "$name" '
              [.samples[].log | select(.event_name == $n)] as $logs
              | [
                  ($logs | length),
                  (
                    [$logs[].live_check_result.highest_advice_level // empty]
                    | if   any(. == "violation")   then "violation"
                      elif any(. == "improvement") then "improvement"
                      elif any(. == "information") then "information"
                      elif length > 0             then "ok"
                      else "n/a" end
                  )
                ]
              | @tsv' "$REPORT")
            if [ "$count" = "0" ] && [ -n "${exempt[$name]:-}" ]; then
              worst="exempt"
            elif [ "$count" = "0" ]; then
              echo "::error::declared event \`$name\` received zero samples"
              fail=1
            elif [ "$worst" = "violation" ]; then
              echo "::error::event \`$name\` has event-level violations"
              fail=1
            fi
            echo "| \`$name\` | $count | $worst |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$fail"
      - name: Assert emitted metrics pass Weaver live-check
        if: always()
        working-directory: ${{ github.workspace }}
        env:
          REPORT_PATH: ${{ steps.weaver-stop.outputs['report-path'] }}
        run: |
          set -euo pipefail
          REPORT="${REPORT_PATH:-}"
          if [ -z "$REPORT" ] || [ ! -s "$REPORT" ]; then
            echo "::error::No live-check report found (path='$REPORT')"
            exit 1
          fi

          {
            echo
            echo "## df_engine metrics live-check"
            echo
            echo "| Metric | Samples | Worst metric/datapoint advice |"
            echo "| --- | ---: | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          raw_metrics="$(
            yq eval-all '.groups[] | select(.type == "metric") | .metric_name' \
              rust/otap-dataflow/semconv/groups/*.yaml
          )"
          filtered_metrics="$(
            printf '%s\n' "$raw_metrics" | grep -Ev '^(---|null)?$' | sort -u || true
          )"
          mapfile -t expected_metrics <<< "$filtered_metrics"
          if [ "${#expected_metrics[@]}" -eq 0 ] || [ -z "${expected_metrics[0]}" ]; then
            echo "::error::No metrics discovered under semconv/groups/"
            exit 1
          fi

          python3 - "$REPORT" "${expected_metrics[@]}" <<'PY'
          import json
          import os
          import sys
          from collections import defaultdict

          report_path = sys.argv[1]
          expected_metrics = sys.argv[2:]
          expected_set = set(expected_metrics)
          summary_path = os.environ["GITHUB_STEP_SUMMARY"]

          # Always-on core metric prefixes exercised by configs/internal-events-otlp.yaml.
          REQUIRED_CORE_PREFIXES = (
              "engine.",
              "pipeline.",
              "pipeline.runtime_control.",
              "tokio.runtime.",
              "channel.sender.",
              "channel.receiver.",
              "node.input.",
              "node.output.",
              "exporter.attempted.",
          )

          # Core engine/boundary namespaces governed by semconv/groups/metric.engine.yaml.
          # Component metrics (e.g. receiver.syslog_cef.*, exporter.otlp_grpc.*) are
          # added in a follow-up PR and remain tolerated until declared.
          CORE_METRIC_NAMESPACES = (
              "admission.rate_limiter.",
              "channel.",
              "controller.monitor.",
              "engine.",
              "exporter.attempted.",
              "exporter.exports.",
              "extension.lifecycle.",
              "flow.",
              "node.",
              "pipeline.",
              "processor.compute.",
              "receiver.messages.",
              "receiver.processing.",
              "receiver.pulled.",
              "receiver.received.",
              "tokio.runtime.",
          )

          with open(report_path, encoding="utf-8") as f:
              data = json.load(f)

          samples = data.get("samples")
          if not isinstance(samples, list):
              print("::error::Live-check report is missing a valid 'samples' list")
              sys.exit(1)

          LEVEL_RANK = {"violation": 3, "improvement": 2, "information": 1}

          counts = defaultdict(int)
          worst_rank = defaultdict(int)
          violations = defaultdict(list)
          seen_violations = defaultdict(set)

          def record_result(metric_name, result):
              if not isinstance(result, dict):
                  return
              level = result.get("highest_advice_level")
              rank = LEVEL_RANK.get(level, 0)
              if rank > worst_rank[metric_name]:
                  worst_rank[metric_name] = rank
              for adv in result.get("all_advice") or []:
                  if isinstance(adv, dict) and adv.get("level") == "violation":
                      key = (adv.get("id", "unknown"), adv.get("message", ""))
                      if key not in seen_violations[metric_name]:
                          seen_violations[metric_name].add(key)
                          violations[metric_name].append(key)

          for sample in samples:
              if not isinstance(sample, dict):
                  continue
              metric = sample.get("metric")
              if not isinstance(metric, dict):
                  continue
              name = metric.get("name")
              if not name:
                  continue
              counts[name] += 1
              record_result(name, metric.get("live_check_result"))
              for dp in metric.get("data_points") or []:
                  if not isinstance(dp, dict):
                      continue
                  record_result(name, dp.get("live_check_result"))
                  for attr in dp.get("attributes") or []:
                      if isinstance(attr, dict):
                          record_result(name, attr.get("live_check_result"))

          RANK_LABEL = {3: "violation", 2: "improvement", 1: "information", 0: "ok"}
          observed_declared = []
          fail = 0
          summary_lines = []

          for name in expected_metrics:
              count = counts.get(name, 0)
              if count == 0:
                  continue
              observed_declared.append(name)
              worst = RANK_LABEL[worst_rank.get(name, 0)]
              if worst == "violation":
                  details = "; ".join(
                      f"[{vid}] {msg}" for vid, msg in violations.get(name, [])[:5]
                  )
                  suffix = f": {details}" if details else ""
                  print(f"::error::metric `{name}` has live-check violations{suffix}")
                  fail = 1
              summary_lines.append(f"| `{name}` | {count} | {worst} |\n")

          with open(summary_path, "a", encoding="utf-8") as summary:
              summary.writelines(summary_lines)

          if not observed_declared:
              print("::error::Zero declared metrics were observed in the live-check report")
              fail = 1
          else:
              for prefix in REQUIRED_CORE_PREFIXES:
                  if not any(name.startswith(prefix) for name in observed_declared):
                      print(
                          f"::error::No declared metrics with prefix `{prefix}` were observed in the live-check report"
                      )
                      fail = 1

          for name in sorted(counts):
              if name not in expected_set and name.startswith(CORE_METRIC_NAMESPACES):
                  print(
                      f"::error::Emitted core metric `{name}` ({counts[name]} samples) is not declared in semconv/groups/"
                  )
                  fail = 1

          sys.exit(fail)
          PY
      - name: Bundle live-check artifacts
        if: always()
        env:
          REPORT_PATH: ${{ steps.weaver-stop.outputs['report-path'] }}
          WEAVER_STATE_DIR: ${{ runner.temp }}/weaver-live-check-df-engine
        run: |
          set -euo pipefail
          mkdir -p live-check-report
          if [ -n "${REPORT_PATH:-}" ] && [ -s "$REPORT_PATH" ]; then
            cp "$REPORT_PATH" live-check-report/live_check.json
          fi
          # weaver.log lives in the start action's state dir. Use the
          # explicit path we passed in (works even on a start failure
          # where $WEAVER_LIVE_CHECK_STATE_DIR was never exported).
          if [ -s "$WEAVER_STATE_DIR/weaver.log" ]; then
            cp "$WEAVER_STATE_DIR/weaver.log" live-check-report/weaver.log
          fi
          ls -la live-check-report || true
      - name: Upload live-check report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: weaver-live-check-df-engine-events
          path: live-check-report
          if-no-files-found: warn
