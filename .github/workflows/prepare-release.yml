name: Prepare Release

on:
  schedule:
    - cron: "0 15 * * 1"
  workflow_dispatch:
    inputs:
      target:
        description: "Components to release"
        required: true
        type: choice
        options:
          - rust
          - go
          - both
        default: rust
      dry_run:
        description: "Dry run mode (just show what would happen)"
        required: true
        type: boolean
        default: true
      include_pdata_views:
        description: "Bump pdata-views in a Rust release"
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare-release:
    permissions:
      contents: read
      issues: read
      pull-requests: read
    runs-on: ubuntu-latest
    env:
      DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      INCLUDE_PDATA_VIEWS: ${{ github.event_name == 'schedule' && 'false' || inputs.include_pdata_views }}
      RELEASE_TARGET: ${{ github.event_name == 'schedule' && 'both' || inputs.target }}
    steps:
      - name: Checkout (dry run)
        if: env.DRY_RUN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: ${{ github.ref }}
          persist-credentials: false

      - name: Create GitHub App token
        if: env.DRY_RUN == 'false'
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.OTELBOT_ARROW_CLIENT_ID }}
          private-key: ${{ secrets.OTELBOT_ARROW_PRIVATE_KEY }}
          permission-contents: write
          permission-issues: write
          permission-pull-requests: write

      - name: Get GitHub App user ID
        if: env.DRY_RUN == 'false'
        id: get-user-id
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
        run: echo "user-id=$(gh api "/users/${APP_SLUG}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Checkout (release preparation)
        if: env.DRY_RUN == 'false'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          ref: main
          token: ${{ steps.app-token.outputs.token }}
          # zizmor: ignore[artipacked] Credentials are required by the release branch push below.
          persist-credentials: true

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache-dependency-path: "**/*.sum"

      - name: Validate trigger
        run: |
          if [[ "$RELEASE_TARGET" != "go" && "$RELEASE_TARGET" != "rust" && "$RELEASE_TARGET" != "both" ]]; then
            echo "Error: release target must be go, rust, or both"
            exit 1
          fi
          if [ "$DRY_RUN" = "false" ] && [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Error: non-dry-run preparation must run from main"
            exit 1
          fi

      - name: Record release base commit
        id: release-base
        run: |
          git fetch --quiet origin main
          echo "sha=$(git rev-parse origin/main)" >> "$GITHUB_OUTPUT"

      - name: Ensure the previous release plan completed
        env:
          GH_TOKEN: ${{ env.DRY_RUN == 'false' && steps.app-token.outputs.token || github.token }}
        run: |
          PLAN=.github/release-plan.json
          if [ ! -f "$PLAN" ]; then
            exit 0
          fi

          check_completed() {
            local target="$1"
            local tag_prefix="$2"
            local release
            local version
            release=$(jq -r ".${target}.has_changes" "$PLAN")
            version=$(jq -r ".${target}.next_version // \"\"" "$PLAN")
            if [ "$release" = "true" ]; then
              tag="${tag_prefix}${version}"
              if ! git rev-parse --verify --quiet "refs/tags/${tag}" >/dev/null; then
                echo "Error: ${target} release ${version} from the previous plan has not been tagged."
                echo "Approve or recover Push Release before preparing another release."
                exit 1
              fi
              is_draft=$(gh release view "$tag" \
                --repo "$GITHUB_REPOSITORY" \
                --json isDraft \
                --jq '.isDraft' 2>/dev/null || true)
              if [ -z "$is_draft" ]; then
                echo "Error: ${target} release ${version} has no GitHub release."
                echo "Recover Push Release before preparing another release."
                exit 1
              fi
              if [ "$is_draft" = "true" ]; then
                echo "Error: ${target} release ${version} is still a draft."
                echo "Recover Push Release before preparing another release."
                exit 1
              fi
            fi
          }

          check_completed go go/v
          check_completed rust rust/otap-dataflow/v

      - name: Generate dependency-bot changelog entries
        run: |
          if [[ "$RELEASE_TARGET" == "go" || "$RELEASE_TARGET" == "both" ]]; then
            ./.github/workflows/scripts/generate-dependency-changelog.sh \
              go Go go/.chloggen/auto-dependency-updates.yaml \
              'go/v[0-9]*.[0-9]*.[0-9]*'
          fi
          if [[ "$RELEASE_TARGET" == "rust" || "$RELEASE_TARGET" == "both" ]]; then
            ./.github/workflows/scripts/generate-dependency-changelog.sh \
              rust/otap-dataflow Rust \
              rust/otap-dataflow/.chloggen/auto-dependency-updates.yaml \
              'rust/otap-dataflow/v[0-9]*.[0-9]*.[0-9]*'
          fi

      - name: Calculate release plan
        id: plan
        run: |
          EMPTY_PLAN='{"has_changes":false,"impact":null,"entry_count":0,"last_tag":"","last_version":"","next_version":null}'
          GO_PLAN="$EMPTY_PLAN"
          RUST_PLAN="$EMPTY_PLAN"

          if [[ "$RELEASE_TARGET" == "go" || "$RELEASE_TARGET" == "both" ]]; then
            GO_PLAN=$(./.github/workflows/scripts/plan-release.sh go)
          fi
          if [[ "$RELEASE_TARGET" == "rust" || "$RELEASE_TARGET" == "both" ]]; then
            RUST_PLAN=$(./.github/workflows/scripts/plan-release.sh rust)
          fi

          GO_RELEASE=$(jq -r '.has_changes' <<< "$GO_PLAN")
          RUST_RELEASE=$(jq -r '.has_changes' <<< "$RUST_PLAN")
          if [[ "$GO_RELEASE" == "true" || "$RUST_RELEASE" == "true" ]]; then
            HAS_CHANGES=true
          else
            HAS_CHANGES=false
          fi

          echo "go=$(jq -c . <<< "$GO_PLAN")" >> "$GITHUB_OUTPUT"
          echo "go_release=$GO_RELEASE" >> "$GITHUB_OUTPUT"
          echo "go_version=$(jq -r '.next_version // ""' <<< "$GO_PLAN")" >> "$GITHUB_OUTPUT"
          echo "has_changes=$HAS_CHANGES" >> "$GITHUB_OUTPUT"
          echo "rust=$(jq -c . <<< "$RUST_PLAN")" >> "$GITHUB_OUTPUT"
          echo "rust_release=$RUST_RELEASE" >> "$GITHUB_OUTPUT"
          echo "rust_version=$(jq -r '.next_version // ""' <<< "$RUST_PLAN")" >> "$GITHUB_OUTPUT"

          echo "Go plan: $(jq -c . <<< "$GO_PLAN")"
          echo "Rust plan: $(jq -c . <<< "$RUST_PLAN")"

      - name: Stop when no release is pending
        if: steps.plan.outputs.has_changes != 'true'
        run: |
          echo "No pending ${RELEASE_TARGET} changelog entries; no release PR is needed."
          {
            echo "# Release preparation"
            echo ""
            echo "No pending ${RELEASE_TARGET} changes were found."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install chloggen
        if: steps.plan.outputs.has_changes == 'true'
        run: make chlog-install

      - name: Render selected changelogs
        if: steps.plan.outputs.has_changes == 'true'
        env:
          GO_RELEASE: ${{ steps.plan.outputs.go_release }}
          GO_VERSION: ${{ steps.plan.outputs.go_version }}
          RUST_RELEASE: ${{ steps.plan.outputs.rust_release }}
          RUST_VERSION: ${{ steps.plan.outputs.rust_version }}
        run: |
          if [ "$GO_RELEASE" = "true" ]; then
            make chlog-update-go VERSION="v${GO_VERSION}"
          fi
          if [ "$RUST_RELEASE" = "true" ]; then
            make chlog-update-rust VERSION="v${RUST_VERSION}"
          fi

      - name: Bump Rust crate versions
        if: steps.plan.outputs.rust_release == 'true'
        env:
          RUST_VERSION: ${{ steps.plan.outputs.rust_version }}
        run: |
          CURRENT_VERSION=$(sed -n 's/^version = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)"/\1/p' rust/otap-dataflow/Cargo.toml | head -1)
          PDATA_VIEWS_VERSION=$(sed -n 's/^version = "\([0-9]\+\.[0-9]\+\.[0-9]\+\)"/\1/p' rust/otap-dataflow/crates/pdata-views/Cargo.toml | head -1)
          CURRENT_VERSION_PATTERN=$(printf '%s' "${CURRENT_VERSION}" | sed 's/\./\\./g')
          sed -i "s/${CURRENT_VERSION_PATTERN}/${RUST_VERSION}/g" rust/otap-dataflow/Cargo.toml

          if [ "$INCLUDE_PDATA_VIEWS" = "true" ]; then
            sed -i \
              "s/^version = \"${PDATA_VIEWS_VERSION}\"/version = \"${RUST_VERSION}\"/" \
              rust/otap-dataflow/crates/pdata-views/Cargo.toml
            sed -i \
              '/^otel-arrow-dfe-pdata-views = / s/version = "[^"]*"/version = "'"${RUST_VERSION}"'"/' \
              rust/otap-dataflow/Cargo.toml
          else
            sed -i \
              '/^otel-arrow-dfe-pdata-views = / s/version = "[^"]*"/version = "'"${PDATA_VIEWS_VERSION}"'"/' \
              rust/otap-dataflow/Cargo.toml
          fi

      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        if: steps.plan.outputs.rust_release == 'true'
        with:
          toolchain: 1.98.0

      - name: Update Rust lockfile
        if: steps.plan.outputs.rust_release == 'true'
        run: cargo generate-lockfile --manifest-path rust/otap-dataflow/Cargo.toml

      - name: Validate Rust crates.io publish plan
        if: steps.plan.outputs.rust_release == 'true'
        run: cargo xtask crates-publish check
        working-directory: rust/otap-dataflow

      - name: Create release plan artifact
        if: steps.plan.outputs.has_changes == 'true'
        id: release-plan
        env:
          BASE_SHA: ${{ steps.release-base.outputs.sha }}
          GO_PLAN: ${{ steps.plan.outputs.go }}
          GO_RELEASE: ${{ steps.plan.outputs.go_release }}
          GO_VERSION: ${{ steps.plan.outputs.go_version }}
          RUST_PLAN: ${{ steps.plan.outputs.rust }}
          RUST_RELEASE: ${{ steps.plan.outputs.rust_release }}
          RUST_VERSION: ${{ steps.plan.outputs.rust_version }}
        run: |
          if [[ "$GO_RELEASE" == "true" && "$RUST_RELEASE" == "true" ]]; then
            BRANCH="otelbot/release-go-v${GO_VERSION}-rust-v${RUST_VERSION}"
            SUMMARY="Go v${GO_VERSION} and Rust v${RUST_VERSION}"
          elif [ "$GO_RELEASE" = "true" ]; then
            BRANCH="otelbot/release-go-v${GO_VERSION}"
            SUMMARY="Go v${GO_VERSION}"
          else
            BRANCH="otelbot/release-rust-v${RUST_VERSION}"
            SUMMARY="Rust v${RUST_VERSION}"
          fi

          jq -n \
            --arg base_sha "$BASE_SHA" \
            --arg branch "$BRANCH" \
            --arg summary "$SUMMARY" \
            --argjson go "$GO_PLAN" \
            --argjson rust "$RUST_PLAN" \
            '{
              schema_version: 1,
              base_sha: $base_sha,
              branch: $branch,
              summary: $summary,
              go: $go,
              rust: $rust
            }' > .github/release-plan.json

          echo "branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "summary=$SUMMARY" >> "$GITHUB_OUTPUT"
          cat .github/release-plan.json

      - name: Extract selected release notes
        if: steps.plan.outputs.has_changes == 'true'
        env:
          GO_RELEASE: ${{ steps.plan.outputs.go_release }}
          GO_VERSION: ${{ steps.plan.outputs.go_version }}
          RUST_RELEASE: ${{ steps.plan.outputs.rust_release }}
          RUST_VERSION: ${{ steps.plan.outputs.rust_version }}
        run: |
          : > /tmp/combined_release_content.txt
          if [ "$GO_RELEASE" = "true" ]; then
            ./.github/workflows/scripts/extract-changelog.sh \
              --version "${GO_VERSION}" \
              --file go/CHANGELOG.md \
              --omit-subtext \
              /tmp/go_release_content.txt
            {
              echo "## What's Changed (Go :hamster:)"
              echo ""
              cat /tmp/go_release_content.txt
              echo ""
            } >> /tmp/combined_release_content.txt
          fi
          if [ "$RUST_RELEASE" = "true" ]; then
            ./.github/workflows/scripts/extract-changelog.sh \
              --version "${RUST_VERSION}" \
              --file rust/otap-dataflow/CHANGELOG.md \
              --omit-subtext \
              /tmp/rust_release_content.txt
            {
              echo "## What's Changed (Rust :crab:)"
              echo ""
              cat /tmp/rust_release_content.txt
              echo ""
            } >> /tmp/combined_release_content.txt
          fi

      - name: Show dry-run plan
        if: steps.plan.outputs.has_changes == 'true' && env.DRY_RUN == 'true'
        env:
          BRANCH: ${{ steps.release-plan.outputs.branch }}
          SUMMARY: ${{ steps.release-plan.outputs.summary }}
        run: |
          {
            echo "# Release preparation dry run"
            echo ""
            echo "**Release:** ${SUMMARY}"
            echo ""
            echo "**Branch:** \`${BRANCH}\`"
            echo ""
            echo "## Release plan"
            echo ""
            echo '```json'
            cat .github/release-plan.json
            echo '```'
            echo ""
            echo "## Release notes"
            echo ""
            cat /tmp/combined_release_content.txt
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Create release branch and commit changes
        if: steps.plan.outputs.has_changes == 'true' && env.DRY_RUN == 'false'
        env:
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          BRANCH: ${{ steps.release-plan.outputs.branch }}
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ steps.release-base.outputs.sha }}
          SUMMARY: ${{ steps.release-plan.outputs.summary }}
          USER_ID: ${{ steps.get-user-id.outputs.user-id }}
        run: |
          ./.github/workflows/scripts/verify-release-window.sh "$RELEASE_BASE_SHA"
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${USER_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          ./.github/workflows/scripts/create-release-branch.sh "$BRANCH" "$SUMMARY" --push

      - name: Create or update pull request
        if: steps.plan.outputs.has_changes == 'true' && env.DRY_RUN == 'false'
        env:
          BRANCH: ${{ steps.release-plan.outputs.branch }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          GO_RELEASE: ${{ steps.plan.outputs.go_release }}
          RUST_RELEASE: ${{ steps.plan.outputs.rust_release }}
          SUMMARY: ${{ steps.release-plan.outputs.summary }}
        run: |
          {
            echo "## ${SUMMARY}"
            echo ""
            echo "This PR contains the automatically calculated release plan."
            echo ""
            echo '```json'
            cat .github/release-plan.json
            echo '```'
            echo ""
            cat /tmp/combined_release_content.txt
            echo ""
            echo "After this PR merges, Push Release starts automatically and waits for approval from the protected \`release\` environment."
          } > /tmp/pr_body.md

          CREATE_LABEL_ARGS=(--label release)
          EDIT_LABEL_ARGS=(--add-label release)
          if [ "$GO_RELEASE" = "true" ]; then
            gh label create release-go --repo "$GITHUB_REPOSITORY" \
              --color 0E8A16 --description "Includes a Go release" --force
            CREATE_LABEL_ARGS+=(--label release-go)
            EDIT_LABEL_ARGS+=(--add-label release-go)
          fi
          if [ "$RUST_RELEASE" = "true" ]; then
            gh label create release-rust --repo "$GITHUB_REPOSITORY" \
              --color D93F0B --description "Includes a Rust OTAP Dataflow release" --force
            CREATE_LABEL_ARGS+=(--label release-rust)
            EDIT_LABEL_ARGS+=(--add-label release-rust)
          fi

          EXISTING_PR=$(gh pr list --head "$BRANCH" --state open --json number --jq '.[0].number // empty')
          TITLE="chore(release): Prepare ${SUMMARY}"
          if [ -n "$EXISTING_PR" ]; then
            gh pr edit "$EXISTING_PR" \
              --title "$TITLE" \
              --body-file /tmp/pr_body.md \
              --base main \
              "${EDIT_LABEL_ARGS[@]}"
          else
            gh pr create \
              --title "$TITLE" \
              --body-file /tmp/pr_body.md \
              --head "$BRANCH" \
              --base main \
              "${CREATE_LABEL_ARGS[@]}"
          fi

      - name: Verify release window remains stable
        if: steps.plan.outputs.has_changes == 'true' && env.DRY_RUN == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_BASE_SHA: ${{ steps.release-base.outputs.sha }}
        run: ./.github/workflows/scripts/verify-release-window.sh "$RELEASE_BASE_SHA"
