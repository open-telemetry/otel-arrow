[workspace]
members = [
    "expressions",
    "parser-abstractions",
    "kql-parser",
    "engine-recordset",
    "engine-columnar",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
authors = ["OpenTelemetry"]
edition = "2024"
repository = "https://github.com/open-telemetry/otel-arrow"
license = "Apache-2.0"
publish = false
rust-version = "1.86.0"

[workspace.dependencies]
ahash = "0.8.12"
arrow = "58.3"
bytes = "1.11.1"
caseless = "0.2.2"
chrono = "0.4.41"
criterion = "0.8.0"
half = "2.7.1"
hex = "0.4.3"
indexmap = "2.13.0"
opentelemetry-proto = "0.32.0"
pest = "2.8"
pest_derive = "2.8"
prost = "0.14"
regex = "1.12"
roaring = "0.11.4"
serde_json = "1.0.149"
sha2 = "0.11.0"
thiserror = "2.0.17"
