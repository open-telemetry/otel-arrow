change_type: bug_fix
component: pdata
note: Merge repeated gauge fields in the best-effort OTLP decoder so no data points are dropped.
issues: [4904]
subtext: |
  A Metric repeating its gauge field now merges per protobuf semantics when decoding best-effort,
  matching the strict decoder: data points of consecutive occurrences are concatenated, and the
  last encoded `data` oneof variant wins. The byte-backed OTLP item counter follows the same rule.
