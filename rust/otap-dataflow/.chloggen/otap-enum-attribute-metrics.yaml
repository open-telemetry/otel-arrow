# Use this changelog template to create an entry for release notes.

change_type: breaking
component: pipeline
note: Consolidate OTAP receiver and exporter metrics into bounded signal, outcome, and rejection error dimensions.
issues: [3300]
subtext: |
  Migration: Replace legacy `receiver.otap.*` and `otap.exporter.grpc.async.*` queries with the documented `receiver.otap.*` and `exporter.otap.*` metrics and bounded attributes. Query exponential histogram distributions for `exporter.otap.exports.duration` and the `exporter.otap.streams.*` metrics; the `.p50`, `.p90`, and `.p99` gauges are removed. OTAP exporter duration values now use seconds (`s`) instead of nanoseconds (`ns`).
