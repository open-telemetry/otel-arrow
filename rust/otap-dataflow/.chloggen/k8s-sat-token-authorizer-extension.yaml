# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: new_component

# The name of the component, or a single word describing the area of concern, (e.g. engine, otap).
# Must be one of the components listed in rust/otap-dataflow/.chloggen/config.yaml.
component: pipeline

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Add the `k8s_sat_token_authorizer` contrib extension, which exposes the `BearerTokenAuthorizer` capability by validating inbound Kubernetes service-account tokens via the `TokenReview` API and admitting them with either a service-account allow-list or a Kubernetes RBAC `SubjectAccessReview` check.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [3494]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The extension is gated behind the `k8s-sat-token-authorizer-extension` feature
  (and the aggregate `contrib-extensions` feature) and registered under the URN
  `urn:otel:extension:k8s_sat_token_authorizer`. It caches reached decisions,
  keyed by the opaque token and bounded by a configurable TTL and entry cap, to
  bound `TokenReview` calls to the API server. A reached deny is a normal
  outcome; an unreachable API server surfaces as an error so callers fail closed.
