# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. engine, otap).
# Must be one of the components listed in rust/otap-dataflow/.chloggen/config.yaml.
component: engine

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Generalize `capability::auth::AuthorizedIdentity` into a scheme-agnostic claims model so one identity type serves every authentication method (Kubernetes SAT, OIDC/JWT, mutual TLS). It now carries an optional `principal`, an optional `scheme` tag, and a `claims` map of `ClaimValue` (single- or multi-valued) keyed by standard/namespaced claim names. `subject()`/`audience()` and their builders remain as ergonomic accessors for the near-universal `sub`/`aud` claims.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [3494]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  This lets authorizers emit the full set of verified claims for downstream
  tenant / per-route authorization resolvers to match on, rather than only a
  subject and audience. Claim names follow JWT registered names where they exist
  (`sub`, `aud`, `groups`) and are otherwise namespaced by scheme (`k8s.*`,
  `x509.*`). `AuthorizedIdentity` remains `#[non_exhaustive]`.
