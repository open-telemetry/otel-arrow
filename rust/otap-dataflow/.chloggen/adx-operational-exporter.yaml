subtext: Coalescing preserves source ACKs and retries after token changes. Malformed or oversized inputs are permanently refused. Shutdown retryably NACKs overflow; blocked NACK routes may exceed normal admission limits. Partial batches behind empty, open upstream flush on their timer or final shutdown.
