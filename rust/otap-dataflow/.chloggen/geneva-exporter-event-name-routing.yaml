# Changelog entry for Geneva exporter attribute-based table routing

change_type: enhancement

component: pipeline

note: "Geneva exporter can route logs and spans to different tables based on an attribute value via `event_name_mapping`, using resource, scope, or record/span attributes (and `event_name` for logs)."

issues: [3600]

subtext: |
  Add an optional `event_name_mapping` under `logs`/`spans` mapping a routing-key attribute value to a destination table (null value uses the source value). Also renames internal `LogConfig`/`SpanConfig` to `LogsConfig`/`TracesConfig` and makes `logs`/`spans` optional to match `GenevaClientConfig`.
