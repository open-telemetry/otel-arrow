change_type: breaking
component: engine
note: Add `credential_stream` API to `AgentFedCredentialProvider` capability.
issues: [3901]
subtext: |
  Migration: `AgentFedCredentialProvider` capability now supports a stream API
  for fetching credentials, allowing for more efficient and continuous
  credential retrieval in scenarios where credentials may change over time.
  Implementation of this change requires updating any existing usage of the
  `AgentFedCredentialProvider` to utilize the new `credential_stream` API.
