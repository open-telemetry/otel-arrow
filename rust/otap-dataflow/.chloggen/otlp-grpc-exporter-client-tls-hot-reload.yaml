change_type: enhancement

component: pipeline

note: "The OTLP gRPC exporter supports opt-in hot reload of file-backed client TLS material without restarting."

issues: [4160, 4165]

subtext: |
  Enable tls.reload with mode: poll and interval: 5m. Omitted or disabled policies do not poll. Legacy reload_interval remains accepted without a policy; combining both is rejected. Invalid updates retain working channels; backend rejection does not trigger rollback.
