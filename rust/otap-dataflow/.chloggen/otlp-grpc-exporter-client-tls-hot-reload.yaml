change_type: enhancement

component: pipeline

note: "Hot-reload file-backed client TLS material in the OTLP gRPC exporter without restarting the collector."

issues: [4160, 4165]

subtext: |
  Polls every reload_interval (default 5m; null disables; 0s rejected). Invalid files or pool-build errors keep the old pool; failed builds wait for a newer generation. Backend TLS rejection does not roll back. CA/cert/key updates are not atomic; detectable inconsistencies wait for a later poll.
