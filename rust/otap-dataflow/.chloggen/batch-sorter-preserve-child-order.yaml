change_type: enhancement
component: pdata
note: Preserve child row order for equal parent IDs and fast-path sorted native IDs in BatchSorter.
issues: [4688]
subtext: |
  Tie-breaking unstable parent-ID sorting by row index keeps attributes in a consistent order across sibling records, improving gzip and zstd compression of encoded OTLP batches while avoiding scratch-buffer sorting when native ID columns are already sorted.
