change_type: breaking
component: pipeline
note: >-
  Migrated traffic generator receiver telemetry from flat counters to dimensioned metric populations with enum attributes.
issues: [3530]
subtext: |
  Migration: Update queries: runs -> `smooth.runs.terminations{outcome}`, sends -> `smooth.payload.sends.attempts{attempt, outcome}`. Removed `signals.produced`, `completion.completions`, and `logs_bytes_produced` (use `node.output.items`, `node.output.messages`, and `node.output.size` instead).
