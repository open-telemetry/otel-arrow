# Use this changelog template to create an entry for release notes.

# One of 'breaking', 'deprecation', 'new_component', 'enhancement', 'bug_fix'
change_type: enhancement

# The name of the component, or a single word describing the area of concern, (e.g. engine, otap).
# Must be one of the components listed in rust/otap-dataflow/.chloggen/config.yaml.
component: observability

# A brief description of the change.  Surround your text with quotes ("") if it needs to start with a backtick (`).
note: Report quantiles and exact zero counts for internal telemetry distribution metrics, and stop emitting empty ones.

# Mandatory: One or more tracking issues related to the change. You can use the PR number here if no issue exists.
issues: [1541]

# (Optional) One or more lines of additional information to render under the primary note.
# These lines will be padded with 2 spaces and then inserted directly into the document.
# Use pipe (|) for multiline entries.
subtext: |
  The admin metrics endpoints now report `zero_count` for every distribution,
  plus the bucket scale, a relative error bound derived from that scale, and
  p50/p90/p99 estimates for the bucketed tiers. Two traffic-generator latency
  metrics were promoted to the bucketed normal tier so these are populated out
  of the box.

  A distribution that recorded nothing during an interval is now all zeros
  rather than carrying `f64::MAX`/`f64::MIN` sentinels, and is omitted from the
  admin output entirely. Zero-filtering is per metric-set bucket rather than per
  field, so idle distributions previously appeared alongside their active
  siblings and reported a min of 1.8e308 and a max of -1.8e308.

  Three related defects are fixed. MMSC distributions encoded `zero_count: 0`
  in their OTLP exponential histogram projection and dropped the zero count when
  merging. Merging into an empty histogram folded the incoming minimum against a
  0.0 sentinel, so every aggregated distribution reported a minimum of zero.
  Finally, the admin API had no exponential-histogram instrument kind, which
  panicked the admin HTTP worker and returned an empty reply for every telemetry
  request.
