\* TLC configuration: bytes (bytes sizing mode). See README.md.
SPECIFICATION Spec

CONSTANTS
    NumRequests = 3
    Mode = "bytes"
    MaxReqSize = 4
    MinSizes = {2, 3}
    MaxSizes = {0, 3, 4}
    InboundLimits = {1, 2, 3}
    OutboundLimits = {1, 2}
    Overheads = {0, 1}
    AllowBatchError = TRUE
    AllowFallback = TRUE

INVARIANTS
    TypeOK
    NoPrematureAck
    AtMostOneOutcome
    ExactCounts
    NoSilentDrop
    ResidualFromLastInput
    DrainedMeansEmpty
    GuardsHold
    OwnershipConsistent

PROPERTIES
    SlotFreePaths

CHECK_DEADLOCK FALSE
