\* TLC configuration: bytes_fragment (bytes sizing mode, larger entries).
\* Targets split fragments that are retained as residuals, which need
\* entries larger than bytes.cfg allows. See README.md.
SPECIFICATION Spec

CONSTANTS
    NumRequests = 1
    Mode = "bytes"
    MaxReqSize = 7
    MinSizes = {3}
    MaxSizes = {4}
    InboundLimits = {1, 2}
    OutboundLimits = {1, 2}
    Overheads = {1}
    AllowBatchError = TRUE
    AllowFallback = TRUE
    FreeSplit = TRUE

INVARIANTS
    TypeOK
    NoPrematureAck
    AtMostOneOutcome
    ExactCounts
    NoSilentDrop
    ResidualFromLastInput
    DrainedMeansEmpty
    GuardsHold
    OwnershipConsistent

PROPERTIES
    SlotFreePaths

CHECK_DEADLOCK FALSE
