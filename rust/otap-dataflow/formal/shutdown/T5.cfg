\* TLC configuration: receiver -> exclusive router (backpressure, parks behind a wakeup)
\* -> exporter (L7). 3 requests: one in the exporter channel, one parked, one buffered.
SPECIFICATION Spec

CONSTANTS
    Topo = "T5"
    NumRequests = 3
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"ff", "wait"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"router"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK TRUE
