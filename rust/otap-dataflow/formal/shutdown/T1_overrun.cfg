\* TLC configuration: T1 with an exporter whose shutdown waits forever for in-flight work.
\* Fails EveryNodeStopsAfterDeadline (S5b) unless "L6" is in Fixes: spec.md L6.
SPECIFICATION Spec

CONSTANTS
    Topo = "T1"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"wait", "ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {TRUE}
    Gates = {"none"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK FALSE
