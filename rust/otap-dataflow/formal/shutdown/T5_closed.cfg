\* TLC configuration: receiver -> processor whose admission closes for good -> exporter.
\* EXPECTED TO FAIL (deadlock): known limitation L5, spec.md D3.
SPECIFICATION Spec

CONSTANTS
    Topo = "T5"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"ff", "wait"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"never"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {FALSE}
    GracefulPremise = FALSE
    Fixes = {"L2b", "L7", "L6", "L3", "L4"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

CHECK_DEADLOCK TRUE
