\* TLC configuration: receiver -> stateless processor -> exporter. See spec.md "Topologies".
SPECIFICATION Spec

CONSTANTS
    Topo = "T1"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"wait", "ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE, TRUE}
    ExpUnbounded = {FALSE}
    Gates = {"none"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK TRUE
