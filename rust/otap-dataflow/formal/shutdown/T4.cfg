\* TLC configuration: receiver -> fanout (await all) -> exporters A, B (L4). Timeouts are
\* off here; the L3 timeout path is T4_timeout.cfg. See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T4"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"wait", "ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"none"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0, 1}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

CHECK_DEADLOCK TRUE
