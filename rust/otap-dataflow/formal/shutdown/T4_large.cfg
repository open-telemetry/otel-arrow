\* TLC configuration: T4 at larger bounds (2 requests, capacity 2), safety and
\* deadlock only, timeouts off, answering exporters. See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T4"
    NumRequests = 2
    Cap = 2
    CtrlCap = 2
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"wait", "ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"none"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

CHECK_DEADLOCK TRUE
