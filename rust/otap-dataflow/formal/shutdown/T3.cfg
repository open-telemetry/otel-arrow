\* TLC configuration: receiver -> retry (requeue_later) -> exporter, with and without
\* admission gating (L2, L2b).
SPECIFICATION Spec

CONSTANTS
    Topo = "T3"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 1
    RecvModes = {"wait", "ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"none", "gated"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK TRUE
