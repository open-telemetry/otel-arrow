\* TLC configuration: T3 at larger bounds (3 requests, capacity 2). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T3"
    NumRequests = 3
    Cap = 2
    CtrlCap = 2
    BurstLimit = 2
    MaxRetries = 1
    RecvModes = {"wait", "ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"none", "gated"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK TRUE
