\* TLC configuration: T4 liveness (S5a, S5b) with fire-and-forget receivers, timeouts off,
\* deadline on. Split from T4.cfg for state-space size. See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T4"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"ff"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"none"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK FALSE
