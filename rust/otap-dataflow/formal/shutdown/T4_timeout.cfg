\* TLC configuration: T4 targeted at L3 -- a destination never answers, a fanout timeout
\* is configured, the receiver waits, no deadline (deadlock = drain stall). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T4"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"wait"}
    RecvSkips = {FALSE}
    ExpSilents = {TRUE}
    ExpUnbounded = {FALSE}
    Gates = {"none"}
    FanoutTimeouts = {TRUE}
    FanoutMaxInflights = {0}
    Deadlines = {FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

CHECK_DEADLOCK TRUE
