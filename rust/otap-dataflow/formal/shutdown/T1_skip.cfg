\* TLC configuration: T1, receiver may stop without ReceiverDrained, no deadline.
\* EXPECTED TO FAIL (deadlock): generic receiver error path, spec.md D2.
SPECIFICATION Spec

CONSTANTS
    Topo = "T1"
    NumRequests = 2
    Cap = 1
    CtrlCap = 1
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"wait", "ff"}
    RecvSkips = {TRUE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"none"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {FALSE}
    GracefulPremise = FALSE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

CHECK_DEADLOCK TRUE
