\* TLC configuration: T5 at larger bounds (4 requests, capacity 2). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T5"
    NumRequests = 4
    Cap = 2
    CtrlCap = 2
    BurstLimit = 2
    MaxRetries = 0
    RecvModes = {"ff", "wait"}
    RecvSkips = {FALSE}
    ExpSilents = {FALSE}
    ExpUnbounded = {FALSE}
    Gates = {"router"}
    FanoutTimeouts = {FALSE}
    FanoutMaxInflights = {0}
    Deadlines = {TRUE, FALSE}
    GracefulPremise = TRUE
    Fixes = {"L2b", "L7", "L6", "L3", "L4", "L9"}

INVARIANTS
    TypeOK
    IngressFirst
    TimersFreeze
    DrainByClosure
    RetainedComeBack
    OneOutcome
    AnsweredAtEnd
    GracefulOutcomes

PROPERTIES
    ProcessorsStopByDeadline
    EveryNodeStopsAfterDeadline

CHECK_DEADLOCK TRUE
