\* TLC configuration: receiver -> P -> exporter, all processor behaviors. See spec.md "Topologies".
SPECIFICATION Spec

CONSTANTS
    Topo = "T1"
    NumRequests = 2
    Behaviors = {"forward", "fwdsub", "ackLocal", "refuse", "fail", "split"}
    FanoutModes = {"none"}
    DebugPorts = {0}
    DebugDetailed = {FALSE}
    MaxRetries = 0
    MetricsFrames = TRUE
    AllowCancel = TRUE
    AllowExit = FALSE
    Cap = 1
    CtrlCap = 1
    ComplCap = 1
    NumDests = 1

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
