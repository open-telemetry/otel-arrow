\* TLC configuration: receiver -> fanout -> 2 exporters. See spec.md "Topologies".
SPECIFICATION Spec

CONSTANTS
    Topo = "T2"
    NumRequests = 2
    Behaviors = {"forward"}
    FanoutModes = {"none", "primary", "all"}
    DebugPorts = {0}
    DebugDetailed = {FALSE}
    MaxRetries = 0
    MetricsFrames = TRUE
    AllowCancel = FALSE
    AllowExit = FALSE

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
