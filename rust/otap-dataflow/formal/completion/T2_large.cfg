\* TLC configuration: T2 at larger bounds (2 requests, capacity 2, 3 destinations). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T2"
    NumRequests = 2
    Behaviors = {"forward"}
    FanoutModes = {"none", "primary", "all"}
    DebugPorts = {0}
    DebugDetailed = {FALSE}
    MaxRetries = 0
    MetricsFrames = TRUE
    AllowCancel = FALSE
    AllowExit = FALSE
    Cap = 2
    CtrlCap = 2
    ComplCap = 2
    NumDests = 3

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
