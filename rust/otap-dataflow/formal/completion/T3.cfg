\* TLC configuration: receiver -> retry -> exporter. See spec.md "Topologies".
SPECIFICATION Spec

CONSTANTS
    Topo = "T3"
    NumRequests = 2
    Behaviors = {"forward"}
    FanoutModes = {"none"}
    DebugPorts = {0}
    DebugDetailed = {FALSE}
    MaxRetries = 2
    MetricsFrames = TRUE
    AllowCancel = FALSE
    AllowExit = FALSE

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
