\* TLC configuration: T1 at larger bounds (3 requests, capacity 2). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T1"
    NumRequests = 3
    Behaviors = {"forward", "fwdsub", "ackLocal", "refuse", "fail", "split"}
    FanoutModes = {"none"}
    DebugPorts = {0}
    DebugDetailed = {FALSE}
    MaxRetries = 0
    MetricsFrames = TRUE
    AllowCancel = TRUE
    AllowExit = FALSE
    Cap = 2
    CtrlCap = 2
    ComplCap = 2
    NumDests = 1

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
