\* TLC configuration: T5 at larger bounds (3 requests, capacity 2). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T5"
    NumRequests = 3
    Behaviors = {"forward"}
    FanoutModes = {"none"}
    DebugPorts = {0, 1, 2, 3}
    DebugDetailed = {FALSE, TRUE}
    MaxRetries = 0
    MetricsFrames = TRUE
    AllowCancel = FALSE
    AllowExit = FALSE
    Cap = 2
    CtrlCap = 2
    ComplCap = 2
    NumDests = 3

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
