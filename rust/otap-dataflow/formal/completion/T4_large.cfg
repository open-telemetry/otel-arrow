\* TLC configuration: T4 at larger bounds (3 requests, capacity 2). See README.md.
SPECIFICATION Spec

CONSTANTS
    Topo = "T4"
    NumRequests = 3
    Behaviors = {"forward"}
    FanoutModes = {"none"}
    DebugPorts = {0}
    DebugDetailed = {FALSE}
    MaxRetries = 2
    MetricsFrames = TRUE
    AllowCancel = FALSE
    AllowExit = FALSE
    Cap = 2
    CtrlCap = 2
    ComplCap = 2
    NumDests = 3

INVARIANTS
    TypeOK
    AtMostOneDelivery
    LineageOnly
    LifoDelivery
    AckOnlyAfterDelivery
    DrainedMeansAnswered
    NoSilentDispatcherDrop
    ReturnDataOnlyWhereAsked
    FanoutNoneAnswersOnceWithAck

CHECK_DEADLOCK FALSE
