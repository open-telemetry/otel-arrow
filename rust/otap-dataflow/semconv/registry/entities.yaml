file_format: definition/2
entities:
- type: otap.engine
  brief: An OTAP Dataflow engine telemetry entity.
  stability: development
  requirement_level: recommended
  identity:
  - ref: service.instance.id
  annotations:
    otap_dataflow:
      scope_descriptor: engine
      rust:
        package: otap-df-engine
        type: EngineEntityAttributeSet
        source: crates/engine/src/attributes.rs
- type: otap.controller
  brief: An OTAP Dataflow controller telemetry entity.
  stability: development
  requirement_level: recommended
  identity:
  - ref: core.id
  - ref: numa.node.id
  - ref: service.instance.id
  annotations:
    otap_dataflow:
      scope_descriptor: controller.attrs
      rust:
        package: otap-df-engine
        type: EngineAttributeSet
        source: crates/engine/src/attributes.rs
      parent_entities:
      - otap.engine
