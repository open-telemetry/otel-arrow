file_format: definition/2
events:
- name: azure_identity_auth.token_refresh_failed
  brief: Emitted by OTAP Dataflow as `azure_identity_auth.token_refresh_failed`.
  stability: development
  requirement_level: recommended
  attributes:
  - ref: error
    requirement_level: required
  entity_associations:
  - otap.extension
  annotations:
    otap_dataflow:
      wire:
        event_name: azure_identity_auth.token_refresh_failed
        scope_names:
        - microsoft.extension.azure_identity_auth
        severity_levels:
        - warn
        sources:
        - crates/contrib-extensions/src/azure_identity_auth/auth.rs
        availability:
        - feature = "azure-identity-auth-extension"
