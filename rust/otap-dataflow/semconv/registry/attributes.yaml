- key: flow.node.decision
  type: string
  stability: development
  brief: 'Name of the decision node that recorded `signals.dropped`. Always emitted as the `flow.node.decision`
    scope attribute; carries an empty value for the flow''s incoming/outgoing/duration entity (which is
    not attributed to a specific decision node). Lets a single flow contain multiple decision nodes without
    conflation. `signals.dropped` aggregates correctly across this attribute: drops at different decision
    nodes are disjoint (a dropped item never reaches a later node), so the sum equals the flow''s total
    removed = `signals.incoming - signals.outgoing`. There is deliberately no per-node "kept" metric:
    a survivor count is non-additive across series nodes (nested subsets double-count) and undefined under
    fan-out, and the flow-wide kept count is simply `signals.outgoing`.'
