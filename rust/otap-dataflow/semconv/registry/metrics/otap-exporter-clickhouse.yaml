file_format: definition/2
metrics:
- name: otap.exporter.clickhouse.log.fast.path.batches
  brief: Total number of OTAP log batches transformed by the specialized path.
  instrument: counter
  unit: '{batch}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.exporter.clickhouse
- name: otap.exporter.clickhouse.log.otlp.direct.path.batches
  brief: Total number of raw OTLP log batches transformed directly to ClickHouse columns.
  instrument: counter
  unit: '{batch}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
