file_format: definition/2
metrics:
- name: processor.durable_buffer.bundles.resolved
  brief: Number of bundles resolved by downstream outcome.
  instrument: counter
  unit: '{bundle}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: outcome
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.durable_buffer.bundles
