file_format: definition/2
metrics:
- name: exporter.azure_monitor.state.mappings
  brief: Current number of entries in the exporter state mapping.
  instrument: gauge
  unit: '{entry}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: mapping
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.azure_monitor.state
