      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka.consumer
      rust:
        field: records_in_flight
- name: receiver.kafka.consumer.records.received
  brief: Kafka records delivered by the consumer before filtering or decoding.
  instrument: counter
  unit: '{message}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
