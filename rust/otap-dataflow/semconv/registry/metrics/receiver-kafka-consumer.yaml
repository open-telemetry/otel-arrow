      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.kafka.consumer
      rust:
        field: duplicate_records
- name: receiver.kafka.consumer.records.inflight
  brief: Current number of delivered records awaiting acknowledgement and commit progress.
  instrument: updowncounter
  unit: '{message}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
