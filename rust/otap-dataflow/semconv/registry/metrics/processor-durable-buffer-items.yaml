file_format: definition/2
metrics:
- name: processor.durable_buffer.items.consumed
  brief: Number of items ingested to durable storage.
  instrument: counter
  unit: '{item}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: signal
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.durable_buffer.items
- name: processor.durable_buffer.items.produced
  brief: Number of items sent downstream.
  instrument: counter
  unit: '{item}'
  stability: development
  requirement_level: recommended
