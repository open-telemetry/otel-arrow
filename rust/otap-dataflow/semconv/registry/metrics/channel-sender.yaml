file_format: definition/2
metrics:
- name: channel.sender.failures
  brief: Failed or refused immediate send attempts.
  instrument: counter
  unit: '{message}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: error.type
    requirement_level: recommended
  - ref: signal
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.sender
- name: channel.sender.messages
  brief: Messages whose immediate channel send attempt terminated.
  instrument: counter
  unit: '{message}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: outcome
    requirement_level: recommended
  - ref: signal
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.sender
