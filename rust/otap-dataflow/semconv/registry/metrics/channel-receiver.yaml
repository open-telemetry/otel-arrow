file_format: definition/2
metrics:
- name: channel.receiver.capacity
  brief: Configured maximum number of buffered messages.
  instrument: gauge
  unit: '{message}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
- name: channel.receiver.messages
  brief: Messages successfully dequeued from the channel.
  instrument: counter
  unit: '{message}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: signal
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
- name: channel.receiver.queue.depth
  brief: Current number of messages buffered in the channel.
  instrument: gauge
  unit: '{message}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.channel
    - otap.extension.channel
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: channel.receiver
