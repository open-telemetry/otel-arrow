file_format: definition/2
metrics:
- name: otap.exporter.geneva.conversion.errors
  brief: Number of OTAP-to-OTLP conversion errors.
  instrument: counter
  unit: '{error}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.exporter.geneva
