file_format: definition/2
metrics:
- name: processor.durable_buffer.flush.failures
  brief: Number of segment finalization failures.
  instrument: counter
  unit: '{error}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.durable_buffer
- name: processor.durable_buffer.in.flight
