file_format: definition/2
metrics:
- name: exporter.azure_monitor.exports.batches
  brief: Number of completed export batches.
  instrument: counter
  unit: '{batch}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: outcome
    requirement_level: recommended
  - ref: signal
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: exporter.azure_monitor.exports
