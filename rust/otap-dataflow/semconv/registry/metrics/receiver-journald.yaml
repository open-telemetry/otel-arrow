file_format: definition/2
metrics:
- name: receiver.journald.acks
  brief: Number of downstream Acks observed.
  instrument: counter
  unit: '{ack}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.journald
