file_format: definition/2
metrics:
- name: receiver.host_metrics.batches.sent
  brief: Number of batches sent downstream.
  instrument: counter
  unit: '{batch}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.host_metrics
- name: receiver.host_metrics.families.scraped
  brief: Number of due metric families processed.
  instrument: counter
  unit: '{family}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
