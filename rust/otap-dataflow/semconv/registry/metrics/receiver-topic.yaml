file_format: definition/2
metrics:
- name: receiver.topic.bridge.controls.ignored.propagation.disabled
  brief: Number of downstream ACK/NACK controls ignored because topic Ack/Nack propagation is disabled
    for this receiver.
  instrument: counter
  unit: '{event}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.topic
    - otap.node.custom.topic
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.topic
- name: receiver.topic.bridge.invalid.or.untracked.id
  brief: Number of downstream ACK/NACK controls carrying an id that is not currently tracked by the topic
    runtime. With the current raw `message_id` bridge this also includes invalid or forged ids; those
    causes are not distinguishable yet.
  instrument: counter
  unit: '{event}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.topic
    - otap.node.custom.topic
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.topic
- name: receiver.topic.bridge.missing.calldata
  brief: Number of downstream ACK/NACK controls missing the bridged topic message id in calldata.
  instrument: counter
  unit: '{event}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.topic
    - otap.node.custom.topic
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.topic
- name: receiver.topic.bridge.runtime.failures
  brief: Number of downstream ACK/NACK controls that failed to bridge for some runtime reason other than
    an unknown message id.
  instrument: counter
  unit: '{event}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node.topic
    - otap.node.custom.topic
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.topic
- name: receiver.topic.bridged.downstream.acks
