  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.traffic_generator
- name: receiver.traffic_generator.smooth.runs.started
  brief: Number of smooth-mode production runs started.
  instrument: counter
  unit: '{run}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
