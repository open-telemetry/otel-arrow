    otap_dataflow:
      metric_set: receiver.traffic_generator
- name: receiver.traffic_generator.spans.produced
  brief: Number of spans generated.
  instrument: counter
  unit: '{span}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
