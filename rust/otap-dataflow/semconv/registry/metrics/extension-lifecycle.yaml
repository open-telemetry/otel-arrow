file_format: definition/2
metrics:
- name: extension.lifecycle.completed.cancelled
  brief: Number of extension tasks that completed because they were cancelled.
  instrument: counter
  unit: '{completion}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - otap.extension
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: extension.lifecycle
