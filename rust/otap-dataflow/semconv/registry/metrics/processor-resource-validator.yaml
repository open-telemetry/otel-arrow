file_format: definition/2
metrics:
- name: processor.resource_validator.batches.accepted
  brief: Number of batches that passed validation
  instrument: counter
  unit: '{batch}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.resource_validator
