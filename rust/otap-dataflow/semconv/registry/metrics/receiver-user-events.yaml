file_format: definition/2
metrics:
- name: receiver.user_events.downstream.send.blocked.ns
  brief: Total time spent waiting for downstream channel capacity.
  instrument: counter
  unit: ns
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.user_events
- name: receiver.user_events.dropped.memory.pressure
  brief: Number of samples dropped due to process-wide memory pressure.
  instrument: counter
  unit: '{item}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: receiver.user_events
- name: receiver.user_events.dropped.no.subscription
