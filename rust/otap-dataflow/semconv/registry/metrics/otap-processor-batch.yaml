file_format: definition/2
metrics:
- name: otap.processor.batch.batching.errors
  brief: Number of batches for which errors encountered
  instrument: counter
  unit: '{error}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.batch
- name: otap.processor.batch.dropped.conversion
  brief: Number of messages dropped due to conversion failures
  instrument: counter
  unit: '{msg}'
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: otap.processor.batch
- name: otap.processor.batch.flush.age.duration
  brief: Time from first pending input arrival to actual flush start
  instrument: histogram
  unit: ns
  stability: development
  requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: otap.processor.batch
- name: otap.processor.batch.flush.output.batches
