file_format: definition/2
metrics:
- name: exporter.kafka.operations.duration
  brief: Time spent in the selected exporter phase.
  instrument: histogram
  unit: s
  stability: development
  requirement_level: recommended
  attributes:
  - ref: operation
    requirement_level: recommended
  - ref: outcome
    requirement_level: recommended
  - ref: signal
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: double
    otap_dataflow:
      metric_set: exporter.kafka.operations
      rust:
        instrument: HistogramNormal
