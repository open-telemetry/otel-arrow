file_format: definition/2
metrics:
- name: processor.partition.operations
  brief: Number of partitioning operations attempted by this processor.
  instrument: counter
  unit: '{operation}'
  stability: development
  requirement_level: recommended
  attributes:
  - ref: outcome
    requirement_level: recommended
  entity_associations:
  - one_of:
    - otap.node
    - otap.node.custom
  annotations:
    code_generation:
      metric_value_type: int
    otap_dataflow:
      metric_set: processor.partition
