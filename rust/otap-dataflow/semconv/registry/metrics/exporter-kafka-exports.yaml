file_format: definition/2
metrics:
- name: exporter.kafka.exports.bytes
  brief: Encoded Kafka payload bytes for attempts that reached the producer.
  instrument: histogram
  unit: By
  stability: development
  requirement_level: recommended
  attributes:
  - ref: outcome
    requirement_level: recommended
  - ref: signal
    requirement_level: recommended
  entity_associations:
