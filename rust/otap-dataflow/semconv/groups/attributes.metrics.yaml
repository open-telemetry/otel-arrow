groups:
  - id: registry.otap.metrics.attributes
    type: attribute_group
    brief: >-
      Datapoint and registration attributes attached to OTAP Dataflow internal
      metrics.
    attributes:
      - id: bucket.range.us
        type: string
        stability: development
        brief: Microsecond poll-time histogram bucket range (lower inclusive, upper exclusive).
        examples:
          - "[0,100)"
          - "[100,200)"
          - "[900,+inf)"
      - id: console.stream
        type: string
        stability: development
        brief: Standard output stream served by the console output writer.
        examples:
          - "stdout"
          - "stderr"
      - id: dimension
        type: string
        stability: development
        brief: Weight dimension metered by the rate admission limiter.
        examples:
          - "bytes"
          - "messages"
      - id: outcome
        type: string
        stability: development
        brief: Terminal outcome of the recorded pipeline or component operation.
        examples:
          - "success"
          - "failure"
          - "refused"
      - id: refusal
        type: string
        stability: development
        brief: Reason a rate admission point declined, or would have declined, a request.
        examples:
          - "would_throttle"
          - "throttle"
          - "oversized"
      - id: signal
        type: string
        stability: development
        brief: OpenTelemetry pipeline signal associated with the metric recording.
        examples:
          - "traces"
          - "metrics"
          - "logs"
