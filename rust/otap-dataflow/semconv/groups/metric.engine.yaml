  - id: metric.pipeline.memory.allocated.delta
    type: metric
    metric_name: pipeline.memory.allocated.delta
    stability: development
    instrument: counter
    unit: "{By}"
    brief: "Bytes allocated to the heap by this pipeline during the last measurement window."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 4
        field: memory_allocated_delta
        instrument_type: Counter<u64>
  - id: metric.pipeline.memory.freed
    type: metric
    metric_name: pipeline.memory.freed
    stability: development
    instrument: counter
    unit: "{By}"
    brief: "Memory freed to the heap by the pipeline instance since start."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 3
        field: memory_freed
        instrument_type: ObserveCounter<u64>
  - id: metric.pipeline.memory.freed.delta
    type: metric
    metric_name: pipeline.memory.freed.delta
    stability: development
    instrument: counter
    unit: "{By}"
    brief: "Bytes returned to the heap by this pipeline during the last measurement window."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 5
        field: memory_freed_delta
        instrument_type: Counter<u64>
  - id: metric.pipeline.memory.usage
    type: metric
    metric_name: pipeline.memory.usage
    stability: development
    instrument: updowncounter
    unit: "{By}"
    brief: "The amount of heap memory in use by the pipeline instance running on a specific core."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 1
        field: memory_usage
        instrument_type: ObserveUpDownCounter<u64>
  - id: metric.pipeline.page.faults.major
    type: metric
    metric_name: pipeline.page.faults.major
    stability: development
    instrument: counter
    unit: "{1}"
    brief: |-
      Number of major page faults (requiring disk I/O) since start.

      Any non-trivial rate typically indicates severe memory pressure or swapping,
      and correlates strongly with pipeline latency spikes.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 11
        field: page_faults_major
        instrument_type: ObserveCounter<u64>
  - id: metric.pipeline.page.faults.minor
    type: metric
    metric_name: pipeline.page.faults.minor
    stability: development
    instrument: counter
    unit: "{1}"
    brief: |-
      Number of minor page faults (served without disk I/O) since start.

      A rising rate indicates memory access pain (poor locality, working-set churn),
      even if heap bytes are stable.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 10
        field: page_faults_minor
        instrument_type: ObserveCounter<u64>
  - id: metric.pipeline.runtime_control.cancel_telemetry_timer.received
    type: metric
    metric_name: pipeline.runtime_control.cancel_telemetry_timer.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of telemetry timer cancel requests received by the runtime manager.

      This is mainly useful for checking that telemetry scheduling remains
      bounded and does not accumulate stale per-node timers.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 13
        visibility: pub(crate)
        struct_brief: |-
          Pipeline-scoped metrics for the shared runtime-control actor.

          This set describes shutdown/drain progress, pending control backlogs, and
          the state and throughput of the runtime-managed timer machinery. It is the
          primary metric set for understanding whether the pipeline runtime is still
          making progress under control-plane load and where graceful shutdown is
          spending time.
        field: cancel_telemetry_timer_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.cancel_timer.received
    type: metric
    metric_name: pipeline.runtime_control.cancel_timer.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `CancelTimer` control messages received by the runtime manager.

      Comparing this with timer starts helps diagnose timer churn, leaks, or
      mismatches between node scheduling and node cleanup behavior.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 11
        visibility: pub(crate)
        field: cancel_timer_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.collect_telemetry.sent
    type: metric
    metric_name: pipeline.runtime_control.collect_telemetry.sent
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `CollectTelemetry` control messages sent to nodes.

      This helps confirm telemetry timers are progressing under load and that
      observability work is not being starved by other runtime-control traffic.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 15
        visibility: pub(crate)
        field: collect_telemetry_sent
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.downstream_shutdown.sent
    type: metric
    metric_name: pipeline.runtime_control.downstream_shutdown.sent
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of downstream `Shutdown` fan-out operations to non-receivers.

      This marks the handoff from receiver draining to downstream convergence,
      which is useful when debugging where shutdown latency is spent.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 8
        visibility: pub(crate)
        field: downstream_shutdown_sent
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.drain.active
    type: metric
    metric_name: pipeline.runtime_control.drain.active
    stability: development
    instrument: gauge
    unit: "{1}"
    brief: |-
      Whether the runtime is currently in graceful drain mode.

      This is the top-level liveness phase signal for shutdown analysis: `1`
      means ingress has been stopped and the runtime is trying to converge to
      quiescence, `0` means normal operation.

      Level: `basic`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 0
        visibility: pub(crate)
        field: drain_active
        instrument_type: Gauge<u64>
  - id: metric.pipeline.runtime_control.drain.pending_receivers
    type: metric
    metric_name: pipeline.runtime_control.drain.pending_receivers
    stability: development
    instrument: gauge
    unit: "{node}"
    brief: |-
      Number of receivers that still need to report `ReceiverDrained`.

      This shows whether shutdown is still blocked in the receiver-first drain
      phase and helps identify a stuck or slow receiver delaying downstream
      shutdown.

      Level: `basic`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 1
        visibility: pub(crate)
        field: drain_pending_receivers
        instrument_type: Gauge<u64>
  - id: metric.pipeline.runtime_control.drain.receiver_phase_duration_ns
    type: metric
    metric_name: pipeline.runtime_control.drain.receiver_phase_duration_ns
    stability: development
    instrument: histogram
    unit: "ns"
    brief: |-
      Distribution of time spent waiting for receivers to finish draining.

      This isolates the receiver-gated phase of shutdown and is useful for
      determining whether slow graceful shutdown is ingress-bound or further
      downstream in the pipeline.

      Level: `detailed`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 16
        visibility: pub(crate)
        field: drain_receiver_phase_duration_ns
        instrument_type: Mmsc
  - id: metric.pipeline.runtime_control.drain.total_duration_ns
    type: metric
    metric_name: pipeline.runtime_control.drain.total_duration_ns
    stability: development
    instrument: histogram
    unit: "ns"
    brief: |-
      Distribution of total graceful shutdown duration for the runtime.

      This is the top-level latency metric for shutdown liveness and shows how
      long the runtime took to move from shutdown acceptance to completion or
      forced deadline exit.

      Level: `detailed`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 17
        visibility: pub(crate)
        field: drain_total_duration_ns
        instrument_type: Mmsc
  - id: metric.pipeline.runtime_control.drain_ingress.sent
    type: metric
    metric_name: pipeline.runtime_control.drain_ingress.sent
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `DrainIngress` fan-out operations sent to receivers.

      This confirms that shutdown moved from "requested" to "stop admitting
      new ingress", which is the first active liveness step of graceful drain.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 6
        visibility: pub(crate)
        field: drain_ingress_sent
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.pending_sends.buffered
    type: metric
    metric_name: pipeline.runtime_control.pending_sends.buffered
    stability: development
    instrument: gauge
    unit: "{message}"
    brief: |-
      Number of node-control deliveries currently buffered for later retry.

      A sustained non-zero value indicates the runtime manager is no longer
      delivering control work immediately and is absorbing backpressure from
      full node-control inboxes instead of blocking the runtime.

      Level: `basic`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 2
        visibility: pub(crate)
        field: pending_sends_buffered
        instrument_type: Gauge<u64>
  - id: metric.pipeline.runtime_control.receiver_drained.received
    type: metric
    metric_name: pipeline.runtime_control.receiver_drained.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `ReceiverDrained` notifications received from receivers.

      This shows actual receiver-side drain progress and helps distinguish "no
      work admitted anymore" from "receivers have really finished draining".

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 7
        visibility: pub(crate)
        field: receiver_drained_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.shutdown.deadline_forced
    type: metric
    metric_name: pipeline.runtime_control.shutdown.deadline_forced
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of shutdowns that reached the deadline before natural completion.

      Any non-zero value here is a direct signal that graceful drain did not
      complete in time and that liveness relied on the shutdown deadline.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 9
        visibility: pub(crate)
        field: shutdown_deadline_forced
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.shutdown.received
    type: metric
    metric_name: pipeline.runtime_control.shutdown.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `RuntimeControlMsg::Shutdown` requests accepted by this runtime.

      This marks the start of the runtime-managed drain sequence and is the
      main counter used to correlate later drain-phase transitions.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 5
        visibility: pub(crate)
        field: shutdown_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.start_telemetry_timer.received
    type: metric
    metric_name: pipeline.runtime_control.start_telemetry_timer.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of telemetry timer start requests received by the runtime manager.

      This shows how much of the runtime-control stream is driven by metrics
      collection scheduling rather than ordinary data-plane coordination.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 12
        visibility: pub(crate)
        field: start_telemetry_timer_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.start_timer.received
    type: metric
    metric_name: pipeline.runtime_control.start_timer.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `StartTimer` control messages received by the runtime manager.

      This helps quantify timer creation pressure and can explain growth in
      `timers.active` or bursts of later `timer_tick.sent` activity.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 10
        visibility: pub(crate)
        field: start_timer_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.telemetry_timers.active
    type: metric
    metric_name: pipeline.runtime_control.telemetry_timers.active
    stability: development
    instrument: gauge
    unit: "{timer}"
    brief: |-
      Number of telemetry collection timers currently registered.

      This distinguishes telemetry scheduling pressure from normal timer
      traffic and helps explain unexpected `CollectTelemetry` activity.

      Level: `basic`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 4
        visibility: pub(crate)
        field: telemetry_timers_active
        instrument_type: Gauge<u64>
  - id: metric.pipeline.runtime_control.timer_tick.sent
    type: metric
    metric_name: pipeline.runtime_control.timer_tick.sent
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `TimerTick` control messages sent to nodes.

      This confirms that due timers are actually being delivered and helps
      detect starvation where timers accumulate but ticks do not make progress.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 14
        visibility: pub(crate)
        field: timer_tick_sent
        instrument_type: Counter<u64>
  - id: metric.pipeline.runtime_control.timers.active
    type: metric
    metric_name: pipeline.runtime_control.timers.active
    stability: development
    instrument: gauge
    unit: "{timer}"
    brief: |-
      Number of ordinary per-node timers currently registered.

      This is useful for understanding timer pressure and for spotting leaks
      where timers are started but not canceled or consumed as expected.

      Level: `basic`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.runtime_control
        struct: RuntimeControlMetrics
        field_order: 3
        visibility: pub(crate)
        field: timers_active
        instrument_type: Gauge<u64>
  - id: metric.pipeline.uptime
    type: metric
    metric_name: pipeline.uptime
    stability: development
    instrument: gauge
    unit: "{s}"
    brief: "The time the pipeline instance has been running."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 0
        field: uptime
        instrument_type: Gauge<f64>
  - id: metric.processor.compute.duration
    type: metric
    metric_name: processor.compute.duration
    stability: development
    instrument: histogram
    unit: "s"
    brief: "Wall-clock duration of processor-local synchronous compute."
    attributes:
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: processor.compute
        struct: ComputeDurationMetrics
        struct_brief: "Metric set containing processor compute duration grouped by outcome."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::OutcomeAttributes
        field: duration
        instrument_type: HistogramNormal
  - id: metric.receiver.messages.bytes
    type: metric
    metric_name: receiver.messages.bytes
    stability: development
    instrument: counter
    unit: "By"
    brief: "Encoded transport payload bytes admitted to the pipeline send path."
    attributes:
      - ref: signal
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: receiver.messages
        struct: ReceiverMessageMetrics
        field_order: 2
        struct_brief: |-
          Lifecycle and wire bytes for messages admitted by a receiver.

          This set will be deprecated after receivers migrate to the shared receiver metrics.
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
        field: bytes
        instrument_type: Counter<u64>
  - id: metric.receiver.messages.completed
    type: metric
    metric_name: receiver.messages.completed
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Number of admitted messages whose receiver work terminated."
    attributes:
      - ref: signal
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: receiver.messages
        struct: ReceiverMessageMetrics
        field_order: 1
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
        field: completed
        instrument_type: Counter<u64>
  - id: metric.receiver.messages.started
    type: metric
    metric_name: receiver.messages.started
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Number of decoded messages admitted to the pipeline send path."
    attributes:
      - ref: signal
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: receiver.messages
        struct: ReceiverMessageMetrics
        field_order: 0
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
        field: started
        instrument_type: Counter<u64>
  - id: metric.receiver.processing.duration
    type: metric
    metric_name: receiver.processing.duration
    stability: development
    instrument: histogram
    unit: "s"
    brief: |-
      Node-defined receiver-local processing time.

      Each receiver documents its stable start and end boundary. Downstream
      processing, batching wait, handoff wait, and Ack/Nack completion are
      excluded.
    annotations:
      otap:
        crate: otap
        metric_set: receiver.processing
        field: duration
        bindings:
          - struct: ReceiverProcessingBasicMetrics
            struct_brief: "Basic receiver-local processing duration, independent of signal and outcome."
            instrument_type: Mmsc
            field_brief: "Node-defined receiver-local processing time."
          - struct: ReceiverProcessingNormalMetrics
            struct_brief: "Normal-resolution receiver-local processing duration."
            instrument_type: HistogramNormal
          - struct: ReceiverProcessingDetailedMetrics
            struct_brief: "Detailed-resolution receiver-local processing duration."
            instrument_type: HistogramDetailed
            field_brief: "Node-defined receiver-local processing time."
  - id: metric.receiver.pulled.attempts
    type: metric
    metric_name: receiver.pulled.attempts
    stability: development
    instrument: counter
    unit: "{attempt}"
    brief: "Number of accepted collection attempts reaching a terminal local outcome."
    attributes:
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: receiver.pulled
        struct: ReceiverPulledMetrics
        struct_brief: |-
          Accepted receiver-initiated collection attempts, completed before downstream handoff.

          One scrape or bounded query page is one attempt, independent of result rows,
          signal classification, and emitted PData. Skipped opportunities are not attempts.
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::OutcomeAttributes
        field: attempts
        instrument_type: Counter<u64>
  - id: metric.receiver.received.messages
    type: metric
    metric_name: receiver.received.messages
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Number of classified external messages whose receiver-local handling terminated."
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: receiver.received
        struct: ReceiverReceivedMetrics
        visibility: pub(crate)
        struct_brief: "Receiver-local handling of classified messages received at the external boundary."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: messages
        instrument_type: Counter<u64>
  - id: metric.receiver.received.payload.size
    type: metric
    metric_name: receiver.received.payload.size
    stability: development
    instrument: counter
    unit: "By"
    brief: "Encoded application payload size observed before receiver decoding."
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: receiver.received
        struct: ReceiverReceivedPayloadMetrics
        visibility: pub(crate)
        struct_brief: "Optional payload-size accounting for classified receiver messages."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: payload_size
        instrument_type: Counter<u64>
  - id: metric.tokio.runtime.blocking.task.queue.size
    type: metric
    metric_name: tokio.runtime.blocking.task.queue.size
    stability: development
    instrument: updowncounter
    unit: "{task}"
    brief: |-
      Current number of tasks pending in the blocking thread pool.

      This counts tasks spawned using `spawn_blocking` that have not yet started.
    annotations:
      otap:
        crate: engine
        metric_set: tokio.runtime
        struct: TokioRuntimeMetrics
        field_order: 6
        struct_brief: |-
          Tokio runtime metrics sampled from the pipeline thread.

          These metrics are collected from `tokio::runtime::Handle::try_current` / `Handle::metrics()`
          and are updated at the same cadence as `PipelineMetrics`.

          **Notes**
          - Tokio exposes runtime-level (aggregate) metrics; it does not expose per-task numeric
            metrics through the stable API.
          - Some Tokio metrics are per-worker; this metric set reports aggregates across all workers.
          - When compiled without `tokio_unstable`, only Tokio's stable metrics are included.
            Additional metrics are included when compiling with `RUSTFLAGS="--cfg tokio_unstable" cargo build --release`.
        field: blocking_task_queue_size
        instrument_type: ObserveUpDownCounter<u64>
        cfg: "tokio_unstable"
  - id: metric.tokio.runtime.blocking.thread.count
    type: metric
    metric_name: tokio.runtime.blocking.thread.count
    stability: development
    instrument: updowncounter
    unit: "{thread}"
    brief: "Current number of threads created for the blocking thread pool."
    annotations:
      otap:
        crate: engine
        metric_set: tokio.runtime
        struct: TokioRuntimeMetrics
        field_order: 7
        field: blocking_thread_count
        instrument_type: ObserveUpDownCounter<u64>
        cfg: "tokio_unstable"
  - id: metric.tokio.runtime.blocking.thread.idle.count
    type: metric
    metric_name: tokio.runtime.blocking.thread.idle.count
    stability: development
    instrument: updowncounter
    unit: "{thread}"
    brief: "Current number of idle threads in the blocking thread pool."
    annotations:
      otap:
        crate: engine
        metric_set: tokio.runtime
        struct: TokioRuntimeMetrics
        field_order: 8
        field: blocking_thread_idle_count
        instrument_type: ObserveUpDownCounter<u64>
        cfg: "tokio_unstable"
  - id: metric.tokio.runtime.budget.forced.yield.count
    type: metric
    metric_name: tokio.runtime.budget.forced.yield.count
    stability: development
    instrument: counter
    unit: "{yield}"
    brief: |-
      Total number of times tasks were forced to yield after exhausting their cooperative budget.

      This metric requires `tokio_unstable` and 64-bit atomics.
    annotations:
      otap:
        crate: engine
        metric_set: tokio.runtime
        struct: TokioRuntimeMetrics
        field_order: 12
        field: budget_forced_yield_count
        instrument_type: ObserveCounter<u64>
        cfg: "all(tokio_unstable, target_has_atomic = \"64\")"
  - id: metric.tokio.runtime.global.task.queue.size
    type: metric
    metric_name: tokio.runtime.global.task.queue.size
    stability: development
    instrument: updowncounter
    unit: "{task}"
    brief: |-
      Current number of tasks pending in the runtime's global/injection queue.

      This queue is used when tasks are spawned or woken from outside the runtime.
    annotations:
      otap:
        crate: engine
        metric_set: tokio.runtime
        struct: TokioRuntimeMetrics
        field_order: 2
        field: global_task_queue_size
        instrument_type: ObserveUpDownCounter<u64>
  - id: metric.tokio.runtime.io.driver.fd.deregistered.count
    type: metric
    metric_name: tokio.runtime.io.driver.fd.deregistered.count
    stability: development
    instrument: counter
    unit: "{fd}"
    brief: |-
      Total number of file descriptors deregistered from the runtime's I/O driver.

      This metric requires `tokio_unstable` and 64-bit atomics (and Tokio's `net` feature).
    annotations:
      otap:
        crate: engine
        metric_set: tokio.runtime
        struct: TokioRuntimeMetrics
        field_order: 20
        field: io_driver_fd_deregistered_count
        instrument_type: ObserveCounter<u64>
        cfg: "all(tokio_unstable, target_has_atomic = \"64\")"
  - id: metric.tokio.runtime.io.driver.fd.registered.count
    type: metric
    metric_name: tokio.runtime.io.driver.fd.registered.count
    stability: development
    instrument: counter
    unit: "{fd}"
    brief: |-
