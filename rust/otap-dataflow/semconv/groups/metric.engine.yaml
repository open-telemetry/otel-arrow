# Generated by `cargo xtask telemetry-schema --generate-semconv`. Do not edit manually.
groups:
  - id: metric.admission.rate_limiter.refusals
    type: metric
    metric_name: admission.rate_limiter.refusals
    stability: development
    brief: "Admission attempts declined, or that would have been declined in observe-only mode."
    instrument: counter
    unit: "{decision}"
    attributes:
      - ref: dimension
        requirement_level: recommended
      - ref: refusal
        requirement_level: recommended
  - id: metric.channel.receiver.capacity
    type: metric
    metric_name: channel.receiver.capacity
    stability: development
    brief: "Configured maximum number of buffered messages."
    instrument: gauge
    unit: "{message}"
  - id: metric.channel.receiver.messages
    type: metric
    metric_name: channel.receiver.messages
    stability: development
    brief: "Messages successfully dequeued from the channel."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.channel.receiver.queue.depth
    type: metric
    metric_name: channel.receiver.queue.depth
    stability: development
    brief: "Current number of messages buffered in the channel."
    instrument: gauge
    unit: "{message}"
  - id: metric.channel.sender.failures
    type: metric
    metric_name: channel.sender.failures
    stability: development
    brief: "Failed or refused immediate send attempts."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: error.type
        requirement_level: recommended
  - id: metric.channel.sender.messages
    type: metric
    metric_name: channel.sender.messages
    stability: development
    brief: "Messages whose immediate channel send attempt terminated."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.controller.monitor.observed_pipelines.live
    type: metric
    metric_name: controller.monitor.observed_pipelines.live
    stability: development
    brief: "Observed logical pipelines currently considered live."
    instrument: gauge
    unit: "{pipeline}"
  - id: metric.controller.monitor.observed_pipelines.ready
    type: metric
    metric_name: controller.monitor.observed_pipelines.ready
    stability: development
    brief: "Observed logical pipelines currently considered ready."
    instrument: gauge
    unit: "{pipeline}"
  - id: metric.controller.monitor.observed_pipelines.total
    type: metric
    metric_name: controller.monitor.observed_pipelines.total
    stability: development
    brief: "Observed logical pipelines currently tracked by the controller."
    instrument: gauge
    unit: "{pipeline}"
  - id: metric.controller.monitor.telemetry.entities
    type: metric
    metric_name: controller.monitor.telemetry.entities
    stability: development
    brief: "Registered telemetry entities visible to the controller monitor."
    instrument: gauge
    unit: "{entity}"
  - id: metric.controller.monitor.telemetry.metric_sets
    type: metric
    metric_name: controller.monitor.telemetry.metric_sets
    stability: development
    brief: "Registered telemetry metric sets visible to the controller monitor."
    instrument: gauge
    unit: "{metric_set}"
  - id: metric.engine.console_output.bytes.written
    type: metric
    metric_name: engine.console_output.bytes.written
    stability: development
    brief: "Bytes written to the stream."
    instrument: counter
    unit: "By"
    attributes:
      - ref: console.stream
        requirement_level: recommended
  - id: metric.engine.console_output.diagnostics.dropped
    type: metric
    metric_name: engine.console_output.diagnostics.dropped
    stability: development
    brief: "Best-effort diagnostics dropped because the queue was full or the frame exceeded the stream's byte budget."
    instrument: counter
    unit: "{frame}"
    attributes:
      - ref: console.stream
        requirement_level: recommended
  - id: metric.engine.console_output.frames.enqueue.failed
    type: metric
    metric_name: engine.console_output.frames.enqueue.failed
    stability: development
    brief: "Frames rejected because the queue was closed or full, the frame was too large, or its writer had failed."
    instrument: counter
    unit: "{frame}"
    attributes:
      - ref: console.stream
        requirement_level: recommended
  - id: metric.engine.console_output.frames.submitted
    type: metric
    metric_name: engine.console_output.frames.submitted
    stability: development
    brief: "Frames accepted into the stream's queue."
    instrument: counter
    unit: "{frame}"
    attributes:
      - ref: console.stream
        requirement_level: recommended
  - id: metric.engine.console_output.frames.written
    type: metric
    metric_name: engine.console_output.frames.written
    stability: development
    brief: "Frames written to the stream."
    instrument: counter
    unit: "{frame}"
    attributes:
      - ref: console.stream
        requirement_level: recommended
  - id: metric.engine.console_output.write.errors
    type: metric
    metric_name: engine.console_output.write.errors
    stability: development
    brief: "Failed writes or flushes. Each one stops the stream's writer."
    instrument: counter
    unit: "{error}"
    attributes:
      - ref: console.stream
        requirement_level: recommended
  - id: metric.engine.cpu.utilization
    type: metric
    metric_name: engine.cpu.utilization
    stability: development
    brief: "Process-wide CPU utilization as a ratio in [0, 1], normalized across all logical CPU cores on the system (not just engine-assigned cores). Aligned with the OTel semantic convention `process.cpu.utilization`. The `cpu.mode` attribute is not set; this reports combined user + system time."
    instrument: gauge
    unit: "{1}"
  - id: metric.engine.memory.commit
    type: metric
    metric_name: engine.memory.commit
    stability: development
    brief: "Process-wide private committed memory, including paged-out private memory."
    instrument: updowncounter
    unit: "By"
  - id: metric.engine.memory.pressure.state
    type: metric
    metric_name: engine.memory.pressure.state
    stability: development
    brief: "Process-wide memory limiter state encoded as `0=normal`, `1=soft`, `2=hard`."
    instrument: gauge
    unit: "{state}"
  - id: metric.engine.memory.rss
    type: metric
    metric_name: engine.memory.rss
    stability: development
    brief: "Process-wide Resident Set Size -- physical RAM currently used by the process. Matches what external tools report (e.g. `kubectl top pod`, `htop`, `ps rss`)."
    instrument: updowncounter
    unit: "{By}"
  - id: metric.engine.process.memory.hard.limit.bytes
    type: metric
    metric_name: engine.process.memory.hard.limit.bytes
    stability: development
    brief: "Effective process-wide memory limiter hard limit, in bytes."
    instrument: gauge
    unit: "{By}"
  - id: metric.engine.process.memory.soft.limit.bytes
    type: metric
    metric_name: engine.process.memory.soft.limit.bytes
    stability: development
    brief: "Effective process-wide memory limiter soft limit, in bytes."
    instrument: gauge
    unit: "{By}"
  - id: metric.engine.process.memory.usage.bytes
    type: metric
    metric_name: engine.process.memory.usage.bytes
    stability: development
    brief: "Most recent process-wide memory limiter sample, in bytes."
    instrument: gauge
    unit: "{By}"
  - id: metric.exporter.attempted.duration
    type: metric
    metric_name: exporter.attempted.duration
    stability: development
    brief: "Time spent performing export attempts, including backend latency."
    instrument: histogram
    unit: "s"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.exporter.attempted.items
    type: metric
    metric_name: exporter.attempted.items
    stability: development
    brief: "Number of signal items handled across export attempts."
    instrument: counter
    unit: "{item}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.exporter.attempted.messages
    type: metric
    metric_name: exporter.attempted.messages
    stability: development
    brief: "Number of node-local delivery attempts. Retries represented as shared attempts count again. This differs from `node.input.messages`, which counts PData messages entering the exporter."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.exporter.attempted.payload.size
    type: metric
    metric_name: exporter.attempted.payload.size
    stability: development
    brief: "Encoded application payload size produced or submitted across export attempts."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.exporter.exports.duration
    type: metric
    metric_name: exporter.exports.duration
    stability: development
    brief: "Time from dequeuing PData through its terminal local or backend export result. Ack/Nack notification time is excluded."
    instrument: histogram
    unit: "s"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.exporter.exports.messages
    type: metric
    metric_name: exporter.exports.messages
    stability: development
    brief: "Number of messages whose export reached a terminal outcome."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.extension.lifecycle.completed.cancelled
    type: metric
    metric_name: extension.lifecycle.completed.cancelled
    stability: development
    brief: "Metric `extension.lifecycle.completed.cancelled`."
    instrument: counter
    unit: "{completion}"
  - id: metric.extension.lifecycle.completed.error
    type: metric
    metric_name: extension.lifecycle.completed.error
    stability: development
    brief: "Metric `extension.lifecycle.completed.error`."
    instrument: counter
    unit: "{completion}"
  - id: metric.extension.lifecycle.completed.ok
    type: metric
    metric_name: extension.lifecycle.completed.ok
    stability: development
    brief: "Metric `extension.lifecycle.completed.ok`."
    instrument: counter
