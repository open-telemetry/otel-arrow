  - id: metric.pipeline.completion.ack.attempted
    type: metric
    metric_name: pipeline.completion.ack.attempted
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of Ack completions routed toward an interested upstream node.

      This increments once the dispatcher finds the closest interested frame
      and attempts delivery, even if the node-control channel is temporarily
      full and the send must be retried later.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 3
        visibility: pub(crate)
        struct_brief: |-
          Pipeline-scoped metrics for the shared completion dispatcher.

          This set describes how Ack/Nack completion traffic enters the dispatcher,
          whether it is successfully delivered to interested upstream nodes, whether
          completions are dropped because no upstream frame subscribed, and how much
          unwind work is required per completion. It is the primary metric set for
          understanding completion-path load, routing behavior, and unwind liveness.
        field: ack_attempted
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.ack.delivered
    type: metric
    metric_name: pipeline.completion.ack.delivered
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of Ack control messages actually delivered to upstream nodes.

      This increments only when the node-control send succeeds, either
      immediately or later via the completion dispatcher's pending-send retry
      loop.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 5
        visibility: pub(crate)
        field: ack_delivered
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.ack.dropped_no_interest
    type: metric
    metric_name: pipeline.completion.ack.dropped_no_interest
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of Ack completions dropped because no upstream frame was interested.

      This distinguishes "successful unwind with no listener" from send
      failure or dispatcher backlog, which is useful when validating routing
      expectations and subscription placement.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 7
        visibility: pub(crate)
        field: ack_dropped_no_interest
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.deliver_ack.received
    type: metric
    metric_name: pipeline.completion.deliver_ack.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `DeliverAck` messages received by the completion dispatcher.

      This shows inbound successful completion pressure on the shared
      completion path and helps explain downstream-to-upstream unwind load.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 1
        visibility: pub(crate)
        field: deliver_ack_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.deliver_nack.received
    type: metric
    metric_name: pipeline.completion.deliver_nack.received
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of `DeliverNack` messages received by the completion dispatcher.

      This is the failure-side counterpart to received acks and is especially
      useful when investigating retry storms or elevated downstream refusal
      rates.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 2
        visibility: pub(crate)
        field: deliver_nack_received
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.nack.attempted
    type: metric
    metric_name: pipeline.completion.nack.attempted
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of Nack completions routed toward an interested upstream node.

      This is the failure-side counterpart to attempted Acks and captures how
      many downstream refusals found an upstream subscriber and entered the
      delivery path.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 4
        visibility: pub(crate)
        field: nack_attempted
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.nack.delivered
    type: metric
    metric_name: pipeline.completion.nack.delivered
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of Nack control messages actually delivered to upstream nodes.

      This is the delivery-side counterpart to attempted Nacks and helps
      distinguish routing intent from successful node-control delivery under
      backpressure.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 6
        visibility: pub(crate)
        field: nack_delivered
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.nack.dropped_no_interest
    type: metric
    metric_name: pipeline.completion.nack.dropped_no_interest
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Count of Nack completions dropped because no upstream frame was interested.

      This is particularly important for liveness and correctness analysis:
      it means failure information reached the dispatcher but no upstream frame
      subscribed to receive it.

      Level: `normal`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 8
        visibility: pub(crate)
        field: nack_dropped_no_interest
        instrument_type: Counter<u64>
  - id: metric.pipeline.completion.pending_sends.buffered
    type: metric
    metric_name: pipeline.completion.pending_sends.buffered
    stability: development
    instrument: gauge
    unit: "{message}"
    brief: |-
      Number of completion deliveries currently buffered for later retry.

      A sustained backlog here means the completion dispatcher is making
      progress by deferring sends to full node-control inboxes instead of
      blocking, but it also indicates unwind traffic is under pressure.

      Level: `basic`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 0
        visibility: pub(crate)
        field: pending_sends_buffered
        instrument_type: Gauge<u64>
  - id: metric.pipeline.completion.unwind.depth
    type: metric
    metric_name: pipeline.completion.unwind.depth
    stability: development
    instrument: histogram
    unit: "{frame}"
    brief: |-
      Distribution of unwind stack depth consumed per completion outcome.

      Larger values indicate completions are traversing more frames before
      finding an interested upstream node or concluding that none exists,
      which helps explain completion-path cost and routing behavior.

      Level: `detailed`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline.completion
        struct: PipelineCompletionMetrics
        field_order: 9
        visibility: pub(crate)
        field: unwind_depth
        instrument_type: Mmsc
  - id: metric.pipeline.context.switches.involuntary
    type: metric
    metric_name: pipeline.context.switches.involuntary
    stability: development
    instrument: counter
    unit: "{1}"
    brief: |-
      Number of times the pipeline thread was preempted by the scheduler since start.

      A rising rate often indicates CPU contention or time-slice expirations.
      When paired with `cpu_utilization`, it helps diagnose CPU time lost to preemption.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 9
        struct_brief: |-
          Per-pipeline instance general metrics.

          Derived metrics (not emitted explicitly):
          - net_allocated_delta = memory_allocated_delta - memory_freed_delta  (`{By}`)
          - allocation_rate     = memory_allocated_delta / interval_s         (`{By/s}`)
          - deallocation_rate   = memory_freed_delta / interval_s             (`{By/s}`)
          - net_allocation_rate = net_allocated_delta / interval_s            (`{By/s}`)
          - cpu_utilization_ratio = (cpu_time_delta_s / wall_time_delta_s)    (`{1}`)
            where cpu_time_delta_s is the per-interval increase in cpu_time.
        field: context_switches_involuntary
        instrument_type: ObserveCounter<u64>
  - id: metric.pipeline.context.switches.voluntary
    type: metric
    metric_name: pipeline.context.switches.voluntary
    stability: development
    instrument: counter
    unit: "{1}"
    brief: |-
      Number of times the pipeline thread voluntarily yielded the CPU since start.

      A rising rate can indicate scheduling pressure due to blocking work
      (I/O, locks, backpressure) and helps distinguish "waiting" from "CPU-bound".
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 8
        field: context_switches_voluntary
        instrument_type: ObserveCounter<u64>
  - id: metric.pipeline.cpu.time
    type: metric
    metric_name: pipeline.cpu.time
    stability: development
    instrument: counter
    unit: "{s}"
    brief: "Total CPU seconds used by the pipeline since start."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 6
        field: cpu_time
        instrument_type: Counter<f64>
  - id: metric.pipeline.cpu.utilization
    type: metric
    metric_name: pipeline.cpu.utilization
    stability: development
    instrument: gauge
    unit: "{1}"
    brief: |-
      Difference in pipeline cpu time since the last measurement, divided by the elapsed time.
      Reported as a ratio in the range `[0, 1]`.
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
        struct: PipelineMetrics
        field_order: 7
        field: cpu_utilization
        instrument_type: Gauge<f64>
  - id: metric.pipeline.memory.allocated
    type: metric
    metric_name: pipeline.memory.allocated
    stability: development
    instrument: counter
    unit: "{By}"
    brief: "Memory allocated to the heap by the pipeline instance since start."
    annotations:
      otap:
        crate: engine
        metric_set: pipeline
