groups:
  - id: metric.admission.rate_limiter.refusals
    type: metric
    metric_name: admission.rate_limiter.refusals
    stability: development
    instrument: counter
    unit: "{decision}"
    brief: "Admission attempts declined, or that would have been declined in observe-only mode."
    attributes:
      - ref: dimension
        requirement_level: required
      - ref: refusal
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: admission.rate_limiter
        struct: RateAdmissionMetrics
        struct_brief: "Rate admission refusals, scoped to the receiver node entity."
        measurement_attributes: crate::admission::metrics::AdmissionRefusalAttributes
        field: refusals
        instrument_type: Counter<u64>
  - id: metric.channel.receiver.capacity
    type: metric
    metric_name: channel.receiver.capacity
    stability: development
    instrument: gauge
    unit: "{message}"
    brief: "Configured maximum number of buffered messages."
    annotations:
      otap:
        crate: engine
        metric_set: channel.receiver
        field: capacity
        instrument_type: Gauge<u64>
        bindings:
          - struct: ChannelReceiverStateMetrics
            field_order: 1
            visibility: pub(crate)
            struct_brief: "Current state of a PData channel queue from the receiver endpoint perspective."
          - struct: ControlChannelReceiverMetrics
            field_order: 2
            visibility: pub(crate)
            struct_brief: "Successfully dequeued control messages and current queue state."
            field_brief: "Configured maximum number of buffered control messages."
  - id: metric.channel.receiver.messages
    type: metric
    metric_name: channel.receiver.messages
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Messages successfully dequeued from the channel."
    attributes:
      - ref: signal
        requirement_level: recommended
    annotations:
      otap:
        crate: engine
        metric_set: channel.receiver
        field: messages
        instrument_type: Counter<u64>
        bindings:
          - struct: ChannelReceiverMetrics
            struct_brief: "Successfully dequeued PData messages grouped by signal."
            measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
          - struct: ControlChannelReceiverMetrics
            field_order: 0
            visibility: pub(crate)
            field_brief: "Control messages successfully dequeued from the channel."
  - id: metric.channel.receiver.queue.depth
    type: metric
    metric_name: channel.receiver.queue.depth
    stability: development
    instrument: gauge
    unit: "{message}"
    brief: "Current number of messages buffered in the channel."
    annotations:
      otap:
        crate: engine
        metric_set: channel.receiver
        field: queue_depth
        instrument_type: Gauge<u64>
        bindings:
          - struct: ChannelReceiverStateMetrics
            field_order: 0
            visibility: pub(crate)
          - struct: ControlChannelReceiverMetrics
            field_order: 1
            visibility: pub(crate)
            field_brief: "Current number of control messages buffered in the channel."
  - id: metric.channel.sender.failures
    type: metric
    metric_name: channel.sender.failures
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Failed or refused immediate send attempts."
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: error.type
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: channel.sender
        field: failures
        instrument_type: Counter<u64>
        bindings:
          - struct: ChannelSenderFailureMetrics
            visibility: pub(crate)
            struct_brief: "PData channel send failures grouped by signal and actionable error category."
            measurement_attributes: crate::channel_metrics::SignalChannelSendFailureAttributes
          - struct: ControlChannelSenderFailureMetrics
            visibility: pub(crate)
            struct_brief: "Control-channel send failures grouped by actionable error category."
            measurement_attributes: crate::channel_metrics::ChannelSendFailureAttributes
            field_brief: "Failed or refused immediate control-message send attempts."
  - id: metric.channel.sender.messages
    type: metric
    metric_name: channel.sender.messages
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Messages whose immediate channel send attempt terminated."
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: channel.sender
        field: messages
        instrument_type: Counter<u64>
        bindings:
          - struct: ChannelSenderMetrics
            struct_brief: "PData channel send attempts grouped by signal and terminal local outcome."
            measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
          - struct: ControlChannelSenderMetrics
            visibility: pub(crate)
            struct_brief: "Control-channel send attempts grouped by terminal local outcome."
            measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::OutcomeAttributes
            field_brief: "Control messages whose immediate channel send attempt terminated."
  - id: metric.controller.monitor.observed_pipelines.live
    type: metric
    metric_name: controller.monitor.observed_pipelines.live
    stability: development
    instrument: gauge
    unit: "{pipeline}"
    brief: "Observed logical pipelines currently considered live."
    annotations:
      otap:
        crate: controller
        metric_set: controller.monitor
        struct: ControllerMonitorMetrics
        field_order: 1
        visibility: pub(crate)
        struct_brief: "Metrics emitted by the controller monitor extension."
        field: observed_pipelines_live
        instrument_type: Gauge<u64>
  - id: metric.controller.monitor.observed_pipelines.ready
    type: metric
    metric_name: controller.monitor.observed_pipelines.ready
    stability: development
    instrument: gauge
    unit: "{pipeline}"
    brief: "Observed logical pipelines currently considered ready."
    annotations:
      otap:
        crate: controller
        metric_set: controller.monitor
        struct: ControllerMonitorMetrics
        field_order: 2
        visibility: pub(crate)
        field: observed_pipelines_ready
        instrument_type: Gauge<u64>
  - id: metric.controller.monitor.observed_pipelines.total
    type: metric
    metric_name: controller.monitor.observed_pipelines.total
    stability: development
    instrument: gauge
    unit: "{pipeline}"
    brief: "Observed logical pipelines currently tracked by the controller."
    annotations:
      otap:
        crate: controller
        metric_set: controller.monitor
        struct: ControllerMonitorMetrics
        field_order: 0
        visibility: pub(crate)
        field: observed_pipelines_total
        instrument_type: Gauge<u64>
  - id: metric.controller.monitor.telemetry.entities
    type: metric
    metric_name: controller.monitor.telemetry.entities
    stability: development
    instrument: gauge
    unit: "{entity}"
    brief: "Registered telemetry entities visible to the controller monitor."
    annotations:
      otap:
        crate: controller
        metric_set: controller.monitor
        struct: ControllerMonitorMetrics
        field_order: 3
        visibility: pub(crate)
        field: telemetry_entities
        instrument_type: Gauge<u64>
  - id: metric.controller.monitor.telemetry.metric_sets
    type: metric
    metric_name: controller.monitor.telemetry.metric_sets
    stability: development
    instrument: gauge
    unit: "{metric_set}"
    brief: "Registered telemetry metric sets visible to the controller monitor."
    annotations:
      otap:
        crate: controller
        metric_set: controller.monitor
        struct: ControllerMonitorMetrics
        field_order: 4
        visibility: pub(crate)
        field: telemetry_metric_sets
        instrument_type: Gauge<u64>
  - id: metric.engine.console_output.bytes.written
    type: metric
    metric_name: engine.console_output.bytes.written
    stability: development
    instrument: counter
    unit: "By"
    brief: "Bytes written to the stream."
    attributes:
      - ref: console.stream
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: engine.console_output
        struct: ConsoleOutputMetrics
        field_order: 3
        struct_brief: "Activity of the process-wide console output service for one stream."
        measurement_attributes: crate::engine_metrics::ConsoleStreamAttributes
        field: bytes_written
        instrument_type: ObserveCounter<u64>
  - id: metric.engine.console_output.diagnostics.dropped
    type: metric
    metric_name: engine.console_output.diagnostics.dropped
    stability: development
    instrument: counter
    unit: "{frame}"
    brief: |-
      Best-effort diagnostics dropped because the queue was full or the frame
      exceeded the stream's byte budget.
    attributes:
      - ref: console.stream
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: engine.console_output
        struct: ConsoleOutputMetrics
        field_order: 5
        measurement_attributes: crate::engine_metrics::ConsoleStreamAttributes
        field: diagnostics_dropped
        instrument_type: ObserveCounter<u64>
  - id: metric.engine.console_output.frames.enqueue.failed
    type: metric
    metric_name: engine.console_output.frames.enqueue.failed
    stability: development
    instrument: counter
    unit: "{frame}"
    brief: |-
      Frames rejected because the queue was closed or full, the frame was too large,
      or its writer had failed.
    attributes:
      - ref: console.stream
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: engine.console_output
        struct: ConsoleOutputMetrics
        field_order: 1
        measurement_attributes: crate::engine_metrics::ConsoleStreamAttributes
        field: frames_enqueue_failed
        instrument_type: ObserveCounter<u64>
  - id: metric.engine.console_output.frames.submitted
    type: metric
    metric_name: engine.console_output.frames.submitted
    stability: development
    instrument: counter
    unit: "{frame}"
    brief: "Frames accepted into the stream's queue."
    attributes:
      - ref: console.stream
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: engine.console_output
        struct: ConsoleOutputMetrics
        field_order: 0
        measurement_attributes: crate::engine_metrics::ConsoleStreamAttributes
        field: frames_submitted
        instrument_type: ObserveCounter<u64>
  - id: metric.engine.console_output.frames.written
    type: metric
    metric_name: engine.console_output.frames.written
    stability: development
    instrument: counter
    unit: "{frame}"
    brief: "Frames written to the stream."
    attributes:
      - ref: console.stream
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: engine.console_output
        struct: ConsoleOutputMetrics
        field_order: 2
        measurement_attributes: crate::engine_metrics::ConsoleStreamAttributes
        field: frames_written
        instrument_type: ObserveCounter<u64>
  - id: metric.engine.console_output.write.errors
    type: metric
    metric_name: engine.console_output.write.errors
    stability: development
    instrument: counter
    unit: "{error}"
    brief: "Failed writes or flushes. Each one stops the stream's writer."
    attributes:
      - ref: console.stream
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: engine.console_output
        struct: ConsoleOutputMetrics
        field_order: 4
        measurement_attributes: crate::engine_metrics::ConsoleStreamAttributes
        field: write_errors
        instrument_type: ObserveCounter<u64>
  - id: metric.engine.cpu.utilization
    type: metric
    metric_name: engine.cpu.utilization
    stability: development
    instrument: gauge
    unit: "{1}"
    brief: |-
      Process-wide CPU utilization as a ratio in `[0, 1]`, normalized across all
      logical CPU cores on the system (not just engine-assigned cores).
      Aligned with the OTel semantic convention `process.cpu.utilization`.

      The `cpu.mode` attribute is not set; this reports combined user + system time.
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 2
        struct_brief: "Engine-wide metrics emitted once per engine instance."
        field: cpu_utilization
        instrument_type: Gauge<f64>
  - id: metric.engine.memory.commit
    type: metric
    metric_name: engine.memory.commit
    stability: development
    instrument: updowncounter
    unit: "By"
    brief: "Process-wide private committed memory, including paged-out private memory."
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 1
        field: memory_commit
        instrument_type: ObserveUpDownCounter<u64>
        cfg: "windows"
  - id: metric.engine.memory.pressure.state
    type: metric
    metric_name: engine.memory.pressure.state
    stability: development
    instrument: gauge
    unit: "{state}"
    brief: "Process-wide memory limiter state encoded as `0=normal`, `1=soft`, `2=hard`."
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 3
        field: memory_pressure_state
        instrument_type: Gauge<u64>
  - id: metric.engine.memory.rss
    type: metric
    metric_name: engine.memory.rss
    stability: development
    instrument: updowncounter
    unit: "{By}"
    brief: |-
      Process-wide Resident Set Size -- physical RAM currently used by the process.
      Matches what external tools report (e.g. `kubectl top pod`, `htop`, `ps rss`).
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 0
        field: memory_rss
        instrument_type: ObserveUpDownCounter<u64>
  - id: metric.engine.process.memory.hard.limit.bytes
    type: metric
    metric_name: engine.process.memory.hard.limit.bytes
    stability: development
    instrument: gauge
    unit: "{By}"
    brief: "Effective process-wide memory limiter hard limit, in bytes."
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 6
        field: process_memory_hard_limit_bytes
        instrument_type: Gauge<u64>
  - id: metric.engine.process.memory.soft.limit.bytes
    type: metric
    metric_name: engine.process.memory.soft.limit.bytes
    stability: development
    instrument: gauge
    unit: "{By}"
    brief: "Effective process-wide memory limiter soft limit, in bytes."
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 5
        field: process_memory_soft_limit_bytes
        instrument_type: Gauge<u64>
  - id: metric.engine.process.memory.usage.bytes
    type: metric
    metric_name: engine.process.memory.usage.bytes
    stability: development
    instrument: gauge
    unit: "{By}"
    brief: "Most recent process-wide memory limiter sample, in bytes."
    annotations:
      otap:
        crate: engine
        metric_set: engine
        struct: EngineMetrics
        field_order: 4
        field: process_memory_usage_bytes
        instrument_type: Gauge<u64>
  - id: metric.exporter.attempted.duration
    type: metric
    metric_name: exporter.attempted.duration
    stability: development
    instrument: histogram
    unit: "s"
    brief: "Time spent performing export attempts, including backend latency."
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: exporter.attempted
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: duration
        bindings:
          - struct: ExporterAttemptedDurationBasicMetrics
            visibility: pub(crate)
            struct_brief: "Optional duration accounting for individual exporter attempts."
            instrument_type: Mmsc
          - struct: ExporterAttemptedDurationNormalMetrics
            visibility: pub(crate)
            struct_brief: "Normal-resolution duration accounting for individual exporter attempts."
            instrument_type: HistogramNormal
          - struct: ExporterAttemptedDurationDetailedMetrics
            visibility: pub(crate)
            struct_brief: "Detailed-resolution duration accounting for individual exporter attempts."
            instrument_type: HistogramDetailed
  - id: metric.exporter.attempted.items
    type: metric
    metric_name: exporter.attempted.items
    stability: development
    instrument: counter
    unit: "{item}"
    brief: "Number of signal items handled across export attempts."
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: exporter.attempted
        struct: ExporterAttemptedItemsMetrics
        visibility: pub(crate)
        struct_brief: "Optional item accounting for individual exporter attempts."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: items
        instrument_type: Counter<u64>
  - id: metric.exporter.attempted.messages
    type: metric
    metric_name: exporter.attempted.messages
    stability: development
    instrument: counter
    unit: "{message}"
    brief: |-
      Number of node-local delivery attempts.

      Retries represented as shared attempts count again. This differs from
      `node.input.messages`, which counts PData messages entering the exporter.
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: exporter.attempted
        struct: ExporterAttemptedMetrics
        visibility: pub(crate)
        struct_brief: "Individual node-local delivery attempts from an exporter."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: messages
        instrument_type: Counter<u64>
  - id: metric.exporter.attempted.payload.size
    type: metric
    metric_name: exporter.attempted.payload.size
    stability: development
    instrument: counter
    unit: "By"
    brief: "Encoded application payload size produced or submitted across export attempts."
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: exporter.attempted
        struct: ExporterAttemptedPayloadMetrics
        visibility: pub(crate)
        struct_brief: "Optional payload-size accounting for individual exporter attempts."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: payload_size
        instrument_type: Counter<u64>
  - id: metric.exporter.exports.duration
    type: metric
    metric_name: exporter.exports.duration
    stability: development
    instrument: histogram
    unit: "s"
    brief: |-
      Time from dequeuing PData through its terminal local or backend export result.
      Ack/Nack notification time is excluded.
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: exporter.exports
        struct: ExporterExportMetrics
        field_order: 1
        struct_brief: |-
          Completed export operations.

          This set will be deprecated after exporters migrate to
          the shared exporter attempt metrics and node-input terminal accounting.
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: duration_seconds
        instrument_type: HistogramNormal
  - id: metric.exporter.exports.messages
    type: metric
    metric_name: exporter.exports.messages
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Number of messages whose export reached a terminal outcome."
    attributes:
      - ref: signal
        requirement_level: required
      - ref: outcome
        requirement_level: required
    annotations:
      otap:
        crate: otap
        metric_set: exporter.exports
        struct: ExporterExportMetrics
        field_order: 0
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalOutcomeAttributes
        field: messages
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.completed.cancelled
    type: metric
    metric_name: extension.lifecycle.completed.cancelled
    stability: development
    instrument: counter
    unit: "{completion}"
    brief: "Count of extension tasks that were cancelled."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 5
        struct_brief: "Lifecycle counters and state gauge for a managed extension instance."
        field: completed_cancelled
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.completed.error
    type: metric
    metric_name: extension.lifecycle.completed.error
    stability: development
    instrument: counter
    unit: "{completion}"
    brief: "Count of extension completions with an error outcome."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 3
        field: completed_error
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.completed.ok
    type: metric
    metric_name: extension.lifecycle.completed.ok
    stability: development
    instrument: counter
    unit: "{completion}"
    brief: "Count of extension completions with a successful outcome."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 2
        field: completed_ok
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.completed.panic
    type: metric
    metric_name: extension.lifecycle.completed.panic
    stability: development
    instrument: counter
    unit: "{completion}"
    brief: "Count of extension tasks that terminated via panic."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 4
        field: completed_panic
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.shutdown.sent
    type: metric
    metric_name: extension.lifecycle.shutdown.sent
    stability: development
    instrument: counter
    unit: "{shutdown}"
    brief: "Count of graceful shutdown signals sent to the extension."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 1
        field: shutdown_sent
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.shutdown.timeout
    type: metric
    metric_name: extension.lifecycle.shutdown.timeout
    stability: development
    instrument: counter
    unit: "{timeout}"
    brief: "Count of extensions that timed out during graceful shutdown."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 6
        field: shutdown_timeout
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.spawned
    type: metric
    metric_name: extension.lifecycle.spawned
    stability: development
    instrument: counter
    unit: "{spawn}"
    brief: "Count of extension tasks spawned."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 0
        field: spawned
        instrument_type: Counter<u64>
  - id: metric.extension.lifecycle.state
    type: metric
    metric_name: extension.lifecycle.state
    stability: development
    instrument: gauge
    unit: "{state}"
    brief: "Current extension lifecycle state (1=spawned, 2=shutdown_sent, 3=completed_ok, 4=failed, 5=timed_out)."
    annotations:
      otap:
        crate: engine
        metric_set: extension.lifecycle
        struct: ExtensionLifecycleMetrics
        field_order: 7
        field: state
        instrument_type: Gauge<u64>
  - id: metric.flow.compute.duration
    type: metric
    metric_name: flow.compute.duration
    stability: development
    instrument: histogram
    unit: "s"
    brief: "Sum of per-node compute durations, in seconds, for messages traversing the flow range."
    attributes:
      - ref: signal
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: flow.compute
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
        field: duration
        bindings:
          - struct: FlowDurationBasicMetrics
            struct_brief: "Basic-tier duration metric set emitted by the end node of a flow range."
            instrument_type: Mmsc
          - struct: FlowDurationNormalMetrics
            struct_brief: "Normal-tier duration metric set emitted by the end node of a flow range."
            instrument_type: HistogramNormal
          - struct: FlowDurationDetailedMetrics
            struct_brief: "Detailed-tier duration metric set emitted by the end node of a flow range."
            instrument_type: HistogramDetailed
  - id: metric.flow.dropped.items
    type: metric
    metric_name: flow.dropped.items
    stability: development
    instrument: counter
    unit: "{item}"
    brief: |-
      Number of signal items (log records, spans, or metric data points) a
      decision node chose to drop.
    attributes:
      - ref: signal
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: flow.dropped
        struct: FlowDroppedItemsMetrics
        struct_brief: "Dropped signal metric set emitted by a decision node within a flow range."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
        field: items
        instrument_type: Counter<u64>
  - id: metric.flow.input.items
    type: metric
    metric_name: flow.input.items
    stability: development
    instrument: counter
    unit: "{item}"
    brief: |-
      Number of signal items (log records, spans, or metric data points)
      entering the flow range.
    attributes:
      - ref: signal
        requirement_level: required
    annotations:
      otap:
        crate: engine
        metric_set: flow.input
        struct: FlowInputItemsMetrics
        struct_brief: "Item count emitted by the start node of a flow range."
        measurement_attributes: otel_arrow_dfe_telemetry::common_attributes::SignalAttributes
        field: items
        instrument_type: Counter<u64>
  - id: metric.flow.input.messages
    type: metric
    metric_name: flow.input.messages
    stability: development
    instrument: counter
    unit: "{message}"
    brief: "Number of PData messages entering the flow range."
    attributes:
      - ref: signal
