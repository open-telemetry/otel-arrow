  - id: metric.extension.lifecycle.spawned
    type: metric
    metric_name: extension.lifecycle.spawned
    stability: development
    brief: "Metric `extension.lifecycle.spawned`."
    instrument: counter
    unit: "{spawn}"
  - id: metric.extension.lifecycle.state
    type: metric
    metric_name: extension.lifecycle.state
    stability: development
    brief: "Metric `extension.lifecycle.state`."
    instrument: gauge
    unit: "{state}"
  - id: metric.flow.compute.duration
    type: metric
    metric_name: flow.compute.duration
    stability: development
    brief: "Sum of per-node compute durations, in seconds, for messages traversing the flow range."
    instrument: histogram
    unit: "s"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.dropped.items
    type: metric
    metric_name: flow.dropped.items
    stability: development
    brief: "Number of signal items (log records, spans, or metric data points) a decision node chose to drop."
    instrument: counter
    unit: "{item}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.input.items
    type: metric
    metric_name: flow.input.items
    stability: development
    brief: "Number of signal items (log records, spans, or metric data points) entering the flow range."
    instrument: counter
    unit: "{item}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.input.messages
    type: metric
    metric_name: flow.input.messages
    stability: development
    brief: "Number of PData messages entering the flow range."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.input.size
    type: metric
    metric_name: flow.input.size
    stability: development
    brief: "Logical payload bytes entering the flow range."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.output.items
    type: metric
    metric_name: flow.output.items
    stability: development
    brief: "Number of signal items (log records, spans, or metric data points) leaving the flow range."
    instrument: counter
    unit: "{item}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.output.messages
    type: metric
    metric_name: flow.output.messages
    stability: development
    brief: "Number of PData messages leaving the flow range."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.flow.output.size
    type: metric
    metric_name: flow.output.size
    stability: development
    brief: "Logical payload bytes leaving the flow range."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.node.completion.duration
    type: metric
    metric_name: node.completion.duration
    stability: development
    brief: "Duration from the tracked node boundary until the corresponding terminal ack or nack is routed, in seconds."
    instrument: histogram
    unit: "s"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.node.completion_emission.notify_ack.routed
    type: metric
    metric_name: node.completion_emission.notify_ack.routed
    stability: development
    brief: "Count of successful `notify_ack` routings into the shared completion lane."
    instrument: counter
    unit: "{message}"
  - id: metric.node.completion_emission.notify_nack.routed
    type: metric
    metric_name: node.completion_emission.notify_nack.routed
    stability: development
    brief: "Count of successful `notify_nack` routings into the shared completion lane."
    instrument: counter
    unit: "{message}"
  - id: metric.node.input.items
    type: metric
    metric_name: node.input.items
    stability: development
    brief: "Input signal items, grouped by the `signal` datapoint attribute."
    instrument: counter
    unit: "{item}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.node.input.messages
    type: metric
    metric_name: node.input.messages
    stability: development
    brief: "Input messages, grouped by `signal` and `outcome` datapoint attributes."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.node.input.size
    type: metric
    metric_name: node.input.size
    stability: development
    brief: "Input logical payload size, grouped by `signal` and `outcome`."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.node.local_wakeup.scheduler.cancel.ignored_shutdown
    type: metric
    metric_name: node.local_wakeup.scheduler.cancel.ignored_shutdown
    stability: development
    brief: "Count of cancel attempts ignored after shutdown was latched."
    instrument: counter
    unit: "{attempt}"
  - id: metric.node.local_wakeup.scheduler.cancel.missed
    type: metric
    metric_name: node.local_wakeup.scheduler.cancel.missed
    stability: development
    brief: "Count of cancel attempts that found no live wakeup in the slot."
    instrument: counter
    unit: "{attempt}"
  - id: metric.node.local_wakeup.scheduler.cancel.removed
    type: metric
    metric_name: node.local_wakeup.scheduler.cancel.removed
    stability: development
    brief: "Count of cancel attempts that removed a live wakeup."
    instrument: counter
    unit: "{wakeup}"
  - id: metric.node.local_wakeup.scheduler.capacity
    type: metric
    metric_name: node.local_wakeup.scheduler.capacity
    stability: development
    brief: "Configured live wakeup slot capacity."
    instrument: gauge
    unit: "{wakeup}"
  - id: metric.node.local_wakeup.scheduler.live
    type: metric
    metric_name: node.local_wakeup.scheduler.live
    stability: development
    brief: "Current number of live wakeups."
    instrument: gauge
    unit: "{wakeup}"
  - id: metric.node.local_wakeup.scheduler.pop.due
    type: metric
    metric_name: node.local_wakeup.scheduler.pop.due
    stability: development
    brief: "Count of wakeups popped for delivery to the processor."
    instrument: counter
    unit: "{wakeup}"
  - id: metric.node.local_wakeup.scheduler.set.error_capacity
    type: metric
    metric_name: node.local_wakeup.scheduler.set.error_capacity
    stability: development
    brief: "Count of set attempts rejected because the live-slot capacity was full."
    instrument: counter
    unit: "{attempt}"
  - id: metric.node.local_wakeup.scheduler.set.error_shutdown
    type: metric
    metric_name: node.local_wakeup.scheduler.set.error_shutdown
    stability: development
    brief: "Count of set attempts rejected after shutdown was latched."
    instrument: counter
    unit: "{attempt}"
  - id: metric.node.local_wakeup.scheduler.set.inserted
    type: metric
    metric_name: node.local_wakeup.scheduler.set.inserted
    stability: development
    brief: "Count of newly inserted wakeups."
    instrument: counter
    unit: "{wakeup}"
  - id: metric.node.local_wakeup.scheduler.set.replaced
    type: metric
    metric_name: node.local_wakeup.scheduler.set.replaced
    stability: development
    brief: "Count of wakeups that replaced an existing live slot."
    instrument: counter
    unit: "{wakeup}"
  - id: metric.node.local_wakeup.scheduler.shutdown.cleared
    type: metric
    metric_name: node.local_wakeup.scheduler.shutdown.cleared
    stability: development
    brief: "Count of live wakeups dropped when shutdown was latched."
    instrument: counter
    unit: "{wakeup}"
  - id: metric.node.output.items
    type: metric
    metric_name: node.output.items
    stability: development
    brief: "Output signal items, grouped by the `signal` datapoint attribute."
    instrument: counter
    unit: "{item}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.node.output.messages
    type: metric
    metric_name: node.output.messages
    stability: development
    brief: "Output messages, grouped by `signal` and `outcome` datapoint attributes."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.node.output.size
    type: metric
    metric_name: node.output.size
    stability: development
    brief: "Output logical payload size, grouped by `signal` and `outcome`."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.pipeline.completion.ack.attempted
    type: metric
    metric_name: pipeline.completion.ack.attempted
    stability: development
    brief: "Count of Ack completions routed toward an interested upstream node. This increments once the dispatcher finds the closest interested frame and attempts delivery, even if the node-control channel is temporarily full and the send must be retried later. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.ack.delivered
    type: metric
    metric_name: pipeline.completion.ack.delivered
    stability: development
    brief: "Count of Ack control messages actually delivered to upstream nodes. This increments only when the node-control send succeeds, either immediately or later via the completion dispatcher's pending-send retry loop. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.ack.dropped_no_interest
    type: metric
    metric_name: pipeline.completion.ack.dropped_no_interest
    stability: development
    brief: "Count of Ack completions dropped because no upstream frame was interested. This distinguishes \"successful unwind with no listener\" from send failure or dispatcher backlog, which is useful when validating routing expectations and subscription placement. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.deliver_ack.received
    type: metric
    metric_name: pipeline.completion.deliver_ack.received
    stability: development
    brief: "Count of `DeliverAck` messages received by the completion dispatcher. This shows inbound successful completion pressure on the shared completion path and helps explain downstream-to-upstream unwind load. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.deliver_nack.received
    type: metric
    metric_name: pipeline.completion.deliver_nack.received
    stability: development
    brief: "Count of `DeliverNack` messages received by the completion dispatcher. This is the failure-side counterpart to received acks and is especially useful when investigating retry storms or elevated downstream refusal rates. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.nack.attempted
    type: metric
    metric_name: pipeline.completion.nack.attempted
    stability: development
    brief: "Count of Nack completions routed toward an interested upstream node. This is the failure-side counterpart to attempted Acks and captures how many downstream refusals found an upstream subscriber and entered the delivery path. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.nack.delivered
    type: metric
    metric_name: pipeline.completion.nack.delivered
    stability: development
    brief: "Count of Nack control messages actually delivered to upstream nodes. This is the delivery-side counterpart to attempted Nacks and helps distinguish routing intent from successful node-control delivery under backpressure. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.nack.dropped_no_interest
    type: metric
    metric_name: pipeline.completion.nack.dropped_no_interest
    stability: development
    brief: "Count of Nack completions dropped because no upstream frame was interested. This is particularly important for liveness and correctness analysis: it means failure information reached the dispatcher but no upstream frame subscribed to receive it. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.completion.pending_sends.buffered
    type: metric
    metric_name: pipeline.completion.pending_sends.buffered
    stability: development
    brief: "Number of completion deliveries currently buffered for later retry. A sustained backlog here means the completion dispatcher is making progress by deferring sends to full node-control inboxes instead of blocking, but it also indicates unwind traffic is under pressure. Level: `basic`."
    instrument: gauge
    unit: "{message}"
  - id: metric.pipeline.completion.unwind.depth
    type: metric
    metric_name: pipeline.completion.unwind.depth
    stability: development
    brief: "Distribution of unwind stack depth consumed per completion outcome. Larger values indicate completions are traversing more frames before finding an interested upstream node or concluding that none exists, which helps explain completion-path cost and routing behavior. Level: `detailed`."
    instrument: histogram
    unit: "{frame}"
  - id: metric.pipeline.context.switches.involuntary
    type: metric
    metric_name: pipeline.context.switches.involuntary
    stability: development
    brief: "Number of times the pipeline thread was preempted by the scheduler since start. A rising rate often indicates CPU contention or time-slice expirations. When paired with `cpu_utilization`, it helps diagnose CPU time lost to preemption."
    instrument: counter
    unit: "{1}"
  - id: metric.pipeline.context.switches.voluntary
    type: metric
    metric_name: pipeline.context.switches.voluntary
    stability: development
    brief: "Number of times the pipeline thread voluntarily yielded the CPU since start. A rising rate can indicate scheduling pressure due to blocking work (I/O, locks, backpressure) and helps distinguish \"waiting\" from \"CPU-bound\"."
    instrument: counter
    unit: "{1}"
  - id: metric.pipeline.cpu.time
    type: metric
    metric_name: pipeline.cpu.time
    stability: development
    brief: "Total CPU seconds used by the pipeline since start."
    instrument: counter
    unit: "{s}"
  - id: metric.pipeline.cpu.utilization
    type: metric
    metric_name: pipeline.cpu.utilization
    stability: development
    brief: "Difference in pipeline cpu time since the last measurement, divided by the elapsed time. Reported as a ratio in the range [0, 1]."
    instrument: gauge
    unit: "{1}"
  - id: metric.pipeline.memory.allocated
    type: metric
    metric_name: pipeline.memory.allocated
    stability: development
    brief: "Memory allocated to the heap by the pipeline instance since start."
    instrument: counter
    unit: "{By}"
  - id: metric.pipeline.memory.allocated.delta
    type: metric
    metric_name: pipeline.memory.allocated.delta
    stability: development
    brief: "Bytes allocated to the heap by this pipeline during the last measurement window."
    instrument: counter
    unit: "{By}"
  - id: metric.pipeline.memory.freed
    type: metric
    metric_name: pipeline.memory.freed
    stability: development
    brief: "Memory freed to the heap by the pipeline instance since start."
    instrument: counter
    unit: "{By}"
  - id: metric.pipeline.memory.freed.delta
    type: metric
    metric_name: pipeline.memory.freed.delta
    stability: development
    brief: "Bytes returned to the heap by this pipeline during the last measurement window."
    instrument: counter
    unit: "{By}"
  - id: metric.pipeline.memory.usage
    type: metric
    metric_name: pipeline.memory.usage
    stability: development
    brief: "The amount of heap memory in use by the pipeline instance running on a specific core."
    instrument: updowncounter
    unit: "{By}"
  - id: metric.pipeline.page.faults.major
    type: metric
    metric_name: pipeline.page.faults.major
    stability: development
    brief: "Number of major page faults (requiring disk I/O) since start. Any non-trivial rate typically indicates severe memory pressure or swapping, and correlates strongly with pipeline latency spikes."
    instrument: counter
    unit: "{1}"
  - id: metric.pipeline.page.faults.minor
    type: metric
    metric_name: pipeline.page.faults.minor
    stability: development
    brief: "Number of minor page faults (served without disk I/O) since start. A rising rate indicates memory access pain (poor locality, working-set churn), even if heap bytes are stable."
    instrument: counter
    unit: "{1}"
  - id: metric.pipeline.runtime_control.cancel_telemetry_timer.received
    type: metric
    metric_name: pipeline.runtime_control.cancel_telemetry_timer.received
    stability: development
    brief: "Count of telemetry timer cancel requests received by the runtime manager. This is mainly useful for checking that telemetry scheduling remains bounded and does not accumulate stale per-node timers. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.cancel_timer.received
    type: metric
    metric_name: pipeline.runtime_control.cancel_timer.received
    stability: development
    brief: "Count of `CancelTimer` control messages received by the runtime manager. Comparing this with timer starts helps diagnose timer churn, leaks, or mismatches between node scheduling and node cleanup behavior. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.collect_telemetry.sent
    type: metric
    metric_name: pipeline.runtime_control.collect_telemetry.sent
    stability: development
    brief: "Count of `CollectTelemetry` control messages sent to nodes. This helps confirm telemetry timers are progressing under load and that observability work is not being starved by other runtime-control traffic. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.downstream_shutdown.sent
    type: metric
    metric_name: pipeline.runtime_control.downstream_shutdown.sent
    stability: development
    brief: "Count of downstream `Shutdown` fan-out operations to non-receivers. This marks the handoff from receiver draining to downstream convergence, which is useful when debugging where shutdown latency is spent. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.drain.active
    type: metric
    metric_name: pipeline.runtime_control.drain.active
    stability: development
    brief: "Whether the runtime is currently in graceful drain mode. This is the top-level liveness phase signal for shutdown analysis: `1` means ingress has been stopped and the runtime is trying to converge to quiescence, `0` means normal operation. Level: `basic`."
    instrument: gauge
    unit: "{1}"
  - id: metric.pipeline.runtime_control.drain.pending_receivers
    type: metric
    metric_name: pipeline.runtime_control.drain.pending_receivers
    stability: development
    brief: "Number of receivers that still need to report `ReceiverDrained`. This shows whether shutdown is still blocked in the receiver-first drain phase and helps identify a stuck or slow receiver delaying downstream shutdown. Level: `basic`."
    instrument: gauge
    unit: "{node}"
  - id: metric.pipeline.runtime_control.drain.receiver_phase_duration_ns
    type: metric
    metric_name: pipeline.runtime_control.drain.receiver_phase_duration_ns
    stability: development
    brief: "Distribution of time spent waiting for receivers to finish draining. This isolates the receiver-gated phase of shutdown and is useful for determining whether slow graceful shutdown is ingress-bound or further downstream in the pipeline. Level: `detailed`."
    instrument: histogram
    unit: "ns"
  - id: metric.pipeline.runtime_control.drain.total_duration_ns
    type: metric
    metric_name: pipeline.runtime_control.drain.total_duration_ns
    stability: development
    brief: "Distribution of total graceful shutdown duration for the runtime. This is the top-level latency metric for shutdown liveness and shows how long the runtime took to move from shutdown acceptance to completion or forced deadline exit. Level: `detailed`."
    instrument: histogram
    unit: "ns"
  - id: metric.pipeline.runtime_control.drain_ingress.sent
    type: metric
    metric_name: pipeline.runtime_control.drain_ingress.sent
    stability: development
    brief: "Count of `DrainIngress` fan-out operations sent to receivers. This confirms that shutdown moved from \"requested\" to \"stop admitting new ingress\", which is the first active liveness step of graceful drain. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.pending_sends.buffered
    type: metric
    metric_name: pipeline.runtime_control.pending_sends.buffered
    stability: development
    brief: "Number of node-control deliveries currently buffered for later retry. A sustained non-zero value indicates the runtime manager is no longer delivering control work immediately and is absorbing backpressure from full node-control inboxes instead of blocking the runtime. Level: `basic`."
    instrument: gauge
    unit: "{message}"
  - id: metric.pipeline.runtime_control.receiver_drained.received
    type: metric
    metric_name: pipeline.runtime_control.receiver_drained.received
    stability: development
    brief: "Count of `ReceiverDrained` notifications received from receivers. This shows actual receiver-side drain progress and helps distinguish \"no work admitted anymore\" from \"receivers have really finished draining\". Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.shutdown.deadline_forced
    type: metric
    metric_name: pipeline.runtime_control.shutdown.deadline_forced
    stability: development
    brief: "Count of shutdowns that reached the deadline before natural completion. Any non-zero value here is a direct signal that graceful drain did not complete in time and that liveness relied on the shutdown deadline. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.shutdown.received
    type: metric
    metric_name: pipeline.runtime_control.shutdown.received
    stability: development
    brief: "Count of `RuntimeControlMsg::Shutdown` requests accepted by this runtime. This marks the start of the runtime-managed drain sequence and is the main counter used to correlate later drain-phase transitions. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.start_telemetry_timer.received
    type: metric
    metric_name: pipeline.runtime_control.start_telemetry_timer.received
    stability: development
    brief: "Count of telemetry timer start requests received by the runtime manager. This shows how much of the runtime-control stream is driven by metrics collection scheduling rather than ordinary data-plane coordination. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.start_timer.received
    type: metric
    metric_name: pipeline.runtime_control.start_timer.received
    stability: development
    brief: "Count of `StartTimer` control messages received by the runtime manager. This helps quantify timer creation pressure and can explain growth in `timers.active` or bursts of later `timer_tick.sent` activity. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.telemetry_timers.active
    type: metric
    metric_name: pipeline.runtime_control.telemetry_timers.active
    stability: development
    brief: "Number of telemetry collection timers currently registered. This distinguishes telemetry scheduling pressure from normal timer traffic and helps explain unexpected `CollectTelemetry` activity. Level: `basic`."
    instrument: gauge
    unit: "{timer}"
  - id: metric.pipeline.runtime_control.timer_tick.sent
    type: metric
    metric_name: pipeline.runtime_control.timer_tick.sent
    stability: development
    brief: "Count of `TimerTick` control messages sent to nodes. This confirms that due timers are actually being delivered and helps detect starvation where timers accumulate but ticks do not make progress. Level: `normal`."
    instrument: counter
    unit: "{message}"
  - id: metric.pipeline.runtime_control.timers.active
    type: metric
    metric_name: pipeline.runtime_control.timers.active
    stability: development
    brief: "Number of ordinary per-node timers currently registered. This is useful for understanding timer pressure and for spotting leaks where timers are started but not canceled or consumed as expected. Level: `basic`."
    instrument: gauge
    unit: "{timer}"
  - id: metric.pipeline.uptime
    type: metric
    metric_name: pipeline.uptime
    stability: development
    brief: "The time the pipeline instance has been running."
    instrument: gauge
    unit: "{s}"
  - id: metric.processor.compute.duration
    type: metric
    metric_name: processor.compute.duration
    stability: development
    brief: "Wall-clock duration of processor-local synchronous compute."
    instrument: histogram
    unit: "s"
    attributes:
      - ref: outcome
        requirement_level: recommended
  - id: metric.receiver.messages.bytes
    type: metric
    metric_name: receiver.messages.bytes
    stability: development
    brief: "Encoded transport payload bytes admitted to the pipeline send path."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.receiver.messages.completed
    type: metric
    metric_name: receiver.messages.completed
    stability: development
    brief: "Number of admitted messages whose receiver work terminated."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.receiver.messages.started
    type: metric
    metric_name: receiver.messages.started
    stability: development
    brief: "Number of decoded messages admitted to the pipeline send path."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
  - id: metric.receiver.processing.duration
    type: metric
    metric_name: receiver.processing.duration
    stability: development
    brief: "Node-defined receiver-local processing time."
    instrument: histogram
    unit: "s"
  - id: metric.receiver.pulled.attempts
    type: metric
    metric_name: receiver.pulled.attempts
    stability: development
    brief: "Number of accepted collection attempts reaching a terminal local outcome."
    instrument: counter
    unit: "{attempt}"
    attributes:
      - ref: outcome
        requirement_level: recommended
  - id: metric.receiver.received.messages
    type: metric
    metric_name: receiver.received.messages
    stability: development
    brief: "Number of classified external messages whose receiver-local handling terminated."
    instrument: counter
    unit: "{message}"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.receiver.received.payload.size
    type: metric
    metric_name: receiver.received.payload.size
    stability: development
    brief: "Encoded application payload size observed before receiver decoding."
    instrument: counter
    unit: "By"
    attributes:
      - ref: signal
        requirement_level: recommended
      - ref: outcome
        requirement_level: recommended
  - id: metric.tokio.runtime.blocking.task.queue.size
    type: metric
    metric_name: tokio.runtime.blocking.task.queue.size
    stability: development
    brief: "Current number of tasks pending in the blocking thread pool. This counts tasks spawned using `spawn_blocking` that have not yet started."
    instrument: updowncounter
    unit: "{task}"
  - id: metric.tokio.runtime.blocking.thread.count
    type: metric
    metric_name: tokio.runtime.blocking.thread.count
    stability: development
    brief: "Current number of threads created for the blocking thread pool."
    instrument: updowncounter
    unit: "{thread}"
  - id: metric.tokio.runtime.blocking.thread.idle.count
    type: metric
    metric_name: tokio.runtime.blocking.thread.idle.count
    stability: development
    brief: "Current number of idle threads in the blocking thread pool."
    instrument: updowncounter
    unit: "{thread}"
  - id: metric.tokio.runtime.budget.forced.yield.count
    type: metric
    metric_name: tokio.runtime.budget.forced.yield.count
    stability: development
    brief: "Total number of times tasks were forced to yield after exhausting their cooperative budget. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{yield}"
  - id: metric.tokio.runtime.global.task.queue.size
    type: metric
    metric_name: tokio.runtime.global.task.queue.size
    stability: development
    brief: "Current number of tasks pending in the runtime's global/injection queue. This queue is used when tasks are spawned or woken from outside the runtime."
    instrument: updowncounter
    unit: "{task}"
  - id: metric.tokio.runtime.io.driver.fd.deregistered.count
    type: metric
    metric_name: tokio.runtime.io.driver.fd.deregistered.count
    stability: development
    brief: "Total number of file descriptors deregistered from the runtime's I/O driver. This metric requires `tokio_unstable` and 64-bit atomics (and Tokio's `net` feature)."
    instrument: counter
    unit: "{fd}"
  - id: metric.tokio.runtime.io.driver.fd.registered.count
    type: metric
    metric_name: tokio.runtime.io.driver.fd.registered.count
    stability: development
    brief: "Total number of file descriptors registered with the runtime's I/O driver. This metric requires `tokio_unstable` and 64-bit atomics (and Tokio's `net` feature)."
    instrument: counter
    unit: "{fd}"
  - id: metric.tokio.runtime.io.driver.ready.count
    type: metric
    metric_name: tokio.runtime.io.driver.ready.count
    stability: development
    brief: "Total number of ready events processed by the runtime's I/O driver. This metric requires `tokio_unstable` and 64-bit atomics (and Tokio's `net` feature)."
    instrument: counter
    unit: "{ready}"
  - id: metric.tokio.runtime.remote.schedule.count
    type: metric
    metric_name: tokio.runtime.remote.schedule.count
    stability: development
    brief: "Total number of tasks scheduled from outside the runtime since it was created. These schedules go through the global injection queue and can be slower than worker-local scheduling. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{remote}"
  - id: metric.tokio.runtime.spawned.tasks.count
    type: metric
    metric_name: tokio.runtime.spawned.tasks.count
    stability: development
    brief: "Total number of tasks spawned in the runtime since it was created. This counter is monotonically increasing. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{spawn}"
  - id: metric.tokio.runtime.task.active.count
    type: metric
    metric_name: tokio.runtime.task.active.count
    stability: development
    brief: "Current number of alive tasks in the runtime. This value increases when tasks are spawned and decreases when tasks complete."
    instrument: updowncounter
    unit: "{task}"
  - id: metric.tokio.runtime.worker.busy.time
    type: metric
    metric_name: tokio.runtime.worker.busy.time
    stability: development
    brief: "Total worker busy time, summed across all runtime workers, since runtime creation. With multiple workers, this sum can exceed wall-clock time because workers can be busy concurrently. This metric is only available on targets with 64-bit atomics."
    instrument: counter
    unit: "{s}"
  - id: metric.tokio.runtime.worker.count
    type: metric
    metric_name: tokio.runtime.worker.count
    stability: development
    brief: "Number of worker threads used by the Tokio runtime. For Tokio's `current_thread` runtime, this is always `1`."
    instrument: updowncounter
    unit: "{thread}"
  - id: metric.tokio.runtime.worker.local.queue.size
    type: metric
    metric_name: tokio.runtime.worker.local.queue.size
    stability: development
    brief: "Current number of tasks pending in worker-local queues, summed across all workers."
    instrument: updowncounter
    unit: "{task}"
  - id: metric.tokio.runtime.worker.local.schedule.count
    type: metric
    metric_name: tokio.runtime.worker.local.schedule.count
    stability: development
    brief: "Total number of tasks scheduled onto worker-local queues, summed across workers, since runtime creation. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{schedule}"
  - id: metric.tokio.runtime.worker.noop.count
    type: metric
    metric_name: tokio.runtime.worker.noop.count
    stability: development
    brief: "Total number of \"noop\" unpark events, summed across workers, since runtime creation. A noop unpark is when a worker is unparked but finds no work before parking again. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{noop}"
  - id: metric.tokio.runtime.worker.overflow.count
    type: metric
    metric_name: tokio.runtime.worker.overflow.count
    stability: development
    brief: "Total number of worker local-queue overflows, summed across workers, since runtime creation. This metric only applies to Tokio's multi-threaded scheduler. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{overflow}"
  - id: metric.tokio.runtime.worker.park.count
    type: metric
    metric_name: tokio.runtime.worker.park.count
    stability: development
    brief: "Total number of times runtime workers parked, summed across all workers, since runtime creation. A worker \"parks\" when it becomes idle and waits for new work. This metric is only available on targets with 64-bit atomics."
    instrument: counter
    unit: "{park}"
  - id: metric.tokio.runtime.worker.park.unpark.count
    type: metric
    metric_name: tokio.runtime.worker.park.unpark.count
    stability: development
    brief: "Total number of park/unpark transitions, summed across all workers, since runtime creation. An odd value means at least one worker is currently parked; an even value means all workers are currently active. This metric is only available on targets with 64-bit atomics."
    instrument: counter
    unit: "{unpark}"
  - id: metric.tokio.runtime.worker.poll.count
    type: metric
    metric_name: tokio.runtime.worker.poll.count
    stability: development
    brief: "Total number of task polls, summed across workers, since runtime creation. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{poll}"
  - id: metric.tokio.runtime.worker.steal.attempt.count
    type: metric
    metric_name: tokio.runtime.worker.steal.attempt.count
    stability: development
    brief: "Total number of steal attempts, summed across workers, since runtime creation. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{steal}"
  - id: metric.tokio.runtime.worker.steal.success.count
    type: metric
    metric_name: tokio.runtime.worker.steal.success.count
    stability: development
    brief: "Total number of successful steal operations, summed across workers, since runtime creation. This metric requires `tokio_unstable` and 64-bit atomics."
    instrument: counter
    unit: "{steal}"
