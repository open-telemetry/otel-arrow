  - id: metric.extension.lifecycle.shutdown.sent
    type: metric
    metric_name: extension.lifecycle.shutdown.sent
    stability: development
    brief: "Metric `extension.lifecycle.shutdown.sent`."
    instrument: counter
    unit: "{shutdown}"
  - id: metric.extension.lifecycle.shutdown.timeout
    type: metric
    metric_name: extension.lifecycle.shutdown.timeout
    stability: development
    brief: "Metric `extension.lifecycle.shutdown.timeout`."
    instrument: counter
