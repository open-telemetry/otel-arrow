name: io.opentelemetry.otap-dataflow
description: >
  Semantic conventions for the attributes, entities, metrics, and events
  produced by OTAP Dataflow. The definition/2 registry is validated with
  Weaver and checked against production Rust telemetry declarations in CI.

  Tracking issue:
  https://github.com/open-telemetry/otel-arrow/issues/1613
schema_url: https://opentelemetry.io/otap-dataflow/schemas/0.1.0
dependencies:
  # Pin the upstream OpenTelemetry semantic conventions used by references
  # in this registry.
  - schema_url: https://opentelemetry.io/schemas/1.41.0
    registry_path: https://github.com/open-telemetry/semantic-conventions.git@v1.41.0[model]
