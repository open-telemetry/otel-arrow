version: otel_dataflow/v1
policies:
  telemetry:
    runtime_metrics: normal
engine:
  telemetry:
    reporting_interval: 1s
  observability:
    pipeline:
      policies:
        telemetry:
          pipeline_metrics: false
          tokio_metrics: false
          runtime_metrics: none
      nodes:
        telemetry:
          type: receiver:internal_telemetry
          config:
            signals: [metrics]
            metrics:
              interval: 1s
        comparison_filter:
          type: processor:filter
          config:
            metrics:
              include:
                match_type: strict
                metric_names:
                  - produced.items
                  - logs.produced
        metrics_debug:
          type: processor:debug
          config:
            verbosity: detailed
            mode: batch
            signals: [metrics]
        noop:
          type: exporter:noop
      connections:
        - from: telemetry
          to: comparison_filter
        - from: comparison_filter
          to: metrics_debug
        - from: metrics_debug
          to: noop
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:traffic_generator
            config:
              data_source: synthetic
              traffic_config:
                max_signal_count: 3
                max_batch_size: 3
                signals_per_second: 1
                log_weight: 100
            entity:
              extend:
                identity_attributes:
                  componentName:
                    value: example-receiver
                  function:
                    value: ingest
            policies:
              telemetry:
                item_counts: true
          noop:
            type: exporter:noop
        connections:
          - from: receiver
            to: noop
