[package]
name = "otel-arrow-dfe-core-nodes"
description = "Core receivers, processors, and exporters for the OTel Arrow Dataflow Engine"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
keywords = ["telemetry", "opentelemetry", "otlp", "otap", "dataflow"]
categories = ["asynchronous"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
otel-arrow-dfe-channel = { workspace = true }
otel-arrow-dfe-config = { workspace = true }
otel-arrow-dfe-engine = { workspace = true }
otel-arrow-dfe-query-engine-languages = { workspace = true, optional = true }
otel-arrow-dfe-otap = { workspace = true }
otel-arrow-dfe-pdata = { workspace = true }
otel-arrow-dfe-pdata-views = { workspace = true }
otel-arrow-dfe-query-engine = { workspace = true, optional = true }
otel-arrow-dfe-quiver = { workspace = true }
otel-arrow-dfe-telemetry = { workspace = true }
otel-arrow-dfe-telemetry-macros = { workspace = true }

arrow = { workspace = true }
async-trait.workspace = true
base64.workspace = true
blake3.workspace = true
byte-unit.workspace = true
bytes.workspace = true
chrono.workspace = true
hashbrown.workspace = true
otel-arrow-contrib-data-engine-expressions = { workspace = true, optional = true }
otel-arrow-contrib-data-engine-kql-parser = { workspace = true, optional = true }
futures.workspace = true
futures-timer.workspace = true
hex.workspace = true
humantime-serde.workspace = true
linkme.workspace = true
object_store = { workspace = true, features = ["fs"], optional = true }
parquet = { workspace = true, optional = true }
prost.workspace = true
prost-types.workspace = true
rand.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
slotmap.workspace = true
smallvec.workspace = true
thiserror.workspace = true
tokio.workspace = true
tower.workspace = true
tonic-middleware.workspace = true
tonic.workspace = true
tokio-util.workspace = true
reqwest.workspace = true
parking_lot.workspace = true
http.workspace = true
secrecy.workspace = true
async-stream.workspace = true
arrow-ipc.workspace = true
uuid.workspace = true
xxhash-rust.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
libc.workspace = true
nix.workspace = true

[features]
# Compatibility default: existing consumers continue to compile every core node.
# Minimal consumers should use `default-features = false` and select exact nodes.
default = ["core-nodes"]

# Keep these umbrella lists exhaustive. Every public node feature must appear in
# exactly one category so `core-nodes` remains the complete built-in inventory.
core-nodes = ["core-receivers", "core-processors", "core-exporters"]
core-receivers = [
    "host-metrics-receiver",
    "internal-telemetry-receiver",
    "journald-receiver",
    "otap-receiver",
    "otlp-receiver",
    "syslog-cef-receiver",
    "topic-receiver",
]
core-processors = [
    "attributes-processor",
    "batch-processor",
    "content-router-processor",
    "debug-processor",
    "durable-buffer-processor",
    "fanout-processor",
    "filter-processor",
    "log-sampling-processor",
    "partition-processor",
    "retry-processor",
    "signal-type-router-processor",
    "temporal-reaggregation-processor",
    "transform-processor",
]
core-exporters = [
    "console-exporter",
    "file-exporter",
    "noop-exporter",
    "otap-exporter",
    "otlp-grpc-exporter",
    "otlp-http-exporter",
    "parquet-exporter",
    "topic-exporter",
]

# Protocol capability aliases. These are convenience bundles over the leaf
# features below; consumers can still select one direction or transport.
otap = ["otap-receiver", "otap-exporter"]
otlp = [
    "otlp-receiver",
    "otlp-grpc-exporter",
    "otlp-http-exporter",
]
topic = ["topic-receiver", "topic-exporter"]

# Receivers: gate the module in `src/receivers/mod.rs`, list the feature in
# `core-receivers`, and gate significant receiver-specific dependency subtrees.
host-metrics-receiver = []
internal-telemetry-receiver = []
journald-receiver = []
otap-receiver = []
otlp-receiver = []
syslog-cef-receiver = []
topic-receiver = []

# Processors: gate the module in `src/processors/mod.rs`, list the feature in
# `core-processors`, and gate significant processor-specific dependency subtrees.
attributes-processor = []
batch-processor = []
content-router-processor = []
debug-processor = []
durable-buffer-processor = []
fanout-processor = []
filter-processor = []
log-sampling-processor = []
partition-processor = [
    "dep:otel-arrow-dfe-query-engine",
    "dep:otel-arrow-dfe-query-engine-languages",
]
retry-processor = []
signal-type-router-processor = []
temporal-reaggregation-processor = []
transform-processor = [
    "dep:otel-arrow-contrib-data-engine-expressions",
    "dep:otel-arrow-contrib-data-engine-kql-parser",
    "dep:otel-arrow-dfe-query-engine",
    "dep:otel-arrow-dfe-query-engine-languages",
]

# Exporters: gate the module in `src/exporters/mod.rs`, list the feature in
# `core-exporters`, and gate significant exporter-specific dependency subtrees.
console-exporter = []
file-exporter = []
noop-exporter = []
otap-exporter = []
otlp-grpc-exporter = []
otlp-http-exporter = []
parquet-exporter = [
    "dep:object_store",
    "dep:parquet",
]
topic-exporter = []

# Cross-cutting capabilities. These may imply a node when the capability has no
# meaning on its own; for example, Azure storage implies the Parquet exporter.
# Enables Weaver-backed semantic-convention assertions in core-node tests.
# Weaver remains a dev-dependency and is not part of the published crate graph.
dev-tools = []
# Azure Blob Storage backend for the Parquet exporter.
azure = ["parquet-exporter", "otel-arrow-dfe-otap/azure"]
bench = []

[dev-dependencies]
arrow-ipc.workspace = true
arrow-schema.workspace = true
fluke-hpack.workspace = true
flume.workspace = true
otel-arrow-dfe-channel = { workspace = true }
otel-arrow-dfe-engine = { workspace = true, features = ["test-utils"] }
otel-arrow-dfe-otap = { workspace = true, features = ["test-utils", "crypto-ring"] }
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }
otel-arrow-dfe-telemetry = { workspace = true }
flate2.workspace = true
http-body-util.workspace = true
hyper.workspace = true
hyper-util.workspace = true
tokio-stream.workspace = true
zstd.workspace = true
pretty_assertions.workspace = true
tempfile.workspace = true
otel-arrow-dfe-test-net.workspace = true
otel-arrow-dfe-test-tls-certs.workspace = true
criterion.workspace = true
weaver_common.workspace = true
weaver_forge.workspace = true
weaver_resolver.workspace = true
weaver_semconv.workspace = true

[[bench]]
name = "temporal_reaggregation_processor"
harness = false
path = "benches/temporal_reaggregation_processor/main.rs"
required-features = ["bench", "temporal-reaggregation-processor"]

[[bench]]
name = "journald_decode"
harness = false
path = "benches/journald_decode/main.rs"
required-features = ["bench", "journald-receiver"]
