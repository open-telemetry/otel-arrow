# Each live component fixture starts two pipelines in the same engine from this
# template. The runner supplies a separate input_address and output_file for each.
#
# In main, the runner adds, reconfigures, and removes the component under test.
# To detect disruption to an unrelated pipeline, it sends marked records through
# observer during and after each rollout. It checks that the records arrive and
# that observer is still serving on the same generation it had at startup.
nodes:
  input:
    type: receiver:syslog_cef
    config:
      batch: { max_size: 1 }
      protocol:
        tcp: { listening_addr: '{{ input_address }}' }
  out:
    type: exporter:file
    config:
      path: '{{ output_file }}'
connections:
  - from: input
    to: out
