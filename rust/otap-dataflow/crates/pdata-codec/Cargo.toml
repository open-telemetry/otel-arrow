[package]
name = "otel-arrow-dfe-pdata-codec"
description = "Pluggable encoded telemetry formats for the OTAP Dataflow Engine"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
keywords = ["telemetry", "opentelemetry", "otlp", "otap", "codec"]
categories = ["encoding"]
rust-version.workspace = true

[dependencies]
bytes.workspace = true
chrono = { workspace = true, optional = true }
linkme.workspace = true
otel-arrow-dfe-config.workspace = true
otel-arrow-dfe-pdata.workspace = true
otel-arrow-dfe-pdata-views.workspace = true
prost.workspace = true
serde.workspace = true
thiserror.workspace = true

[dev-dependencies]
serde_yaml.workspace = true
arrow.workspace = true
futures.workspace = true
tokio = { workspace = true, features = ["test-util"] }
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }

[features]
syslog-cef = ["dep:chrono"]
bench = ["syslog-cef"]
testing = []
# Registers fixture codecs. Enable only from dev-dependencies, never runtime dependencies.
test-codecs = ["testing"]

[lints]
workspace = true
