[package]
name = "otel-arrow-dfe-controller"
description = "OTAP dataflow engine controller"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
keywords = ["telemetry", "opentelemetry", "otlp", "otap", "controller"]
categories = ["asynchronous"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
testing = []
admin-live-logs-ws = ["otel-arrow-dfe-admin/live-logs-ws"]
jemalloc-pprof = ["otel-arrow-dfe-admin/jemalloc-pprof"]

[dependencies]
otel-arrow-dfe-config = { workspace = true }
otel-arrow-dfe-state = { workspace = true }
otel-arrow-dfe-engine = { workspace = true }
otel-arrow-dfe-telemetry = { workspace = true }
otel-arrow-dfe-telemetry-macros = { workspace = true }
otel-arrow-dfe-admin = { workspace = true }

sysinfo = { workspace = true }
thiserror = { workspace = true }
miette = { workspace = true }
bytes = { workspace = true }
core_affinity = { workspace = true }
tokio = { workspace = true }
tokio-util = { workspace = true }
smallvec = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
prost = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
serde = { workspace = true }
tokio-tungstenite = { workspace = true }
humantime-serde = { workspace = true }
linkme = { workspace = true }
uuid = { workspace = true }
url = { workspace = true }

[dev-dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
otel-arrow-dfe-test-net = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["registry"] }
