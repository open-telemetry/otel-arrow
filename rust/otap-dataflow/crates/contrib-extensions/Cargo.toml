[package]
name = "otap-df-contrib-extensions"
description = "OTAP Contrib extensions"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
# Workspace crates
otap-df-config = { workspace = true }
otap-df-engine = { workspace = true }
otap-df-otap = { workspace = true }
otap-df-telemetry = { workspace = true }
otap-df-telemetry-macros = { workspace = true }

async-trait.workspace = true
futures.workspace = true
http = { workspace = true, optional = true }
linkme.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-stream.workspace = true
azure_core = { workspace = true, optional = true, features = ["reqwest"] }
azure_identity = { workspace = true, optional = true }
humantime-serde = { workspace = true, optional = true }
jsonwebtoken = { workspace = true, optional = true }
oauth2 = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true, features = ["form"] }
secrecy = { workspace = true, optional = true }

[features]
# Umbrella feature enabling all contrib extensions.
contrib-extensions = ["azure-identity-auth-extension", "oauth2-client-auth-extension"]
# Azure Identity authentication extension (BearerTokenProvider capability).
azure-identity-auth-extension = ["dep:azure_core", "dep:azure_identity", "dep:humantime-serde", "dep:rand"]
# OAuth 2.0 Client Auth extension (BearerTokenProvider capability).
oauth2-client-auth-extension = ["dep:oauth2", "dep:reqwest", "dep:http", "dep:jsonwebtoken", "dep:humantime-serde", "dep:rand", "dep:secrecy"]

[dev-dependencies]
otap-df-engine = { workspace = true, features = ["test-utils"] }
otap-df-otap = { workspace = true, features = ["crypto-ring"] }
rcgen = { workspace = true, features = ["aws_lc_rs"] }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
wiremock = { workspace = true }
