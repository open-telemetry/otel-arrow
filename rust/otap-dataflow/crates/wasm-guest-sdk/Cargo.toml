[package]
name = "otel-arrow-dfe-wasm-guest-sdk"
description = "Internal guest SDK for OTAP dataflow WASM plugins"
version.workspace = true
authors.workspace = true
repository.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
rust-version.workspace = true

[features]
default = ["guest"]
guest = ["dep:serde", "dep:serde_json", "dep:wit-bindgen"]

[dependencies]
serde = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }
wit-bindgen = { version = "0.62", features = ["async", "macros", "realloc"], optional = true }

[lints]
workspace = true
