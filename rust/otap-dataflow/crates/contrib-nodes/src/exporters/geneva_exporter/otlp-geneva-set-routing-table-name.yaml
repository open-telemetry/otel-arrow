# Geneva Exporter with Custom Table Routing
#
# This configuration routes logs to "Test1" table and spans to "Test2" table
# in Geneva, using a type_router to split signals into separate processing
# paths with dedicated attribute processors and transforms.
#
# Usage:
#   ./df_engine --config otlp-geneva-custom-tables.yaml --num-cores 1
#
# Send data to this collector using:
#   - OTLP/gRPC endpoint: localhost:4317

version: otel_dataflow/v1

policies:
  channel_capacity:
    control:
      node: 100
      pipeline: 100
    pdata: 128

engine: {}

groups:
  default:
    pipelines:
      main:
        nodes:
          # OTLP gRPC Receiver - shared across all signals
          otlp-receiver:
            type: "urn:otel:receiver:otlp"
            config:
              protocols:
                grpc:
                  listening_addr: "127.0.0.1:4317"

          # Type router - splits logs and traces into separate paths
          signal-router:
            type: "urn:otel:processor:type_router"
            outputs:
              - logs
              - traces
            config: {}

          geneva-exporter-logs:
            type: "urn:microsoft:exporter:geneva"
            config:
              endpoint: "https://gcs.ppe.monitoring.core.windows.net/"
              environment: "test"
              account: "PipelineAgent2Demo"
              namespace: "PAdemo2"
              region: "westus2"
              config_major_version: 2
              tenant: "PAdemo2"
              role_name: "otlp-collector"
              role_instance: "ragudevbox-collector-002"
              auth:
                type: "certificate"
                path: "C:\\Official_New\\Cert\\pipelineagentkv-NSAonecert-20260520.pfx"
                password: ""
              max_buffer_size: 1000
              max_concurrent_uploads: 4
              logs:
                default_event_name: "Test1"
                # You can use one of the following routing configurations to map logs to different event names (tables) in Geneva:
                # Example routing using event_name.
                # event_name_mapping:
                #   routing_key: event_name
                #   events:
                #     Test1: Log1
                #     Log1: Log1

                # Or use resource_attribute:
                # event_name_mapping:
                #  routing_key:
                #    resource_attribute: cluster
                #  events:
                #    Test1: Log1
                #    Log1: 

                # Or use scope_attribute:
                # event_name_mapping:
                #  routing_key:
                #    scope_attribute: scope.name
                #  events:
                #    Test1: Log1
                #    #Log1: Log1

                # Or use log_record_attribute:
                # event_name_mapping:
                #  routing_key:
                #    log_record_attribute: custom_event_name  # Note: event_name at this level will not work, it has to be log_record_attribute
                #  events:
                #    Test1:
                #    Log1:               

          geneva-exporter-traces:
            type: "urn:microsoft:exporter:geneva"
            config:
              endpoint: "https://gcs.ppe.monitoring.core.windows.net/"
              environment: "test"
              account: "PipelineAgent2Demo"
              namespace: "PAdemo2"
              region: "westus2"
              config_major_version: 2
              tenant: "PAdemo2"
              role_name: "otlp-collector"
              role_instance: "ragudevbox-collector-002"
              auth:
                type: "certificate"
                path: "C:\\Official_New\\Cert\\pipelineagentkv-NSAonecert-20260520.pfx"
                password: ""
              max_buffer_size: 1000
              max_concurrent_uploads: 4
              spans:
                default_event_name: "Test2"
                # Example span routing configurations (similar to logs):
                # event_name_mapping:
                #  routing_key:
                #    resource_attribute: cluster
                #  events:
                #    Test2: Test2
                #    Span2: MyEvent
                
                # Or use scope_attribute:
                # event_name_mapping:
                #  routing_key:
                #    scope_attribute: scope.name
                #  events:
                #    Test2: Test2
                #    Span2: MyEvent
                
                # Or use span_attribute:
                # event_name_mapping:
                #  routing_key:
                #    span_attribute: custom_scope
                #  events:
                #    Test2: Test2
                #    Span2: MyEvent

        connections:
          # Shared receiver → type router
          - from: otlp-receiver
            to: signal-router

          # Logs path: router["logs"] → attr → transform → exporter
          - from: signal-router["logs"]
            to: geneva-exporter-logs

          # Traces path: router["traces"] → attr → exporter
          - from: signal-router["traces"]
            to: geneva-exporter-traces
