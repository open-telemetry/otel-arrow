node.id=1
process.roles=broker,controller
controller.quorum.voters=1@broker:29093
controller.listener.names=CONTROLLER

listeners=CONTROLLER://:29093,PLAINTEXT://:19092,SASL_SSL_HOST://:9093,SASL_SSL_INTERNAL://:19093
advertised.listeners=PLAINTEXT://broker:19092,SASL_SSL_HOST://KAFKA_SASL_TLS_HOST:KAFKA_SASL_TLS_PORT,SASL_SSL_INTERNAL://broker:19093
listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,SASL_SSL_HOST:SASL_SSL,SASL_SSL_INTERNAL:SASL_SSL
inter.broker.listener.name=PLAINTEXT

sasl.enabled.mechanisms=PLAIN,SCRAM-SHA-256,SCRAM-SHA-512
listener.name.sasl_ssl_host.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_plain="plain-secret";
listener.name.sasl_ssl_host.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ssl_host.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ssl_internal.plain.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="broker" password="broker-secret" user_plain="plain-secret";
listener.name.sasl_ssl_internal.scram-sha-256.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;
listener.name.sasl_ssl_internal.scram-sha-512.sasl.jaas.config=org.apache.kafka.common.security.scram.ScramLoginModule required;

ssl.keystore.type=PKCS12
ssl.keystore.location=/etc/kafka/secrets/broker.p12
ssl.keystore.password=changeit
ssl.key.password=changeit
ssl.client.auth=none

log.dirs=/var/lib/kafka/data
num.partitions=1
auto.create.topics.enable=true
offsets.topic.replication.factor=1
group.initial.rebalance.delay.ms=0
transaction.state.log.replication.factor=1
transaction.state.log.min.isr=1
share.coordinator.state.topic.replication.factor=1
share.coordinator.state.topic.min.isr=1
