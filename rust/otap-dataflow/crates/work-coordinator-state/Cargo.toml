[package]
name = "otel-arrow-dfe-work-coordinator-state"
description = "Local durable authority and opaque conditional source progress"
version.workspace = true
authors.workspace = true
edition.workspace = true
repository.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true
readme = "README.md"
keywords = ["telemetry", "opentelemetry", "coordination", "checkpoint"]
categories = ["database", "data-structures"]

[lints]
workspace = true

[features]
default = ["sqlite"]
sqlite = ["dep:rusqlite", "dep:fs2", "dep:nix", "dep:uuid", "dep:sha2"]
# Explicit opt-in for crash-boundary tests; absent from production builds.
test-utils = ["sqlite"]

[dependencies]
thiserror.workspace = true
sha2 = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
rusqlite = { workspace = true, optional = true }
fs2 = { workspace = true, optional = true }
nix = { workspace = true, features = ["user"], optional = true }
uuid = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
