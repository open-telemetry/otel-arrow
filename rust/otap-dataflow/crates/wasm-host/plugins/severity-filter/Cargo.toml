[package]
name = "severity-filter-guest"
description = "Reference WASM guest plugin: filter log records where severity == ERROR"
version = "0.0.0"
edition = "2021"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-guest-sdk = { package = "otel-arrow-dfe-wasm-guest-sdk", path = "../../../wasm-guest-sdk" }

[profile.release]
opt-level = "s"
lto = true
strip = true
