[package]
name = "otel-arrow-dfe-engine"
description = "Async pipeline engine"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
keywords = ["telemetry", "opentelemetry", "otlp", "otap", "dataflow"]
categories = ["asynchronous"]
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[features]
testing = []
jemalloc = ["dep:tikv-jemalloc-ctl", "dep:tikv-jemalloc-sys"]
jemalloc-testing = ["jemalloc"]
test-utils = []

[dependencies]
otel-arrow-dfe-channel = { workspace = true }
otel-arrow-dfe-pdata = { workspace = true }
otel-arrow-dfe-config = { workspace = true }
otel-arrow-dfe-engine-macros = { workspace = true }
otel-arrow-dfe-component-inventory-syntax = { workspace = true }
otel-arrow-dfe-state = { workspace = true }
otel-arrow-dfe-telemetry = { workspace = true }
otel-arrow-dfe-telemetry-macros = { workspace = true }

thiserror = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
linkme = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
secrecy = { workspace = true }
flume = { workspace = true }
bitflags = { workspace = true }
bytemuck = { workspace = true }
smallvec = { workspace = true }
socket2 = { workspace = true }
cpu-time = { workspace = true }
memory-stats = { workspace = true }
nix = { workspace = true, features = ["resource", "sched"] }
parking_lot = { workspace = true }
futures-core = { workspace = true }
async-channel = { workspace = true }
uuid = { workspace = true }
data-encoding = { workspace = true }

[target.'cfg(not(windows))'.dependencies]
tikv-jemalloc-ctl = { workspace = true, optional = true }
tikv-jemalloc-sys = { workspace = true, optional = true }

[dev-dependencies]
async-trait = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "time", "test-util"] }
tempfile = { workspace = true }
prost = { workspace = true }

[target.'cfg(not(windows))'.dev-dependencies]
tikv-jemallocator = { workspace = true }
