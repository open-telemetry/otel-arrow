[package]
name = "otel-arrow-dfe-query-engine-playground"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "Interactive web playground for executing OPL programs against OpenTelemetry data"

[[bin]]
name = "opl-playground"
path = "src/main.rs"

[dependencies]
arrow = { workspace = true, features = ["prettyprint"] }
axum = { workspace = true }
base64 = { workspace = true }
prost = { workspace = true }
serde = { workspace = true }
tokio = { workspace = true }

otel-arrow-contrib-data-engine-parser-abstractions = { workspace = true }
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }
otel-arrow-dfe-query-engine = { workspace = true }
otel-arrow-dfe-query-engine-languages = { workspace = true }

[lints]
workspace = true
