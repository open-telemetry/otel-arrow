[package]
name = "otel-arrow-dfe-ctl"
description = "Control CLI for the OTAP dataflow engine admin SDK"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "dfctl"
path = "src/main.rs"

[lints]
workspace = true

[target.'cfg(any(target_os = "linux", target_os = "windows"))'.dependencies]
rustls-symcrypt = { workspace = true, optional = true }

[features]
default = ["crypto-ring"]
crypto-ring = ["otel-arrow-dfe-admin-api/crypto-ring", "dep:rustls", "rustls/ring"]
crypto-aws-lc = ["otel-arrow-dfe-admin-api/crypto-aws-lc", "dep:rustls", "rustls/aws_lc_rs"]
crypto-openssl = ["otel-arrow-dfe-admin-api/crypto-openssl", "dep:rustls", "dep:rustls-openssl"]
crypto-symcrypt = ["otel-arrow-dfe-admin-api/crypto-symcrypt", "dep:rustls", "dep:rustls-symcrypt"]

[dependencies]
otel-arrow-dfe-admin-api = { path = "../admin-api", default-features = false, features = ["http-client"] }
otel-arrow-dfe-config = { workspace = true }

clap = { workspace = true, features = ["derive", "env"] }
clap_complete = { workspace = true }
crossterm = { workspace = true }
humantime = { workspace = true }
humantime-serde = { workspace = true }
ratatui = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
tempfile = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "signal", "time"] }
rustls = { workspace = true, optional = true }
rustls-openssl = { workspace = true, optional = true }

[dev-dependencies]
wiremock = { workspace = true }
