[package]
name = "otel-arrow-dfe-query-engine"
description = "Query engine for transforming OpenTelemetry data in OTAP pipelines"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
readme = "README.md"
publish = true
keywords = ["opentelemetry", "otlp", "otap", "query", "datafusion"]
categories = ["data-structures"]
edition.workspace = true
rust-version.workspace = true

[dependencies]
arrow = { workspace = true, features = ["prettyprint"] }
async-trait = { workspace = true }
datafusion = { workspace = true, features = [
    "crypto_expressions",
    "datetime_expressions",
    "math_expressions",
    "unicode_expressions",
] }
futures-core = { workspace = true }
memchr = { workspace = true }
sha1 = { workspace = true, optional = true }
xxhash-rust = { workspace = true }
parking_lot = { workspace = true }
smallvec = { workspace = true }
thiserror = { workspace = true }
otel-arrow-contrib-data-engine-expressions = { workspace = true }
otel-arrow-contrib-data-engine-parser-abstractions = { workspace = true }
uuid = { workspace = true }

otel-arrow-dfe-config = { workspace = true }
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }

[features]
sha1-hash = ["dep:sha1"]

[dev-dependencies]
criterion = { workspace = true, features = ["async_tokio"] }
otel-arrow-contrib-data-engine-kql-parser = { workspace = true }
otel-arrow-contrib-data-engine-parser-abstractions = { workspace = true }
pretty_assertions = { workspace = true }
prost = { workspace = true }
tokio = { workspace = true }

otel-arrow-dfe-query-engine-languages = { workspace = true }
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }

[target.'cfg(not(windows))'.dev-dependencies]
tikv-jemallocator.workspace = true

[[bench]]
name = "filter"
harness = false

[[bench]]
name = "assign_attributes"
harness = false

[lints]
workspace = true
