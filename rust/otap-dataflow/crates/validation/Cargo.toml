[package]
name = "otel-arrow-dfe-validation"
description = "Performs validation for encoding/decoding and pipelines with OTLP/OTAP requests"
version.workspace = true
authors.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true
edition.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
otel-arrow-dfe-wasm-host = { workspace = true, features = ["wasm"], optional = true }
async-trait = { workspace = true }
linkme = { workspace = true }
serde = { workspace = true }
serde_yaml = { workspace = true }
serde_json = { workspace = true }
tokio = { workspace = true }
otel-arrow-dfe-test-net = { workspace = true }
humantime-serde = { workspace = true }

testcontainers = { workspace = true, features = ["http_wait_plain"] }
minijinja = { workspace = true }

otel-arrow-dfe-admin-api = { workspace = true }
otel-arrow-dfe-engine = { workspace = true }
otel-arrow-dfe-config = { workspace = true }
otel-arrow-dfe-core-nodes = { workspace = true, features = ["core-nodes"] }
otel-arrow-dfe-dev-nodes = { workspace = true }
otel-arrow-dfe-pdata = { workspace = true, features = ["testing"] }
otel-arrow-dfe-pdata-codec = { workspace = true }
otel-arrow-dfe-telemetry = { workspace = true }
otel-arrow-dfe-telemetry-macros = { workspace = true }
otel-arrow-dfe-otap = { workspace = true }
otel-arrow-dfe-controller = { workspace = true }
prost = { workspace = true }

[features]
integration-tests = []
# Offline real-factory coverage; keep Azure and database features opt-in.
akv-database-bindings = [
    "otel-arrow-dfe-contrib-extensions/azure-key-vault-user-pass-auth",
    "otel-arrow-dfe-contrib-nodes/oracle",
    "otel-arrow-dfe-contrib-nodes/postgresql",
    "otel-arrow-dfe-contrib-nodes/sql-server",
]
offline-fixtures = [
    "otel-arrow-dfe-contrib-extensions/contrib-extensions",
    "otel-arrow-dfe-contrib-nodes/contrib-processors",
    "otel-arrow-dfe-contrib-nodes/kafka", "otel-arrow-dfe-contrib-nodes/clickhouse",
    "otel-arrow-dfe-contrib-nodes/geneva", "otel-arrow-dfe-contrib-nodes/azure-monitor",
    "dep:otel-arrow-dfe-wasm-host",
]
crypto-ring = ["otel-arrow-dfe-otap/crypto-ring"]
crypto-aws-lc = ["otel-arrow-dfe-otap/crypto-aws-lc"]
crypto-symcrypt = ["otel-arrow-dfe-otap/crypto-symcrypt"]
crypto-openssl = ["otel-arrow-dfe-otap/crypto-openssl"]

[dev-dependencies]
chrono.workspace = true
regex.workspace = true
tokio-tungstenite.workspace = true
wat.workspace = true
base64.workspace = true
tokio-rustls = { workspace = true, features = ["ring"] }
futures-util.workspace = true
flate2.workspace = true
parquet.workspace = true
anyhow.workspace = true
reqwest = { workspace = true, features = ["json"] }
otel-arrow-dfe-engine = { workspace = true, features = ["test-utils"] }
otel-arrow-dfe-contrib-extensions = { workspace = true, features = ["flat-file-api-key-auth"] }
bytes = { workspace = true }
otel-arrow-dfe-otap = { workspace = true, features = ["test-utils"] }
otel-arrow-dfe-contrib-nodes = { workspace = true }
otel-arrow-dfe-pdata-codec = { workspace = true, features = ["testing"] }
otel-arrow-dfe-quiver = { workspace = true }
otel-arrow-dfe-state = { workspace = true }
parking_lot = { workspace = true }
tempfile = { workspace = true }
tokio-util = { workspace = true }
tracing-subscriber = { workspace = true, features = ["fmt", "std", "env-filter"] }
wiremock = { workspace = true }
otel-arrow-dfe-test-tls-certs = { workspace = true }
weaver_common = { workspace = true }
weaver_forge = { workspace = true }
weaver_resolver = { workspace = true }
weaver_semconv = { workspace = true }

[target.'cfg(not(windows))'.dev-dependencies]
rdkafka.workspace = true

[target.'cfg(windows)'.dev-dependencies]
rdkafka = { workspace = true, features = ["cmake-build"] }

[[test]]
name = "akv_database_bindings"
path = "tests/akv_database_bindings.rs"
required-features = ["akv-database-bindings"]

[[test]]
name = "pipeline_tests"
path = "tests/pipeline_tests.rs"
required-features = ["integration-tests"]

[[test]]
name = "durable_buffer_processor_tests"
path = "tests/durable_buffer_processor_tests.rs"
required-features = ["integration-tests"]

[[test]]
name = "core_node_liveness_tests"
path = "tests/core_node_liveness_tests.rs"
required-features = ["integration-tests"]
