groups:
  - id: registry.host
    type: attribute_group
    display_name: Host Attributes
    brief: >
      A host is defined as a computing instance. For example, physical servers, virtual machines, switches or disk array.
    attributes:
      - id: host.id
        type: string
        annotations:
          traffic-generator:
            values: [fdbf79e8af94cb7f9e8df36789187052, i-0a1b2c3d4e5f67890, 3c9e1f7a2b8d4e6f0a1c5b9d7e2f4a68, 8f14e45fceea167a5a36dedd4bea2543]
        stability: development
        brief: >
          Unique host ID. For Cloud, this must be the instance_id assigned by the cloud provider.
          For non-containerized systems, this should be the `machine-id`. See the table below for
          the sources to use to determine the `machine-id` based on operating system.
        examples: ['fdbf79e8af94cb7f9e8df36789187052']
      - id: host.name
        type: string
        annotations:
          traffic-generator:
            values: [opentelemetry-test, web-01, web-02, db-primary, worker-7.prod.example.com]
        stability: development
        brief: >
          Name of the host. On UNIX systems, it may contain what the hostname
          command returns, or the fully qualified hostname, or another name
          specified by the user.
        examples: ['opentelemetry-test']
      - id: host.type
        type: string
        annotations:
          traffic-generator:
            values: [n1-standard-1, m5.large, t3.medium, Standard_D2s_v3, c6g.xlarge]
            weights: [3, 3, 2, 2, 1]
        stability: development
        brief: >
          Type of host. For Cloud, this must be the machine type.
        examples: ['n1-standard-1']
      - id: host.arch
        annotations:
          traffic-generator:
            values: [amd64, arm64, x86, arm32, ppc64, s390x, ppc32, ia64]
            weights: [70, 22, 2, 2, 2, 1, 0.5, 0.5]
        type:
          members:
            - id: amd64
              value: 'amd64'
              brief: "AMD64"
              stability: development
            - id: arm32
              value: 'arm32'
              brief: "ARM32"
              stability: development
            - id: arm64
              value: 'arm64'
              brief: "ARM64"
              stability: development
            - id: ia64
              value: 'ia64'
              brief: "Itanium"
              stability: development
            - id: ppc32
              value: 'ppc32'
              brief: "32-bit PowerPC"
              stability: development
            - id: ppc64
              value: 'ppc64'
              brief: "64-bit PowerPC"
              stability: development
            - id: s390x
              value: 's390x'
              brief: "IBM z/Architecture"
              stability: development
            - id: x86
              value: 'x86'
              brief: "32-bit x86"
              stability: development
        stability: development
        brief: >
            The CPU architecture the host system is running on.
      - id: host.image.name
        type: string
        annotations:
          traffic-generator:
            values: [infra-ami-eks-worker-node-7d4ec78312, CentOS-8-x86_64-1905, ubuntu-2204-jammy-v20240501, debian-12-bookworm]
        stability: development
        brief: >
          Name of the VM image or OS install the host was instantiated from.
        examples: ['infra-ami-eks-worker-node-7d4ec78312', 'CentOS-8-x86_64-1905']
      - id: host.image.id
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: [ami-07b06b442921831e5, ami-0c55b159cbfafe1f0, ami-0abcdef1234567890]
        brief: >
          VM image ID or host OS image ID. For Cloud, this value is from the provider.
        examples: ['ami-07b06b442921831e5']
      - id: host.image.version
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: ["0.1", "1.0.0", "2024.05.01", "22.04"]
        brief: >
          The version string of the VM image or host OS as defined in
          [Version Attributes](/docs/resource/README.md#version-attributes).
        examples: ['0.1']
      - id: host.ip
        stability: development
        type: string[]
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 4 } }
            items: { values: ["192.168.1.140", "fe80::abc2:4a28:737a:609e", "10.0.0.12", "172.17.0.1", "2001:db8::1"] }
        brief: >
          Available IP addresses of the host, excluding loopback interfaces.
        note: >
          IPv4 Addresses MUST be specified in dotted-quad notation. IPv6 addresses
          MUST be specified in the [RFC 5952](https://www.rfc-editor.org/rfc/rfc5952.html) format.
        examples:
          - ["192.168.1.140", "fe80::abc2:4a28:737a:609e"]
      - id: host.mac
        stability: development
        type: string[]
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 3 } }
            items: { values: [AC-DE-48-23-45-67, AC-DE-48-23-45-67-01-9F, 02-42-AC-11-00-02, 00-1A-2B-3C-4D-5E] }
        brief: >
          Available MAC addresses of the host, excluding loopback interfaces.
        note: >
          MAC Addresses MUST be represented in [IEEE RA hexadecimal form](https://standards.ieee.org/wp-content/uploads/import/documents/tutorials/eui.pdf):
          as hyphen-separated octets in uppercase hexadecimal form from most to least significant.
        examples:
          - ['AC-DE-48-23-45-67', 'AC-DE-48-23-45-67-01-9F']
      - id: host.cpu.vendor.id
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: [GenuineIntel, AuthenticAMD, ARM]
            weights: [55, 35, 10]
        brief: >
          Processor manufacturer identifier. A maximum 12-character string.
        note: >
          [CPUID](https://wiki.osdev.org/CPUID) command returns the vendor ID string in EBX, EDX and ECX registers.
          Writing these to memory in this order results in a 12-character string.
        examples: [ 'GenuineIntel' ]
      - id: host.cpu.family
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: ["6", "23", "25", PA-RISC 1.1e]
            weights: [50, 20, 25, 5]
        brief: >
          Family or generation of the CPU.
        examples: [ '6', 'PA-RISC 1.1e' ]
      - id: host.cpu.model.id
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: ["6", "85", "106", "143", "1", 9000/778/B180L]
            weights: [2, 4, 4, 3, 3, 1]
        brief: >
          Model identifier. It provides more granular information about the CPU, distinguishing it from
          other CPUs within the same family.
        examples: [ '6', '9000/778/B180L' ]
      - id: host.cpu.model.name
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: ['11th Gen Intel(R) Core(TM) i7-1185G7 @ 3.00GHz', 'Intel(R) Xeon(R) Platinum 8375C CPU @ 2.90GHz', 'AMD EPYC 7R13 Processor', 'Neoverse-N1']
            weights: [1, 4, 3, 2]
        brief: >
          Model designation of the processor.
        examples: [ '11th Gen Intel(R) Core(TM) i7-1185G7 @ 3.00GHz' ]
      - id: host.cpu.stepping
        stability: development
        type: string
        annotations:
          traffic-generator:
            values: ["1", "4", "7", r1p1, r3p1]
            weights: [3, 2, 2, 1, 1]
        brief: >
          Stepping or core revisions.
        examples: ["1", "r1p1"]
      - id: host.cpu.cache.l2.size
        stability: development
        type: int
        annotations:
          traffic-generator:
            values: [262144, 524288, 1048576, 1310720, 2097152, 12288000]
            weights: [2, 3, 4, 3, 2, 1]
        brief: >
          The amount of level 2 memory cache available to the processor (in Bytes).
        examples: [ 12288000 ]
