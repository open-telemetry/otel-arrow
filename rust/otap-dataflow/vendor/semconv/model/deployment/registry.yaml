groups:
  - id: registry.deployment
    type: attribute_group
    display_name: Deployment Attributes
    brief: >
      This document defines attributes for software deployments.
    attributes:
      - id: deployment.name
        annotations:
          traffic-generator:
            values: [deploy my app, deploy-frontend, deploy-backend, deploy-api-gateway, deploy-worker]
            weights: [2, 4, 4, 2, 1]
        type: string
        stability: development
        brief: >
          The name of the deployment.
        examples: ["deploy my app", "deploy-frontend"]
      - id: deployment.id
        annotations:
          traffic-generator:
            values: ["1208", "1209", "1210", "1211", "1212", "1213"]
        type: string
        stability: development
        brief: >
          The ID of the deployment.
        examples: ["1208"]
      - id: deployment.status
        annotations:
          traffic-generator:
            values: [failed, succeeded]
            weights: [8, 92]
        type:
          members:
            - id: failed
              value: failed
              brief: failed
              stability: development
            - id: succeeded
              value: succeeded
              brief: succeeded
              stability: development
        brief: >
          The status of the deployment.
        stability: development
      - id: deployment.environment.name
        annotations:
          traffic-generator:
            values: [production, staging, test, development]
            weights: [60, 20, 10, 10]
        type:
          members:
            - id: production
              value: "production"
              brief: Production environment
              stability: stable
            - id: staging
              value: "staging"
              brief: Staging environment
              stability: stable
            - id: test
              value: "test"
              brief: Testing environment
              stability: stable
            - id: development
              value: "development"
              brief: Development environment
              stability: stable
        stability: stable
        brief: >
          Name of the [deployment environment](https://wikipedia.org/wiki/Deployment_environment)
          (aka deployment tier).
        note: |
          `deployment.environment.name` does not affect the uniqueness constraints defined through
          the `service.namespace`, `service.name` and `service.instance.id` resource attributes.
          This implies that resources carrying the following attribute combinations MUST be
          considered to be identifying the same service:

          - `service.name=frontend`, `deployment.environment.name=production`
          - `service.name=frontend`, `deployment.environment.name=staging`.
        examples: ["staging", "production"]
