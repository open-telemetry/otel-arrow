groups:
  - id: metric.otel.sdk.span.live.count
    type: metric
    metric_name: otel.sdk.span.live.count
    annotations:
      traffic-generator:
        value:
          range: { min: 0, max: 2000 }
          distribution: { type: lognormal, mean: 50, stddev: 50 }
      code_generation:
        metric_value_type: int
    stability: development
    deprecated:
      reason: renamed
      renamed_to: otel.sdk.span.live
    brief: "Deprecated, use `otel.sdk.span.live` instead."
    instrument: updowncounter
    unit: "{span}"
  - id: metric.otel.sdk.span.ended.count
    type: metric
    metric_name: otel.sdk.span.ended.count
    annotations:
      traffic-generator:
        value:
          range: { min: 0, max: 20000 }
          distribution: { type: lognormal, mean: 500, stddev: 1000 }
        temporality: delta
      code_generation:
        metric_value_type: int
    stability: development
    deprecated:
      reason: obsoleted
    brief: "Use `otel.sdk.span.started` minus `otel.sdk.span.live` to derive this value."
    instrument: counter
    unit: "{span}"
