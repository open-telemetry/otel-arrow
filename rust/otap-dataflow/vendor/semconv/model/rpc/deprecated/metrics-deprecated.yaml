    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 4194304 }
          distribution: { type: lognormal, mean: 2048, stddev: 8192 }
        bounds: [0, 100, 512, 1024, 4096, 16384, 65536, 262144, 1048576, 4194304]
        observations: { range: { min: 1, max: 20 } }
        temporality: delta
    stability: development
    brief: Measures the size of RPC request messages (uncompressed).
    instrument: histogram
    unit: "By"
    note: |
      **Streaming**: Recorded per message in a streaming batch
    extends: attributes.metrics.rpc.server
    deprecated:
      reason: obsoleted
      note: Removed, no replacement at this time.

