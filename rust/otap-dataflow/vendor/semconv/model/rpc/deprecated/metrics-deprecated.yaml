  - id: metric.rpc.server.duration
    type: metric
    metric_name: rpc.server.duration
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 60000.0 }
          distribution: { type: lognormal, mean: 50.0, stddev: 100.0 }
        bounds: [0, 5, 10, 25, 50, 75, 100, 250, 500, 750, 1000, 2500, 5000, 7500, 10000]
        observations: { range: { min: 1, max: 20 } }
        temporality: delta
    stability: development
    instrument: histogram
    unit: "ms"
    note: |
      While streaming RPCs may record this metric as start-of-batch
      to end-of-batch, it's hard to interpret in practice.

      **Streaming**: N/A.
    extends: attributes.metrics.rpc.server
    deprecated:
      reason: uncategorized
      note: Replaced by `rpc.server.call.duration` with unit `s`.
    brief: "Deprecated, use `rpc.server.call.duration` instead. Note: the unit also changed from `ms` to `s`."

