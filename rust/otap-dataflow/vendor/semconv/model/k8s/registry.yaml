groups:
  - id: registry.k8s
    type: attribute_group
    display_name: Kubernetes Attributes
    brief: >
      Kubernetes resource attributes.
    attributes:
      - id: k8s.cluster.name
        annotations:
          traffic-generator:
            values: [opentelemetry-cluster, prod-us-east-1, prod-eu-west-1, staging, dev]
            weights: [3, 4, 3, 2, 1]
        type: string
        stability: stable
        brief: >
          The name of the cluster.
        examples: ['opentelemetry-cluster']
      - id: k8s.cluster.uid
        annotations:
          traffic-generator:
            values: ['218fc5a9-a5f1-4b54-aa05-46717d0ab26d', '7c1e4d2b-3a9f-4e8c-b6d5-0f2a1c9e8b74', 'e5b9a3c1-6d4f-4a2e-9c8b-1f7d3e5a2b60']
        type: string
        stability: stable
        brief: >
          A pseudo-ID for the cluster, set to the UID of the `kube-system`
          namespace.
        note: |
          K8s doesn't have support for obtaining a cluster ID. If this is ever
          added, we will recommend collecting the `k8s.cluster.uid` through the
          official APIs. In the meantime, we are able to use the `uid` of the
          `kube-system` namespace as a proxy for cluster ID. Read on for the
          rationale.

          Every object created in a K8s cluster is assigned a distinct UID. The
          `kube-system` namespace is used by Kubernetes itself and will exist
          for the lifetime of the cluster. Using the `uid` of the `kube-system`
          namespace is a reasonable proxy for the K8s ClusterID as it will only
          change if the cluster is rebuilt. Furthermore, Kubernetes UIDs are
          UUIDs as standardized by
          [ISO/IEC 9834-8 and ITU-T X.667](https://www.itu.int/ITU-T/studygroups/com17/oid.html).
          Which states:

          > If generated according to one of the mechanisms defined in Rec.
          > ITU-T X.667 | ISO/IEC 9834-8, a UUID is either guaranteed to be
          > different from all other UUIDs generated before 3603 A.D., or is
          > extremely likely to be different (depending on the mechanism chosen).

          Therefore, UIDs between clusters should be extremely unlikely to
          conflict.
        examples: ['218fc5a9-a5f1-4b54-aa05-46717d0ab26d']
      - id: k8s.node.name
        annotations:
          traffic-generator:
            values: [node-1, node-2, node-3, ip-10-0-1-23.ec2.internal, aks-nodepool1-12345678-vmss000000, gke-prod-default-pool-1a2b3c4d-x9z8]
        type: string
        stability: stable
        brief: >
          The name of the Node.
        examples: ['node-1']
      - id: k8s.node.uid
        annotations:
          traffic-generator:
            values: ['1eb3a0c6-0477-4080-a9cb-0cb7db65c6a2', '5f2d8e14-9b3a-4c71-8e6f-2a4b9c0d1e37', 'a8c4e2f6-1d3b-4f59-b7a0-6e9c2d4f8b13']
        type: string
        stability: stable
        brief: >
          The UID of the Node.
        examples: ['1eb3a0c6-0477-4080-a9cb-0cb7db65c6a2']
      - id: k8s.node.label
        annotations:
          traffic-generator:
            keys:
              values: [kubernetes.io/arch, kubernetes.io/os, node.kubernetes.io/instance-type, topology.kubernetes.io/zone, data]
              weights: [3, 3, 2, 2, 1]
            value:
              values: [arm64, amd64, linux, m5.xlarge, us-east-1a, '']
              weights: [2, 3, 4, 2, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The label placed on the Node, the `<key>` being the label name, the value being the label value, even if the value is empty.
        note: |
          Examples:

          - A label `kubernetes.io/arch` with value `arm64` SHOULD be recorded
            as the `k8s.node.label.kubernetes.io/arch` attribute with value `"arm64"`.
          - A label `data` with empty string value SHOULD be recorded as
            the `k8s.node.label.data` attribute with value `""`.
        examples: ['arm64', '']
      - id: k8s.node.annotation
        annotations:
          traffic-generator:
            keys:
              values: [node.alpha.kubernetes.io/ttl, volumes.kubernetes.io/controller-managed-attach-detach, kubeadm.alpha.kubernetes.io/cri-socket, data]
              weights: [3, 3, 2, 1]
            value:
              values: ['0', 'true', 'unix:///run/containerd/containerd.sock', '']
              weights: [3, 3, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The annotation placed on the Node, the `<key>` being the annotation name, the value being the annotation value, even if the value is empty.
        note: |
          Examples:

          - An annotation `node.alpha.kubernetes.io/ttl` with value `0` SHOULD be recorded as
            the `k8s.node.annotation.node.alpha.kubernetes.io/ttl` attribute with value `"0"`.
          - An annotation `data` with empty string value SHOULD be recorded as
            the `k8s.node.annotation.data` attribute with value `""`.
        examples: [ '0', '' ]
      - id: k8s.node.system_container.name
        annotations:
          traffic-generator:
            weights: [3, 3, 3, 1]
        type: string
        stability: development
        brief: >
          The name of the system container running on the K8s Node.
        examples: ['kubelet', 'runtime', 'pods', 'misc']
      - id: k8s.namespace.name
        annotations:
          traffic-generator:
            values: [default, kube-system, monitoring, production, staging, opentelemetry]
            weights: [5, 3, 2, 4, 2, 2]
        type: string
        stability: stable
        brief: >
          The name of the namespace that the pod is running in.
        examples: ['default']
      - id: k8s.namespace.label
        annotations:
          traffic-generator:
            keys:
              values: [kubernetes.io/metadata.name, team, environment, data]
              weights: [5, 2, 2, 1]
            value:
              values: [default, kube-system, platform, production, '']
              weights: [4, 2, 2, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The label placed on the Namespace, the `<key>` being the label name, the value being the label value, even if the value is empty.
        note: |

          Examples:

          - A label `kubernetes.io/metadata.name` with value `default` SHOULD be recorded
            as the `k8s.namespace.label.kubernetes.io/metadata.name` attribute with value `"default"`.
          - A label `data` with empty string value SHOULD be recorded as
            the `k8s.namespace.label.data` attribute with value `""`.
        examples: ['default', '']
      - id: k8s.namespace.annotation
        annotations:
          traffic-generator:
            keys:
              values: [ttl, owner, scheduler.alpha.kubernetes.io/node-selector, data]
              weights: [3, 2, 1, 1]
            value:
              values: ['0', '3600', team-platform, '']
              weights: [3, 1, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The annotation placed on the Namespace, the `<key>` being the annotation name, the value being the annotation value, even if the value is empty.
        note: |

          Examples:

          - An annotation `ttl` with value `0` SHOULD be recorded
            as the `k8s.namespace.annotation.ttl` attribute with value `"0"`.
          - An annotation `data` with empty string value SHOULD be recorded as
            the `k8s.namespace.annotation.data` attribute with value `""`.
        examples: ['0', '']
      - id: k8s.pod.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '3c9f1a7e-2b4d-4e8a-9f6c-1d5e7b3a9c20', '9e4b2d6f-8a1c-4f3e-b5d7-0c2a6e8f1b49', 'd1f7a3c5-6e2b-4b9d-8c4a-7f0e3b5d2a86']
        type: string
        stability: stable
        brief: >
          The UID of the Pod.
        examples: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff']
      - id: k8s.pod.name
        annotations:
          traffic-generator:
            values: [opentelemetry-pod-autoconf, frontend-7d4b9c8f6d-x2k9p, checkout-5f6c7d8b9-qwz4m, redis-0, otel-collector-agent-8hk2l, coredns-5d78c9869d-abcde]
        type: string
        stability: stable
        brief: >
          The name of the Pod.
        examples: ['opentelemetry-pod-autoconf']
      - id: k8s.pod.ip
        annotations:
          traffic-generator:
            values: [172.18.0.2, 10.244.0.15, 10.244.1.37, 10.244.2.8, 192.168.45.12]
        type: string
        stability: stable
        brief: >
          IP address allocated to the Pod.
        examples: [ '172.18.0.2' ]
        note: |
          This attribute aligns with the `podIP` field of the
          [K8s PodStatus](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.34/#podstatus-v1-core).
      - id: k8s.pod.hostname
        annotations:
          traffic-generator:
            values: [collector-gateway, redis-0, web-1, db-primary]
        type: string
        stability: stable
        brief: >
          Specifies the hostname of the Pod.
        note: |
          The K8s Pod spec has an optional hostname field, which can be used to specify a hostname.
          Refer to [K8s docs](https://kubernetes.io/docs/concepts/services-networking/dns-pod-service/#pod-hostname-and-subdomain-field)
          for more information about this field.

          This attribute aligns with the `hostname` field of the
          [K8s PodSpec](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.34/#podspec-v1-core).
        examples: [ 'collector-gateway' ]
      - id: k8s.pod.start_time
        annotations:
          traffic-generator:
            values: ['2025-12-04T08:41:03Z', '2025-12-03T22:15:47Z', '2025-11-28T14:02:19Z', '2025-12-04T09:30:00Z']
        type: string
        stability: stable
        brief: >
          The start timestamp of the Pod.
        examples: [ '2025-12-04T08:41:03Z' ]
        note: |
          Date and time at which the object was acknowledged by the Kubelet.
          This is before the Kubelet pulled the container image(s) for the pod.

          This attribute aligns with the `startTime` field of the
          [K8s PodStatus](https://kubernetes.io/docs/reference/generated/kubernetes-api/v1.34/#podstatus-v1-core),
          in ISO 8601 (RFC 3339 compatible) format.
      - id: k8s.pod.label
        annotations:
          traffic-generator:
            keys:
              values: [app, app.kubernetes.io/name, pod-template-hash, mycompany.io/arch, data]
              weights: [5, 4, 3, 1, 1]
            value:
              values: [my-app, frontend, 7d4b9c8f6d, x64, '']
              weights: [4, 3, 3, 1, 1]
        type: template[string]
        stability: stable
        brief: >
          The label placed on the Pod, the `<key>` being the label name, the value being the label value.
        examples: ['my-app', 'x64', '']
        note: |
          Examples:

          - A label `app` with value `my-app` SHOULD be recorded as
            the `k8s.pod.label.app` attribute with value `"my-app"`.
          - A label `mycompany.io/arch` with value `x64` SHOULD be recorded as
            the `k8s.pod.label.mycompany.io/arch` attribute with value `"x64"`.
          - A label `data` with empty string value SHOULD be recorded as
            the `k8s.pod.label.data` attribute with value `""`.
      - id: k8s.pod.annotation
        annotations:
          traffic-generator:
            keys:
              values: [kubernetes.io/enforce-mountable-secrets, prometheus.io/scrape, prometheus.io/port, mycompany.io/arch, data]
              weights: [1, 4, 3, 1, 1]
            value:
              values: ['true', '8080', x64, '']
              weights: [4, 3, 1, 1]
        type: template[string]
        stability: stable
        brief: >
          The annotation placed on the Pod, the `<key>` being the annotation name, the value being the annotation value.
        note: |
          Examples:

          - An annotation `kubernetes.io/enforce-mountable-secrets` with value `true` SHOULD be recorded as
            the `k8s.pod.annotation.kubernetes.io/enforce-mountable-secrets` attribute with value `"true"`.
          - An annotation `mycompany.io/arch` with value `x64` SHOULD be recorded as
            the `k8s.pod.annotation.mycompany.io/arch` attribute with value `"x64"`.
          - An annotation `data` with empty string value SHOULD be recorded as
            the `k8s.pod.annotation.data` attribute with value `""`.
        examples: [ 'true', 'x64', '' ]
      - id: k8s.container.name
        annotations:
          traffic-generator:
            values: [redis, app, nginx, otel-collector, istio-proxy, envoy]
            weights: [2, 4, 2, 2, 2, 1]
        type: string
        stability: stable
        brief: >
          The name of the Container from Pod specification, must be unique
          within a Pod. Container runtime usually uses different globally unique
          name (`container.name`).
        examples: ['redis']
      - id: k8s.container.restart_count
        annotations:
          traffic-generator:
            range: { min: 0, max: 100 }
            distribution: { type: zipf, exponent: 1.5 }
        type: int
        stability: stable
        brief: >
          Number of times the container was restarted. This attribute can be
          used to identify a particular container (running or stopped) within a
          container spec.
      - id: k8s.container.status.last_terminated_reason
        annotations:
          traffic-generator:
            values: [Completed, Error, OOMKilled, Evicted, ContainerCannotRun]
            weights: [6, 3, 2, 1, 1]
        type: string
        stability: development
        brief: >
          Last terminated reason of the Container.
        examples: ["Evicted", "Error"]
      - id: k8s.container.ephemeral_storage.fs_type
        annotations:
          traffic-generator:
            weights: [3, 2]
        type:
          members:
            - id: rootfs
              value: 'rootfs'
              brief: "For the container's writable layer usage."
              stability: development
            - id: logs
              value: 'logs'
              brief: "For the container's log files usage (stdout/stderr)."
              stability: development
        stability: development
        brief: >
          The type of file system component for ephemeral storage.
        note: |
          Eviction decisions based on ephemeral-storage resource limits are made based on the total container usage.
        examples: ['rootfs', 'logs']

      - id: k8s.replicaset.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '4a7c9e1b-3d5f-4b2a-8e6c-9f1d3b5a7c02', 'b8e2f4a6-7c1d-4e3b-9a5f-2d6c8e0b4f17']
        type: string
        stability: stable
        brief: >
          The UID of the ReplicaSet.
        examples: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff']
      - id: k8s.replicaset.name
        annotations:
          traffic-generator:
            values: [opentelemetry, frontend-7d4b9c8f6d, checkout-5f6c7d8b9, coredns-5d78c9869d]
        type: string
        stability: stable
        brief: >
          The name of the ReplicaSet.
        examples: ['opentelemetry']
      - id: k8s.replicaset.label
        annotations:
          traffic-generator:
            keys:
              values: [app, pod-template-hash, app.kubernetes.io/name, injected]
              weights: [4, 3, 2, 1]
            value:
              values: [guestbook, frontend, 7d4b9c8f6d, '']
              weights: [3, 3, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The label placed on the ReplicaSet, the `<key>` being the label name, the value being the label value, even if the value is empty.
        note: |

          Examples:

          - A label `app` with value `guestbook` SHOULD be recorded
            as the `k8s.replicaset.label.app` attribute with value `"guestbook"`.
          - A label `injected` with empty string value SHOULD be recorded as
            the `k8s.replicaset.label.injected` attribute with value `""`.
        examples: ['guestbook', '']
      - id: k8s.replicaset.annotation
        annotations:
          traffic-generator:
            keys:
              values: [replicas, deployment.kubernetes.io/desired-replicas, deployment.kubernetes.io/revision, data]
              weights: [2, 3, 3, 1]
            value:
              values: ['0', '1', '3', '']
              weights: [1, 3, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The annotation placed on the ReplicaSet, the `<key>` being the annotation name, the value being the annotation value, even if the value is empty.
        note: |

          Examples:

          - An annotation `replicas` with value `0` SHOULD be recorded
            as the `k8s.replicaset.annotation.replicas` attribute with value `"0"`.
          - An annotation `data` with empty string value SHOULD be recorded as
            the `k8s.replicaset.annotation.data` attribute with value `""`.
        examples: ['0', '']
      - id: k8s.replicationcontroller.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '6d1f3b5a-9c7e-4a2d-8b4f-0e2c6a8d1f53']
        type: string
        stability: development
        brief: >
          The UID of the replication controller.
        examples: [ '275ecb36-5aa8-4c2a-9c47-d8bb681b9aff' ]
      - id: k8s.replicationcontroller.name
        annotations:
          traffic-generator:
            values: [opentelemetry, nginx, legacy-web]
        type: string
        stability: development
        brief: >
          The name of the replication controller.
        examples: [ 'opentelemetry' ]
      - id: k8s.resourcequota.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '8f3a5c7e-1b9d-4d2f-a6c8-3e5b7d9f1a24']
        type: string
        stability: development
        brief: >
          The UID of the resource quota.
        examples: [ '275ecb36-5aa8-4c2a-9c47-d8bb681b9aff' ]
      - id: k8s.resourcequota.name
        annotations:
          traffic-generator:
            values: [opentelemetry, compute-resources, object-counts, storage-quota]
        type: string
        stability: development
        brief: >
          The name of the resource quota.
        examples: [ 'opentelemetry' ]
      - id: k8s.deployment.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '2e6a8c0f-4b1d-4f7e-9d3a-5c7e9b1d3f68', 'c4f6b8d0-2e9a-4c5f-8b1d-7a3e5c9f0b82']
        type: string
        stability: stable
        brief: >
          The UID of the Deployment.
        examples: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff']
      - id: k8s.deployment.name
        annotations:
          traffic-generator:
            values: [opentelemetry, frontend, checkout, coredns, otel-collector]
        type: string
        stability: stable
        brief: >
          The name of the Deployment.
        examples: ['opentelemetry']
      - id: k8s.deployment.label
        annotations:
          traffic-generator:
            keys:
              values: [app, app.kubernetes.io/name, app.kubernetes.io/version, injected]
              weights: [4, 3, 2, 1]
            value:
              values: [guestbook, frontend, 1.2.0, '']
              weights: [3, 3, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The label placed on the Deployment, the `<key>` being the label name, the value being the label value, even if the value is empty.
        note: |

          Examples:

          - A label `app` with value `guestbook` SHOULD be recorded
            as the `k8s.deployment.label.app` attribute with value `"guestbook"`.
          - A label `injected` with empty string value SHOULD be recorded as
            the `k8s.deployment.label.injected` attribute with value `""`.
        examples: ['guestbook', '']
      - id: k8s.deployment.annotation
        annotations:
          traffic-generator:
            keys:
              values: [replicas, deployment.kubernetes.io/revision, meta.helm.sh/release-name, data]
              weights: [2, 4, 2, 1]
            value:
              values: ['1', '3', my-release, '']
              weights: [3, 2, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The annotation placed on the Deployment, the `<key>` being the annotation name, the value being the annotation value, even if the value is empty.
        note: |

          Examples:

          - An annotation `replicas` with value `1` SHOULD be recorded
            as the `k8s.deployment.annotation.replicas` attribute with value `"1"`.
          - An annotation `data` with empty string value SHOULD be recorded as
            the `k8s.deployment.annotation.data` attribute with value `""`.
        examples: ['1', '']
      - id: k8s.statefulset.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '5b7d9f1a-3c6e-4a8b-9d2f-1e4a6c8b0d35']
        type: string
        stability: stable
        brief: >
          The UID of the StatefulSet.
        examples: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff']
      - id: k8s.statefulset.name
        annotations:
          traffic-generator:
            values: [opentelemetry, redis, postgres, kafka, zookeeper]
        type: string
        stability: stable
        brief: >
          The name of the StatefulSet.
        examples: ['opentelemetry']
      - id: k8s.statefulset.label
        annotations:
          traffic-generator:
            keys:
              values: [app, app.kubernetes.io/name, app.kubernetes.io/component, injected]
              weights: [4, 3, 2, 1]
            value:
              values: [guestbook, redis, database, '']
              weights: [3, 3, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The label placed on the StatefulSet, the `<key>` being the label name, the value being the label value, even if the value is empty.
        note: |

          Examples:

          - A label `app` with value `guestbook` SHOULD be recorded
            as the `k8s.statefulset.label.app` attribute with value `"guestbook"`.
          - A label `injected` with empty string value SHOULD be recorded as
            the `k8s.statefulset.label.injected` attribute with value `""`.
        examples: ['guestbook', '']
      - id: k8s.statefulset.annotation
        annotations:
          traffic-generator:
            keys:
              values: [replicas, meta.helm.sh/release-name, data]
              weights: [3, 2, 1]
            value:
              values: ['1', '3', my-release, '']
              weights: [3, 2, 2, 1]
        type: template[string]
        stability: stable
        brief: >
          The annotation placed on the StatefulSet, the `<key>` being the annotation name, the value being the annotation value, even if the value is empty.
        note: |

          Examples:

          - An annotation `replicas` with value `1` SHOULD be recorded
            as the `k8s.statefulset.annotation.replicas` attribute with value `"1"`.
          - An annotation `data` with empty string value SHOULD be recorded as
            the `k8s.statefulset.annotation.data` attribute with value `""`.
        examples: ['1', '']
      - id: k8s.daemonset.uid
        annotations:
          traffic-generator:
            values: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff', '9a1c3e5f-7b2d-4e6a-8c0f-4d6b8a2c1e79']
        type: string
        stability: stable
        brief: >
          The UID of the DaemonSet.
        examples: ['275ecb36-5aa8-4c2a-9c47-d8bb681b9aff']
      - id: k8s.daemonset.name
        annotations:
          traffic-generator:
            values: [opentelemetry, kube-proxy, fluent-bit, node-exporter, otel-collector-agent]
        type: string
        stability: stable
        brief: >
          The name of the DaemonSet.
        examples: ['opentelemetry']
      - id: k8s.daemonset.label
        annotations:
          traffic-generator:
            keys:
              values: [app, k8s-app, app.kubernetes.io/name, injected]
