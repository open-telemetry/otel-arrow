groups:
  # k8s.pod.* metrics
  - id: metric.k8s.pod.uptime
    type: metric
    metric_name: k8s.pod.uptime
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0, max: 31536000 }
          distribution: { type: lognormal, mean: 604800, stddev: 1209600 }
    stability: development
    brief: "The time the Pod has been running."
    entity_associations:
      - k8s.pod
    note: |
      Instrumentations SHOULD use a gauge with type `double` and measure uptime in seconds as a floating point number with the highest precision available.
      The actual accuracy would depend on the instrumentation and operating system.
    instrument: gauge
    unit: "s"

  # k8s.pod.status.* metrics
  - id: metric.k8s.pod.status.reason
    type: metric
    metric_name: k8s.pod.status.reason
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [0, 1], weights: [9, 1] }
    stability: development
    brief: "Describes the number of K8s Pods that are currently in a state for a given reason."
    entity_associations:
      - k8s.pod
    note: |
      All possible pod status reasons will be reported at each time interval to avoid missing metrics.
      Only the value corresponding to the current reason will be non-zero.
    instrument: updowncounter
    unit: "{pod}"
    attributes:
      - ref: k8s.pod.status.reason
        requirement_level: required
  - id: metric.k8s.pod.status.phase
    type: metric
    metric_name: k8s.pod.status.phase
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [0, 1], weights: [4, 1] }
    stability: development
    brief: "Describes number of K8s Pods that are currently in a given phase."
    entity_associations:
      - k8s.pod
    note: |
      All possible pod phases will be reported at each time interval to avoid missing metrics.
      Only the value corresponding to the current phase will be non-zero.
    instrument: updowncounter
    unit: "{pod}"
    attributes:
      - ref: k8s.pod.status.phase
        requirement_level: required

  # k8s.pod.cpu.* metrics
  - id: metric.k8s.pod.cpu.time
    type: metric
    metric_name: k8s.pod.cpu.time
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 60.0 }
          distribution: { type: lognormal, mean: 2.0, stddev: 5.0 }
        temporality: delta
    stability: release_candidate
    brief: "Total CPU time consumed."
    entity_associations:
      - k8s.pod
    note: >
      Total CPU time consumed by the specific Pod on all available CPU cores
    instrument: counter
    unit: "s"
  - id: metric.k8s.pod.cpu.usage
    type: metric
    metric_name: k8s.pod.cpu.usage
    entity_associations:
      - k8s.pod
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 8.0 }
          distribution: { type: lognormal, mean: 0.25, stddev: 0.5 }
    stability: development
    brief: "Pod's CPU usage, measured in CPUs. Range from 0 to the number of allocatable CPUs."
    note: >
      CPU usage of the specific Pod on all available CPU cores. It is calculated as the change in
      cumulative CPU time (k8s.pod.cpu.time) over a measurement interval, divided by the elapsed time:
      usageCores = (cpuTimeEnd - cpuTimeStart) / elapsedSeconds
    instrument: gauge
    unit: "{cpu}"

  # k8s.pod.memory.* metrics
  - id: metric.k8s.pod.memory.usage
    type: metric
    metric_name: k8s.pod.memory.usage
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 1048576, max: 17179869184 }
          distribution: { type: lognormal, mean: 268435456, stddev: 536870912 }
    stability: release_candidate
    brief: "Memory usage of the Pod."
    entity_associations:
      - k8s.pod
    instrument: updowncounter
    unit: "By"
    note: >
      Total memory in use. This includes all memory regardless of when it was accessed.

      This metric is derived from the
      [MemoryStats.UsageBytes](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#MemoryStats)
      field of the [PodStats.Memory](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#PodStats)
      of the Kubelet's stats API.
  - id: metric.k8s.pod.memory.available
    type: metric
    metric_name: k8s.pod.memory.available
    stability: release_candidate
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 17179869184 }
          distribution: { type: lognormal, mean: 536870912, stddev: 805306368 }
    entity_associations:
      - k8s.pod
    brief: "Pod memory available."
    note: >
      Available memory for use.  This is defined as the memory limit - workingSetBytes.
      If memory limit is undefined, the available bytes is omitted.

      This metric is derived from the
      [MemoryStats.AvailableBytes](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#MemoryStats)
      field of the [PodStats.Memory](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#PodStats)
      of the Kubelet's stats API.
    instrument: updowncounter
    unit: "By"
  - id: metric.k8s.pod.memory.rss
    type: metric
    metric_name: k8s.pod.memory.rss
    stability: release_candidate
    brief: "Pod memory RSS."
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 1048576, max: 17179869184 }
          distribution: { type: lognormal, mean: 134217728, stddev: 268435456 }
    entity_associations:
      - k8s.pod
    note: >
      The amount of anonymous and swap cache memory (includes transparent hugepages).

      This metric is derived from the
      [MemoryStats.RSSBytes](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#MemoryStats)
      field of the [PodStats.Memory](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#PodStats)
      of the Kubelet's stats API.
    instrument: updowncounter
    unit: "By"
  - id: metric.k8s.pod.memory.working_set
    type: metric
    metric_name: k8s.pod.memory.working_set
    stability: release_candidate
    entity_associations:
      - k8s.pod
    brief: "Pod memory working set."
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 1048576, max: 17179869184 }
          distribution: { type: lognormal, mean: 201326592, stddev: 402653184 }
    note: >
      The amount of working set memory. This includes recently accessed memory,
      dirty memory, and kernel memory. WorkingSetBytes is <= UsageBytes.

      This metric is derived from the
      [MemoryStats.WorkingSetBytes](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#MemoryStats)
      field of the [PodStats.Memory](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#PodStats)
      of the Kubelet's stats API.
    instrument: updowncounter
    unit: "By"
  - id: metric.k8s.pod.paging.faults
    type: metric
    metric_name: k8s.pod.paging.faults
    stability: development
    brief: "Pod memory paging faults."
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 10000 }
          distribution: { type: exponential, mean: 200 }
        temporality: delta
    entity_associations:
      - k8s.pod
    attributes:
      - ref: system.paging.fault.type
    note: >
      Cumulative number of major/minor page faults.

      This metric is derived from the
      [MemoryStats.PageFaults](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#MemoryStats) and
      [MemoryStats.MajorPageFaults](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#MemoryStats)
      field of the [PodStats.Memory](https://pkg.go.dev/k8s.io/kubelet@v0.34.0/pkg/apis/stats/v1alpha1#PodStats)
      of the Kubelet's stats API.
    instrument: counter
    unit: "{fault}"

