# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
attributes:
  - key: source.address
    type: string
    annotations:
      traffic-generator:
        values: [source.example.com, "10.1.2.80", /tmp/my.sock, "192.168.1.42", "2001:db8::5"]
        weights: [3, 4, 1, 3, 1]
    stability: development
    brief: "Source address - domain name if available without reverse DNS lookup; otherwise, IP address or UNIX domain socket name."
    note: >
      When observed from the destination side, and when communicating through an intermediary, `source.address` SHOULD represent
      the source address behind any intermediaries, for example proxies, if it's available.
    examples: ['source.example.com', '10.1.2.80', '/tmp/my.sock']
  - key: source.port
    type: int
    annotations:
      traffic-generator:
        range: { min: 1024, max: 65535 }
    stability: development
    brief: 'Source port number'
    examples: [3389, 2888]
