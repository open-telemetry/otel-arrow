groups:
  - id: registry.exception
    type: attribute_group
    display_name: Exception Attributes
    brief: >
      This document defines the shared attributes used to
      report a single exception associated with a span or log.
    attributes:
      - id: exception.type
        annotations:
          traffic-generator:
            values: [java.net.ConnectException, OSError, java.lang.NullPointerException, System.TimeoutException, ValueError, "*errors.errorString"]
            weights: [3, 2, 3, 2, 2, 1]
        type: string
        stability: stable
        brief: >
          The type of the exception (its fully-qualified class name, if applicable).
          The dynamic type of the exception should be preferred over the static type
          in languages that support it.
        examples: ["java.net.ConnectException", "OSError"]
        note: |
          If the recorded exception type is a wrapper that is not meaningful for
          failure classification, instrumentation MAY use the type of the inner
          exception instead. For example, in Go, errors created with `fmt.Errorf`
          using `%w` MAY be unwrapped when the wrapper type does not help
          classify the failure.
      - id: exception.message
        annotations:
          traffic-generator:
            values: ["Division by zero", "Can't convert 'int' object to str implicitly", "Connection refused", "The operation has timed out.", "invalid literal for int() with base 10: 'abc'"]
            weights: [1, 1, 3, 3, 2]
        type: string
        stability: stable
        brief: The exception message.
        examples:
          ["Division by zero", "Can't convert 'int' object to str implicitly"]
        note: |
          > [!WARNING]
          >
          > This attribute may contain sensitive information.
      - id: exception.stacktrace
        annotations:
          traffic-generator:
            values:
              - "Exception in thread \"main\" java.lang.RuntimeException: Test exception\n at com.example.GenerateTrace.methodB(GenerateTrace.java:13)\n at com.example.GenerateTrace.methodA(GenerateTrace.java:9)\n at com.example.GenerateTrace.main(GenerateTrace.java:5)"
              - "Traceback (most recent call last):\n  File \"app.py\", line 12, in <module>\n    main()\n  File \"app.py\", line 8, in main\n    return 1 / 0\nZeroDivisionError: division by zero"
              - "System.TimeoutException: The operation has timed out.\n   at Example.Service.CallAsync() in Service.cs:line 42\n   at Example.Program.Main() in Program.cs:line 10"
        type: string
        stability: stable
        brief: >
          A stacktrace as a string in the natural representation for the language runtime.
          The representation is to be determined and documented by each language SIG.
        examples: >
          Exception in thread "main" java.lang.RuntimeException: Test exception\n
          at com.example.GenerateTrace.methodB(GenerateTrace.java:13)\n
          at com.example.GenerateTrace.methodA(GenerateTrace.java:9)\n
          at com.example.GenerateTrace.main(GenerateTrace.java:5)
