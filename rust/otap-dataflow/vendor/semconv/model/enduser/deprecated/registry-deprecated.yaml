groups:
  - id: registry.enduser.deprecated
    type: attribute_group
    display_name: Deprecated End User Attributes
    brief: "Describes deprecated end user attributes."
    attributes:
      - id: enduser.role
        annotations:
          traffic-generator:
            values: [admin, user, viewer, editor]
            weights: [1, 6, 3, 2]
        type: string
        deprecated:
          reason: uncategorized
          note: Use `user.roles` instead.
        stability: development
        brief: "Deprecated, use `user.roles` instead."
        examples: 'admin'
      - id: enduser.scope
        annotations:
          traffic-generator:
            values: ["read:message, write:files", "read:message", "write:files", "read:profile"]
            weights: [2, 4, 2, 3]
        type: string
        deprecated:
          reason: obsoleted
          note: Removed, no replacement at this time.
        stability: development
        brief: "Deprecated, no replacement at this time."
        examples: 'read:message, write:files'
