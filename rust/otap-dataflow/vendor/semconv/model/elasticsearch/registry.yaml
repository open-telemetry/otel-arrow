groups:
  - id: registry.elasticsearch
    type: attribute_group
    display_name: Elasticsearch Attributes
    brief: >
      This section defines attributes for Elasticsearch.
    attributes:
      - id: elasticsearch.node.name
        annotations:
          traffic-generator:
            values: [instance-0000000001, instance-0000000002, instance-0000000003]
            weights: [4, 3, 3]
        type: string
        stability: development
        brief: >
          Represents the human-readable identifier of the node/instance to which a request was routed.
        examples: ["instance-0000000001"]
