groups:
  - id: registry.user
    type: attribute_group
    display_name: User Attributes
    brief: "Describes information about the user."
    attributes:
      - id: user.email
        annotations:
          traffic-generator:
            values: [a.einstein@example.com, m.curie@example.com, i.newton@example.com, a.lovelace@example.com]
        type: string
        stability: development
        brief: >
          User email address.
        examples: ['a.einstein@example.com']
      - id: user.full_name
        annotations:
          traffic-generator:
            values: ["Albert Einstein", "Marie Curie", "Isaac Newton", "Ada Lovelace"]
        type: string
        stability: development
        brief: >
          User's full name
        examples: ['Albert Einstein']
      - id: user.hash
        annotations:
          traffic-generator:
            values: ["364fc68eaf4c8acec74a4e52d7d1feaa", "5d41402abc4b2a76b9719d911017c592", "098f6bcd4621d373cade4e832627b4f6", "e10adc3949ba59abbe56e057f20f883e"]
        type: string
        stability: development
        brief: >
          Unique user hash to correlate information for a user in anonymized form.
        note: >
          Useful if `user.id` or `user.name` contain confidential information and cannot be used.
        examples: ['364fc68eaf4c8acec74a4e52d7d1feaa']
      - id: user.id
        annotations:
          traffic-generator:
            values: ["S-1-5-21-202424912787-2692429404-2351956786-1000", "S-1-5-21-202424912787-2692429404-2351956786-1001", "1000", "u_8f3a2b"]
        type: string
        stability: development
        brief: >
          Unique identifier of the user.
        examples: ['S-1-5-21-202424912787-2692429404-2351956786-1000']
      - id: user.name
        annotations:
          traffic-generator:
            values: [a.einstein, m.curie, i.newton, a.lovelace, root]
            weights: [3, 3, 2, 2, 1]
        type: string
        stability: development
        brief: >
          Short name or login/username of the user.
        examples: ['a.einstein']
      - id: user.roles
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 3 } }
            items:
              values: [user, reporting_user, editor, admin]
              weights: [6, 2, 2, 1]
        type: string[]
        stability: development
        brief: >
          Array of user roles at the time of the event.
        examples:
          - [admin, reporting_user]
