groups:
  - id: registry.container.deprecated
    type: attribute_group
    display_name: Deprecated Container Attributes
    brief: "Describes deprecated container attributes."
    attributes:
      - id: container.labels
        annotations:
          traffic-generator:
            keys: { values: [app, version, maintainer, environment], weights: [4, 3, 1, 2] }
            value: { values: [nginx, "1.0.0", ops-team, production] }
        type: template[string]
        examples: [ 'nginx' ]
        brief: "Deprecated, use `container.label` instead."
        stability: development
        deprecated:
          reason: renamed
          renamed_to: container.label
      - id: container.cpu.state
        brief: "Deprecated, use `cpu.mode` instead."
        annotations:
          traffic-generator:
            values: [user, system, kernel]
            weights: [6, 1, 3]
        type:
          members:
            - id: user
              value: 'user'
              brief: "When tasks of the cgroup are in user mode (Linux). When all container processes are in user mode (Windows)."
              stability: development
            - id: system
              value: 'system'
              brief: "When CPU is used by the system (host OS)"
              stability: development
            - id: kernel
              value: 'kernel'
              brief: "When tasks of the cgroup are in kernel mode (Linux). When all container processes are in kernel mode (Windows)."
              stability: development
        stability: development
        deprecated:
          reason: renamed
          renamed_to: cpu.mode
        examples: [ "user", "kernel" ]
      - id: container.runtime
        annotations:
          traffic-generator:
            values: [docker, containerd, cri-o, rkt]
            weights: [4, 5, 2, 1]
        type: string
        stability: development
        deprecated:
          reason: renamed
          renamed_to: container.runtime.name
        brief: >
          The container runtime managing this container.
        examples: ['docker', 'containerd', 'rkt']
