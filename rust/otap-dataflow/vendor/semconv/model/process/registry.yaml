groups:
  - id: registry.process
    type: attribute_group
    display_name: Process Attributes
    brief: >
        An operating system process.
    attributes:
      - id: process.pid
        annotations:
          traffic-generator:
            range: { min: 1, max: 4194304 }
        type: int
        stability: release_candidate
        brief: >
          Process identifier (PID).
        examples: [1234]
      - id: process.parent_pid
        annotations:
          traffic-generator:
            range: { min: 1, max: 4194304 }
            distribution: { type: zipf, exponent: 1.1 }
        type: int
        stability: release_candidate
        brief: >
          Parent Process identifier (PPID).
        examples: [111]
      - id: process.vpid
        annotations:
          traffic-generator:
            range: { min: 1, max: 1000 }
            distribution: { type: zipf, exponent: 1.3 }
        type: int
        stability: release_candidate
        brief: >
          Virtual process identifier.
        note: >
          The process ID within a PID namespace. This is not necessarily unique
          across all processes on the host but it is unique within the process
          namespace that the process exists within.
        examples: [12]
      - id: process.session_leader.pid
        annotations:
          traffic-generator:
            range: { min: 1, max: 4194304 }
        type: int
        stability: release_candidate
        brief: >
          The PID of the process's session leader. This is also the session ID
          (SID) of the process.
        examples: [14]
      - id: process.group_leader.pid
        annotations:
          traffic-generator:
            range: { min: 1, max: 4194304 }
        type: int
        stability: release_candidate
        brief: >
          The PID of the process's group leader. This is also the process group
          ID (PGID) of the process.
        examples: [23]
      - id: process.executable.build_id.gnu
        annotations:
          traffic-generator:
            values: [c89b11207f6479603b0d49bf291c092c2b719293, 3f8a1c2e9d4b7a6f5e0c1d2b3a4f5e6d7c8b9a01, a1b2c3d4e5f60718293a4b5c6d7e8f9012345678]
        stability: release_candidate
        type: string
        brief: >
          The GNU build ID as found in the `.note.gnu.build-id` ELF section (hex string).
        examples: ['c89b11207f6479603b0d49bf291c092c2b719293']
      - id: process.executable.build_id.go
        annotations:
          traffic-generator:
            values: [foh3mEXu7BLZjsN9pOwG/kATcXlYVCDEFouRMQed_/WwRFB1hPo9LBkekthSPG/x8hMC8emW2cCjXD0_1aY, Qm7aZ2kL9xVt3PbN1cRw/Hs5dJ8fGq0YeU4iO6pTn/Lk2mB9vC7xZ1aS3dF5gH/Wr4tY6uI8oP0aS2dF4gH]
        stability: release_candidate
        type: string
        brief: >
          The Go build ID as retrieved by `go tool buildid <go executable>`.
        examples: ['foh3mEXu7BLZjsN9pOwG/kATcXlYVCDEFouRMQed_/WwRFB1hPo9LBkekthSPG/x8hMC8emW2cCjXD0_1aY']
      - id: process.executable.build_id.htlhash
        annotations:
          traffic-generator:
            values: [600DCAFE4A110000F2BF38C493F5FB92, 9F2C4B7A1E3D5C8B0A6F4E2D1C3B5A79, 1A2B3C4D5E6F708192A3B4C5D6E7F801]
        stability: release_candidate
        type: string
        brief: >
          Deterministic build ID for executables.
        note: |
          GNU and Go build IDs may be stripped or unavailable in some environments
          (e.g., Alpine Linux, Docker images). This attribute provides a deterministic
          build ID computed by hashing the first and last 4096 bytes of the file
          along with its length:

          ```
          Input   ← Concat(File[:4096], File[-4096:], BigEndianUInt64(Len(File)))
          Digest  ← SHA256(Input)
          BuildID ← Digest[:16]
          ```

          The result is the first 16 bytes (128 bits) of the SHA256 digest,
          represented as a hex string.
        examples: ['600DCAFE4A110000F2BF38C493F5FB92']
      - id: process.executable.name
        annotations:
          traffic-generator:
            values: [otelcol, java, python3, node, nginx, bash, dotnet]
            weights: [2, 4, 3, 3, 2, 2, 1]
        type: string
        stability: release_candidate
        brief: >
          The name of the process executable. On Linux based systems, this SHOULD be
          set to the base name of the target of `/proc/[pid]/exe`. On Windows,
          this SHOULD be set to the base name of `GetProcessImageFileNameW`.
        examples: ['otelcol']
      - id: process.executable.path
        annotations:
          traffic-generator:
            values: [/usr/bin/cmd/otelcol, /usr/bin/java, /usr/bin/python3, /usr/local/bin/node, /usr/sbin/nginx, /bin/bash, 'C:\Program Files\dotnet\dotnet.exe']
            weights: [2, 4, 3, 3, 2, 2, 1]
        type: string
        stability: release_candidate
        brief: >
          The full path to the process executable. On Linux based systems, can
          be set to the target of `proc/[pid]/exe`. On Windows, can be set to the
          result of `GetProcessImageFileNameW`.
        examples: ['/usr/bin/cmd/otelcol']
      - id: process.command
        annotations:
          traffic-generator:
            values: [cmd/otelcol, java, python3, node, nginx, bash]
            weights: [2, 4, 3, 3, 2, 2]
        type: string
        stability: release_candidate
        brief: >
          The command used to launch the process (i.e. the command name). On Linux
          based systems, can be set to the zeroth string in `proc/[pid]/cmdline`.
          On Windows, can be set to the first parameter extracted from `GetCommandLineW`.
        examples: ['cmd/otelcol']
      - id: process.command_line
        annotations:
          traffic-generator:
            values:
              - 'C:\cmd\otecol --config="my directory\config.yaml"'
              - "java -Xmx2g -jar /opt/app/service.jar"
              - "python3 -m http.server 8080"
              - "node /srv/app/server.js"
              - "nginx -g daemon off;"
            weights: [1, 4, 2, 3, 2]
        type: string
        stability: release_candidate
        brief: >
          The full command used to launch the process as a single string representing
          the full command. On Windows, can be set to the result of `GetCommandLineW`.
          Do not set this if you have to assemble it just for monitoring; use
          `process.command_args` instead.
          SHOULD NOT be collected by default unless there is sanitization that excludes sensitive data.
        examples: ['C:\cmd\otecol --config="my directory\config.yaml"']
      - id: process.command_args
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 6 } }
            items:
              values: [cmd/otecol, --config=config.yaml, java, -jar, /opt/app/service.jar, -v, run, --port=8080]
              weights: [2, 3, 2, 2, 2, 2, 2, 1]
        type: string[]
        stability: release_candidate
        brief: >
          All the command arguments (including the command/executable itself) as
          received by the process. On Linux-based systems (and some other Unixoid
          systems supporting procfs), can be set according to the list of
          null-delimited strings extracted from `proc/[pid]/cmdline`. For libc-based
          executables, this would be the full argv vector passed to `main`.
          SHOULD NOT be collected by default unless there is sanitization that excludes sensitive data.
        examples:
          - ['cmd/otecol', '--config=config.yaml']
      - id: process.args_count
        annotations:
          traffic-generator:
            range: { min: 1, max: 32 }
            distribution: { type: zipf, exponent: 1.3 }
        type: int
        stability: release_candidate
        brief: >
          Length of the process.command_args array
        note: >
          This field can be useful for querying or performing bucket analysis on how many
          arguments were provided to start a process. More arguments may be an indication
          of suspicious activity.
        examples: [4]
      - id: process.owner
        annotations:
          traffic-generator:
            values: [root, www-data, operator, ubuntu, nobody]
            weights: [5, 2, 2, 2, 1]
        type: string
        stability: release_candidate
        brief: >
          The username of the user that owns the process.
        examples: ['root']
      - id: process.user.id
        annotations:
          traffic-generator:
            values: [0, 33, 1000, 1001, 1002, 65534]
            weights: [5, 1, 3, 2, 1, 1]
        type: int
        stability: release_candidate
        brief: >
          The effective user ID (EUID) of the process.
        examples: [1001]
      - id: process.user.name
        annotations:
          traffic-generator:
            values: [root, www-data, operator, ubuntu, nobody]
            weights: [5, 2, 2, 2, 1]
        type: string
        stability: release_candidate
        brief: >
          The username of the effective user of the process.
        examples: ['root']
      - id: process.real_user.id
        annotations:
          traffic-generator:
            values: [0, 33, 1000, 1001, 1002, 65534]
            weights: [5, 1, 3, 2, 1, 1]
        type: int
        stability: release_candidate
        brief: >
          The real user ID (RUID) of the process.
        examples: [1000]
      - id: process.real_user.name
        annotations:
          traffic-generator:
            values: [root, operator, ubuntu, www-data]
            weights: [4, 3, 2, 1]
        type: string
        stability: release_candidate
        brief: >
          The username of the real user of the process.
        examples: ['operator']
      - id: process.saved_user.id
        annotations:
          traffic-generator:
            values: [0, 1000, 1001, 1002]
            weights: [5, 3, 2, 1]
        type: int
        stability: release_candidate
        brief: >
          The saved user ID (SUID) of the process.
        examples: [1002]
      - id: process.saved_user.name
        annotations:
          traffic-generator:
            values: [root, operator, ubuntu]
            weights: [5, 3, 2]
        type: string
        stability: release_candidate
        brief: >
          The username of the saved user.
        examples: ['operator']
      - id: process.runtime.name
        annotations:
          traffic-generator:
            values: [OpenJDK Runtime Environment, CPython, node, .NET, go]
            weights: [4, 3, 3, 2, 2]
        type: string
        stability: release_candidate
        brief: >
          The name of the runtime of this process.
        examples: ['OpenJDK Runtime Environment']
      - id: process.runtime.version
        annotations:
          traffic-generator:
            values: ["14.0.2", "17.0.9+9", "21.0.1", "3.12.1", "20.10.0", "8.0.0", "go1.22.3"]
            weights: [1, 3, 3, 3, 2, 2, 2]
        type: string
        stability: release_candidate
        brief: >
          The version of the runtime of this process, as returned by the runtime
          without modification.
        examples: '14.0.2'
      - id: process.runtime.description
        annotations:
          traffic-generator:
            values: [Eclipse OpenJ9 Eclipse OpenJ9 VM openj9-0.21.0, OpenJDK 64-Bit Server VM 17.0.9+9, Eclipse Temurin 21.0.1+12, "CPython 3.12.1 (main, Dec  8 2023)"]
            weights: [1, 4, 3, 2]
        type: string
        stability: release_candidate
        brief: >
          An additional description about the runtime of the process, for example
          a specific vendor customization of the runtime environment.
        examples: 'Eclipse OpenJ9 Eclipse OpenJ9 VM openj9-0.21.0'
      - id: process.title
        annotations:
          traffic-generator:
            values: [cat /etc/hostname, xfce4-session, bash, "nginx: worker process", "postgres: checkpointer"]
            weights: [1, 1, 4, 3, 2]
        type: string
        stability: release_candidate
        brief: >
          Process title (proctitle)
        note: >
          In many Unix-like systems, process title (proctitle), is the string
          that represents the name or command line of a running process,
          displayed by system monitoring tools like ps, top, and htop.
        examples: ["cat /etc/hostname", "xfce4-session", "bash"]
      - id: process.creation.time
        annotations:
          traffic-generator:
            values: ["2023-11-21T09:25:34.853Z", "2026-11-10T22:01:07.120Z", "2026-11-11T08:00:00.000Z"]
        type: string
        stability: release_candidate
        brief: >
          The date and time the process was created, in ISO 8601 format.
        examples: ['2023-11-21T09:25:34.853Z']
      - id: process.exit.time
        annotations:
          traffic-generator:
            values: ["2023-11-21T09:26:12.315Z", "2026-11-10T22:05:44.902Z", "2026-11-11T08:00:03.517Z"]
        type: string
        stability: release_candidate
        brief: >
          The date and time the process exited, in ISO 8601 format.
        examples: ['2023-11-21T09:26:12.315Z']
      - id: process.exit.code
        annotations:
          traffic-generator:
            values: [0, 1, 2, 127, 130, 137, 143]
            weights: [85, 6, 2, 2, 1, 2, 2]
        type: int
        stability: release_candidate
        brief: >
          The exit code of the process.
        examples: [127]
      - id: process.interactive
        annotations:
          traffic-generator:
            values: [true, false]
            weights: [1, 9]
        type: boolean
        stability: release_candidate
        brief: >
          Whether the process is connected to an interactive shell.
      - id: process.working_directory
        annotations:
          traffic-generator:
            values: [/root, /, /home/ubuntu, /opt/app, /srv/app]
            weights: [2, 3, 2, 3, 2]
        type: string
        stability: release_candidate
        brief: >
          The working directory of the process.
        examples: ["/root"]
      - id: process.context_switch.type
        annotations:
          traffic-generator:
            values: [voluntary, involuntary]
            weights: [8, 2]
        brief: "Specifies whether the context switches for this data point were voluntary or involuntary."
        type:
          members:
            - id: voluntary
              value: 'voluntary'
              stability: release_candidate
            - id: involuntary
              value: 'involuntary'
              stability: release_candidate
        stability: release_candidate
      - id: process.environment_variable
        annotations:
          traffic-generator:
            keys: { values: [USER, PATH, HOME, LANG, SHELL], weights: [3, 4, 2, 1, 1] }
            value: { values: [ubuntu, "/usr/local/bin:/usr/bin", /home/ubuntu, en_US.UTF-8, /bin/bash] }
        brief: >
          Process environment variables, `<key>` being the environment variable
          name, the value being the environment variable value.
        note: |
          Examples:

          - an environment variable `USER` with value `"ubuntu"` SHOULD be recorded
          as the `process.environment_variable.USER` attribute with value `"ubuntu"`.

          - an environment variable `PATH` with value `"/usr/local/bin:/usr/bin"`
          SHOULD be recorded as the `process.environment_variable.PATH` attribute
          with value `"/usr/local/bin:/usr/bin"`.

        type: template[string]
        stability: release_candidate
        examples: ['ubuntu', '/usr/local/bin:/usr/bin']
      - id: process.state
        annotations:
          traffic-generator:
            values: [running, sleeping, stopped, defunct]
            weights: [15, 82, 2, 1]
        type:
          members:
            - id: running
              value: 'running'
              stability: release_candidate
            - id: sleeping
              value: 'sleeping'
              stability: release_candidate
            - id: stopped
              value: 'stopped'
              stability: release_candidate
            - id: defunct
              value: 'defunct'
              stability: release_candidate
        stability: release_candidate
        brief: >
          The process state, e.g., [Linux Process State Codes](https://man7.org/linux/man-pages/man1/ps.1.html#PROCESS_STATE_CODES)
        examples: [ "running" ]
  # process.linux* attribute group
  - id: registry.process.linux
    type: attribute_group
    brief: "Describes Linux Process attributes"
    attributes:
      - id: process.linux.cgroup
        annotations:
          traffic-generator:
            values:
              - "1:name=systemd:/user.slice/user-1000.slice/session-3.scope"
              - "0::/user.slice/user-1000.slice/user@1000.service/tmux-spawn-0267755b-4639-4a27-90ed-f19f88e53748.scope"
              - "0::/system.slice/nginx.service"
              - "0::/kubepods.slice/kubepods-burstable.slice/cri-containerd-3f2a.scope"
            weights: [2, 1, 3, 4]
        type: string
        stability: release_candidate
        brief: The control group associated with the process.
        examples: ["1:name=systemd:/user.slice/user-1000.slice/session-3.scope", "0::/user.slice/user-1000.slice/user@1000.service/tmux-spawn-0267755b-4639-4a27-90ed-f19f88e53748.scope"]
        note: >
          Control groups (cgroups) are a kernel feature used to organize and
          manage process resources. This attribute provides the path(s) to the
          cgroup(s) associated with the process, which should match the contents
          of the
          [/proc/\[PID\]/cgroup](https://man7.org/linux/man-pages/man7/cgroups.7.html)
          file.
