groups:
  - id: registry.network.deprecated
    type: attribute_group
    display_name: Deprecated Network Attributes
    brief: >
        These attributes may be used for any network related operation.
    attributes:
      - id: net.sock.peer.name
        type: string
        annotations:
          traffic-generator:
            values: [/var/my.sock, /tmp/my.sock, /run/docker.sock]
        deprecated:
          reason: obsoleted
          note: "Removed. No replacement at this time."
        stability: development
        brief: Deprecated, no replacement at this time.
        examples: ['/var/my.sock']
      - id: net.sock.peer.addr
        type: string
        annotations:
          traffic-generator:
            values: ["192.168.0.1", "10.0.3.17", "172.17.0.3", "2001:db8::10"]
        deprecated:
          reason: renamed
          renamed_to: network.peer.address
        stability: development
        brief: Deprecated, use `network.peer.address`.
        examples: ['192.168.0.1']
      - id: net.sock.peer.port
        type: int
        annotations:
          traffic-generator:
            range: { min: 1024, max: 65535 }
        deprecated:
          reason: renamed
          renamed_to: network.peer.port
        stability: development
        examples: [65531]
        brief: Deprecated, use `network.peer.port`.
      - id: net.peer.name
        type: string
        annotations:
          traffic-generator:
            values: [example.com, api.example.com, db.internal, cache.internal]
        deprecated:
          reason: uncategorized
          note: Replaced by `server.address` on client spans and `client.address` on server spans.
        stability: development
        brief: Deprecated, use `server.address` on client spans and `client.address` on server spans.
        examples: ['example.com']
      - id: net.peer.port
        type: int
        annotations:
          traffic-generator:
            values: [443, 80, 8080, 5432, 6379]
            weights: [40, 15, 20, 15, 10]
        deprecated:
          reason: uncategorized
          note: Replaced by `server.port` on client spans and `client.port` on server spans.
        stability: development
        brief: Deprecated, use `server.port` on client spans and `client.port` on server spans.
        examples: [8080]
      - id: net.peer.ip
        type: string
        annotations:
          traffic-generator:
            values: ["127.0.0.1", "10.0.3.17", "192.168.1.25", "2001:db8::10"]
        deprecated:
          reason: renamed
          renamed_to: network.peer.address
        stability: development
        brief: Deprecated, use `network.peer.address`.
        examples: '127.0.0.1'
      - id: net.host.name
        type: string
        annotations:
          traffic-generator:
            values: [example.com, localhost, web-01.example.com, api.example.com]
        deprecated:
          reason: renamed
          renamed_to: server.address
        stability: development
        brief: Deprecated, use `server.address`.
        examples: ['example.com']
      - id: net.host.ip
        type: string
        annotations:
          traffic-generator:
            values: ["192.168.0.1", "10.1.2.80", "172.17.0.2", "::1"]
        deprecated:
          reason: renamed
          renamed_to: network.local.address
        stability: development
        brief: Deprecated, use `network.local.address`.
        examples: '192.168.0.1'
      - id: net.host.port
        type: int
        annotations:
          traffic-generator:
            values: [8080, 443, 80, 8443, 3000]
            weights: [30, 30, 20, 10, 10]
        deprecated:
          reason: renamed
          renamed_to: server.port
        stability: development
        brief: Deprecated, use `server.port`.
        examples: [8080]
      - id: net.sock.host.addr
        type: string
        annotations:
          traffic-generator:
            values: [/var/my.sock, "10.1.2.80", "192.168.0.15", "172.17.0.2"]
        deprecated:
          reason: renamed
          renamed_to: network.local.address
        stability: development
        brief: Deprecated, use `network.local.address`.
        examples: ['/var/my.sock']
      - id: net.sock.host.port
        type: int
        annotations:
          traffic-generator:
            values: [8080, 443, 80, 8443, 3000]
            weights: [30, 30, 20, 10, 10]
        deprecated:
          reason: renamed
          renamed_to: network.local.port
        stability: development
        brief: Deprecated, use `network.local.port`.
        examples: [8080]
      - id: net.transport
        annotations:
          traffic-generator:
            values: [ip_tcp, ip_udp, pipe, inproc, other]
            weights: [80, 10, 3, 5, 2]
        type:
          members:
            - id: ip_tcp
              value: "ip_tcp"
              stability: development
            - id: ip_udp
              value: "ip_udp"
              stability: development
            - id: pipe
              value: "pipe"
              brief: 'Named or anonymous pipe.'
              stability: development
            - id: inproc
              value: "inproc"
              brief: 'In-process communication.'
              stability: development
              note: >
                Signals that there is only in-process communication not using a "real" network protocol
                in cases where network attributes would normally be expected. Usually all other network
                attributes can be left out in that case.
            - id: other
              value: "other"
              stability: development
              brief: 'Something else (non IP-based).'
        deprecated:
          reason: renamed
          renamed_to: network.transport
        stability: development
        brief: Deprecated, use `network.transport`.
      - id: net.protocol.name
        type: string
        annotations:
          traffic-generator:
            values: [http, amqp, mqtt]
            weights: [8, 1, 1]
        deprecated:
          reason: renamed
          renamed_to: network.protocol.name
        stability: development
        brief: Deprecated, use `network.protocol.name`.
        examples: ['amqp', 'http', 'mqtt']
      - id: net.protocol.version
        type: string
        annotations:
          traffic-generator:
            values: ["3.1.1", "1.1", "2", "5.0"]
            weights: [2, 5, 3, 1]
        deprecated:
          reason: renamed
          renamed_to: network.protocol.version
        stability: development
        brief: Deprecated, use `network.protocol.version`.
        examples: '3.1.1'
      - id: net.sock.family
        annotations:
          traffic-generator:
            values: [inet, inet6, unix]
            weights: [75, 15, 10]
        type:
          members:
            - id: inet
              value: 'inet'
              brief: "IPv4 address"
              stability: development
            - id: inet6
              value: 'inet6'
              brief: "IPv6 address"
              stability: development
            - id: unix
              value: 'unix'
              brief: "UNIX domain socket path"
              stability: development
        deprecated:
          reason: uncategorized
          note: Split to `network.transport` and `network.type`.
        stability: development
        brief: Deprecated, use `network.transport` and `network.type`.
