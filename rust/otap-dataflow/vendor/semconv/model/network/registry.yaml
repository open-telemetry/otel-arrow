groups:
  - id: registry.network
    type: attribute_group
    display_name: Network Attributes
    brief: >
        These attributes may be used for any network related operation.
    attributes:
      - id: network.carrier.icc
        type: string
        annotations:
          traffic-generator:
            values: [DE, US, GB, FR, JP, IN, BR]
            weights: [2, 5, 2, 2, 2, 3, 2]
        stability: development
        brief: "The ISO 3166-1 alpha-2 2-character country code associated with the mobile carrier network."
        examples: "DE"
      - id: network.carrier.mcc
        type: string
        annotations:
          traffic-generator:
            values: ["310", "311", "262", "234", "208", "440", "404"]
            weights: [4, 2, 2, 2, 2, 2, 3]
        stability: development
        brief: "The mobile carrier country code."
        examples: "310"
      - id: network.carrier.mnc
        type: string
        annotations:
          traffic-generator:
            values: ["001", "260", "410", "01", "02", "10", "20"]
        stability: development
        brief: "The mobile carrier network code."
        examples: "001"
      - id: network.carrier.name
        type: string
        annotations:
          traffic-generator:
            values: [sprint, verizon, t-mobile, at&t, vodafone, orange]
            weights: [1, 4, 3, 3, 2, 2]
        stability: development
        brief: "The name of the mobile carrier."
        examples: "sprint"
      - id: network.connection.subtype
        annotations:
          traffic-generator:
            values: [lte, nr, nrnsa, lte_ca, hspap, hspa, umts, hsdpa, hsupa, edge, gprs, gsm, iwlan, cdma, evdo_0, evdo_a, evdo_b, cdma2000_1xrtt, iden, ehrpd, td_scdma]
            weights: [40, 15, 12, 8, 4, 3, 2, 2, 1, 2, 1, 1, 3, 0.5, 0.2, 0.5, 0.2, 0.3, 0.1, 0.3, 0.3]
        type:
          members:
            - id: gprs
              brief: GPRS
              value: "gprs"
              stability: development
            - id: edge
              brief: EDGE
              value: "edge"
              stability: development
            - id: umts
              brief: UMTS
              value: "umts"
              stability: development
            - id: cdma
              brief: CDMA
              value: "cdma"
              stability: development
            - id: evdo_0
              brief: EVDO Rel. 0
              value: "evdo_0"
              stability: development
            - id: evdo_a
              brief: "EVDO Rev. A"
              value: "evdo_a"
              stability: development
            - id: cdma2000_1xrtt
              brief: CDMA2000 1XRTT
              value: "cdma2000_1xrtt"
              stability: development
            - id: hsdpa
              brief: HSDPA
              value: "hsdpa"
              stability: development
            - id: hsupa
              brief: HSUPA
              value: "hsupa"
              stability: development
            - id: hspa
              brief: HSPA
              value: "hspa"
              stability: development
            - id: iden
              brief: IDEN
              value: "iden"
              stability: development
            - id: evdo_b
              brief: "EVDO Rev. B"
              value: "evdo_b"
              stability: development
            - id: lte
              brief: LTE
              value: "lte"
              stability: development
            - id: ehrpd
              brief: EHRPD
              value: "ehrpd"
              stability: development
            - id: hspap
              brief: HSPAP
              value: "hspap"
              stability: development
            - id: gsm
              brief: GSM
              value: "gsm"
              stability: development
            - id: td_scdma
              brief: TD-SCDMA
              value: "td_scdma"
              stability: development
            - id: iwlan
              brief: IWLAN
              value: "iwlan"
              stability: development
            - id: nr
              brief: "5G NR (New Radio)"
              value: "nr"
              stability: development
            - id: nrnsa
              brief: "5G NRNSA (New Radio Non-Standalone)"
              value: "nrnsa"
              stability: development
            - id: lte_ca
              brief: LTE CA
              value: "lte_ca"
              stability: development
        stability: development
        brief: 'This describes more details regarding the connection.type. It may be the type of cell technology connection, but it could be used for describing details about a Wi-Fi connection.'
        examples: 'LTE'
      - id: network.connection.type
        annotations:
          traffic-generator:
            values: [wifi, wired, cell, unavailable, unknown]
            weights: [45, 25, 25, 3, 2]
        type:
          members:
            - id: wifi
              value: "wifi"
              brief: 'Wi-Fi'
              stability: development
            - id: wired
              value: "wired"
              stability: development
            - id: cell
              value: "cell"
              stability: development
            - id: unavailable
              value: "unavailable"
              stability: development
            - id: unknown
              value: "unknown"
              stability: development
        stability: development
        brief: 'The internet connection type.'
        examples: 'wifi'
      - id: network.local.address
        stability: stable
        type: string
        annotations:
          traffic-generator:
            values: ["10.1.2.80", "/tmp/my.sock", "192.168.0.15", "172.17.0.2", "::1", "127.0.0.1"]
            weights: [4, 1, 3, 3, 1, 2]
        brief: Local address of the network connection - IP address or UNIX domain socket name.
        examples: ['10.1.2.80', '/tmp/my.sock']
      - id: network.local.port
        stability: stable
        type: int
        annotations:
          traffic-generator:
            range: { min: 32768, max: 65535 }
        brief: Local port number of the network connection.
        examples: [65123]
      - id: network.peer.address
        stability: stable
        type: string
        annotations:
          traffic-generator:
            values: ["10.1.2.80", "/tmp/my.sock", "10.0.3.17", "192.168.1.25", "2001:db8::10", "52.94.236.248"]
            weights: [4, 1, 3, 3, 1, 2]
        brief: Peer address of the network connection - IP address or UNIX domain socket name.
        examples: ['10.1.2.80', '/tmp/my.sock']
      - id: network.peer.port
        stability: stable
        type: int
        annotations:
          traffic-generator:
            values: [443, 80, 8080, 5432, 3306, 6379, 9092, 4317, 65123]
            weights: [30, 10, 10, 8, 6, 8, 5, 5, 2]
        brief: Peer port number of the network connection.
        examples: [65123]
      - id: network.protocol.name
        stability: stable
        type: string
        annotations:
          traffic-generator:
            values: [http, amqp, mqtt, grpc, kafka]
            weights: [70, 8, 5, 12, 5]
        brief: '[OSI application layer](https://wikipedia.org/wiki/Application_layer) or non-OSI equivalent.'
        note: The value SHOULD be normalized to lowercase.
        examples: ['amqp', 'http', 'mqtt']
      - id: network.protocol.version
        stability: stable
        type: string
        annotations:
          traffic-generator:
            values: ["1.1", "2", "3", "1.0"]
            weights: [50, 40, 8, 2]
        brief: The actual version of the protocol used for network communication.
        examples: ['1.1', '2']
        note: >
          If protocol version is subject to negotiation (for example using [ALPN](https://www.rfc-editor.org/rfc/rfc7301.html)),
          this attribute SHOULD be set to the negotiated version. If the actual protocol version is not known,
          this attribute SHOULD NOT be set.
      - id: network.transport
        stability: stable
        annotations:
          traffic-generator:
            values: [tcp, udp, unix, pipe, quic]
            weights: [80, 10, 5, 2, 3]
        type:
          members:
            - id: tcp
              value: 'tcp'
              brief: "TCP"
              stability: stable
            - id: udp
              value: 'udp'
              brief: "UDP"
              stability: stable
            - id: pipe
              value: "pipe"
              brief: 'Named or anonymous pipe.'
              stability: stable
            - id: unix
              value: 'unix'
              brief: "UNIX domain socket"
              stability: stable
            - id: quic
              value: 'quic'
              brief: "QUIC"
              stability: stable
        brief: >
          [OSI transport layer](https://wikipedia.org/wiki/Transport_layer) or
          [inter-process communication method](https://wikipedia.org/wiki/Inter-process_communication).
        note: |
          The value SHOULD be normalized to lowercase.

          Consider always setting the transport when setting a port number, since
          a port number is ambiguous without knowing the transport. For example
          different processes could be listening on TCP port 12345 and UDP port 12345.
        examples: ['tcp', 'udp']
      - id: network.type
        stability: stable
        annotations:
          traffic-generator:
            weights: [80, 20]
        type:
          members:
            - id: ipv4
              value: 'ipv4'
              brief: "IPv4"
              stability: stable
            - id: ipv6
              value: 'ipv6'
              brief: "IPv6"
              stability: stable
        brief: '[OSI network layer](https://wikipedia.org/wiki/Network_layer) or non-OSI equivalent.'
        note: The value SHOULD be normalized to lowercase.
        examples: ['ipv4', 'ipv6']
      - id: network.io.direction
        annotations:
          traffic-generator:
            values: [transmit, receive]
        type:
          members:
            - id: transmit
              value: 'transmit'
              stability: release_candidate
            - id: receive
              value: 'receive'
              stability: release_candidate
        stability: release_candidate
        brief: >
          The direction of traffic from the perspective of the observing host's physical or virtual network interface.
          It should not be used to represent the logical direction of a stateful connection or network flow.
        examples: ["transmit"]
      - id: network.interface.name
        type: string
        annotations:
          traffic-generator:
            values: [lo, eth0, eth1, ens5, wlan0, docker0]
            weights: [2, 6, 2, 3, 1, 1]
        brief: 'The network interface name.'
        examples: [ 'lo', 'eth0' ]
        stability: release_candidate
      - id: network.connection.state
        annotations:
          traffic-generator:
            values: [established, time_wait, listen, close_wait, syn_sent, syn_received, fin_wait_1, fin_wait_2, last_ack, closing, closed]
            weights: [50, 15, 10, 8, 3, 2, 3, 4, 2, 1, 2]
        type:
          members:
            - id: closed
              value: 'closed'
              stability: development
            - id: close_wait
              value: 'close_wait'
              stability: development
            - id: closing
              value: 'closing'
              stability: development
            - id: established
              value: 'established'
              stability: development
            - id: fin_wait_1
              value: 'fin_wait_1'
              stability: development
            - id: fin_wait_2
              value: 'fin_wait_2'
              stability: development
            - id: last_ack
              value: 'last_ack'
              stability: development
            - id: listen
              value: 'listen'
              stability: development
            - id: syn_received
              value: 'syn_received'
              stability: development
            - id: syn_sent
              value: 'syn_sent'
              stability: development
            - id: time_wait
              value: 'time_wait'
              stability: development
        stability: development
        brief: "The state of network connection"
        note: "Connection states are defined as part of the [rfc9293](https://datatracker.ietf.org/doc/html/rfc9293#section-3.3.2)"
        examples: [ "close_wait" ]
