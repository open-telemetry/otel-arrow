groups:
  # General system attributes
  - id: registry.system
    type: attribute_group
    display_name: General System Attributes
    brief: "Describes System attributes"
    attributes:
      - id: system.device
        type: string
        annotations:
          traffic-generator:
            values: [sda, sda1, nvme0n1, nvme0n1p1, eth0, lo, dm-0]
            weights: [3, 2, 4, 3, 3, 1, 1]
        stability: development
        brief: "The device identifier"
        examples: ["(identifier)"]
  # system.memory.* attribute group
  - id: registry.system.memory
    type: attribute_group
    display_name: System Memory Attributes
    brief: "Describes System Memory attributes"
    attributes:
      - id: system.memory.state
        annotations:
          traffic-generator:
            values: [used, free, buffers, cached]
            weights: [35, 25, 10, 30]
        type:
          members:
            - id: used
              value: 'used'
              stability: development
              brief: Actual used virtual memory in bytes.
              note: >
                Calculation based on the operating system metrics.
                On Linux, this corresponds to "MemTotal - MemAvailable" from /proc/meminfo, which
                more accurately reflects memory in active use by applications compared to older
                formulas based on free, cached, and buffers. If MemAvailable is not available,
                a fallback to those older formulas may be used.
            - id: free
              value: 'free'
              stability: development
            - id: shared
              value: 'shared'
              stability: development
              deprecated:
                reason: uncategorized
                note: "Removed, report shared memory usage with `metric.system.memory.linux.shared` metric"
            - id: buffers
              value: 'buffers'
              stability: development
            - id: cached
              value: 'cached'
              stability: development
        stability: development
        brief: "The memory state"
        examples: ["free", "cached"]
      - id: system.memory.linux.slab.state
        annotations:
          traffic-generator:
            weights: [3, 2]
        type:
          members:
            - id: reclaimable
              value: 'reclaimable'
              stability: development
            - id: unreclaimable
              value: 'unreclaimable'
              stability: development
        stability: development
        brief: "The Linux Slab memory state"
        examples: ["reclaimable", "unreclaimable"]
      - id: system.memory.linux.hugepages.state
        annotations:
          traffic-generator:
            values: [free, used]
        type:
          members:
            - id: free
              value: 'free'
              stability: development
            - id: used
              value: 'used'
              stability: development
        stability: development
        brief: "The Linux HugePages memory state"
        examples: ["free", "used"]
  # system.paging.* attribute group
  - id: registry.system.paging
    type: attribute_group
    display_name: System Paging Attributes
    brief: "Describes System Memory Paging attributes"
    attributes:
      - id: system.paging.state
        annotations:
          traffic-generator:
            values: [used, free]
            weights: [3, 7]
        type:
          members:
            - id: used
              value: 'used'
              stability: development
            - id: free
              value: 'free'
              stability: development
        stability: development
        brief: "The memory paging state"
        examples: ["free"]
      - id: system.paging.fault.type
        annotations:
          traffic-generator:
            values: [minor, major]
            weights: [95, 5]
        type:
          members:
            - id: major
              value: 'major'
              stability: release_candidate
            - id: minor
              value: 'minor'
              stability: release_candidate
        stability: release_candidate
        brief: "The paging fault type"
        examples: ["minor"]
      - id: system.paging.direction
        annotations:
          traffic-generator:
            values: [in, out]
            weights: [6, 4]
        type:
          members:
            - id: in
              value: 'in'
              stability: development
            - id: out
              value: 'out'
              stability: development
        stability: development
        brief: "The paging access direction"
        examples: ["in"]
  - id: registry.system.filesystem
    type: attribute_group
    display_name: Filesystem Attributes
    brief: "Describes Filesystem attributes"
    attributes:
      - id: system.filesystem.state
        brief: "The filesystem state"
        annotations:
          traffic-generator:
            values: [used, free, reserved]
            weights: [45, 45, 10]
        type:
          members:
            - id: used
              value: 'used'
              stability: development
            - id: free
              value: 'free'
              stability: development
            - id: reserved
              value: 'reserved'
              stability: development
        stability: development
        examples: ["used"]
      - id: system.filesystem.type
        annotations:
          traffic-generator:
            values: [ext4, ntfs, refs, hfsplus, exfat, fat32]
            weights: [60, 20, 3, 5, 5, 7]
        type:
          members:
            - id: fat32
              value: 'fat32'
              stability: development
            - id: exfat
              value: 'exfat'
              stability: development
            - id: ntfs
              value: 'ntfs'
              stability: development
            - id: refs
              value: 'refs'
              stability: development
            - id: hfsplus
              value: 'hfsplus'
              stability: development
            - id: ext4
              value: 'ext4'
              stability: development
        stability: development
        brief: "The filesystem type"
        examples: ["ext4"]
      - id: system.filesystem.mode
        type: string
        annotations:
          traffic-generator:
            values: [rw, ro]
            weights: [9, 1]
        stability: development
        brief: "The filesystem mode"
        examples: ["rw, ro"]
      - id: system.filesystem.mountpoint
        type: string
        annotations:
          traffic-generator:
            values: [/, /mnt/data, /boot, /home, /var, /tmp]
            weights: [5, 2, 1, 2, 2, 1]
        stability: development
        brief: "The filesystem mount path"
        examples: ["/mnt/data"]
