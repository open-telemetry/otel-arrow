groups:
  # system.* metrics
  - id: metric.system.uptime
    type: metric
    metric_name: system.uptime
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 60.0, max: 31536000.0 }
          distribution: { type: lognormal, mean: 864000.0, stddev: 1728000.0 }
    stability: development
    brief: "The time the system has been running."
    note: |
      Instrumentations SHOULD use a gauge with type `double` and measure uptime in seconds as a floating point number with the highest precision available.
      The actual accuracy would depend on the instrumentation and operating system.
    instrument: gauge
    unit: "s"
    entity_associations:
      - host

  # system.cpu.* metrics
  - id: metric.system.cpu.physical.count
    type: metric
    metric_name: system.cpu.physical.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [2, 4, 8, 16, 32, 64], weights: [3, 5, 5, 3, 2, 1] }
    stability: development
    brief: "Reports the number of actual physical processor cores on the hardware."
    note: "Calculated by multiplying the number of sockets by the number of cores per socket"
    instrument: updowncounter
    unit: "{cpu}"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.cpu.logical.count
    type: metric
    metric_name: system.cpu.logical.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [2, 4, 8, 16, 32, 64, 128], weights: [2, 4, 5, 4, 3, 2, 1] }
    stability: development
    brief: "Reports the number of logical (virtual) processor cores created by the operating system to manage multitasking."
    note: "Calculated by multiplying the number of sockets by the number of cores per socket, and then by the number of threads per core"
    instrument: updowncounter
    unit: "{cpu}"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.cpu.time
    type: metric
    metric_name: system.cpu.time
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 60.0 }
          distribution: { type: lognormal, mean: 2.0, stddev: 4.0 }
        temporality: delta
    stability: development
    brief: "Seconds each logical CPU spent on each mode."
    instrument: counter
    unit: "s"
    attributes:
      - ref: cpu.mode
        note: "Following states SHOULD be used: `user`, `system`, `nice`, `idle`, `iowait`, `interrupt`, `steal`"
      - ref: cpu.logical_number
        requirement_level: opt_in
    entity_associations:
      - host

  - id: metric.system.cpu.utilization
    type: metric
    metric_name: system.cpu.utilization
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: normal, mean: 0.35, stddev: 0.25 }
    stability: development
    brief: "For each logical CPU, the utilization is calculated as the change in cumulative CPU time (cpu.time) over a measurement interval, divided by the elapsed time."
    instrument: gauge
    unit: "1"
    attributes:
      - ref: cpu.mode
        note: "Following modes SHOULD be used: `user`, `system`, `nice`, `idle`, `iowait`, `interrupt`, `steal`"
      - ref: cpu.logical_number
        requirement_level: opt_in
    entity_associations:
      - host

  - id: metric.system.cpu.frequency
    type: metric
    metric_name: system.cpu.frequency
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 800000000, max: 5500000000 }
          distribution: { type: normal, mean: 2800000000, stddev: 700000000 }
    stability: development
    brief: "Operating frequency of the logical CPU in Hertz."
    instrument: gauge
    unit: "Hz"
    attributes:
      - ref: cpu.logical_number
    entity_associations:
      - host

  # system.memory.* metrics
  - id: metric.system.memory.usage
    type: metric
    metric_name: system.memory.usage
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 10000000, max: 256000000000 }
          distribution: { type: lognormal, mean: 4000000000, stddev: 6000000000 }
    stability: development
    brief: "Reports memory in use by state."
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref: system.memory.state
    entity_associations:
      - host

  - id: metric.system.memory.limit
    type: metric
    metric_name: system.memory.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [4294967296, 8589934592, 17179869184, 34359738368, 68719476736, 137438953472], weights: [2, 4, 5, 4, 2, 1] }
    stability: development
    brief: "Total virtual memory available in the system."
    instrument: updowncounter
    unit: "By"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.memory.utilization
    type: metric
    metric_name: system.memory.utilization
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: normal, mean: 0.45, stddev: 0.2 }
    stability: development
    brief: Percentage of memory bytes in use.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: system.memory.state
    entity_associations:
      - host

  # system.paging.* metrics
  - id: metric.system.paging.usage
    type: metric
    metric_name: system.paging.usage
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 17179869184 }
          distribution: { type: lognormal, mean: 500000000, stddev: 1000000000 }
    stability: development
    brief: "UNIX swap or windows pagefile usage."
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref: system.paging.state
      - ref: system.device
        brief: Unique identifier for the device responsible for managing paging operations.
        examples: ["/dev/dm-0"]
    entity_associations:
      - host

  - id: metric.system.paging.utilization
    type: metric
    metric_name: system.paging.utilization
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: exponential, mean: 0.1 }
    stability: development
    brief: Swap (UNIX) or pagefile (windows) utilization.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: system.paging.state
      - ref: system.device
        brief: Unique identifier for the device responsible for managing paging operations.
        examples: ["/dev/dm-0"]
    entity_associations:
      - host

  - id: metric.system.paging.faults
    type: metric
    metric_name: system.paging.faults
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 100000 }
          distribution: { type: lognormal, mean: 2000, stddev: 5000 }
        temporality: delta
    stability: development
    brief: The number of page faults.
    instrument: counter
    unit: "{fault}"
    attributes:
      - ref: system.paging.fault.type
    entity_associations:
      - host

  - id: metric.system.paging.operations
    type: metric
    metric_name: system.paging.operations
    stability: development
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 10000 }
          distribution: { type: exponential, mean: 50 }
        temporality: delta
    brief: The number of paging operations.
    instrument: counter
    unit: "{operation}"
    attributes:
      - ref: system.paging.fault.type
      - ref: system.paging.direction
    entity_associations:
      - host

  # system.disk.* metrics
  - id: metric.system.disk.io
    type: metric
    metric_name: system.disk.io
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 2000000000 }
          distribution: { type: lognormal, mean: 20000000, stddev: 50000000 }
        temporality: delta
    stability: development
    brief: Disk bytes transferred.
    instrument: counter
    unit: "By"
    attributes:
      - ref: system.device
      - ref: disk.io.direction
    entity_associations:
      - host

  - id: metric.system.disk.operations
    type: metric
    metric_name: system.disk.operations
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 100000 }
          distribution: { type: lognormal, mean: 1000, stddev: 3000 }
        temporality: delta
    stability: development
    brief: Disk operations count.
    instrument: counter
    unit: "{operation}"
    attributes:
      - ref: system.device
      - ref: disk.io.direction
    entity_associations:
      - host

  - id: metric.system.disk.io_time
    type: metric
    metric_name: system.disk.io_time
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 10.0 }
          distribution: { type: lognormal, mean: 0.5, stddev: 1.0 }
        temporality: delta
    stability: development
    brief: "Time disk spent activated."
    instrument: counter
    unit: "s"
    note: |
      The real elapsed time ("wall clock") used in the I/O path (time from operations running in parallel are not counted). Measured as:

      - Linux: Field 13 from [procfs-diskstats](https://www.kernel.org/doc/Documentation/ABI/testing/procfs-diskstats)
      - Windows: The complement of
        ["Disk\% Idle Time"](https://learn.microsoft.com/archive/blogs/askcore/windows-performance-monitor-disk-counters-explained#windows-performance-monitor-disk-counters-explained)
        performance counter: `uptime * (100 - "Disk\% Idle Time") / 100`
    attributes:
      - ref: system.device
    entity_associations:
      - host

  - id: metric.system.disk.operation_time
    type: metric
    metric_name: system.disk.operation_time
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 60.0 }
          distribution: { type: lognormal, mean: 1.0, stddev: 2.0 }
        temporality: delta
    stability: development
    brief: "Sum of the time each operation took to complete."
    instrument: counter
    unit: "s"
    note: |
      Because it is the sum of time each request took, parallel-issued requests each contribute to make the count grow. Measured as:

      - Linux: Fields 7 & 11 from [procfs-diskstats](https://www.kernel.org/doc/Documentation/ABI/testing/procfs-diskstats)
      - Windows: "Avg. Disk sec/Read" perf counter multiplied by "Disk Reads/sec" perf counter (similar for Writes)
    attributes:
      - ref: system.device
      - ref: disk.io.direction
    entity_associations:
      - host

  - id: metric.system.disk.merged
    type: metric
    metric_name: system.disk.merged
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 10000 }
          distribution: { type: exponential, mean: 100 }
        temporality: delta
    stability: development
    brief: The number of disk reads/writes merged into single physical disk access operations.
    instrument: counter
    unit: "{operation}"
    attributes:
      - ref: system.device
      - ref: disk.io.direction
    entity_associations:
      - host

  - id: metric.system.disk.limit
    type: metric
    metric_name: system.disk.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [68719476736, 137438953472, 274877906944, 549755813888, 1099511627776, 4398046511104], weights: [2, 4, 4, 3, 2, 1] }
    stability: development
    brief: "The total storage capacity of the disk."
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref: system.device
    entity_associations:
      - host

  # system.filesystem.* metrics
  - id: metric.system.filesystem.usage
    type: metric
    metric_name: system.filesystem.usage
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 2000000000000 }
          distribution: { type: lognormal, mean: 50000000000, stddev: 100000000000 }
    stability: development
    brief: "Reports a filesystem's space usage across different states."
    note: |
      The sum of all `system.filesystem.usage` values over the different `system.filesystem.state` attributes
      SHOULD equal the total storage capacity of the filesystem, that is `system.filesystem.limit`.
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref: system.device
        brief: Identifier for the device where the filesystem resides.
        examples: ["/dev/sda", "\\network-drive"]
      - ref: system.filesystem.state
      - ref: system.filesystem.type
      - ref: system.filesystem.mode
      - ref: system.filesystem.mountpoint
    entity_associations:
      - host

  - id: metric.system.filesystem.utilization
    type: metric
    metric_name: system.filesystem.utilization
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: normal, mean: 0.5, stddev: 0.25 }
    stability: development
    brief: Fraction of filesystem bytes used.
    instrument: gauge
    unit: "1"
    attributes:
      - ref: system.device
        brief: Identifier for the device where the filesystem resides.
        examples: ["/dev/sda", "\\network-drive"]
      - ref: system.filesystem.state
      - ref: system.filesystem.type
      - ref: system.filesystem.mode
      - ref: system.filesystem.mountpoint
    entity_associations:
      - host

  - id: metric.system.filesystem.limit
    type: metric
    metric_name: system.filesystem.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [1073741824, 68719476736, 137438953472, 274877906944, 549755813888, 1099511627776], weights: [1, 3, 4, 3, 2, 1] }
    stability: development
    brief: "The total storage capacity of the filesystem."
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref: system.device
        brief: Identifier for the device where the filesystem resides.
        examples: ["/dev/sda", "\\network-drive"]
      - ref: system.filesystem.type
      - ref: system.filesystem.mode
      - ref: system.filesystem.mountpoint
    entity_associations:
      - host

  - id: metric.system.filesystem.lock.count
    type: metric
    metric_name: system.filesystem.lock.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 500 }
          distribution: { type: exponential, mean: 20 }
    stability: development
    brief: "Filesystem lock counts."
    instrument: updowncounter
    unit: "{lock}"
    attributes:
      - ref: system.device
        brief: OS-specific identifier for the device where the file resides.
        examples: ["08:01"]
      - ref: file.lock.type
      - ref: file.lock.mechanism
      - ref: file.lock.mode
    entity_associations:
      - host

  # system.network.* metrics
  - id: metric.system.network.packet.dropped
    type: metric
    metric_name: system.network.packet.dropped
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 100 }
          distribution: { type: exponential, mean: 1 }
        temporality: delta
    stability: development
    brief: "Count of packets that are dropped or discarded even though there was no error."
    instrument: counter
    unit: "{packet}"
    note: |
      Measured as:

      - Linux: the `drop` column in `/proc/net/dev` ([source](https://web.archive.org/web/20180321091318/http://www.onlamp.com/pub/a/linux/2000/11/16/LinuxAdmin.html))
      - Windows: [`InDiscards`/`OutDiscards`](https://docs.microsoft.com/windows/win32/api/netioapi/ns-netioapi-mib_if_row2)
        from [`GetIfEntry2`](https://docs.microsoft.com/windows/win32/api/netioapi/nf-netioapi-getifentry2)
    attributes:
      - ref: network.interface.name
      - ref: network.io.direction
    entity_associations:
      - host

  - id: metric.system.network.packet.count
    type: metric
    metric_name: system.network.packet.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 1000000 }
          distribution: { type: lognormal, mean: 5000, stddev: 20000 }
        temporality: delta
    stability: development
    brief: The number of packets transferred.
    instrument: counter
    unit: "{packet}"
    attributes:
      - ref: system.device
      - ref: network.io.direction
    entity_associations:
      - host

  - id: metric.system.network.errors
    type: metric
    metric_name: system.network.errors
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 50 }
          distribution: { type: exponential, mean: 0.5 }
        temporality: delta
    stability: development
    brief: "Count of network errors detected."
    instrument: counter
    unit: "{error}"
    note: |
      Measured as:

      - Linux: the `errs` column in `/proc/net/dev` ([source](https://web.archive.org/web/20180321091318/http://www.onlamp.com/pub/a/linux/2000/11/16/LinuxAdmin.html)).
      - Windows: [`InErrors`/`OutErrors`](https://docs.microsoft.com/windows/win32/api/netioapi/ns-netioapi-mib_if_row2)
        from [`GetIfEntry2`](https://docs.microsoft.com/windows/win32/api/netioapi/nf-netioapi-getifentry2).
    attributes:
      - ref: network.interface.name
      - ref: network.io.direction
    entity_associations:
      - host

  - id: metric.system.network.io
    type: metric
    metric_name: system.network.io
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 1250000000 }
          distribution: { type: lognormal, mean: 5000000, stddev: 20000000 }
        temporality: delta
    stability: development
    brief: The number of bytes transmitted and received.
    instrument: counter
    unit: "By"
    attributes:
      - ref: network.interface.name
      - ref: network.io.direction
    entity_associations:
      - host

  - id: metric.system.network.connection.count
    type: metric
    metric_name: system.network.connection.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 5000 }
          distribution: { type: exponential, mean: 100 }
    stability: development
    brief: The number of connections.
    instrument: updowncounter
    unit: "{connection}"
    attributes:
      - ref: network.interface.name
      - ref: network.connection.state
      - ref: network.transport
    entity_associations:
      - host

  # system.process.* metrics
  - id: metric.system.process.count
    type: metric
    metric_name: system.process.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 2000 }
          distribution: { type: lognormal, mean: 150, stddev: 200 }
    stability: development
    brief: "Total number of processes in each state."
    instrument: updowncounter
    unit: "{process}"
    attributes:
      - ref: process.state
    entity_associations:
      - host

  - id: metric.system.process.created
    type: metric
    metric_name: system.process.created
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 1000 }
          distribution: { type: exponential, mean: 20 }
        temporality: delta
    stability: development
    brief: "Total number of processes created over uptime of the host."
    instrument: counter
    unit: "{process}"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.process.limit
    type: metric
    metric_name: system.process.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [32768, 63704, 127436, 4194304], weights: [3, 2, 2, 3] }
    stability: development
    brief: "The maximum number of concurrent processes/tasks allowed by the operating system."
    instrument: updowncounter
    unit: "{thread}"
    attributes: []
    entity_associations:
      - host
    note: |
      On Linux, this corresponds to `/proc/sys/kernel/pid_max` or `/proc/sys/kernel/threads-max`.
      A per-user process limit may also be retrieved via `getrlimit(RLIMIT_NPROC)`.
      On BSD-like systems, this corresponds to `sysctl kern.maxproc`. This metric is unsupported on Windows systems.

  # system.memory.linux.* metrics
  - id: metric.system.memory.linux.available
    type: metric
    metric_name: system.memory.linux.available
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 50000000, max: 128000000000 }
          distribution: { type: lognormal, mean: 6000000000, stddev: 8000000000 }
    stability: development
    brief: "An estimate of how much memory is available for starting new applications, without causing swapping."
    note: |
      This is an alternative to `system.memory.usage` metric with `state=free`.
      Linux starting from 3.14 exports "available" memory. It takes "free" memory as a baseline, and then factors in kernel-specific values.
      This is supposed to be more accurate than just "free" memory.
      For reference, see the calculations [here](https://superuser.com/a/980821).
      See also `MemAvailable` in [/proc/meminfo](https://man7.org/linux/man-pages/man5/proc.5.html).
    instrument: updowncounter
    unit: "By"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.memory.linux.shared
    type: metric
    metric_name: system.memory.linux.shared
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 4000000000 }
          distribution: { type: lognormal, mean: 200000000, stddev: 300000000 }
    stability: development
    brief: "Shared memory used (mostly by tmpfs)."
    note: |
      Equivalent of `shared` from [`free` command](https://man7.org/linux/man-pages/man1/free.1.html) or
      `Shmem` from [`/proc/meminfo`](https://man7.org/linux/man-pages/man5/proc.5.html)"
    instrument: updowncounter
    unit: "By"
    entity_associations:
      - host

  - id: metric.system.memory.linux.hugepages.limit
    type: metric
    metric_name: system.memory.linux.hugepages.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [0, 128, 512, 1024, 4096], weights: [5, 2, 2, 2, 1] }
    stability: development
    brief: "Total number of hugepages available."
    instrument: updowncounter
    unit: "{page}"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.memory.linux.hugepages.page_size
    type: metric
    metric_name: system.memory.linux.hugepages.page_size
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [2097152, 1073741824], weights: [9, 1] }
    stability: development
    brief: "System hugepage size in bytes."
    instrument: updowncounter
    unit: "By"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.memory.linux.hugepages.reserved
    type: metric
    metric_name: system.memory.linux.hugepages.reserved
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 512 }
          distribution: { type: exponential, mean: 16 }
    stability: development
    brief: "Number of reserved hugepages."
    note: |
      Hugepages for which a commitment to allocate has been made, but no allocation has yet been made.
      This is reported as a separate metric rather than a `usage` state because reserved pages are already counted in `free` pages.
      They represent a subset of free pages that cannot be used for non-reserved allocations.
    instrument: updowncounter
    unit: "{page}"
    attributes: []
    entity_associations:
      - host

  - id: metric.system.memory.linux.hugepages.surplus
    type: metric
    metric_name: system.memory.linux.hugepages.surplus
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 256 }
          distribution: { type: exponential, mean: 4 }
    stability: development
    brief: "Number of surplus hugepages."
    note: |
      Overcommitted hugepages beyond the persistent pool.
      This is reported as a separate metric rather than a `usage` state because surplus pages can be in either `used` or `free` state.
      Including them in `usage` would break the convention that `usage` states sum to the `limit`.
    instrument: updowncounter
    unit: "{page}"
    attributes: []
    entity_associations:
      - host

