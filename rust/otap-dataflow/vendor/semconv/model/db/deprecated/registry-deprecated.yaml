groups:
  - id: registry.db.deprecated
    type: attribute_group
    display_name: Deprecated Database Attributes
    brief: >
      Describes deprecated database attributes.
    stability: development
    attributes:
      - id: db.connection_string
        annotations:
          traffic-generator:
            values:
              - 'Server=(localdb)\v11.0;Integrated Security=true;'
              - 'Host=db.example.com;Port=5432;Database=appdb;'
              - 'Server=sql01.example.com,1433;Database=orders;'
            weights: [2, 3, 2]
        type: string
        brief: 'Deprecated, use `server.address`, `server.port` attributes instead.'
        stability: development
        deprecated:
          reason: uncategorized
          note: >
            Replaced by `server.address` and `server.port`.
        examples: Server=(localdb)\v11.0;Integrated Security=true;
      - id: db.jdbc.driver_classname
        annotations:
          traffic-generator:
            values: [org.postgresql.Driver, com.microsoft.sqlserver.jdbc.SQLServerDriver, com.mysql.cj.jdbc.Driver, oracle.jdbc.OracleDriver]
            weights: [4, 2, 3, 1]
        type: string
        brief: 'Removed, no replacement at this time.'
        stability: development
        deprecated:
          reason: obsoleted
          note: >
            Removed, no replacement at this time.
        examples: ['org.postgresql.Driver', 'com.microsoft.sqlserver.jdbc.SQLServerDriver']
      - id: db.operation
        annotations:
          traffic-generator:
            values: [SELECT, INSERT, UPDATE, DELETE, findAndModify, HMSET, GET]
            weights: [10, 4, 3, 1, 1, 1, 3]
        type: string
        brief: 'Deprecated, use `db.operation.name` instead.'
        stability: development
        deprecated:
          reason: renamed
          renamed_to: db.operation.name
        examples: ['findAndModify', 'HMSET', 'SELECT']
      - id: db.user
        annotations:
          traffic-generator:
            values: [readonly_user, reporting_user, app_user, admin]
            weights: [3, 1, 5, 1]
        type: string
        brief: 'Deprecated, no replacement at this time.'
        deprecated:
          reason: obsoleted
          note: Removed, no replacement at this time.
        stability: development
        examples: ['readonly_user', 'reporting_user']
      - id: db.statement
        annotations:
          traffic-generator:
            values:
              - "SELECT * FROM wuser_table"
              - 'SET mykey "WuValue"'
              - "SELECT id, name FROM customers WHERE id = 42"
              - "INSERT INTO orders (id, total) VALUES (1001, 19.99)"
            weights: [3, 2, 4, 2]
        type: string
        brief: The database statement being executed.
        deprecated:
          reason: renamed
          renamed_to: db.query.text
        stability: development
        examples: ['SELECT * FROM wuser_table', 'SET mykey "WuValue"']
      - id: db.cassandra.table
        annotations:
          traffic-generator:
            values: [mytable, users, events, sensor_readings]
            weights: [3, 3, 2, 1]
        type: string
        stability: development
        brief: 'Deprecated, use `db.collection.name` instead.'
        deprecated:
          reason: renamed
          renamed_to: db.collection.name
        examples: 'mytable'
      - id: db.cosmosdb.container
        annotations:
          traffic-generator:
            values: [mytable, users, orders, products]
            weights: [3, 3, 2, 1]
        type: string
        stability: development
        brief: 'Deprecated, use `db.collection.name` instead.'
        deprecated:
          reason: renamed
          renamed_to: db.collection.name
        examples: 'mytable'
      - id: db.mongodb.collection
        annotations:
          traffic-generator:
            values: [mytable, users, orders, sessions]
            weights: [3, 3, 2, 1]
        type: string
        stability: development
        brief: 'Deprecated, use `db.collection.name` instead.'
        deprecated:
          reason: renamed
          renamed_to: db.collection.name
        examples: 'mytable'
      - id: db.sql.table
        annotations:
          traffic-generator:
            values: [mytable, users, orders, customers, products]
            weights: [2, 4, 3, 3, 2]
        type: string
        stability: development
        brief: 'Deprecated, use `db.collection.name` instead.'
        deprecated:
          reason: uncategorized
          note: "Replaced by `db.collection.name`, but only if not extracting the value from `db.query.text`."
        examples: 'mytable'
      - id: db.redis.database_index
        annotations:
          traffic-generator:
            range: { min: 0, max: 15 }
            distribution: { type: zipf, exponent: 1.5 }
        type: int
        stability: development
        brief: 'Deprecated, use `db.namespace` instead.'
        deprecated:
          reason: uncategorized
          note: Replaced by `db.namespace` (string).
        examples: [0, 1, 15]
      - id: db.name
        annotations:
          traffic-generator:
            values: [customers, main, appdb, orders]
            weights: [3, 2, 4, 2]
        type: string
        stability: development
        brief: 'Deprecated, use `db.namespace` instead.'
        deprecated:
          reason: renamed
          renamed_to: db.namespace
        examples: [ 'customers', 'main' ]
      - id: db.mssql.instance_name
        annotations:
          traffic-generator:
            values: [MSSQLSERVER, SQLEXPRESS, REPORTING]
            weights: [7, 2, 1]
        type: string
        stability: development
        brief: 'Deprecated, SQL Server instance is now populated as a part of `db.namespace` attribute.'
        deprecated:
          reason: obsoleted
          note: Removed, no replacement at this time.
        examples: 'MSSQLSERVER'
      - id: db.instance.id
        annotations:
          traffic-generator:
            values: [mysql-e26b99z.example.com, mysql-a13c42k.example.com, pg-primary-0.example.com, instance-0000000001]
        type: string
        stability: development
        brief: 'Deprecated, no general replacement at this time. For Elasticsearch, use `db.elasticsearch.node.name` instead.'
        deprecated:
          reason: obsoleted
          note: >
            Removed, no general replacement at this time. For Elasticsearch, use `db.elasticsearch.node.name` instead.
        examples: 'mysql-e26b99z.example.com'
      - id: db.elasticsearch.cluster.name
        annotations:
          traffic-generator:
            values: [e9106fc68e3044f0b1475b04bf4ffd5f, prod-logs-cluster, search-cluster-01]
        type: string
        stability: development
        deprecated:
          reason: renamed
          renamed_to: db.namespace
        brief: >
          Deprecated, use `db.namespace` instead.
        examples: ["e9106fc68e3044f0b1475b04bf4ffd5f"]
      - id: db.cosmosdb.status_code
        annotations:
          traffic-generator:
            values: [200, 201, 204, 304, 400, 404, 409, 412, 429, 500, 503]
            weights: [60, 15, 5, 2, 2, 5, 2, 1, 5, 1, 2]
        type: int
        stability: development
        deprecated:
          reason: uncategorized
          note: Use `db.response.status_code` instead.
        brief: 'Deprecated, use `db.response.status_code` instead.'
        examples: [200, 201]
      - id: db.cosmosdb.operation_type
        annotations:
          traffic-generator:
            values: [read, query, create, upsert, replace, delete, patch, batch, read_feed, query_plan, execute, execute_javascript, head, head_feed, invalid]
            weights: [30, 20, 10, 10, 5, 4, 4, 3, 3, 2, 2, 1, 2, 1, 1]
        type:
          members:
            - id: batch
              value: "batch"
              stability: development
            - id: create
              value: "create"
              stability: development
            - id: delete
              value: "delete"
              stability: development
            - id: execute
              value: "execute"
              stability: development
            - id: execute_javascript
              value: "execute_javascript"
              stability: development
            - id: invalid
              value: "invalid"
              stability: development
            - id: head
              value: "head"
              stability: development
            - id: head_feed
              value: "head_feed"
              stability: development
            - id: patch
              value: "patch"
              stability: development
            - id: query
              value: "query"
              stability: development
            - id: query_plan
              value: "query_plan"
              stability: development
            - id: read
              value: "read"
              stability: development
            - id: read_feed
              value: "read_feed"
              stability: development
            - id: replace
              value: "replace"
              stability: development
            - id: upsert
              value: "upsert"
              stability: development
        stability: development
        deprecated:
          reason: obsoleted
          note: >
            Removed, no replacement at this time.
        brief: Deprecated, no replacement at this time.

      - id: db.cassandra.coordinator.dc
        annotations:
