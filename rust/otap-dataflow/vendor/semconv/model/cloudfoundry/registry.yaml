groups:
  - id: registry.cloudfoundry
    type: attribute_group
    display_name: CloudFoundry Attributes
    brief: >
      CloudFoundry resource attributes.
    attributes:
      - id: cloudfoundry.system.id
        annotations:
          traffic-generator:
            values: [cf/gorouter, cf/diego-cell, cf/cloud_controller_ng, cf/uaa, cf/doppler]
            weights: [4, 3, 1, 1, 1]
        type: string
        stability: development
        brief: >
          A guid or another name describing the event source.
        note: |
          CloudFoundry defines the `source_id` in the [Loggregator v2 envelope](https://github.com/cloudfoundry/loggregator-api#v2-envelope).
          It is used for logs and metrics emitted by CloudFoundry. It is
          supposed to contain the component name, e.g. "gorouter", for
          CloudFoundry components.

          When system components are instrumented, values from the
          [Bosh spec](https://bosh.io/docs/jobs/#properties-spec)
          should be used. The `system.id` should be set to
          `spec.deployment/spec.name`.
        examples:
          - 'cf/gorouter'
      - id: cloudfoundry.system.instance.id
        annotations:
          traffic-generator:
            values:
              - 218fc5a9-a5f1-4b54-aa05-46717d0ab26d
              - 6f1c2d3e-8b4a-4c9d-9e2f-1a7b3c5d7e9f
              - c4e8a1b2-3d5f-4a6b-8c9d-0e1f2a3b4c5d
        type: string
        stability: development
        brief: >
          A guid describing the concrete instance of the event source.
        note: |
          CloudFoundry defines the `instance_id` in the [Loggregator v2 envelope](https://github.com/cloudfoundry/loggregator-api#v2-envelope).
          It is used for logs and metrics emitted by CloudFoundry. It is
          supposed to contain the vm ID for CloudFoundry components.

          When system components are instrumented, values from the
          [Bosh spec](https://bosh.io/docs/jobs/#properties-spec)
          should be used. The `system.instance.id` should be set to `spec.id`.
        examples:
          - '218fc5a9-a5f1-4b54-aa05-46717d0ab26d'
      - id: cloudfoundry.app.name
        annotations:
          traffic-generator:
            values: [my-app-name, checkout-service, payment-api, inventory-worker]
            weights: [4, 3, 2, 1]
        type: string
        stability: development
        brief: >
          The name of the application.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.application_name`. This is the same value
          as reported by `cf apps`.
        examples: ['my-app-name']
      - id: cloudfoundry.app.id
        annotations:
          traffic-generator:
            values:
              - 218fc5a9-a5f1-4b54-aa05-46717d0ab26d
              - 9a3b5c7d-1e2f-4a6b-8c0d-2e4f6a8b0c1d
              - 5e7f9a1b-3c5d-4e7f-9a1b-3c5d7e9f1a2b
        type: string
        stability: development
        brief: >
          The guid of the application.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.application_id`. This is the same value as
          reported by `cf app <app-name> --guid`.
        examples: ['218fc5a9-a5f1-4b54-aa05-46717d0ab26d']
      - id: cloudfoundry.app.instance.id
        annotations:
          traffic-generator:
            values: ["0", "1", "2", "3"]
            weights: [8, 4, 2, 1]
        type: string
        stability: development
        brief: >
          The index of the application instance. 0 when just one instance is active.
        note: |
          CloudFoundry defines the `instance_id` in the [Loggregator v2 envelope](https://github.com/cloudfoundry/loggregator-api#v2-envelope).
          It is used for logs and metrics emitted by CloudFoundry. It is
          supposed to contain the application instance index for applications
          deployed on the runtime.

          Application instrumentation should use the value from environment
          variable `CF_INSTANCE_INDEX`.
        examples:
          - '0'
          - '1'
      - id: cloudfoundry.space.name
        annotations:
          traffic-generator:
            values: [my-space-name, production, staging, development]
            weights: [2, 5, 2, 1]
        type: string
        stability: development
        brief: >
          The name of the CloudFoundry space the application is running in.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.space_name`. This is the same value as
          reported by `cf spaces`.
        examples: ['my-space-name']
      - id: cloudfoundry.space.id
        annotations:
          traffic-generator:
            values:
              - 218fc5a9-a5f1-4b54-aa05-46717d0ab26d
              - 0b2d4f6a-8c1e-4a3b-9d5f-7a9b1c3d5e7f
              - 7c9e1a3b-5d7f-4b9c-8e0a-2c4e6f8a0b1c
        type: string
        stability: development
        brief: >
          The guid of the CloudFoundry space the application is running in.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.space_id`. This is the same value as
          reported by `cf space <space-name> --guid`.
        examples: ['218fc5a9-a5f1-4b54-aa05-46717d0ab26d']
      - id: cloudfoundry.org.name
        annotations:
          traffic-generator:
            values: [my-org-name, platform, engineering, system]
            weights: [3, 3, 3, 1]
        type: string
        stability: development
        brief: >
          The name of the CloudFoundry organization the app is running in.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.org_name`. This is the same value as
          reported by `cf orgs`.
        examples: ['my-org-name']
      - id: cloudfoundry.org.id
        annotations:
          traffic-generator:
            values:
              - 218fc5a9-a5f1-4b54-aa05-46717d0ab26d
              - 3f5a7b9c-1d3e-4f5a-8b7c-9d1e3f5a7b9c
        type: string
        stability: development
        brief: >
          The guid of the CloudFoundry org the application is running in.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.org_id`. This is the same value as
          reported by `cf org <org-name> --guid`.
        examples: ['218fc5a9-a5f1-4b54-aa05-46717d0ab26d']
      - id: cloudfoundry.process.id
        annotations:
          traffic-generator:
            values:
              - 218fc5a9-a5f1-4b54-aa05-46717d0ab26d
              - 9a3b5c7d-1e2f-4a6b-8c0d-2e4f6a8b0c1d
              - "1234"
        type: string
        stability: development
        brief: >
          The UID identifying the process.
        note: |
          Application instrumentation should use the value from environment
          variable `VCAP_APPLICATION.process_id`. It is supposed to be equal to
          `VCAP_APPLICATION.app_id` for applications deployed to the runtime.
          For system components, this could be the actual PID.
        examples: ['218fc5a9-a5f1-4b54-aa05-46717d0ab26d']
      - id: cloudfoundry.process.type
        annotations:
          traffic-generator:
            values: [web, worker, task, sidecar]
            weights: [7, 2, 1, 1]
        type: string
        stability: development
        brief: >
          The type of process.
        note: |
          CloudFoundry applications can consist of multiple jobs. Usually the
          main process will be of type `web`. There can be additional background
          tasks or side-cars with different process types.
        examples: ['web']
