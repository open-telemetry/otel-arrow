groups:
  - id: registry.feature_flag
    type: attribute_group
    stability: release_candidate
    display_name: Feature Flag Attributes
    brief: >
        This document defines attributes for Feature Flags.
    attributes:
      - id: feature_flag.key
        annotations:
          traffic-generator:
            values: [logo-color, new-checkout-flow, dark-mode, search-v2, beta-banner]
            weights: [3, 4, 2, 2, 1]
        type: string
        stability: release_candidate
        brief: The lookup key of the feature flag.
        examples: ["logo-color"]
      - id: feature_flag.provider.name
        annotations:
          traffic-generator:
            values: [Flag Manager, LaunchDarkly, flagd, Unleash, Split]
            weights: [3, 3, 2, 1, 1]
        type: string
        stability: release_candidate
        brief: Identifies the feature flag provider.
        examples: ["Flag Manager"]
      - id: feature_flag.result.variant
        annotations:
          traffic-generator:
            values: [red, "true", "on", "off", "false", control, treatment]
            weights: [2, 3, 3, 2, 2, 2, 2]
        type: string
        stability: release_candidate
        examples: ["red", "true", "on"]
        brief: >
          A semantic identifier for an evaluated flag value.
        note: |-
          A semantic identifier, commonly referred to as a variant, provides a means
          for referring to a value without including the value itself. This can
          provide additional context for understanding the meaning behind a value.
          For example, the variant `red` maybe be used for the value `#c05543`.
      - id: feature_flag.context.id
        annotations:
          traffic-generator:
            values:
              - 5157782b-2203-4c80-a857-dbbd5e7761db
              - 0d8e3f2a-6b1c-4f7e-9a2d-3c4b5a6d7e8f
              - 9a7b6c5d-4e3f-4a1b-8c2d-1e0f9a8b7c6d
              - user-12345
              - user-67890
        type: string
        stability: release_candidate
        examples: ["5157782b-2203-4c80-a857-dbbd5e7761db"]
        brief: >
          The unique identifier for the flag evaluation context. For example, the targeting key.
      - id: feature_flag.version
        annotations:
          traffic-generator:
            values: ["1", "2", "3", 01ABCDEF, 02BCDEF0]
            weights: [3, 3, 2, 1, 1]
        type: string
        stability: release_candidate
        examples: ["1", "01ABCDEF"]
        brief: >
          The version of the ruleset used during the evaluation. This may be any stable value which uniquely identifies the ruleset.
      - id: feature_flag.set.id
        annotations:
          traffic-generator:
            values: [proj-1, ab98sgs, service1/dev, service1/prod]
            weights: [3, 1, 2, 4]
        type: string
        stability: release_candidate
        examples: ["proj-1", "ab98sgs", "service1/dev"]
        brief: >
          The identifier of the [flag set](https://openfeature.dev/specification/glossary/#flag-set) to which the feature flag belongs.
      - id: feature_flag.result.reason
        annotations:
          traffic-generator:
            values: [static, default, targeting_match, split, cached, disabled, unknown, stale, error]
            weights: [20, 15, 30, 10, 15, 3, 2, 2, 3]
        type:
          members:
            - id: static
              value: "static"
              brief: The resolved value is static (no dynamic evaluation).
              stability: release_candidate
            - id: default
              value: "default"
              brief: The resolved value fell back to a pre-configured value (no dynamic evaluation occurred or dynamic evaluation yielded no result).
              stability: release_candidate
            - id: targeting_match
              value: "targeting_match"
              brief: The resolved value was the result of a dynamic evaluation, such as a rule or specific user-targeting.
              stability: release_candidate
            - id: split
              value: "split"
              brief: The resolved value was the result of pseudorandom assignment.
              stability: release_candidate
            - id: cached
              value: "cached"
              brief: The resolved value was retrieved from cache.
              stability: release_candidate
            - id: disabled
              value: "disabled"
              brief: The resolved value was the result of the flag being disabled in the management system.
              stability: release_candidate
            - id: unknown
              value: "unknown"
              brief: The reason for the resolved value could not be determined.
              stability: release_candidate
            - id: stale
              value: "stale"
              brief: The resolved value is non-authoritative or possibly out of date
              stability: release_candidate
            - id: error
              value: "error"
              brief: The resolved value was the result of an error.
              stability: release_candidate
        stability: release_candidate
        examples: ["static", "targeting_match", "error", "default"]
        brief: >
          The reason code which shows how a feature flag value was determined.
      - id: feature_flag.result.value
        annotations:
          traffic-generator:
            values: ["#ff0000", true, 3, 0.5]
            weights: [4, 3, 2, 1]
        type: any
        stability: release_candidate
        examples: ["#ff0000", true, 3]
        brief: The evaluated value of the feature flag.
        note: |
          With some feature flag providers, feature flag results can be quite large or contain private or sensitive details.
          Because of this, `feature_flag.result.variant` is often the preferred attribute if it is available.

          It may be desirable to redact or otherwise limit the size and scope of `feature_flag.result.value` if possible.
          Because the evaluated flag value is unstructured and may be any type, it is left to the instrumentation author to determine how best to achieve this.
      - id: feature_flag.error.message
        annotations:
          traffic-generator:
            values:
              - "Unexpected input type: string"
              - The user has exceeded their storage quota
              - Flag not found
              - Provider not ready
            weights: [3, 1, 4, 2]
        type: string
        stability: release_candidate
        brief: >
          A message providing more detail about an error that occurred during feature flag evaluation in human-readable form.
        examples: ["Unexpected input type: string", "The user has exceeded their storage quota"]
