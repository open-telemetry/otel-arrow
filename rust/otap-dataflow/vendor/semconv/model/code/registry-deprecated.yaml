groups:
  - id: registry.code.deprecated
    type: attribute_group
    display_name: Deprecated Code Attributes
    brief: >
      These deprecated attributes provide context about source code
    attributes:
      - id: code.function
        type: string
        annotations:
          traffic-generator:
            values: [serveRequest, transfer, handle, main, doGet]
            weights: [4, 2, 2, 1, 1]
        stability: development
        deprecated:
          reason: uncategorized
          note: >
            Value should be included in `code.function.name` which is expected
            to be a fully-qualified name.
        brief: >
          Deprecated, use `code.function.name` instead
        examples: serveRequest
      - id: code.filepath
        type: string
        annotations:
          traffic-generator:
            values: [/usr/local/MyApplication/content_root/app/index.php, /app/src/main/java/com/example/MyHttpService.java, /home/user/repo/pkg/foo/handler.go]
        stability: development
        deprecated:
          reason: renamed
          renamed_to: code.file.path
        brief: >
          Deprecated, use `code.file.path` instead
        examples: /usr/local/MyApplication/content_root/app/index.php
      - id: code.lineno
        type: int
        annotations:
          traffic-generator:
            range: { min: 1, max: 5000 }
            distribution: { type: lognormal, mean: 200, stddev: 300 }
        stability: development
        deprecated:
          reason: renamed
          renamed_to: code.line.number
        brief: >
          Deprecated, use `code.line.number` instead
        examples: 42
      - id: code.column
        type: int
        annotations:
          traffic-generator:
            range: { min: 1, max: 120 }
            distribution: { type: lognormal, mean: 16, stddev: 12 }
        stability: development
        deprecated:
          reason: renamed
          renamed_to: code.column.number
        brief: >
          Deprecated, use `code.column.number`
        examples: 16
      - id: code.namespace
        type: string
        annotations:
          traffic-generator:
            values: [com.example.MyHttpService, com.example.Server, GuzzleHttp\Client, github.com/my/repo/pkg]
        stability: development
        deprecated:
          reason: uncategorized
          note: >
            Value should be included in `code.function.name` which is expected to be a fully-qualified name.
        brief: >
          Deprecated, namespace is now included into `code.function.name`
        examples: com.example.MyHttpService
