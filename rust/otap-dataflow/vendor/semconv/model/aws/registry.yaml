groups:
  - id: registry.aws
    type: attribute_group
    display_name: General AWS Attributes
    brief: >
      This section defines generic attributes for AWS services.
    attributes:
      - id: aws.request_id
        annotations:
          traffic-generator:
            values: [79b9da39-b7ae-508a-a6bc-864b2829c622, C9ER4AJX75574TDJ, 4f1c2b6e-9a3d-4e7b-8c21-0d5e6f7a8b9c, 8XKD2M7QPZ3RT9VB]
        type: string
        stability: development
        brief: "The AWS request ID as returned in the response headers `x-amzn-requestid`, `x-amzn-request-id` or `x-amz-request-id`."
        examples:
          - 79b9da39-b7ae-508a-a6bc-864b2829c622
          - C9ER4AJX75574TDJ
      - id: aws.extended_request_id
        annotations:
          traffic-generator:
            values: ["wzHcyEWfmOGDIE5QOhTAqFDoDWP3y8IUvpNINCwL9N4TEHbUw0/gZJ+VZTmCNCWR7fezEN3eCiQ=", "Kq1Zr8m3nV0b6yTqXc5hP2sD9fG4jL7aE1uW0oI3kR8tY6xN5zM2vB4cA7pQ9eS=", "a8Zp3QwErTy6UiOp1AsDfGhJkL0zXcVbNm9QwErTyUiOp2AsDfGhJkL4zXcVbNm="]
        type: string
        stability: development
        brief: "The AWS extended request ID as returned in the response header `x-amz-id-2`."
        examples:
          - wzHcyEWfmOGDIE5QOhTAqFDoDWP3y8IUvpNINCwL9N4TEHbUw0/gZJ+VZTmCNCWR7fezEN3eCiQ=
  - id: registry.aws.dynamodb
    type: attribute_group
    display_name: Amazon DynamoDB Attributes
    brief: >
            This document defines attributes for AWS DynamoDB.
    attributes:
      - id: aws.dynamodb.table_names
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 3 } }
            items: { values: [Users, Cats, Orders, Sessions, Products], weights: [5, 2, 4, 3, 2] }
        type: string[]
        stability: development
        brief: The keys in the `RequestItems` object field.
        examples:
          - [Users, Cats]
      - id: aws.dynamodb.consumed_capacity
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items:
              values:
                - '{"CapacityUnits": 1.0, "TableName": "Users"}'
                - '{"CapacityUnits": 2.5, "ReadCapacityUnits": 2.5, "TableName": "Orders"}'
                - '{"CapacityUnits": 0.5, "Table": {"CapacityUnits": 0.5}, "TableName": "Cats"}'
              weights: [5, 3, 2]
        type: string[]
        stability: development
        brief: "The JSON-serialized value of each item in the `ConsumedCapacity` response field."
        examples:
          - ['{
              "CapacityUnits": number,
              "GlobalSecondaryIndexes": {
                "string" : {
                    "CapacityUnits": number,
                    "ReadCapacityUnits": number,
                    "WriteCapacityUnits": number
                }
              },
              "LocalSecondaryIndexes": {
                "string" : {
                    "CapacityUnits": number,
                    "ReadCapacityUnits": number,
                    "WriteCapacityUnits": number
                }
              },
              "ReadCapacityUnits": number,
              "Table": {
                "CapacityUnits": number,
                "ReadCapacityUnits": number,
                "WriteCapacityUnits": number
              },
              "TableName": "string",
              "WriteCapacityUnits": number
            }']
      - id: aws.dynamodb.item_collection_metrics
        annotations:
          traffic-generator:
            values:
              - '{"Users": [{"ItemCollectionKey": {"id": {"S": "42"}}, "SizeEstimateRangeGB": [0.0, 1.0]}]}'
              - '{"Orders": [{"ItemCollectionKey": {"customer": {"S": "alice"}}, "SizeEstimateRangeGB": [1.0, 2.0]}]}'
        type: string
        stability: development
        brief: "The JSON-serialized value of the `ItemCollectionMetrics` response field."
        examples:
          - '{
              "string" : [
                {
                    "ItemCollectionKey": {
                      "string" : {
                          "B": blob,
                          "BOOL": boolean,
                          "BS": [ blob ],
                          "L": [
                            "AttributeValue"
                          ],
                          "M": {
                            "string" : "AttributeValue"
                          },
                          "N": "string",
                          "NS": [ "string" ],
                          "NULL": boolean,
                          "S": "string",
                          "SS": [ "string" ]
                      }
                    },
                    "SizeEstimateRangeGB": [ number ]
                }
              ]
            }'
      - id: aws.dynamodb.provisioned_read_capacity
        annotations:
          traffic-generator:
            values: [1.0, 2.0, 5.0, 10.0, 25.0, 100.0]
            weights: [5, 4, 3, 2, 1, 1]
        type: double
        stability: development
        brief: "The value of the `ProvisionedThroughput.ReadCapacityUnits` request parameter."
        examples:
          - 1.0
          - 2.0
      - id: aws.dynamodb.provisioned_write_capacity
        annotations:
          traffic-generator:
            values: [1.0, 2.0, 5.0, 10.0, 25.0, 100.0]
            weights: [5, 4, 3, 2, 1, 1]
        type: double
        stability: development
        brief: "The value of the `ProvisionedThroughput.WriteCapacityUnits` request parameter."
        examples:
          - 1.0
          - 2.0
      - id: aws.dynamodb.consistent_read
        annotations:
          traffic-generator:
            values: [true, false]
            weights: [1, 3]
        type: boolean
        stability: development
        brief: "The value of the `ConsistentRead` request parameter."
      - id: aws.dynamodb.projection
        annotations:
          traffic-generator:
            weights: [5, 3, 2]
        type: string
        stability: development
        brief: "The value of the `ProjectionExpression` request parameter."
        examples:
          - Title
          - Title, Price, Color
          - Title, Description, RelatedItems, ProductReviews
      - id: aws.dynamodb.limit
        annotations:
          traffic-generator:
            values: [10, 25, 50, 100, 1000]
            weights: [5, 3, 3, 2, 1]
        type: int
        stability: development
        brief: "The value of the `Limit` request parameter."
        examples:
          - 10
      - id: aws.dynamodb.attributes_to_get
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 4 } }
            items: { values: [id, lives, name, email, created_at], weights: [5, 2, 3, 2, 1] }
        type: string[]
        stability: development
        brief: "The value of the `AttributesToGet` request parameter."
        examples:
          - [lives, id]
      - id: aws.dynamodb.index_name
        annotations:
          traffic-generator:
            values: [name_to_group, email_index, created_at_index]
            weights: [5, 3, 2]
        type: string
        stability: development
        brief: "The value of the `IndexName` request parameter."
        examples:
          - name_to_group
      - id: aws.dynamodb.select
        annotations:
          traffic-generator:
            values: [ALL_ATTRIBUTES, ALL_PROJECTED_ATTRIBUTES, SPECIFIC_ATTRIBUTES, COUNT]
            weights: [6, 2, 3, 1]
        type: string
        stability: development
        brief: "The value of the `Select` request parameter."
        examples:
          - ALL_ATTRIBUTES
          - COUNT
      - id: aws.dynamodb.global_secondary_indexes
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items:
              values:
                - '{"IndexName": "email_index", "KeySchema": [{"AttributeName": "email", "KeyType": "HASH"}], "Projection": {"ProjectionType": "ALL"}}'
                - '{"IndexName": "name_to_group", "KeySchema": [{"AttributeName": "name", "KeyType": "HASH"}], "Projection": {"ProjectionType": "KEYS_ONLY"}, "ProvisionedThroughput": {"ReadCapacityUnits": 5, "WriteCapacityUnits": 5}}'
        type: string[]
        stability: development
        brief: "The JSON-serialized value of each item of the `GlobalSecondaryIndexes` request field"
        examples:
          - ['{
              "IndexName": "string",
              "KeySchema": [
                {
                  "AttributeName": "string",
                  "KeyType": "string"
                }
              ],
              "Projection": {
                "NonKeyAttributes": [ "string" ],
                "ProjectionType": "string"
              },
              "ProvisionedThroughput": {
                "ReadCapacityUnits": number,
                "WriteCapacityUnits": number
              }
            }']
      - id: aws.dynamodb.local_secondary_indexes
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items:
              values:
                - '{"IndexName": "created_at_index", "IndexSizeBytes": 1048576, "ItemCount": 1200, "KeySchema": [{"AttributeName": "id", "KeyType": "HASH"}, {"AttributeName": "created_at", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "ALL"}}'
                - '{"IndexName": "status_index", "IndexSizeBytes": 65536, "ItemCount": 80, "KeySchema": [{"AttributeName": "id", "KeyType": "HASH"}, {"AttributeName": "status", "KeyType": "RANGE"}], "Projection": {"ProjectionType": "KEYS_ONLY"}}'
        type: string[]
        stability: development
        brief: "The JSON-serialized value of each item of the `LocalSecondaryIndexes` request field."
        examples:
          - ['{
              "IndexArn": "string",
              "IndexName": "string",
              "IndexSizeBytes": number,
              "ItemCount": number,
              "KeySchema": [
                {
                  "AttributeName": "string",
                  "KeyType": "string"
                }
              ],
              "Projection": {
                "NonKeyAttributes": [ "string" ],
                "ProjectionType": "string"
              }
            }']
      - id: aws.dynamodb.exclusive_start_table
        annotations:
          traffic-generator:
            values: [Users, CatsTable, Orders]
        type: string
        stability: development
        brief: "The value of the `ExclusiveStartTableName` request parameter."
        examples: [Users, CatsTable]
      - id: aws.dynamodb.table_count
        annotations:
          traffic-generator:
            range: { min: 0, max: 100 }
            distribution: { type: zipf, exponent: 1.1 }
        type: int
        stability: development
        brief: "The number of items in the `TableNames` response parameter."
        examples:
          - 20
      - id: aws.dynamodb.scan_forward
        annotations:
          traffic-generator:
            values: [true, false]
            weights: [4, 1]
        type: boolean
        stability: development
        brief: "The value of the `ScanIndexForward` request parameter."
      - id: aws.dynamodb.segment
        annotations:
          traffic-generator:
            range: { min: 0, max: 99 }
        type: int
        stability: development
        brief: "The value of the `Segment` request parameter."
        examples:
          - 10
      - id: aws.dynamodb.total_segments
        annotations:
          traffic-generator:
            values: [1, 4, 8, 16, 100]
            weights: [3, 3, 2, 1, 1]
        type: int
        stability: development
        brief: "The value of the `TotalSegments` request parameter."
        examples:
          - 100
      - id: aws.dynamodb.count
        annotations:
          traffic-generator:
            range: { min: 0, max: 1000 }
            distribution: { type: zipf, exponent: 1.2 }
        type: int
        stability: development
        brief: "The value of the `Count` response parameter."
        examples:
          - 10
      - id: aws.dynamodb.scanned_count
        annotations:
          traffic-generator:
            range: { min: 0, max: 10000 }
            distribution: { type: zipf, exponent: 1.1 }
        type: int
        stability: development
        brief: "The value of the `ScannedCount` response parameter."
        examples:
          - 50
      - id: aws.dynamodb.attribute_definitions
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 3 } }
            items:
              values:
                - '{"AttributeName": "id", "AttributeType": "S"}'
                - '{"AttributeName": "created_at", "AttributeType": "N"}'
                - '{"AttributeName": "email", "AttributeType": "S"}'
              weights: [5, 3, 2]
        type: string[]
        stability: development
        brief: "The JSON-serialized value of each item in the `AttributeDefinitions` request field."
        examples:
          - ['{
              "AttributeName": "string",
              "AttributeType": "string"
            }']
      - id: aws.dynamodb.global_secondary_index_updates
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items:
              values:
                - '{"Create": {"IndexName": "email_index", "KeySchema": [{"AttributeName": "email", "KeyType": "HASH"}], "Projection": {"ProjectionType": "ALL"}, "ProvisionedThroughput": {"ReadCapacityUnits": 5, "WriteCapacityUnits": 5}}}'
                - '{"Update": {"IndexName": "name_to_group", "ProvisionedThroughput": {"ReadCapacityUnits": 10, "WriteCapacityUnits": 10}}}'
                - '{"Delete": {"IndexName": "status_index"}}'
              weights: [4, 4, 2]
        type: string[]
        stability: development
        brief: "The JSON-serialized value of each item in the `GlobalSecondaryIndexUpdates` request field."
        examples:
          - ['{
              "Create": {
                "IndexName": "string",
                "KeySchema": [
                  {
                    "AttributeName": "string",
                    "KeyType": "string"
                  }
                ],
                "Projection": {
                  "NonKeyAttributes": [ "string" ],
                  "ProjectionType": "string"
                },
                "ProvisionedThroughput": {
                  "ReadCapacityUnits": number,
                  "WriteCapacityUnits": number
                }
              }']
  - id: registry.aws.ecs
    type: attribute_group
    display_name: Amazon ECS Attributes
    brief: >
      This document defines attributes for AWS Elastic Container Service (ECS).
    attributes:
      - id: aws.ecs.container.arn
        annotations:
          traffic-generator:
            values:
              - "arn:aws:ecs:us-west-1:123456789123:container/32624152-9086-4f0e-acae-1a75b14fe4d9"
              - "arn:aws:ecs:us-east-1:123456789123:container/7c1e5a2d-4b3f-4e8a-9d10-2f6b8c4e1a37"
        type: string
        stability: development
        brief: >
          The Amazon Resource Name (ARN) of an [ECS container instance](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ECS_instances.html).
        examples:
          [
            "arn:aws:ecs:us-west-1:123456789123:container/32624152-9086-4f0e-acae-1a75b14fe4d9",
          ]
      - id: aws.ecs.cluster.arn
        annotations:
          traffic-generator:
            values: ["arn:aws:ecs:us-west-2:123456789123:cluster/my-cluster", "arn:aws:ecs:us-east-1:123456789123:cluster/prod-cluster"]
            weights: [1, 2]
        type: string
        stability: development
        brief: >
          The ARN of an [ECS cluster](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/clusters.html).
        examples: ["arn:aws:ecs:us-west-2:123456789123:cluster/my-cluster"]
      - id: aws.ecs.launchtype
        annotations:
          traffic-generator:
            values: [ec2, fargate]
            weights: [4, 6]
        type:
          members:
            - id: ec2
              value: "ec2"
              brief: Amazon EC2
              stability: development
            - id: fargate
              value: "fargate"
              brief: Amazon Fargate
              stability: development
        stability: development
        brief: >
          The [launch type](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/launch_types.html) for an ECS task.
      - id: aws.ecs.task.arn
        type: string
        stability: development
        brief: >
          The ARN of a running [ECS task](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/ecs-account-settings.html#ecs-resource-ids).
        examples:
          [
            "arn:aws:ecs:us-west-1:123456789123:task/10838bed-421f-43ef-870a-f43feacbbb5b",
            "arn:aws:ecs:us-west-1:123456789123:task/my-cluster/task-id/23ebb8ac-c18f-46c6-8bbe-d55d0e37cfbd"
          ]
      - id: aws.ecs.task.family
        annotations:
          traffic-generator:
            values: [opentelemetry-family, web-api, worker]
            weights: [2, 5, 3]
        type: string
        stability: development
        brief: >
          The family name of the [ECS task definition](https://docs.aws.amazon.com/AmazonECS/latest/developerguide/task_definitions.html) used to create the ECS task.
        examples: ["opentelemetry-family"]
      - id: aws.ecs.task.id
        annotations:
          traffic-generator:
            values: [10838bed-421f-43ef-870a-f43feacbbb5b, 23ebb8ac-c18f-46c6-8bbe-d55d0e37cfbd, 5e9a7c31-2d48-4f6b-b0e3-91c4a8d27f60]
        type: string
        stability: development
        brief: >
          The ID of a running ECS task. The ID MUST be extracted from `task.arn`.
        examples:
          [
            "10838bed-421f-43ef-870a-f43feacbbb5b",
            "23ebb8ac-c18f-46c6-8bbe-d55d0e37cfbd"
          ]
      - id: aws.ecs.task.revision
        annotations:
          traffic-generator:
            values: ["1", "8", "26", "42"]
            weights: [2, 3, 3, 2]
        type: string
        stability: development
        brief: >
          The revision for the task definition used to create the ECS task.
        examples: ["8", "26"]
  - id: registry.aws.eks
    type: attribute_group
    display_name: Amazon EKS Attributes
    brief: >
      This document defines attributes for AWS Elastic Kubernetes Service (EKS).
    attributes:
      - id: aws.eks.cluster.arn
        annotations:
          traffic-generator:
            values: ["arn:aws:ecs:us-west-2:123456789123:cluster/my-cluster", "arn:aws:eks:us-east-1:123456789123:cluster/prod-eks"]
        type: string
        stability: development
        brief: >
          The ARN of an EKS cluster.
        examples: ["arn:aws:ecs:us-west-2:123456789123:cluster/my-cluster"]
  - id: registry.aws.log
    type: attribute_group
    display_name: Amazon Logs Attributes
    brief: >
      This document defines attributes for AWS Logs.
    attributes:
      - id: aws.log.group.names
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 3 } }
            items: { values: [/aws/lambda/my-function, opentelemetry-service, /ecs/web-api], weights: [4, 3, 3] }
        type: string[]
        stability: development
        brief: >
          The name(s) of the AWS log group(s) an application is writing to.
        examples:
          - ["/aws/lambda/my-function", "opentelemetry-service"]
        note: >
          Multiple log groups must be supported for cases like multi-container applications,
          where a single application has sidecar containers, and each write to their own log
          group.
      - id: aws.log.group.arns
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items:
              values:
                - "arn:aws:logs:us-west-1:123456789012:log-group:/aws/my/group:*"
                - "arn:aws:logs:us-east-1:123456789012:log-group:/ecs/web-api:*"
        type: string[]
        stability: development
        brief: >
          The Amazon Resource Name(s) (ARN) of the AWS log group(s).
        examples:
          - ["arn:aws:logs:us-west-1:123456789012:log-group:/aws/my/group:*"]
        note: >
          See the
          [log group ARN format documentation](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/iam-access-control-overview-cwl.html#CWL_ARN_Format).
      - id: aws.log.stream.names
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items: { values: [logs/main/10838bed-421f-43ef-870a-f43feacbbb5b, logs/sidecar/23ebb8ac-c18f-46c6-8bbe-d55d0e37cfbd] }
        type: string[]
        stability: development
        brief: >
          The name(s) of the AWS log stream(s) an application is writing to.
        examples:
          - ["logs/main/10838bed-421f-43ef-870a-f43feacbbb5b"]
      - id: aws.log.stream.arns
        annotations:
          traffic-generator:
            length: { range: { min: 1, max: 2 } }
            items:
              values:
                - "arn:aws:logs:us-west-1:123456789012:log-group:/aws/my/group:log-stream:logs/main/10838bed-421f-43ef-870a-f43feacbbb5b"
                - "arn:aws:logs:us-west-1:123456789012:log-group:/aws/my/group:log-stream:logs/sidecar/23ebb8ac-c18f-46c6-8bbe-d55d0e37cfbd"
        type: string[]
        stability: development
        brief: >
          The ARN(s) of the AWS log stream(s).
        examples:
          - ["arn:aws:logs:us-west-1:123456789012:log-group:/aws/my/group:log-stream:logs/main/10838bed-421f-43ef-870a-f43feacbbb5b"]
        note: >
          See the
          [log stream ARN format documentation](https://docs.aws.amazon.com/AmazonCloudWatch/latest/logs/iam-access-control-overview-cwl.html#CWL_ARN_Format).
          One log group can contain several log streams, so these ARNs necessarily identify both a log
          group and a log stream.

  - id: registry.aws.lambda
    type: attribute_group
    display_name: Amazon Lambda Attributes
    brief: >
        This document defines attributes for AWS Lambda.
    attributes:
      - id: aws.lambda.invoked_arn
        annotations:
          traffic-generator:
            values:
              - "arn:aws:lambda:us-east-1:123456:function:myfunction:myalias"
              - "arn:aws:lambda:us-east-1:123456:function:myfunction"
              - "arn:aws:lambda:us-west-2:123456:function:order-processor:prod"
            weights: [3, 5, 2]
        type: string
        stability: development
        brief: >
          The full invoked ARN as provided on the `Context` passed to the function
          (`Lambda-Runtime-Invoked-Function-Arn` header on the `/runtime/invocation/next` applicable).
        note: This may be different from `cloud.resource_id` if an alias is involved.
        examples: ["arn:aws:lambda:us-east-1:123456:function:myfunction:myalias"]
      - id: aws.lambda.resource_mapping.id
        annotations:
          traffic-generator:
            values: [587ad24b-03b9-4413-8202-bbd56b36e5b7, 9c2e4f1a-6b7d-4e83-a5c0-3d8f1b2e7a64]
        type: string
        stability: development
        brief: >
          The UUID of the [AWS Lambda EvenSource Mapping](https://docs.aws.amazon.com/AWSCloudFormation/latest/UserGuide/aws-resource-lambda-eventsourcemapping.html).
          An event source is mapped to a lambda function. It's contents are read by Lambda and used to trigger a function. This isn't available in the lambda execution
          context or the lambda runtime environment. This is going to be populated by the AWS SDK for each language when that UUID is present.
          Some of these operations are Create/Delete/Get/List/Update EventSourceMapping.
        examples: ["587ad24b-03b9-4413-8202-bbd56b36e5b7"]
  - id: registry.aws.s3
    type: attribute_group
    display_name: Amazon S3 Attributes
    brief: >
      This document defines attributes for AWS S3.
    attributes:
      - id: aws.s3.bucket
        annotations:
          traffic-generator:
            values: [some-bucket-name, app-assets, backups-prod, logs-archive]
            weights: [2, 4, 1, 3]
        type: string
        stability: development
        brief: "The S3 bucket name the request refers to. Corresponds to the `--bucket` parameter of the [S3 API](https://docs.aws.amazon.com/cli/latest/reference/s3api/index.html) operations."
        examples:
          - some-bucket-name
        note: |
          The `bucket` attribute is applicable to all S3 operations that reference a bucket, i.e. that require the bucket name as a mandatory parameter.
          This applies to almost all S3 operations except `list-buckets`.
      - id: aws.s3.key
        annotations:
          traffic-generator:
            values: [someFile.yml, images/logo.png, data/2026/11/11/events.json, backups/db.tar.gz]
            weights: [2, 4, 3, 1]
        type: string
        stability: development
        brief: "The S3 object key the request refers to. Corresponds to the `--key` parameter of the [S3 API](https://docs.aws.amazon.com/cli/latest/reference/s3api/index.html) operations."
        examples:
          - someFile.yml
        note: |
          The `key` attribute is applicable to all object-related S3 operations, i.e. that require the object key as a mandatory parameter.
          This applies in particular to the following operations:

          - [copy-object](https://docs.aws.amazon.com/cli/latest/reference/s3api/copy-object.html)
          - [delete-object](https://docs.aws.amazon.com/cli/latest/reference/s3api/delete-object.html)
          - [get-object](https://docs.aws.amazon.com/cli/latest/reference/s3api/get-object.html)
