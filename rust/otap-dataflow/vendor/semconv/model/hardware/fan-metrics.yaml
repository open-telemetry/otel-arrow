# yaml-language-server: $schema=https://raw.githubusercontent.com/open-telemetry/weaver/v0.25.1/schemas/semconv.schema.v2.json
file_format: definition/2
metrics:
  - name: hw.fan.speed
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      naming_conventions:
        # TODO hw.fan.speed is used as a namespace by hw.fan.speed.limit
        policy_exceptions:
          - metric_namespace_collision
      traffic-generator:
        value:
          range: { min: 0, max: 20000 }
          distribution: { type: normal, mean: 4500, stddev: 2000 }
    stability: development
    brief: "Fan speed in revolutions per minute."
    instrument: gauge
    unit: "rpm"
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended

  - name: hw.fan.speed.limit
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value: { values: [500, 1000, 12000, 16000, 20000], weights: [2, 2, 3, 2, 1] }
    stability: development
    brief: "Speed limit in rpm."
    instrument: gauge
    unit: "rpm"
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended
      - ref: hw.limit_type
        examples: ["low.critical", "low.degraded", "max"]
        requirement_level: recommended

  - name: hw.fan.speed_ratio
    requirement_level: recommended
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: normal, mean: 0.4, stddev: 0.2 }
    stability: development
    brief: "Fan speed expressed as a fraction of its maximum speed."
    instrument: gauge
    unit: "1"
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended

metric_refinements:
  - id: metric.hw.fan.status
    ref: hw.status
    attributes:
      - ref_group: hardware.attributes.common
      - ref: hw.sensor_location
        requirement_level: recommended
      - ref: hw.type
        note: "MUST be set to `fan`."
        examples: ["fan"]
      - ref: hw.state
        note: |
          MUST be set to one of the following values:

          * `ok`: The fan is operating normally.
          * `degraded`: The fan is operating with reduced functionality or performance.
          * `failed`: The fan has failed and is not operational.
        examples: ["ok", "degraded", "failed"]
