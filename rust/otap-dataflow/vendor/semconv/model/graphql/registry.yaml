groups:
  - id: registry.graphql
    type: attribute_group
    display_name: GraphQL Attributes
    brief: 'This document defines attributes for GraphQL.'
    attributes:
      - id: graphql.operation.name
        annotations:
          traffic-generator:
            values: [findBookById, listBooks, createOrder, getUserProfile, onOrderUpdated]
            weights: [4, 3, 2, 3, 1]
        brief: "The name of the operation being executed."
        type: string
        stability: development
        examples: 'findBookById'
      - id: graphql.operation.type
        annotations:
          traffic-generator:
            values: [query, mutation, subscription]
            weights: [80, 17, 3]
        brief: "The type of the operation being executed."
        stability: development
        type:
          members:
            - id: query
              value: "query"
              brief: "GraphQL query"
              stability: development
            - id: mutation
              value: "mutation"
              brief: "GraphQL mutation"
              stability: development
            - id: subscription
              value: "subscription"
              brief: "GraphQL subscription"
              stability: development
        examples: ['query', 'mutation', 'subscription']
      - id: graphql.document
        annotations:
          traffic-generator:
            values:
              - "query findBookById { bookById(id: ?) { name } }"
              - "query listBooks { books(first: ?) { id name } }"
              - "mutation createOrder { createOrder(input: ?) { id status } }"
              - "subscription onOrderUpdated { orderUpdated(id: ?) { status } }"
            weights: [4, 3, 2, 1]
        brief: "The GraphQL document being executed."
        type: string
        stability: development
        note: If instrumentation can reliably identify and redact sensitive information it SHOULD do it.
        examples: 'query findBookById { bookById(id: ?) { name } }'
