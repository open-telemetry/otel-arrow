groups:
  - id: metric.go.memory.used
    type: metric
    metric_name: go.memory.used
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 1048576, max: 8589934592 }
          distribution: { type: lognormal, mean: 134217728, stddev: 268435456 }
    brief: "Memory used by the Go runtime."
    note: >
      Computed from `(/memory/classes/total:bytes - /memory/classes/heap/released:bytes)`.
    instrument: updowncounter
    unit: "By"
    attributes:
      - ref: go.memory.type
        requirement_level: recommended
      - ref: go.memory.detailed_type
        requirement_level: opt_in
    stability: development

  - id: metric.go.memory.limit
    type: metric
    metric_name: go.memory.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          values: [268435456, 536870912, 1073741824, 2147483648, 4294967296]
          weights: [2, 3, 3, 2, 1]
    brief: "Go runtime memory limit configured by the user, if a limit exists."
    note: >
      Computed from `/gc/gomemlimit:bytes`.
      This metric is excluded if the limit obtained from the Go runtime is math.MaxInt64.
    instrument: updowncounter
    unit: "By"
    stability: development

  - id: metric.go.memory.allocated
    type: metric
    metric_name: go.memory.allocated
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 4294967296 }
          distribution: { type: lognormal, mean: 52428800, stddev: 104857600 }
        temporality: delta
    brief: "Memory allocated to the heap by the application."
    note: >
      Computed from `/gc/heap/allocs:bytes`.
    instrument: counter
    unit: "By"
    stability: development

  - id: metric.go.memory.allocations
    type: metric
    metric_name: go.memory.allocations
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 50000000 }
          distribution: { type: lognormal, mean: 500000, stddev: 1000000 }
        temporality: delta
    brief: "Count of allocations to the heap by the application."
    note: >
      Computed from `/gc/heap/allocs:objects`.
    instrument: counter
    unit: "{allocation}"
    stability: development

  - id: metric.go.memory.gc.goal
    type: metric
    metric_name: go.memory.gc.goal
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 4194304, max: 8589934592 }
          distribution: { type: lognormal, mean: 167772160, stddev: 268435456 }
    brief: "Heap size target for the end of the GC cycle."
    note: >
      Computed from `/gc/heap/goal:bytes`.
    instrument: updowncounter
    unit: "By"
    stability: development

  - id: metric.go.memory.gc.cycles
    type: metric
    metric_name: go.memory.gc.cycles
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 0, max: 50 }
          distribution: { type: exponential, mean: 3 }
        temporality: delta
    brief: "Number of completed GC cycles."
    note: >
      Computed from `/gc/cycles/total:gc-cycles`.
    instrument: counter
    unit: "{gc_cycle}"
    stability: development

  - id: metric.go.memory.gc.pause.duration
    type: metric
    metric_name: go.memory.gc.pause.duration
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 0.1 }
          distribution: { type: lognormal, mean: 0.0002, stddev: 0.0005 }
        bounds: [0.00001, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.0025, 0.005, 0.01, 0.025, 0.05, 0.1]
        observations: { range: { min: 1, max: 20 } }
        temporality: delta
    brief: "Distribution of individual GC-related stop-the-world pause latencies. This is the time from deciding to stop the world until the world is started again."
    note: >
      Computed from `/sched/pauses/total/gc:seconds`.
      Bucket boundaries are provided by the runtime, and are subject to change.
    instrument: histogram
    unit: "s"
    stability: development

  - id: metric.go.goroutine.count
    type: metric
    metric_name: go.goroutine.count
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          range: { min: 1, max: 100000 }
          distribution: { type: lognormal, mean: 200, stddev: 500 }
    brief: "Count of live goroutines."
    note: >
      Computed from `/sched/goroutines:goroutines`.
    instrument: updowncounter
    unit: "{goroutine}"
    stability: development

  - id: metric.go.processor.limit
    type: metric
    metric_name: go.processor.limit
    annotations:
      code_generation:
        metric_value_type: int
      traffic-generator:
        value:
          values: [1, 2, 4, 8, 16, 32, 64]
          weights: [1, 3, 4, 4, 3, 1, 1]
    brief: "The number of OS threads that can execute user-level Go code simultaneously."
    note: >
      Computed from `/sched/gomaxprocs:threads`.
    instrument: updowncounter
    unit: "{thread}"
    stability: development

  - id: metric.go.schedule.duration
    type: metric
    metric_name: go.schedule.duration
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 1.0 }
          distribution: { type: lognormal, mean: 0.00005, stddev: 0.0002 }
        bounds: [0.000001, 0.000005, 0.00001, 0.000025, 0.00005, 0.0001, 0.00025, 0.0005, 0.001, 0.005, 0.01, 0.1, 1]
        observations: { range: { min: 1, max: 20 } }
        temporality: delta
    brief: "The time goroutines have spent in the scheduler in a runnable state before actually running."
    note: >
      Computed from `/sched/latencies:seconds`.
      Bucket boundaries are provided by the runtime, and are subject to change.
    instrument: histogram
    unit: "s"
    stability: development

  - id: metric.go.config.gogc
    type: metric
    metric_name: go.config.gogc
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          values: [100.0, 50.0, 75.0, 25.0, 0.0]
          weights: [80, 8, 6, 4, 2]
    brief: "Heap size target percentage configured by the user, otherwise 100."
    note: >
      The value range is [0.0,100.0].
      Computed from `/gc/gogc:percent`.
    instrument: updowncounter
    unit: "%"
    stability: development

  - id: metric.go.cpu.time
    type: metric
    metric_name: go.cpu.time
    annotations:
      code_generation:
        metric_value_type: double
      traffic-generator:
        value:
          range: { min: 0.0, max: 60.0 }
          distribution: { type: lognormal, mean: 0.5, stddev: 1.0 }
        temporality: delta
    brief: "Estimated CPU time spent by the Go runtime."
    note: >
      Computed from `/cpu/classes/...` metrics.
      This metric is an overestimate, and not directly comparable to system CPU time measurements.
      Compare only with other `go.cpu.time` metrics.
    instrument: counter
    unit: "s"
    attributes:
      - ref: go.cpu.state
        requirement_level: required
      - ref: go.cpu.detailed_state
        requirement_level: opt_in
    stability: development
