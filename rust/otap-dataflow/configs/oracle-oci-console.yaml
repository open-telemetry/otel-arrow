version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        nodes:
          oracle-audit:
            type: urn:otel:receiver:oracle
            config:
              source_id: oracle-audit
              connection:
                connect_string: '${env:ORACLE_CONNECT_STRING}'
                instant_client_dir: '${env:ORACLE_INSTANT_CLIENT_DIR}'
              authentication:
                username_file: '${env:ORACLE_USERNAME_FILE}'
                password_file: '${env:ORACLE_PASSWORD_FILE}'
              query:
                statement: >
                  SELECT EVENT_ID, EVENT_TS, PAYLOAD
                  FROM OTAP_ORACLE_EVENTS
                  ORDER BY EVENT_TS, EVENT_ID
                interval: 5s
                fetch_size: 1000
                max_rows_per_poll: 10000
                timeout: 2m
              # Parsed for forward compatibility; stateful watermarking is not active.
              watermark:
                timestamp_column: EVENT_TS
                tie_breaker_column: EVENT_ID
                timezone: UTC
                start_at: beginning
              # Parsed for forward compatibility; checkpoint persistence is not active.
              checkpoint:
                directory: ${engine.state_dir}/oracle
                on_nack: rewind
                max_consecutive_failures: 5
          console:
            type: exporter:console
            config:
              format: pretty

        connections:
          - from: oracle-audit
            to: console
