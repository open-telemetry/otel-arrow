# Replace endpoint, secret references, connection, and state path before running.
# Build with oracle,azure-key-vault-user-pass-auth,crypto-ring.
version: otel_dataflow/v1
engine: {}
policies:
  resources:
    core_allocation:
      type: core_count
      count: 1
groups:
  default:
    pipelines:
      main:
        extensions:
          database-credentials:
            type: urn:otel:extension:azure_key_vault_user_pass_auth
            config:
              vault_url: https://example-vault.vault.azure.net
              username_secret:
                name: oracle-username
              password_secret:
                name: oracle-password
              identity:
                method: managed_identity
              startup_timeout: 30s
        nodes:
          database:
            type: urn:otel:receiver:oracle
            capabilities:
              basic_auth_provider: database-credentials
            config:
              source_id: oracle-events
              connection:
                connect_string: //database.example.com:1521/FREEPDB1
                instant_client_dir: /opt/oracle/instantclient
              query:
                statement: >
                  SELECT EVENT_ID, EVENT_TS, PAYLOAD FROM OTAP_ORACLE_EVENTS
                  WHERE EVENT_TS > :last_timestamp
                    OR (EVENT_TS = :last_timestamp AND EVENT_ID > :last_id)
                  ORDER BY EVENT_TS ASC, EVENT_ID ASC
                interval: 1m
                timeout: 30s
                fetch_size_rows: 100
                max_rows_per_poll: 1000
                max_batch_bytes: 4MiB
              watermark:
                mode: composite
                timestamp:
                  column: EVENT_TS
                  bind: last_timestamp
                  initial: "2026-01-01T00:00:00Z"
                  timezone: UTC
                tie_breaker:
                  column: EVENT_ID
                  bind: last_id
                  initial: 0
              checkpoint:
                directory: ./state/oracle-akv
                on_nack: rewind
                on_permanent_nack: pause
                nack_backoff: 1s
                max_consecutive_failures: 5
          console:
            type: exporter:console
            config:
              format: pretty
        connections:
          - from: database
            to: console
