version: otel_dataflow/v1
engine: { }
groups:
  default:
    pipelines:
      main:
        # Test configuration for mTLS (mutual authentication)
        # This demonstrates OTLP receiver with mTLS -> OTLP exporter with mTLS
        #
        # How to test:
        # 1. Generate certificates: ./scripts/generate-test-certs.sh
        # 2. Start the collector: cargo run -- --config configs/test-mtls.yaml
        # 3. Send test data to the receiver on https://127.0.0.1:4317 with client cert

        policies:
          channel_capacity:
            control:
              node: 100
              pipeline: 100
            pdata: 128

        nodes:
          receiver:
            type: receiver:otlp
            config:
              protocols:
                grpc:
                  listening_addr: "127.0.0.1:4317"
                  # Receiver mTLS configuration (server-side)
                  tls:
                    # Server identity (required for TLS)
                    cert_file: "./test-certs/server.crt"
                    key_file: "./test-certs/server.key"

                    # Client certificate verification for mTLS
                    client_ca_file: "./test-certs/ca.crt"
                    include_system_ca_certs_pool: false

          exporter:
            type: exporter:otlp_grpc
            config:
              # Send to another OTLP receiver with mTLS enabled
              # Uses port 4319 to avoid conflict with standard OTLP ports (4317=gRPC, 4318=HTTP)
              grpc_endpoint: "https://127.0.0.1:4319"

              # Exporter mTLS configuration (client-side)
              tls:
                # Trust settings for verifying the server certificate
                ca_file: "./test-certs/ca.crt"
                include_system_ca_certs_pool: false

                # Client identity for mTLS (these make it mTLS instead of just TLS)
                cert_file: "./test-certs/client.crt"
                key_file: "./test-certs/client.key"

                # File-backed client TLS reloads every 5 minutes by default.
                # null disables reload; "0s" is rejected.
                # Separate CA/cert/key replacements are not one atomic update.
                # Detectable inconsistencies keep current material until a later poll.
                # Kubernetes projected volumes pin one generation per attempt;
                # subPath mounts do not receive projected-volume updates.
                # Invalid files or pool-build errors retain the old pool.
                # Later backend TLS rejection does not roll back an installed pool.
                reload_interval: "5m"

        connections:
          - from: receiver
            to: exporter
