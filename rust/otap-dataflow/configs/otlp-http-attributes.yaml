# Capture explicitly selected HTTP headers and project them into resources.
version: otel_dataflow/v1
groups:
  default:
    pipelines:
      main:
        nodes:
          receiver:
            type: receiver:otlp
            header_capture:
              headers:
                - match_names: [x-forwarded-host, x-azure-originalhost, host]
                  transform:
                    type: authority_host
                    # First is the default; select last only for a trusted appending proxy.
                    selection: first
            config:
              protocols:
                http:
                  listening_addr: "127.0.0.1:4318"
          attributes:
            type: processor:attribute
            config:
              apply_to: [resource]
              actions:
                - action: insert
                  key: server.address
                  value:
                    source:
                      type: transport_header
                      named: [x-forwarded-host, x-azure-originalhost, host]
                - action: insert
                  key: http.host
                  value:
                    source:
                      type: transport_header
                      named: [x-forwarded-host, x-azure-originalhost, host]
          debug:
            type: processor:debug
            config:
              verbosity: detailed
              mode: batch
          noop:
            type: exporter:noop
            config: {}
        connections:
          - from: receiver
            to: attributes
          - from: attributes
            to: debug
          - from: debug
            to: noop
