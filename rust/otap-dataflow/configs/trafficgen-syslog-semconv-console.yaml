# Run from rust/otap-dataflow.
# Demonstrates two-pipeline topology:
#   pipeline1: trafficgen (with syslog codec/profiles) -> debug_processor -> syslog_cef_exporter
#   pipeline2: syslog_cef_receiver -> console_exporter
# Structured events passing through debug_processor in pipeline1 are encoded to syslog-batch,
# sent over TCP to pipeline2's syslog_cef_receiver, decoded back to OTAP events, and printed to console.
version: otel_dataflow/v1
engine: {}
groups:
  default:
    pipelines:
      pipeline1:
        codecs:
          bindings:
            syslog-batch:
              options:
                # Test-oriented rotation; fixed profiles are also supported:
                # rfc3164, rfc5424, cef, cef_rfc3164, cef_rfc5424
                profile: all
        nodes:
          trafficgen:
            type: receiver:traffic_generator
            config:
              data_source: semantic_conventions
              registry_path: ./crates/pdata-codec/src/codecs/syslog/registry
              traffic_config:
                max_signal_count: 100
                max_batch_size: 10
                signals_per_second: 10
                log_weight: 1
                metric_weight: 0
                trace_weight: 0
          debug_processor:
            type: processor:debug
            config:
              verbosity: basic
              mode: signal
          syslog_cef_exporter:
            type: exporter:syslog_cef
            config:
              protocol:
                tcp:
                  endpoint: "127.0.0.1:5140"
                  framing: newline
        connections:
          - from: trafficgen
            to: debug_processor
          - from: debug_processor
            to: syslog_cef_exporter

      pipeline2:
        nodes:
          syslog_cef_receiver:
            type: receiver:syslog_cef
            config:
              protocol:
                tcp:
                  listening_addr: "127.0.0.1:5140"
                  framing: newline
          console_exporter:
            type: exporter:console
            config:
              format: pretty
        connections:
          - from: syslog_cef_receiver
            to: console_exporter
