# Note, to run this locally, use:
# 1. cargo binstall hawkeye@7.0.1
# 2. hawkeye check
# Check shows files that do not conform with expectation.
# hawkeye format updates those files with the header.text below.

[header]
text = """Copyright The OpenTelemetry Authors
SPDX-License-Identifier: Apache-2.0"""

[files]
includes = [
    "*.go",
    "*.rs"
]
excludes = [
    # proto files
    "**/proto/**/*",
    # generated files
    "collector/cmd/otelarrowcol/**/*",
    "go/pkg/otel/arrow_record/mock/mock.go"
]